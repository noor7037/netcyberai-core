// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Kotlin for the Focus Lock (M2b-3). Set here, on the root project, so Capacitor's own kotlin-bom
    // (node_modules/@capacitor/android/capacitor/build.gradle reads rootProject.ext.kotlin_version) uses the same version.
    ext.kotlin_version = '2.1.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
