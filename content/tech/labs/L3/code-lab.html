  g.set('seen',"{'to', 'be', 'or', 'not'}");g.step(5,t3('A set keeps only unique items (4 here). Set order is not guaranteed.','Set sirf unique items rakhta hai (yahan 4). Set ka order guaranteed nahi.','सेट सिर्फ़ अनोखी वस्तुएँ रखता है (यहाँ 4)। सेट का क्रम तय नहीं।'));g.set('pair',"('be', 2)");g.step(6,t3('A tuple is like a list that cannot be changed (immutable).','Tuple list jaisa hai par badla nahi ja sakta (immutable).','टपल सूची जैसा है पर बदला नहीं जा सकता (अपरिवर्तनीय)।'));g.print(rep());g.step(7,t3('Dicts remember insertion order (since Python 3.7).','Dicts insertion order yaad rakhte hain (Python 3.7 se).','डिक्ट डालने का क्रम याद रखते हैं (Python 3.7 से)।'));g.print("4 ('be', 2)");g.step(8);return g.s;},

  g.set('s',"'12'");g.step(2);g.step(3);g.set('n','12');g.step(4);g.print('8.333333333333334');g.step(5,t3('Floats are stored in binary, so 100/12 shows many digits.','Floats binary mein store hote hain, isliye 100/12 bahut digits dikhata hai.','फ़्लोट बाइनरी में रखे जाते हैं, इसलिए 100/12 कई अंक दिखाता है।'));g.step(10,t3('finally always runs — perfect for closing files.','finally hamesha chalta hai — files band karne ke liye best.','finally हमेशा चलता है — फ़ाइलें बंद करने के लिए सबसे अच्छा।'));g.print('checked 12');g.step(11);
  g.set('s',"'abc'");g.step(2);g.step(3);g.step(4,t3("int('abc') fails and raises ValueError. n keeps its OLD value 12!","int('abc') fail hota hai, ValueError. n ki PURANI value 12 rehti hai!","int('abc') विफल होता है, ValueError। n का पुराना मान 12 रहता है!"),"ValueError: invalid literal for int() with base 10: 'abc'");g.step(6,t3('Python jumps to the first matching except block.','Python pehle matching except block par kood-ta hai.','Python पहले मेल खाते except भाग पर जाता है।'));g.print('not a number: abc');g.step(7);g.step(10);g.print('checked abc');g.step(11);

 gen(){const g=G();const R=b=>`Account(owner='Riya', balance=${b})`;g.set('Account','<class>');g.step(1,t3('A class is a blueprint. Methods are functions that belong to it.','Class ek blueprint hai. Methods uske functions hain.','क्लास एक नक़्शा है। मेथड उसके फ़ंक्शन हैं।'));

 gen(fx){const g=G();g.set('average','<function>');g.step(1);if(!fx){g.set('test_average','<function>');g.step(4,t3('A test function: each assert states a fact that must be True.','Test function: har assert ek fact batata hai jo True hona chahiye.','परीक्षण फ़ंक्शन: हर assert एक तथ्य बताता है जो True होना चाहिए।'));g.push('test_average()',{});g.step(8);g.push('average',{nums:'[2, 4, 6]'});g.step(1);g.set('↩ return','4.0');g.step(2);g.pop();g.step(5,t3('4.0 == 4 is True — first test passes.','4.0 == 4 True — pehla test pass.','4.0 == 4 True — पहला परीक्षण पास।'));g.push('average',{nums:'[]'});g.step(1,t3('Edge case: an empty list.','Edge case: khaali list.','सीमांत स्थिति: ख़ाली सूची।'));g.step(2,t3('len([]) is 0, so sum/len crashes. The test found a real bug before users did! Tick "Apply the bug fix".','len([]) 0 hai, to sum/len crash. Test ne users se pehle asli bug pakda! "Bug fix lagao" tick karo.','len([]) 0 है, तो sum/len क्रैश। परीक्षण ने उपयोगकर्ताओं से पहले असली बग पकड़ा! "बग सुधार लगाओ" चुनो।'),'ZeroDivisionError: division by zero');g.pop();g.pop();g.print('FAILED test_average — ZeroDivisionError: division by zero',1);g.step(8,t3('The error travelled up from average() through test_average() to the caller: the test FAILED, so "all tests passed" never prints. Now tick "Apply the bug fix".','Error average() se test_average() hote hue upar tak gaya: test FAIL, isliye "all tests passed" kabhi print nahi hota. Ab "Bug fix lagao" tick karo.','त्रुटि average() से test_average() होते हुए ऊपर तक गई: परीक्षण विफल, इसलिए "all tests passed" कभी नहीं छपता। अब "बग सुधार लगाओ" चुनो।'),'Traceback: line 8 → line 6 → line 2');return g.s;}
  g.set('test_average','<function>');g.step(6);g.push('test_average()',{});g.step(10);g.push('average',{nums:'[2, 4, 6]'});g.step(1);g.step(2,t3('not [2, 4, 6] is False — carry on.','not [2, 4, 6] False — aage badho.','not [2, 4, 6] False — आगे बढ़ो।'));g.set('↩ return','4.0');g.step(4);g.pop();g.step(7);g.push('average',{nums:'[]'});g.step(1);g.step(2,t3('An empty list is "falsy", so not nums is True.','Khaali list "falsy" hai, to not nums True.','ख़ाली सूची "falsy" है, तो not nums True।'));g.set('↩ return','0');g.step(3);g.pop();g.step(8,t3('Both asserts pass.','Dono asserts pass.','दोनों assert पास।'));g.pop();g.step(10);g.print('all tests passed');g.step(11,t3('Keep the test forever: it stops this bug coming back (a regression test). Tools like pytest run hundreds of such tests on every change.','Test hamesha rakho: yeh bug wapas aane se rokta hai (regression test). pytest jaise tools har change par sainkdon tests chalate hain.','परीक्षण हमेशा रखो: यह बग लौटने से रोकता है (रिग्रेशन परीक्षण)। pytest जैसे टूल हर बदलाव पर सैकड़ों परीक्षण चलाते हैं।'));return g.s;},

 gen(){const g=G();g.set('fact','<function>');g.step(1,t3('A recursive function calls itself on a smaller problem.','Recursive function chhoti problem par khud ko bulata hai.','पुनरावर्ती फ़ंक्शन छोटी समस्या पर ख़ुद को बुलाता है।'));const go=n=>{g.push(`fact(${n})`,{n:String(n)});g.step(n===4?6:4,n===4?t3('First call: fact(4).','Pehla call: fact(4).','पहला कॉल: fact(4)।'):t3(`Paused fact(${n+1}) waits; a new frame fact(${n}) goes on top of the stack.`,`fact(${n+1}) ruka hai; naya frame fact(${n}) stack ke upar.`,`fact(${n+1}) रुका है; नया फ़्रेम fact(${n}) स्टैक के ऊपर।`));g.step(2);if(n===0){g.set('↩ return','1');g.step(3,t3('Base case reached: stop calling. Without it the stack would overflow (Python stops at about 1000 frames: RecursionError).','Base case aa gaya: rukko. Iske bina stack overflow (Python lagbhag 1000 frames par rukta: RecursionError).','आधार स्थिति आ गई: रुको। इसके बिना स्टैक भर जाता (Python लगभग 1000 फ़्रेम पर रुकता: RecursionError)।'));g.pop();return 1;}const r=n*go(n-1);g.set('↩ return',String(r));g.step(4,t3(`Unwinding: ${n} × fact(${n-1}) = ${r}.`,`Wapas aate hue: ${n} × fact(${n-1}) = ${r}.`,`लौटते हुए: ${n} × fact(${n-1}) = ${r}।`));g.pop();return r;};go(4);g.print('24');g.step(6,t3('5 frames were stacked, then unwound. Recursion suits trees, folders and divide-and-conquer sorts.','5 frames stack hue, phir khule. Recursion trees, folders aur divide-and-conquer sorts ke liye best.','5 फ़्रेम ढेर हुए, फिर खुले। पुनरावर्तन पेड़, फ़ोल्डर और बाँटो-जीतो क्रमबद्धता के लिए उपयुक्त।'));return g.s;},

function fmtT(ops){const s=ops/1e8;if(!isFinite(s)||s>3.15e7*1e6)return K.t(t3('longer than the universe has existed','universe ki umar se zyaada','ब्रह्मांड की आयु से अधिक'));if(s<1e-6)return '<1 µs';if(s<1e-3)return (s*1e6).toFixed(0)+' µs';if(s<1)return (s*1e3).toFixed(0)+' ms';if(s<60)return s.toFixed(1)+' s';if(s<3600)return (s/60).toFixed(0)+' min';if(s<86400)return (s/3600).toFixed(1)+' h';if(s<3.15e7)return (s/86400).toFixed(0)+' d';return (s/3.15e7).toExponential(1)+' yr';}
function fmtN(x){return x>=1e15?x.toExponential(1):Math.round(x).toLocaleString('en-IN');}
function drawGrowth(){const n=NS(+K.$('#nR').value);K.$('#nVal').textContent=n.toLocaleString('en-IN');let p='';const W=300,H=150;FN.forEach(([k,f],i)=>{let d='';for(let x=1;x<=32;x++){const y=Math.min(f(x)/1024,1);d+=(x===1?'M':'L')+(10+(x-1)/31*W).toFixed(1)+','+(155-y*H).toFixed(1);}p+=`<path d="${d}" fill="none" stroke="${COL[i]}" stroke-width="2.5"/><text x="${12+i*52}" y="12" fill="${COL[i]}" font-size="10" font-weight="700">${k}</text>`;});
 K.$('#gchart').innerHTML=`<line x1="10" y1="155" x2="312" y2="155" stroke="#334155"/>`+p+`<text x="300" y="167" fill="#9fb0d6" font-size="9" text-anchor="end">n = 1 … 32 (y up to 1024 steps)</text>`;
 K.$('#gtab').innerHTML=`<tr><th>Big-O</th><th>${K.esc(K.t(t3('steps','steps','चरण')))}</th><th>${K.esc(K.t(t3('time @ 10⁸/s','time @ 10⁸/s','समय @ 10⁸/s')))}</th></tr>`+FN.map(([k,f],i)=>{const o=f(n);return `<tr><td style="color:${COL[i]}">${k}</td><td>${fmtN(o)}</td><td class="${o/1e8>1?'bad':'ok'}">${fmtT(o)}</td></tr>`;}).join('');
 K.$('#growthInfo').textContent=K.t(t3('Big-O counts how steps grow as input grows, ignoring constant factors. At a million items, O(n log n) is 2 crore steps (a fraction of a second) while O(n²) is 10¹² (hours). That is why sorting and search algorithms matter more than faster hardware.','Big-O batata hai input badhne par steps kaise badhte hain, constants ignore karke. 10 lakh items par O(n log n) = 2 crore steps (second ka hissa) jabki O(n²) = 10¹² (ghante). Isliye algorithms tez hardware se zyaada matter karte hain.','बिग-O बताता है इनपुट बढ़ने पर चरण कैसे बढ़ते हैं, स्थिरांक छोड़कर। 10 लाख वस्तुओं पर O(n log n) = 2 करोड़ चरण (सेकंड का अंश) जबकि O(n²) = 10¹² (घंटे)। इसलिए एल्गोरिदम तेज़ हार्डवेयर से ज़्यादा मायने रखते हैं।'));
 if(n>=100000&&!gSeen){gSeen=true;K.check('bigo-explored',{n});}}
// ---------- stack & queue
let STK=[],QUE=[],nxt=1;
function drawSQ(msg){K.$('#stk').innerHTML=STK.map(v=>`<div class="it">${v}</div>`).join('');K.$('#que').innerHTML=QUE.map(v=>`<div class="it">${v}</div>`).join('');if(msg)K.$('#sqInfo').textContent=K.t(msg);}
async function brackets(){const s=K.$('#br').value.slice(0,40),P={')':'(',']':'[','}':'{'};const st=[];let ok=true,i=0,cls=[];for(;i<s.length;i++){const ch=s[i];if('([{'.includes(ch))st.push(ch);else if(P[ch]){if(st[st.length-1]===P[ch])st.pop();else{ok=false;}}cls[i]=ok?'d':'x';K.$('#brView').innerHTML=[...s].map((c,k)=>`<span class="${k===i?'c':cls[k]||''}">${K.esc(c)}</span>`).join('');K.$('#brStk').innerHTML=st.map(v=>`<div class="it">${K.esc(v)}</div>`).join('');await K.sleep(350);if(!ok)break;}
 if(ok&&st.length)ok=false;K.$('#brInfo').textContent=K.t(ok?t3('Balanced ✓ Every closer matched the opener on top of the stack. Code editors and compilers check your brackets exactly like this.','Balanced ✓ Har closing bracket stack ke top wale opener se mila. Code editors aur compilers aise hi check karte hain.','संतुलित ✓ हर बंद कोष्ठक स्टैक के ऊपर वाले खुले से मिला। कोड एडिटर और कंपाइलर ठीक ऐसे ही जाँचते हैं।'):t3('Not balanced ✗ A closer did not match the top of the stack, or openers were left over.','Balanced nahi ✗ Koi closer stack top se nahi mila, ya openers bache rahe.','संतुलित नहीं ✗ कोई बंद कोष्ठक स्टैक के ऊपर से नहीं मिला, या खुले बचे रहे।'));K.check('brackets-checked',{balanced:ok,length:s.length});}
// ---------- modes
function setMode(m){mode=MODES[m]?m:'trace';K.$$('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));K.$$('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+mode));
 if(mode==='trace')drawTrace();if(mode==='sort')drawBars();if(mode==='search')drawCells();if(mode==='growth')drawGrowth();if(mode==='stack')drawSQ();K.emit('mode-opened',{mode});}
function fillSel(){K.$('#prog').innerHTML=Object.keys(SC).map(k=>`<option value="${k}">${K.esc(K.t(SC[k].t))}</option>`).join('');K.$('#prog').value=scn;const a=K.$('#algo').value||algo;K.$('#algo').innerHTML=Object.keys(ALG).map(k=>`<option value="${k}">${K.esc(K.t(ALG[k]))}</option>`).join('');K.$('#algo').value=a;const o=K.$('#order').value||'random';K.$('#order').innerHTML=Object.keys(ORD).map(k=>`<option value="${k}">${K.esc(K.t(ORD[k]))}</option>`).join('');K.$('#order').value=o;}
(async()=>{K.lab='code-lab';K.header(t3('Code & Algorithms Lab','Code aur Algorithms Lab','कोड और एल्गोरिदम लैब'),t3('Step through Python, race sorts, feel Big-O','Python step-by-step, sorts ki race, Big-O mehsoos karo','पायथन चरण-दर-चरण, सॉर्ट की दौड़, बिग-O महसूस करो'));
 cfg=await K.boot({mode:'trace',scenario:'loop-sum',fixed:false,algo:'bubble',order:'random',n:16,target:88,input:'{[()()]}'});
 K.$('#modes').innerHTML=Object.keys(MODES).map(k=>`<button class="btn" data-m="${k}">${K.esc(K.t(MODES[k]))}</button>`).join('');K.$$('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
 algo=ALG[cfg.algo]?cfg.algo:'bubble';fillSel();K.$('#order').value=ORD[cfg.order]?cfg.order:'random';K.$('#size').value=String([8,16,32].includes(+cfg.n)?+cfg.n:16);K.$('#algo').value=algo;fixed=cfg.fixed===true||cfg.fixed==='true'||cfg.fixed==='1';
 K.$('#prog').onchange=e=>{fixed=false;loadScn(e.target.value);};K.$('#fix').onchange=e=>{fixed=e.target.checked;loadScn(scn);};K.$('#stepB').onclick=()=>step(1);K.$('#back').onclick=()=>step(-1);K.$('#play').onclick=play;K.$('#rst').onclick=()=>{si=-1;stopPlay();drawTrace();};
 K.$('#sortGo').onclick=runSort;K.$('#shuffle').onclick=()=>{if(sorting)return;seed++;mk();};K.$('#race').onclick=()=>{if(!sorting)race();};['#order','#size'].forEach(s=>K.$(s).onchange=()=>{if(!sorting)mk();});
 K.$('#tgt').value=cfg.target;K.$('#lin').onclick=linear;K.$('#bin').onclick=binary;
 K.$('#nR').oninput=drawGrowth;
 K.$('#push').onclick=()=>{STK.push(nxt++);drawSQ(t3('push adds on top. Undo in an editor and the browser Back button are stacks.','push top par jodta hai. Editor ka Undo aur browser Back button stacks hain.','push ऊपर जोड़ता है। एडिटर का Undo और ब्राउज़र Back बटन स्टैक हैं।'));K.emit('ds-op',{kind:'stack',op:'push'});};
 K.$('#pop').onclick=()=>{const v=STK.pop();drawSQ(v==null?t3('Empty stack: in Python, list.pop() would raise IndexError.','Khaali stack: Python mein list.pop() IndexError dega.','ख़ाली स्टैक: Python में list.pop() IndexError देगा।'):t3(`pop removed ${v} — the newest item. In Python a list is a stack: append() and pop() are O(1).`,`pop ne ${v} hataya — sabse naya item. Python mein list hi stack hai: append() aur pop() O(1).`,`pop ने ${v} हटाया — सबसे नई वस्तु। Python में सूची ही स्टैक है: append() और pop() O(1)।`));K.emit('ds-op',{kind:'stack',op:'pop'});};
 K.$('#enq').onclick=()=>{QUE.push(nxt++);drawSQ(t3('enqueue joins at the back, like a ticket line or a printer queue.','enqueue peeche judta hai, ticket line ya printer queue jaisa.','enqueue पीछे जुड़ता है, टिकट लाइन या प्रिंटर कतार जैसा।'));K.emit('ds-op',{kind:'queue',op:'enqueue'});};
 K.$('#deq').onclick=()=>{const v=QUE.shift();drawSQ(v==null?t3('Empty queue.','Khaali queue.','ख़ाली कतार।'):t3(`dequeue served ${v} — the oldest item. Use collections.deque in Python: popleft() is O(1).`,`dequeue ne ${v} serve kiya — sabse purana. Python mein collections.deque: popleft() O(1).`,`dequeue ने ${v} परोसा — सबसे पुरानी। Python में collections.deque: popleft() O(1)।`));K.emit('ds-op',{kind:'queue',op:'dequeue'});};
 K.$('#br').value=cfg.input;K.$('#brGo').onclick=brackets;
 const n0=Math.max(1,+cfg.n||16);K.$('#nR').value=String(cfg.mode==='growth'?K.clamp(Math.round(Math.log10(n0)*10),0,60):10);
 mk();loadScn(cfg.scenario);setMode(cfg.mode);
 K.onLang(()=>{K.$$('#modes button').forEach(b=>b.textContent=K.t(MODES[b.dataset.m]));fillSel();setMode(mode);});
 window.__c={step,loadScn,runSort,race,linear,binary,brackets,setN:v=>{K.$('#nR').value=v;drawGrowth();},all:()=>{while(si<steps.length-1)step(1);}};})();
</script>
</body></html>
