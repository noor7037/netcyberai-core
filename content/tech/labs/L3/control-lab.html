<!doctype html><html lang="en" data-lab="control-lab"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061233"><title>Circuits & Control Lab · NCA Tech Lab L3</title><style>:root{--bg:#061233;--bg2:#0b1b4a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#eef4ff;--mut:#9fb0d6;--grape:#8B3DFF;--cyan:#02CFF9;--leaf:#22C55E;--coral:#FF6B57;--gold:#F5B90A;--tang:#FF7A1A;--royal:#2563EB;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(120% 80% at 10% -10%,#22145e 0%,transparent 55%),radial-gradient(120% 80% at 110% 10%,#04395e 0%,transparent 50%),var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;min-height:100%}
body{padding:0 0 24px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(6,18,51,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.wrap{max-width:1100px;margin:0 auto;padding:12px}
.goal{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:linear-gradient(135deg,rgba(139,61,255,.22),rgba(2,207,249,.12));border:1px solid rgba(139,61,255,.4);margin-bottom:12px;font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{font-size:14px;margin:0 0 8px;color:var(--cyan);letter-spacing:.3px;text-transform:uppercase}
.grid{display:grid;gap:12px}
@media(min-width:720px){.grid.two{grid-template-columns:1.25fr 1fr}}
@media(orientation:landscape) and (max-height:500px){.grid.two{grid-template-columns:1.2fr 1fr}.top{padding:6px 12px}}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--tx);border-radius:12px;padding:9px 12px;font:inherit;font-weight:600;min-height:40px;cursor:pointer;transition:transform .12s,background .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--grape),#5b2be0);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(139,61,255,.4)}
.btn.ok{background:var(--leaf);color:#062;border-color:transparent}
.btn.on{outline:2px solid var(--cyan)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border-radius:99px;padding:6px 11px;min-height:34px;font-size:13px}
label.sl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);flex:1;min-width:120px}
input[type=range]{width:100%;accent-color:var(--grape)}
input[type=text],textarea,select{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px;font:inherit}
.stat{display:flex;flex-direction:column;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.22);min-width:80px}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mut)}
.mut{color:var(--mut)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
canvas,svg{display:block;max-width:100%;touch-action:none}


.explain{font-size:13.5px;color:#d7e2ff;background:rgba(0,0,0,.2);border-left:3px solid var(--cyan);padding:8px 10px;border-radius:8px;margin-top:8px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(2,207,249,.0)}50%{box-shadow:0 0 0 6px rgba(2,207,249,.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top h1 .hstat{display:none;font-size:12px;font-weight:700;color:#4ade80;animation:pop .3s both}.top h1.toasting small{display:none}.top h1.toasting .hstat{display:block}
.seg.chips{margin:4px 0}.seg.chips button{white-space:normal;text-align:left;line-height:1.25;max-width:100%}
.seg.chips.big .pick{width:100%;font-weight:700}
</style></head><body><script>// NCA Tech Lab L3 shared kit: language, config from ?cfg= / ?lesson= / inline, mission events, small helpers. No eval.
(function(g){

  // Toasts never cover content (readability rule): the message temporarily replaces the header subtitle, then the subtitle returns after 2.5 s.
  K.toast=(msg)=>{const h=K.$('header.top h1');if(!h)return;let st=h.querySelector('.hstat');if(!st){st=K.el('span',{class:'hstat',role:'status','aria-live':'polite'});h.appendChild(st);}st.textContent=msg;h.classList.add('toasting');clearTimeout(K._tt);K._tt=setTimeout(()=>h.classList.remove('toasting'),2500);};
  K.events=[];

  K.emit=(event,data)=>{const m={type:'nca-lab-event',lab:K.lab,event,data:data||{},at:Date.now()};K.events.push(m);try{parent!==window&&parent.postMessage(m,'*');}catch(e){}g.dispatchEvent(new CustomEvent('nca-lab-event',{detail:m}));document.documentElement.dataset.lastEvent=event;};

  K.onLang=(fn)=>K.listeners.push(fn);
  K.setLang=(l)=>{K.lang=l;localStorage.setItem('nca-lang',l);K.$$('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));K.$$('[data-t]').forEach(e=>{const o=K.T[e.dataset.t];if(o)e.innerHTML=K.t(o);});K.renderGoal();K.listeners.forEach(f=>f(l));};
  K.T={};// string table: key -> {en,hi,hinglish}
  K.renderGoal=()=>{const gEl=K.$('#goal');if(!gEl)return;const goal=K.goal||K.T.__goal;gEl.style.display=goal?'flex':'none';if(goal)gEl.innerHTML='<span>🎯</span><div><b>'+K.esc(K.t({en:'Goal',hinglish:'Goal',hi:'लक्ष्य'}))+':</b> '+K.esc(K.t(goal))+'</div>';};
  K.header=(title,sub)=>{const h=K.el('header',{class:'top'});h.innerHTML='<span class="badge">L3</span><h1>'+K.esc(K.t(title))+'<small>'+K.esc(K.t(sub))+'</small></h1><div class="langs" role="group" aria-label="Language"><button data-l="hinglish">Hinglish</button><button data-l="en">EN</button><button data-l="hi">हिं</button></div>';document.body.prepend(h);K.$$('.langs button',h).forEach(b=>b.onclick=()=>{K.setLang(b.dataset.l);h.querySelector('h1').firstChild.textContent=K.t(title);h.querySelector('small').textContent=K.t(sub);});};
  // Readability rule: native <select> boxes cut long option text on phones, so every select is shown as a wrapping row of chips.
  K.chipify=(sel)=>{if(sel._chips||sel.dataset.keep!=null)return;const box=K.el('div',{class:'seg chips',role:'radiogroup','aria-label':sel.getAttribute('aria-label')||'options'});sel.after(box);sel.style.display='none';sel._chips=box;let last='';
    let open=false;const render=(force)=>{const n=sel.options.length,big=n>6;const sig=[...sel.options].map(o=>o.value+'\u0001'+o.textContent).join('\u0002')+'|'+sel.value+'|'+open;if(sig===last&&!force)return;last=sig;box.innerHTML='';box.classList.toggle('big',big);
      if(big){const cur=sel.options[sel.selectedIndex];const t=K.el('button',{class:'btn on pick',type:'button','aria-expanded':open?'true':'false'});t.textContent=(open?'▴ ':'▾ ')+(cur?cur.textContent:'');t.onclick=()=>{open=!open;render(true);};box.appendChild(t);if(!open)return;}
      [...sel.options].forEach(o=>{if(big&&o.value===sel.value)return;const b=K.el('button',{class:'btn'+(o.value===sel.value?' on':''),type:'button',role:'radio','aria-checked':o.value===sel.value?'true':'false'});b.textContent=o.textContent;b.onclick=()=>{if(sel.disabled)return;sel.value=o.value;open=false;render(true);sel.dispatchEvent(new Event('change',{bubbles:true}));};box.appendChild(b);});};

    const inl=document.getElementById('lesson-inline');
    try{if(inl){const L=JSON.parse(inl.textContent);if(L.play){Object.assign(cfg,L.play.config||{});K.goal=L.play.goal;}}}catch(e){}

function avSim(th,sp,rl){const R=K.rng(7);let x=20,y=200,a=-Math.PI/2,col=0;const vis=new Set(),trail=[[x,y]],frames=[];for(let i=0;i<900;i++){const f=Math.min(ray(x,y,a),ray(x,y,a-0.35),ray(x,y,a+0.35))-RR,l=ray(x,y,a-0.9)-RR,r=ray(x,y,a+0.9)-RR;let go=sp;
 if(f<th){a+=(rl==='right'||r>=l)?0.35:-0.35;go=0;}else if(l<th*0.5)a+=0.1;else if(r<th*0.5)a-=0.1;else a+=(R()-0.5)*0.15;
 const nx=x+Math.cos(a)*go,ny=y+Math.sin(a)*go;if(go&&blocked(nx,ny)){col++;a+=Math.PI*0.75;}else{x=nx;y=ny;}vis.add(Math.floor(x/20)+','+Math.floor(y/20));if(i%3==0)trail.push([x,y]);if(i%6==0)frames.push([x,y,a,f,l,r,col,trail.length]);}
 let free=0;for(let cx=0;cx<16;cx++)for(let cy=0;cy<11;cy++)if(!blocked(cx*20+10,cy*20+10))free++;
 return{col,cov:Math.min(100,vis.size/free*100),trail,frames};}
function drawArena(s,fi){let g=`<rect x="1" y="1" width="318" height="218" rx="8" fill="#020817" stroke="#334155" stroke-width="2"/>`+OBS.map(([a,b,w,h])=>`<rect x="${a}" y="${b}" width="${w}" height="${h}" rx="4" fill="#1e2b55" stroke="#475569"/>`).join('')+`<text x="20" y="214" fill="#64748b" font-size="9" text-anchor="middle">▲</text>`;
 if(s){const fr=s.frames[Math.min(fi,s.frames.length-1)];const [x,y,a,f,l,r,c,tl]=fr;g+=`<polyline points="${s.trail.slice(0,tl).map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ')}" fill="none" stroke="#00C2B8" stroke-width="2" opacity=".45"/>`;
  const th=+K.$('#th').value;[[f,0],[l,-0.6],[r,0.6]].forEach(([d,o])=>{const dd=d+RR;g+=`<line x1="${x}" y1="${y}" x2="${x+Math.cos(a+o)*dd}" y2="${y+Math.sin(a+o)*dd}" stroke="${d<th?'#f87171':'#4ade80'}" stroke-width="1.5" opacity=".8"/>`;});
  g+=`<g transform="translate(${x},${y}) rotate(${a*180/Math.PI})"><rect x="-8" y="-7" width="16" height="14" rx="4" fill="#8B3DFF"/><circle cx="5" cy="0" r="2.5" fill="#fff"/></g>`;}
 K.$('#arena').innerHTML=g;}
async function drive(fast){const th=+K.$('#th').value,sp=+K.$('#sp').value;cancelAnimationFrame(avAnim);const s=avSim(th,sp,rule);
 if(!fast&&!K.reduced){for(let i=0;i<s.frames.length;i+=2){drawArena(s,i);await K.sleep(12);}}drawArena(s,s.frames.length-1);
 const ok=s.col===0&&s.cov>=35;K.$('#avNums').innerHTML=cell(s.col?'bad':'good',t3('Crashes','Takkar','टक्कर'),s.col)+cell(s.cov>=35?'good':'warn',t3('Area explored','Area explore kiya','क्षेत्र खोजा'),fmt(s.cov,0)+'%')+cell('',t3('Rule','Rule','नियम'),rule==='open'?'↔':'↻');
 const msg=ok?t3('Zero crashes and good coverage. Robot vacuums use the same sense → decide → act loop, plus a map.','Zero takkar aur achhi coverage. Robot vacuum bhi yahi sense → decide → act loop chalate hain, saath mein map.','शून्य टक्कर और अच्छा कवरेज। रोबोट वैक्यूम भी यही अनुभव → निर्णय → क्रिया लूप चलाते हैं, साथ में नक्शा।')
  :s.col?t3(`${s.col} crashes. The robot reacts too late: raise the turn distance or slow down — it needs room to turn at this speed.`,`${s.col} takkar. Robot der se react karta hai: turn distance badhao ya speed kam karo — is speed par mudne ke liye jagah chahiye.`,`${s.col} टक्कर। रोबोट देर से प्रतिक्रिया करता है: मुड़ने की दूरी बढ़ाओ या धीमा करो — इस गति पर मुड़ने को जगह चाहिए।`)
  :t3('No crashes, but it stays in one area. A very large turn distance makes it timid; try a middle value or the other rule.','Koi takkar nahi, par ek hi area mein rehta hai. Bahut bada turn distance use darpok banata hai; beech ki value ya doosra rule try karo.','कोई टक्कर नहीं, पर एक ही क्षेत्र में रहता है। बहुत बड़ी दूरी उसे डरपोक बनाती है; बीच का मान या दूसरा नियम आज़माओ।');
 K.$('#avInfo').innerHTML=K.esc(K.t(msg));K.emit('avoid-run',{collisions:s.col,coverage:Math.round(s.cov),threshold:th,speed:sp,rule});if(ok&&!avDone){avDone=true;K.check('avoid-clear',{threshold:th,coverage:Math.round(s.cov)});}return{col:s.col,cov:s.cov};}
// ---------- modes
function setMode(m){mode=MODES[m]?m:'ohm';K.$$('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));K.$$('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+mode));
 if(mode==='ohm')drawOhm(false);else cancelAnimationFrame(ohmRAF);if(mode==='adc')drawADC(false);if(mode==='pwm')drawPWM(false);if(mode==='pid')drawPIDFrame(pidRun,749);if(mode==='avoid')drawArena(null,0);K.emit('mode-opened',{mode});}
function segs(){K.$('#freq').innerHTML=Object.keys(FQ).map(k=>`<button class="btn" data-f="${k}">${K.esc(K.t(FQ[k]))}</button>`).join('');K.$$('#freq button').forEach(b=>b.onclick=()=>{fq=b.dataset.f;drawPWM(true);});
 K.$('#presets').innerHTML=Object.keys(PRE).map(k=>`<button class="btn" data-p="${k}">${K.esc(K.t(PRE[k][0]))}</button>`).join('');K.$$('#presets button').forEach(b=>b.onclick=()=>{const p=PRE[b.dataset.p];K.$('#kp').value=p[1];K.$('#ki').value=p[2];K.$('#kd').value=p[3];pidLbl();fly(false);});
 K.$('#rules').innerHTML=Object.keys(RUL).map(k=>`<button class="btn ${k===rule?'on':''}" data-r="${k}">${K.esc(K.t(RUL[k]))}</button>`).join('');K.$$('#rules button').forEach(b=>b.onclick=()=>{rule=b.dataset.r;segs();});}
function pidLbl(){const [a,b,c]=pidVals();K.$('#kpV').textContent=a;K.$('#kiV').textContent=b;K.$('#kdV').textContent=c;}
function avLbl(){K.$('#thV').textContent=K.$('#th').value;K.$('#spV').textContent=K.$('#sp').value;}
(async()=>{K.lab='control-lab';K.header(t3('Circuits & Control Lab','Circuits & Control Lab','परिपथ और नियंत्रण लैब'),t3('Ohm’s law, ADC, PWM, PID and robot reflexes','Ohm ka niyam, ADC, PWM, PID aur robot reflexes','ओम का नियम, ADC, PWM, PID और रोबोट प्रतिवर्त'));
 cfg=await K.boot({mode:'ohm',volts:5,bits:3,rate:8,duty:25,rule:'open'});
 K.$('#modes').innerHTML=Object.keys(MODES).map(k=>`<button class="btn" data-m="${k}">${K.esc(K.t(MODES[k]))}</button>`).join('');K.$$('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
 K.$('#vs').value=String(K.clamp(Math.round(+cfg.volts*2),1,24));K.$('#bs').value=String(K.clamp(+cfg.bits,1,12));K.$('#fs').value=String(K.clamp(+cfg.rate,2,60));K.$('#ds').value=String(K.clamp(+cfg.duty,0,100));rule=RUL[cfg.rule]?cfg.rule:'open';
 ['#vs','#rs'].forEach(s=>K.$(s).oninput=()=>drawOhm(true));K.$('#led').onchange=()=>drawOhm(true);['#bs','#fs'].forEach(s=>K.$(s).oninput=()=>drawADC(true));K.$('#ds').oninput=()=>drawPWM(true);
 ['#kp','#ki','#kd'].forEach(s=>K.$(s).oninput=pidLbl);K.$('#fly').onclick=()=>fly(false);K.$('#wind').onchange=()=>drawPIDFrame(null,0);['#th','#sp'].forEach(s=>K.$(s).oninput=avLbl);K.$('#drive').onclick=()=>drive(false);
 segs();pidLbl();avLbl();setMode(cfg.mode);
 K.onLang(()=>{K.$$('#modes button').forEach(b=>b.textContent=K.t(MODES[b.dataset.m]));segs();setMode(mode);});
 const set=(s,v)=>{K.$(s).value=v;};
 window.__k={ohm:(v,r,led=true)=>{set('#vs',v*2);set('#rs',RS.indexOf(r));K.$('#led').checked=led;drawOhm(true);return ohmCalc();},adc:(b,f)=>{set('#bs',b);set('#fs',f);drawADC(true);},pwm:(d,f)=>{if(f)fq=f;set('#ds',d);drawPWM(true);},
  pid:(p,i,d,w=false)=>{set('#kp',p);set('#ki',i);set('#kd',d);K.$('#wind').checked=w;pidLbl();return fly(true);},avoid:(th,sp,rl)=>{set('#th',th);set('#sp',sp);if(rl)rule=rl;segs();avLbl();return drive(true);},sim:avSim,mode:setMode};})();
</script>
