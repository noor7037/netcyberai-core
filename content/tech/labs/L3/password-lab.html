  // Toasts never cover content (readability rule): the message temporarily replaces the header subtitle, then the subtitle returns after 2.5 s.

    let open=false;const render=(force)=>{const n=sel.options.length,big=n>6;const sig=[...sel.options].map(o=>o.value+'\u0001'+o.textContent).join('\u0002')+'|'+sel.value+'|'+open;if(sig===last&&!force)return;last=sig;box.innerHTML='';box.classList.toggle('big',big);
      if(big){const cur=sel.options[sel.selectedIndex];const t=K.el('button',{class:'btn on pick',type:'button','aria-expanded':open?'true':'false'});t.textContent=(open?'▴ ':'▾ ')+(cur?cur.textContent:'');t.onclick=()=>{open=!open;render(true);};box.appendChild(t);if(!open)return;}
      [...sel.options].forEach(o=>{if(big&&o.value===sel.value)return;const b=K.el('button',{class:'btn'+(o.value===sel.value?' on':''),type:'button',role:'radio','aria-checked':o.value===sel.value?'true':'false'});b.textContent=o.textContent;b.onclick=()=>{if(sel.disabled)return;sel.value=o.value;open=false;render(true);sel.dispatchEvent(new Event('change',{bubbles:true}));};box.appendChild(b);});};
    render();new MutationObserver(render).observe(sel,{childList:true,subtree:true,characterData:true});setInterval(render,250);};
  K.chipAll=()=>{K.$$('select').forEach(K.chipify);if(!K._mo){K._mo=new MutationObserver(()=>K.$$('select').forEach(K.chipify));K._mo.observe(document.body,{childList:true,subtree:true});}};
  K.boot=async(defaults)=>{let cfg=Object.assign({},defaults||{});
    const inl=document.getElementById('lesson-inline');
    try{if(inl){const L=JSON.parse(inl.textContent);if(L.play){Object.assign(cfg,L.play.config||{});K.goal=L.play.goal;}}}catch(e){}
    const lp=qs.get('lesson');if(lp){try{const L=await (await fetch(lp)).json();if(L.play&&L.play.lab===K.lab){Object.assign(cfg,L.play.config||{});K.goal=L.play.goal;}}catch(e){}}
    const c=qs.get('cfg');if(c){try{Object.assign(cfg,JSON.parse(c));}catch(e){}}
    for(const [k,v] of qs){if(!['cfg','lesson','lang'].includes(k))cfg[k]=v;}
    K.cfg=cfg;K.setLang(K.lang);setTimeout(K.chipAll,0);return cfg;};
  g.K=K;

// most common leaked passwords (public breach lists), rank order

const PHRASE='amber anchor apple arrow atlas bamboo banyan basket beacon bison blossom bridge bronze cactus camel candle canyon carbon cedar cherry cliff cobalt comet coral cotton crater cricket crystal dancer delta desert dolphin domino dragon drum eagle echo ember falcon fern festival fiber flame fossil galaxy garden garnet ginger glacier granite harbor hazel helmet hermit honey horizon iris island ivory jasmine jungle kettle kingfisher kite lagoon lantern laser lemon lotus magnet mango maple marble meadow meteor mint monsoon mosaic nectar nickel nimbus oasis ocean olive onion orbit otter paddle palm panda paper pebble pepper piano pixel planet plume pocket prism pumpkin quartz quill rainbow raven reef ribbon river rocket saffron sapphire satchel scooter shadow shell signal silver sitar skyline slate sparrow spice spiral spruce stable summit sunrise tabla tamarind teapot temple thunder tiger timber topaz tulip tunnel turban turtle umbrella valley velvet violet volcano walnut whistle willow window yak zebra zenith'.split(' ');
const DICT=new Set([...WORDS,...PHRASE,'correct','horse','battery','staple']);const DN=DICT.size;
const L33T={'@':'a','4':'a','3':'e','1':'i','!':'i','0':'o','$':'s','5':'s','7':'t'};
const SEQS=['abcdefghijklmnopqrstuvwxyz','0123456789','qwertyuiop','asdfghjkl','zxcvbnm'];
function charset(s){let n=0;if(/[a-z]/.test(s))n+=26;if(/[A-Z]/.test(s))n+=26;if(/[0-9]/.test(s))n+=10;if(/[^A-Za-z0-9]/.test(s))n+=33;return n||1;}
function analyse(pw){const segs=[];const low=pw.toLowerCase();
 const ci=COMMON.indexOf(low);if(ci>=0)return{guesses:ci+1,segs:[{s:pw,k:'common',g:ci+1}],common:true};
 let i=0;while(i<pw.length){let best=null;
  for(let j=pw.length;j>i+2&&!best;j--){const sub=low.slice(i,j),deL=sub.replace(/[@4310!$57]/g,c=>L33T[c]);
   if(COMMON.includes(sub))best={k:'common',g:COMMON.indexOf(sub)+1,j};
   else if(DICT.has(sub))best={k:'word',g:(PHRASE.includes(sub)?PHRASE.length:DN)*(pw.slice(i,j)!==sub?2:1),j};
   else if(DICT.has(deL)&&deL!==sub)best={k:'l33t',g:DN*4,j};
   else if(/^(19[5-9]\d|20[0-3]\d)$/.test(sub))best={k:'year',g:90,j};
   else if(sub.length>=3&&SEQS.some(q=>q.includes(sub)||q.split('').reverse().join('').includes(sub)))best={k:'sequence',g:SEQS.length*26*2,j};
   else if(sub.length>=3&&new Set(sub).size===1)best={k:'repeat',g:charset(sub[0])*sub.length,j};}
  if(best){segs.push({s:pw.slice(i,best.j),k:best.k,g:best.g});i=best.j;}
  else{const last=segs[segs.length-1];if(last&&last.k==='brute'){last.s+=pw[i];}else segs.push({s:pw[i],k:'brute'});i++;}}
 const cs=charset(pw);const br=segs.filter(s=>s.k==='brute');const sepOnly=br.length>0&&br.every(s=>s.s.length===1&&s.s===br[0].s&&/[^A-Za-z0-9]/.test(s.s))&&segs.some(s=>s.k==='word');
 let g=1;br.forEach((s,i)=>{s.g=sepOnly?(i?1:33):Math.pow(cs,s.s.length);if(sepOnly)s.k='sep';});for(const s of segs)g*=s.g;
 if(segs.length>1&&!sepOnly)g*=factorial(Math.min(segs.length,6));g=Math.min(g,Math.pow(cs,pw.length));return{guesses:Math.max(1,g),segs,common:false};}
function factorial(n){return n<=1?1:n*factorial(n-1);}
const ATT=[['🌐',t3('Online, with lockout','Online, lockout ke saath','ऑनलाइन, लॉकआउट के साथ'),t3('site allows ~10 tries/hour','site ~10 tries/ghanta deti hai','साइट ~10 प्रयास/घंटा देती है'),10/3600],

function human(sec){const u=[[3.15e7*100,t3('centuries','sadiyan','सदियाँ')],[3.15e7,t3('years','saal','साल')],[86400*30,t3('months','mahine','महीने')],[86400,t3('days','din','दिन')],[3600,t3('hours','ghante','घंटे')],[60,t3('minutes','minute','मिनट')],[1,t3('seconds','second','सेकंड')]];

let shown=false,lastBits=-1,cfg;
function update(){const pw=K.$('#pw').value;if(!pw){K.$('#fill').style.width='0';K.$('#verdict').textContent='';K.$('#bits').textContent='';K.$('#segs').innerHTML='';K.$('#attacks').innerHTML=`<div class="mut">${K.t(t3('Type a password (a made-up one!) to see how attackers would fare.','Ek password likho (bana hua!) aur dekho attackers ka kya haal hota.','एक पासवर्ड लिखो (बनाया हुआ!) और देखो हमलावरों का क्या हाल होता।'))}</div>`;return;}
 const a=analyse(pw),bits=Math.log2(a.guesses);const pct=Math.min(100,bits/80*100);const col=bits<28?'#FF6B57':bits<45?'#FF7A1A':bits<60?'#F5B90A':'#22C55E';
 K.$('#fill').style.width=pct+'%';K.$('#fill').style.background=col;
 const v=bits<28?t3('Very weak','Bahut kamzor','बहुत कमज़ोर'):bits<45?t3('Weak','Kamzor','कमज़ोर'):bits<60?t3('Okay for low-value accounts','Kam zaroori accounts ke liye theek','कम ज़रूरी खातों के लिए ठीक'):t3('Strong','Mazboot','मज़बूत');
 K.$('#verdict').innerHTML=`<span style="color:${col}">${K.t(v)}</span>`;K.$('#bits').textContent=`≈ ${bits.toFixed(0)} bits · ${pw.length} ${K.t(t3('chars','chars','अक्षर'))}`;
 K.$('#segs').innerHTML=a.segs.map((s,i)=>`<span style="background:${KC[s.k][0]}33;border:1px solid ${KC[s.k][0]};animation-delay:${i*60}ms">${K.esc(shown?s.s:'•'.repeat(s.s.length))}<small>${K.t(KC[s.k][1])}</small></span>`).join('');
 K.$('#attacks').innerHTML=ATT.map(([ic,l,d,r])=>{const s=a.guesses/2/r;return `<div class="att"><span style="font-size:20px">${ic}</span><div>${K.t(l)}<small>${K.t(d)}</small></div><div class="t" style="color:${s<3600?'#FF6B57':s<3.15e7?'#F5B90A':'#22C55E'}">${human(s)}</div></div>`;}).join('')+`<div class="explain">${K.t(t3('Length beats complexity: each extra random character multiplies the work. Patterns attackers try first — leaked lists, names, cricket stars, years, "@123" endings — collapse strength. And with 2-step verification (OTP app or passkey), a guessed password alone is not enough.','Length complexity se aage: har extra random character kaam ko guna kar deta hai. Patterns jo attackers pehle try karte hain — leaked lists, naam, cricket stars, saal, "@123" endings — strength gira dete hain. Aur 2-step verification (OTP app ya passkey) ke saath sirf guess kiya password kaafi nahi.','लंबाई जटिलता से आगे: हर अतिरिक्त यादृच्छिक अक्षर काम को गुणा कर देता है। जो पैटर्न हमलावर पहले आज़माते हैं — लीक सूचियाँ, नाम, क्रिकेट सितारे, वर्ष, "@123" अंत — ताक़त गिरा देते हैं। और दो-चरण सत्यापन (OTP ऐप या पासकी) के साथ सिर्फ़ अनुमानित पासवर्ड काफ़ी नहीं।'))}</div>`;
 const b=Math.round(bits);if(b!==lastBits){lastBits=b;clearTimeout(update.t);update.t=setTimeout(()=>{K.emit('strength-checked',{bits:b,length:pw.length,patterns:[...new Set(a.segs.map(s=>s.k))]});if(a.segs.some(s=>!['brute','sep'].includes(s.k)))K.emit('weak-pattern-found',{patterns:[...new Set(a.segs.filter(s=>!['brute','sep'].includes(s.k)).map(s=>s.k))]});if(b>=60&&!a.common&&!update.strong){update.strong=1;K.check('strong-password',{bits:b});}},350);}}
function secureRand(n){if(cfg.seed){const r=K.rng(+cfg.seed+(secureRand.c=(secureRand.c||0)+1));return Math.floor(r()*n);}const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}
function gen(){const n=+K.$('#wc').value;K.$('#wn').textContent=n;const w=[];for(let i=0;i<n;i++)w.push(PHRASE[secureRand(PHRASE.length)]);const p=w.join('-');const bpw=Math.log2(PHRASE.length),bits=Math.round(n*bpw);
 K.$('#phrase').textContent=p;K.$('#phraseInfo').innerHTML=K.t(t3(`${n} words from this demo list of ${PHRASE.length} → ${bpw.toFixed(1)} bits each ≈ ${bits} bits. Real generators such as the EFF diceware list use 7,776 words (12.9 bits per word), so 5 words ≈ 65 bits. Easy to remember, hard to guess — store it in a password manager.`,`Is demo list ke ${PHRASE.length} mein se ${n} words → har ek ${bpw.toFixed(1)} bits ≈ ${bits} bits. Asli generators jaise EFF diceware list 7,776 words (har word 12.9 bits) use karte hain, to 5 words ≈ 65 bits. Yaad rakhna aasaan, guess karna mushkil — password manager mein rakho.`,`इस डेमो सूची के ${PHRASE.length} में से ${n} शब्द → हर एक ${bpw.toFixed(1)} बिट ≈ ${bits} बिट। असली जनरेटर जैसे EFF डाइसवेयर सूची 7,776 शब्द (हर शब्द 12.9 बिट) इस्तेमाल करते हैं, तो 5 शब्द ≈ 65 बिट। याद रखना आसान, अनुमान लगाना मुश्किल — पासवर्ड मैनेजर में रखो।`));
 K.$('#pw').value=p;update();K.emit('passphrase-made',{words:n,bits});}
(async()=>{K.lab='password-lab';K.header(t3('Password Strength Lab','Password Strength Lab','पासवर्ड ताक़त लैब'),t3('How attackers guess, and how to beat them','Attackers kaise guess karte hain, aur unhe kaise haraayein','हमलावर कैसे अनुमान लगाते हैं, और उन्हें कैसे हराएँ'));
 cfg=await K.boot({sample:''});
 const warn=()=>K.$('#warn').innerHTML='🔐 '+K.t(t3('Never type a real password here. This page works fully offline and sends nothing, but good habit is: real passwords go only into the real login page or your password manager.','Yahan kabhi asli password mat likho. Yeh page poora offline chalta hai aur kuch nahi bhejta, par achhi aadat yahi hai: asli password sirf asli login page ya password manager mein.','यहाँ कभी असली पासवर्ड मत लिखो। यह पेज पूरी तरह ऑफ़लाइन चलता है और कुछ नहीं भेजता, पर अच्छी आदत यही है: असली पासवर्ड सिर्फ़ असली लॉगिन पेज या पासवर्ड मैनेजर में।'));warn();
 const SAM=['password@123','Virat@2011','qwerty12','Mumbai#1998','correct-horse-battery-staple','t9#Vq!2zLm8p','Tiger-Saffron-Kettle-Orbit-Velvet'];K.$('#samples').innerHTML=SAM.map(s=>`<button class="btn" style="font:12px ui-monospace,monospace" data-s="${K.esc(s)}">${K.esc(s)}</button>`).join('');
 K.$$('#samples button').forEach(b=>b.onclick=()=>{K.$('#pw').value=b.dataset.s;update();});
 K.$('#pw').type='password';K.$('#eye').onclick=()=>{shown=!shown;K.$('#pw').type=shown?'text':'password';K.$('#eye').textContent=shown?'👁':'🙈';update();};
 K.$('#pw').oninput=update;K.$('#gen').onclick=gen;K.$('#wc').oninput=()=>{K.$('#wn').textContent=K.$('#wc').value;};
 if(cfg.sample){K.$('#pw').value=cfg.sample;}update();K.onLang(()=>{warn();update();});window.__pw={analyse,gen};})();
</script>
</body></html>
