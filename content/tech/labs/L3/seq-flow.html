</style></head><body><script>// NCA Tech Lab L3 shared kit: language, config from ?cfg= / ?lesson= / inline, mission events, small helpers. No eval.
(function(g){
  const qs=new URLSearchParams(location.search);
  const K={lang:qs.get('lang')||localStorage.getItem('nca-lang')||'hinglish',cfg:{},goal:null,lab:document.documentElement.dataset.lab,listeners:[]};
  K.reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  K.t=(o)=>o==null?'':typeof o==='string'?o:(o[K.lang]||o.hinglish||o.en||'');
  K.$=(s,r)=>(r||document).querySelector(s);K.$$=(s,r)=>[...(r||document).querySelectorAll(s)];
  K.el=(tag,attrs,html)=>{const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='on')for(const ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;};
  K.esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  K.rng=(seed)=>{let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};};
  K.clamp=(v,a,b)=>Math.max(a,Math.min(b,v));K.lerp=(a,b,t)=>a+(b-a)*t;K.ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  K.sleep=(ms)=>new Promise(r=>setTimeout(r,K.reduced?0:ms));
  K.tween=(ms,fn)=>new Promise(res=>{if(K.reduced||ms<=0){fn(1);return res();}const t0=performance.now();const f=n=>{const t=Math.min(1,(n-t0)/ms);fn(K.ease(t));t<1?requestAnimationFrame(f):res();};requestAnimationFrame(f);});
  // Toasts never cover content (readability rule): the message temporarily replaces the header subtitle, then the subtitle returns after 2.5 s.
  K.toast=(msg)=>{const h=K.$('header.top h1');if(!h)return;let st=h.querySelector('.hstat');if(!st){st=K.el('span',{class:'hstat',role:'status','aria-live':'polite'});h.appendChild(st);}st.textContent=msg;h.classList.add('toasting');clearTimeout(K._tt);K._tt=setTimeout(()=>h.classList.remove('toasting'),2500);};
  K.events=[];
  // emit a lab event; the lesson player listens via postMessage and matches it against try.questions[type=lab-check].answer
  K.emit=(event,data)=>{const m={type:'nca-lab-event',lab:K.lab,event,data:data||{},at:Date.now()};K.events.push(m);try{parent!==window&&parent.postMessage(m,'*');}catch(e){}g.dispatchEvent(new CustomEvent('nca-lab-event',{detail:m}));document.documentElement.dataset.lastEvent=event;};
  K.check=(event,data,msg)=>{K.emit(event,data);K.toast('✓ '+(msg||K.t({en:'Mission check passed',hinglish:'Mission check pass!',hi:'मिशन जाँच पास!'})));};
  K.onLang=(fn)=>K.listeners.push(fn);
  K.setLang=(l)=>{K.lang=l;localStorage.setItem('nca-lang',l);K.$$('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));K.$$('[data-t]').forEach(e=>{const o=K.T[e.dataset.t];if(o)e.innerHTML=K.t(o);});K.renderGoal();K.listeners.forEach(f=>f(l));};
  K.T={};// string table: key -> {en,hi,hinglish}
  K.renderGoal=()=>{const gEl=K.$('#goal');if(!gEl)return;const goal=K.goal||K.T.__goal;gEl.style.display=goal?'flex':'none';if(goal)gEl.innerHTML='<span>🎯</span><div><b>'+K.esc(K.t({en:'Goal',hinglish:'Goal',hi:'लक्ष्य'}))+':</b> '+K.esc(K.t(goal))+'</div>';};
  K.header=(title,sub)=>{const h=K.el('header',{class:'top'});h.innerHTML='<span class="badge">L3</span><h1>'+K.esc(K.t(title))+'<small>'+K.esc(K.t(sub))+'</small></h1><div class="langs" role="group" aria-label="Language"><button data-l="hinglish">Hinglish</button><button data-l="en">EN</button><button data-l="hi">हिं</button></div>';document.body.prepend(h);K.$$('.langs button',h).forEach(b=>b.onclick=()=>{K.setLang(b.dataset.l);h.querySelector('h1').firstChild.textContent=K.t(title);h.querySelector('small').textContent=K.t(sub);});};
  // Readability rule: native <select> boxes cut long option text on phones, so every select is shown as a wrapping row of chips.
  K.chipify=(sel)=>{if(sel._chips||sel.dataset.keep!=null)return;const box=K.el('div',{class:'seg chips',role:'radiogroup','aria-label':sel.getAttribute('aria-label')||'options'});sel.after(box);sel.style.display='none';sel._chips=box;let last='';
    let open=false;const render=(force)=>{const n=sel.options.length,big=n>6;const sig=[...sel.options].map(o=>o.value+'\u0001'+o.textContent).join('\u0002')+'|'+sel.value+'|'+open;if(sig===last&&!force)return;last=sig;box.innerHTML='';box.classList.toggle('big',big);
      if(big){const cur=sel.options[sel.selectedIndex];const t=K.el('button',{class:'btn on pick',type:'button','aria-expanded':open?'true':'false'});t.textContent=(open?'▴ ':'▾ ')+(cur?cur.textContent:'');t.onclick=()=>{open=!open;render(true);};box.appendChild(t);if(!open)return;}
      [...sel.options].forEach(o=>{if(big&&o.value===sel.value)return;const b=K.el('button',{class:'btn'+(o.value===sel.value?' on':''),type:'button',role:'radio','aria-checked':o.value===sel.value?'true':'false'});b.textContent=o.textContent;b.onclick=()=>{if(sel.disabled)return;sel.value=o.value;open=false;render(true);sel.dispatchEvent(new Event('change',{bubbles:true}));};box.appendChild(b);});};
    render();new MutationObserver(render).observe(sel,{childList:true,subtree:true,characterData:true});setInterval(render,250);};
  K.chipAll=()=>{K.$$('select').forEach(K.chipify);if(!K._mo){K._mo=new MutationObserver(()=>K.$$('select').forEach(K.chipify));K._mo.observe(document.body,{childList:true,subtree:true});}};
  K.boot=async(defaults)=>{let cfg=Object.assign({},defaults||{});
    const inl=document.getElementById('lesson-inline');
    try{if(inl){const L=JSON.parse(inl.textContent);if(L.play){Object.assign(cfg,L.play.config||{});K.goal=L.play.goal;}}}catch(e){}
    const lp=qs.get('lesson');if(lp){try{const L=await (await fetch(lp)).json();if(L.play&&L.play.lab===K.lab){Object.assign(cfg,L.play.config||{});K.goal=L.play.goal;}}catch(e){}}
    const c=qs.get('cfg');if(c){try{Object.assign(cfg,JSON.parse(c));}catch(e){}}
    for(const [k,v] of qs){if(!['cfg','lesson','lang'].includes(k))cfg[k]=v;}
    K.cfg=cfg;K.setLang(K.lang);setTimeout(K.chipAll,0);return cfg;};
  g.K=K;
})(window);
</script><div class="wrap">
 <div id="goal" class="goal" style="display:none"></div>

  <div><div class="card" id="detail"><h2 data-t="now"></h2><div id="now"></div><div id="fields"></div></div><div class="card" id="extra" style="display:none"></div></div>
 </div>

<style>
.fld{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font:12.5px ui-monospace,monospace;background:rgba(0,0,0,.25);padding:8px;border-radius:10px;margin-top:8px}
.fld b{color:#02CFF9;font-weight:600}.fld span{color:#eef4ff;word-break:break-all}
.layer{padding:6px 10px;border-radius:9px;margin:3px 0;font:12px ui-monospace,monospace;color:#061233;font-weight:700;animation:pop .4s both}
.tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:3px;background:linear-gradient(#8B3DFF,#02CFF9)}

.ms.on{opacity:1;border-color:#02CFF9;background:rgba(2,207,249,.1);transform:translateX(4px)}.ms:before{content:"";position:absolute;left:-19px;top:12px;width:11px;height:11px;border-radius:99px;background:#0b1b4a;border:2px solid #02CFF9}
.ms.on:before{background:#FFD23F;box-shadow:0 0 12px #FFD23F}.ms .yr{font-weight:800;color:#FFD23F}

<script>
const T=K.T;T.now={en:'What is happening',hinglish:'Kya ho raha hai',hi:'क्या हो रहा है'};
const t3=(en,hinglish,hi)=>({en,hinglish,hi});let cfg,S,cur=0,timer=null,st={},anim=null;
const SC={};
// ---------- sequence-diagram engine ----------
function seqSteps(){return typeof S.steps==='function'?S.steps(st):S.steps;}
function drawSeq(upto,prog){const A=S.actors,n=A.length,W=360,colW=W/n,steps=seqSteps(),rowH=34,top=64,H=top+steps.length*rowH+16;
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9fb0d6"/></marker><filter id="gl"><feGaussianBlur stdDeviation="2.5"/></filter></defs>`;
 A.forEach((a,i)=>{const x=colW*(i+.5);s+=`<line x1="${x}" y1="${top-8}" x2="${x}" y2="${H-6}" stroke="rgba(255,255,255,.14)" stroke-dasharray="3 5"/><circle cx="${x}" cy="22" r="17" fill="#0b1b4a" stroke="${a[3]||'#8B3DFF'}" stroke-width="2"/><text x="${x}" y="28" text-anchor="middle" font-size="16">${a[1]}</text><text x="${x}" y="52" text-anchor="middle" font-size="${n>5?8.5:10}" fill="#cbd5e1" font-weight="700">${K.esc(K.t(a[2]))}</text>`;});
 const ix=id=>A.findIndex(a=>a[0]===id);
 steps.forEach((m,i)=>{if(i>upto)return;const y=top+i*rowH+rowH/2,x1=colW*(ix(m.from)+.5),x2=colW*(ix(m.to)+.5);const col=m.cls==='bad'?'#FF6B57':m.cls==='enc'?'#22C55E':m.cls==='warn'?'#F5B90A':'#02CFF9';const act=i===upto;
  if(m.from===m.to){s+=`<rect x="${x1-colW*.45}" y="${y-11}" width="${colW*.9}" height="22" rx="8" fill="${col}" fill-opacity="${act?.35:.15}" stroke="${col}"/><text x="${x1}" y="${y+4}" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="700">${K.esc(m.label)}</text>`;return;}
  const p=act?prog:1;const xe=x1+(x2-x1)*p;s+=`<line x1="${x1}" y1="${y}" x2="${xe}" y2="${y}" stroke="${col}" stroke-width="${act?3:2}" ${m.cls==='bad'&&m.drop?'stroke-dasharray="4 4"':''} marker-end="${p>=1&&!m.drop?'url(#ah)':''}" opacity="${act?1:.7}"/>`;
  if(m.drop&&p>=1){const xm=x2+(x1>x2?16:-16);s+=`<text x="${xm}" y="${y+5}" text-anchor="middle" font-size="16">💥</text>`;}
  if(act&&p<1)s+=`<circle cx="${xe}" cy="${y}" r="7" fill="${col}" filter="url(#gl)"/><circle cx="${xe}" cy="${y}" r="4" fill="#fff"/>`;
  s+=`<text x="${(x1+x2)/2}" y="${y-6}" text-anchor="middle" font-size="9.5" fill="${act?'#fff':'#cbd5e1'}" font-weight="700">${m.cls==='enc'?'🔒 ':''}${K.esc(m.label)}</text>`;});
 s+='</svg>';K.$('#vis').innerHTML=s;}
function showDetail(m){K.$('#now').innerHTML=m?K.t(m.text):K.t(S.intro||t3('Press ▶ or Step.','▶ ya Step dabao.','▶ या Step दबाओ।'));
 K.$('#fields').innerHTML=m&&m.fields?`<div class="fld">${Object.entries(m.fields).map(([k,v])=>`<b>${K.esc(k)}</b><span>${K.esc(typeof v==='object'?JSON.stringify(v):v)}</span>`).join('')}</div>`:'';
 if(m&&m.layers)K.$('#fields').innerHTML+=m.layers.map((l,i)=>`<div class="layer" style="background:${['#FFD23F','#02CFF9','#c4a3ff','#22C55E','#FF7A1A'][i%5]};margin-left:${i*0}px;animation-delay:${i*120}ms">${K.esc(l)}</div>`).join('');}
async function seqStep(){const steps=seqSteps();if(cur>=steps.length){finish();return false;}const m=steps[cur];showDetail(m);if(m.fn)m.fn(st);
 if(!K.reduced){await new Promise(res=>{const t0=performance.now();const f=n=>{const p=Math.min(1,(n-t0)/650);drawSeq(cur,K.ease(p));p<1?requestAnimationFrame(f):res();};requestAnimationFrame(f);});}else drawSeq(cur,1);
 cur++;if(cur>=steps.length)finish();return true;}
function finish(){stop();if(st.finished)return;st.finished=true;if(S.onDone)S.onDone(st);else{const fl={};Object.keys(st).forEach(k=>{if(st[k]===true&&k!=='finished')fl[k]=true;});K.check('scenario-complete',{scenario:S.id,flags:fl});}}
function stop(){clearTimeout(timer);timer=null;K.$('#play').textContent='▶';}
let busy=false;async function stepOnce(){if(busy)return;busy=true;await seqStep();busy=false;}
function play(){if(timer){stop();return;}K.$('#play').textContent='⏸';const loop=async()=>{if(!timer)return;const more=await seqStep();if(more&&timer)timer=setTimeout(loop,K.reduced?50:900/(+cfg.speed||1));else stop();};timer=setTimeout(loop,10);}
// ---------- networking ----------
const PH=['phone','📱',t3('Your phone','Tumhara phone','आपका फ़ोन'),'#FFD23F'],SV=['server','🖥️',t3('Server','Server','सर्वर'),'#02CFF9'];
const tog=(id,label)=>`<label class="row mut" style="font-size:13px;gap:4px"><input type="checkbox" id="${id}" ${st[id]?'checked':''}> ${K.t(label)}</label>`;
SC['tcp-handshake']={title:t3('TCP three-way handshake','TCP three-way handshake','टीसीपी तीन-चरणीय हैंडशेक'),actors:[PH,SV],toggles:()=>tog('drop',t3('Lose the SYN-ACK','SYN-ACK kho do','SYN-ACK खो दो')),
 intro:t3('TCP gives reliable, ordered delivery over an unreliable network. Before any data, both sides agree on starting sequence numbers.','TCP unreliable network par reliable, ordered delivery deta hai. Data se pehle dono taraf starting sequence numbers par sehmat hote hain.','टीसीपी अविश्वसनीय नेटवर्क पर विश्वसनीय, क्रमबद्ध वितरण देता है। डेटा से पहले दोनों पक्ष आरंभिक क्रम संख्याओं पर सहमत होते हैं।'),
 steps:s=>{const a=[{from:'phone',to:'server',label:'SYN',fields:{src:'192.168.1.5:51514',dst:'203.0.113.25:443',flags:'SYN',seq:1000},text:t3('"Can we talk?" The phone picks a random initial sequence number (here 1000) and sets the SYN flag. State: SYN-SENT.','"Baat karein?" Phone ek random initial sequence number (yahan 1000) chunta hai aur SYN flag lagata hai. State: SYN-SENT.','"बात करें?" फ़ोन एक यादृच्छिक प्रारंभिक क्रम संख्या (यहाँ 1000) चुनता है और SYN ध्वज लगाता है। स्थिति: SYN-SENT।')}];
  if(s.drop)a.push({from:'server',to:'phone',label:'SYN-ACK',cls:'bad',drop:true,fields:{flags:'SYN,ACK',seq:5000,ack:1001},text:t3('The reply is lost on a noisy Wi-Fi link. The phone hears nothing…','Noisy Wi-Fi par reply kho gaya. Phone ko kuch sunai nahi diya…','शोर-भरे वाई-फ़ाई पर उत्तर खो गया। फ़ोन को कुछ नहीं मिला…')},{from:'phone',to:'phone',label:'⏱ RTO 1 s',cls:'warn',text:t3('Retransmission timer fires (the initial timeout is 1 second, RFC 6298), and it doubles on each retry.','Retransmission timer fire hota hai (initial timeout 1 second, RFC 6298), aur har retry par double hota hai.','पुनःप्रेषण टाइमर चलता है (प्रारंभिक समय-सीमा 1 सेकंड, RFC 6298), और हर प्रयास पर दोगुना होता है।')},{from:'phone',to:'server',label:'SYN (again)',cls:'warn',fields:{flags:'SYN',seq:1000},text:t3('Same SYN sent again. Reliability comes from timers + retransmission.','Wahi SYN dobara bheja. Reliability timers + retransmission se aati hai.','वही SYN फिर भेजा। विश्वसनीयता टाइमर + पुनःप्रेषण से आती है।')});
  return a.concat([{from:'server',to:'phone',label:'SYN-ACK',fields:{flags:'SYN,ACK',seq:5000,ack:1001},text:t3('"Yes, and here is my number." Server chooses seq 5000 and acknowledges 1001 = "I got your 1000, send 1001 next".','"Haan, aur yeh mera number." Server seq 5000 chunta hai aur 1001 acknowledge karta hai = "tumhara 1000 mila, ab 1001 bhejo".','"हाँ, और यह मेरी संख्या।" सर्वर seq 5000 चुनता है और 1001 स्वीकारता है = "आपका 1000 मिला, अब 1001 भेजो"।')},
  {from:'phone',to:'server',label:'ACK',fields:{flags:'ACK',seq:1001,ack:5001},text:t3('Phone acknowledges 5001. Both sides are ESTABLISHED after 1 round trip (1 RTT).','Phone 5001 acknowledge karta hai. 1 round trip (1 RTT) ke baad dono ESTABLISHED.','फ़ोन 5001 स्वीकारता है। 1 राउंड ट्रिप (1 RTT) के बाद दोनों ESTABLISHED।')},
  {from:'phone',to:'server',label:'DATA 78 B',fields:{flags:'PSH,ACK',seq:1001,len:78,payload:'(TLS ClientHello…)'},text:t3('Now real data flows. Each byte is numbered, so the receiver can reorder and spot gaps.','Ab asli data chalta hai. Har byte numbered hai, isliye receiver reorder kar sakta hai aur gaps pakad sakta hai.','अब असली डेटा चलता है। हर बाइट क्रमांकित है, इसलिए प्राप्तकर्ता क्रम सुधार सकता है और अंतराल पकड़ सकता है।')},
  {from:'server',to:'phone',label:'ACK 1079',fields:{flags:'ACK',ack:1079,window:65535},text:t3('ack = 1001 + 78 = 1079. The window field is flow control: how much more the receiver can accept.','ack = 1001 + 78 = 1079. Window field flow control hai: receiver aur kitna le sakta hai.','ack = 1001 + 78 = 1079। विंडो फ़ील्ड प्रवाह-नियंत्रण है: प्राप्तकर्ता और कितना ले सकता है।')},
  {from:'phone',to:'server',label:'FIN',fields:{flags:'FIN,ACK'},text:t3('Closing: each side sends FIN and gets an ACK. UDP, by contrast, has no handshake at all — used for video calls, DNS and games where speed beats perfection.','Band karna: har side FIN bhejti hai aur ACK paati hai. UDP mein koi handshake nahi — video calls, DNS aur games ke liye, jahan speed perfection se zyada zaroori.','बंद करना: हर पक्ष FIN भेजता है और ACK पाता है। यूडीपी में कोई हैंडशेक नहीं — वीडियो कॉल, DNS और खेलों के लिए, जहाँ गति पूर्णता से ज़्यादा ज़रूरी।')},{from:'server',to:'phone',label:'FIN-ACK',fields:{flags:'FIN,ACK'},text:t3('Server agrees to close.','Server band karne ko raazi.','सर्वर बंद करने को सहमत।')},{from:'phone',to:'server',label:'ACK',fields:{flags:'ACK'},text:t3('Connection closed (the phone waits in TIME-WAIT briefly to catch stray packets).','Connection band (phone thodi der TIME-WAIT mein rukta hai bhatke packets ke liye).','संयोजन बंद (फ़ोन भटके पैकेट के लिए थोड़ी देर TIME-WAIT में रुकता है)।')}]);}};
SC['dns-resolution']={title:t3('DNS: turning a name into an address','DNS: naam ko address mein badalna','डीएनएस: नाम को पते में बदलना'),actors:[['br','🌐',t3('Browser','Browser','ब्राउज़र'),'#FFD23F'],['rr','🏢',t3('Resolver','Resolver','रिज़ॉल्वर'),'#8B3DFF'],['root','🌳',t3('Root','Root','रूट'),'#22C55E'],['tld','🇮🇳',t3('.in TLD','.in TLD','.in टीएलडी'),'#FF7A1A'],['auth','📒',t3('Authoritative','Authoritative','आधिकारिक'),'#02CFF9']],toggles:()=>tog('cached',t3('Resolver already has it cached','Resolver ke cache mein pehle se','रिज़ॉल्वर के कैश में पहले से')),
 intro:t3('Computers route by IP address; humans remember names. DNS is the internet\'s distributed phone book.','Computers IP address se route karte hain; insaan naam yaad rakhte hain. DNS internet ki distributed phone book hai.','कंप्यूटर आईपी पते से मार्ग तय करते हैं; इंसान नाम याद रखते हैं। डीएनएस इंटरनेट की वितरित फ़ोन-बुक है।'),
 steps:s=>{const q={from:'br',to:'rr',label:'A? www.myschool.in',fields:{type:'A (IPv4)',name:'www.myschool.in',transport:'UDP port 53 (or DoH/DoT, encrypted)'},text:t3('Browser and OS caches missed, so the stub resolver asks a recursive resolver (your ISP\'s, or a public one).','Browser aur OS cache miss, to stub resolver recursive resolver (ISP ka ya public) se poochta hai.','ब्राउज़र और ओएस कैश में नहीं मिला, तो स्टब रिज़ॉल्वर पुनरावर्ती रिज़ॉल्वर (आईएसपी का या सार्वजनिक) से पूछता है।')};
  const ans={from:'rr',to:'br',label:'203.0.113.25',cls:'enc',fields:{answer:'www.myschool.in A 203.0.113.25',TTL:'300 s'},text:t3('Answer returned. The browser can now open a TCP/QUIC connection to 203.0.113.25 (a documentation example address).','Answer wapas. Browser ab 203.0.113.25 (documentation example address) se TCP/QUIC connection khol sakta hai.','उत्तर वापस। ब्राउज़र अब 203.0.113.25 (दस्तावेज़ीकरण उदाहरण पता) से TCP/QUIC संयोजन खोल सकता है।')};
  if(s.cached)return [q,{from:'rr',to:'rr',label:'cache HIT',cls:'enc',text:t3('The resolver looked this up for someone 2 minutes ago and the TTL (300 s) has not expired — no need to ask anyone. Caching is why DNS is fast.','Resolver ne 2 minute pehle kisi ke liye dekha tha aur TTL (300 s) khatam nahi hua — kisi se poochne ki zaroorat nahi. Caching ki wajah se DNS fast hai.','रिज़ॉल्वर ने 2 मिनट पहले किसी के लिए देखा था और TTL (300 s) ख़त्म नहीं हुआ — किसी से पूछने की ज़रूरत नहीं। कैशिंग से डीएनएस तेज़ है।')},ans];
  return [q,{from:'rr',to:'root',label:'www.myschool.in?',text:t3('Resolver starts at the top: one of the 13 named root server identities (a.root-servers.net … m.root-servers.net), served by 1,900+ anycast instances worldwide, including in India.','Resolver top se shuru: 13 named root server identities (a…m.root-servers.net) mein se ek, duniya bhar mein 1,900+ anycast instances, India mein bhi.','रिज़ॉल्वर ऊपर से शुरू: 13 नामित रूट सर्वर पहचान (a…m.root-servers.net) में से एक, विश्व भर में 1,900+ एनीकास्ट प्रतियाँ, भारत में भी।')},
  {from:'root',to:'rr',label:'ask .in servers',cls:'warn',fields:{type:'referral (NS)',NS:'.in name servers (run for NIXI)'},text:t3('Root does not know the answer but refers: "ask the .in servers". This is a referral, not an answer.','Root ko answer nahi pata par refer karta hai: ".in servers se poochho". Yeh referral hai, answer nahi.','रूट को उत्तर नहीं पता पर भेजता है: ".in सर्वर से पूछो"। यह संदर्भ है, उत्तर नहीं।')},
  {from:'rr',to:'tld',label:'www.myschool.in?',text:t3('Resolver asks the .in TLD servers (India\'s country-code domain, managed by NIXI).','Resolver .in TLD servers se poochta hai (India ka country-code domain, NIXI manage karta hai).','रिज़ॉल्वर .in टीएलडी सर्वर से पूछता है (भारत का देश-कोड डोमेन, NIXI प्रबंधित)।')},
  {from:'tld',to:'rr',label:'ask ns1.myschool-dns.in',cls:'warn',fields:{NS:'ns1.myschool-dns.in, ns2.myschool-dns.in'},text:t3('Another referral: the school\'s own (authoritative) name servers.','Ek aur referral: school ke apne (authoritative) name servers.','एक और संदर्भ: विद्यालय के अपने (आधिकारिक) नाम सर्वर।')},
  {from:'rr',to:'auth',label:'www.myschool.in?',text:t3('Resolver asks the authoritative server — the source of truth for this domain.','Resolver authoritative server se poochta hai — is domain ka source of truth.','रिज़ॉल्वर आधिकारिक सर्वर से पूछता है — इस डोमेन का सत्य-स्रोत।')},
  {from:'auth',to:'rr',label:'A 203.0.113.25',cls:'enc',fields:{record:'A',value:'203.0.113.25',TTL:300},text:t3('Final answer with a TTL of 300 s. The resolver caches it so the next 5 minutes of lookups are instant.','TTL 300 s ke saath final answer. Resolver cache karta hai taaki agle 5 minute ke lookups turant hon.','300 s TTL के साथ अंतिम उत्तर। रिज़ॉल्वर इसे कैश करता है ताकि अगले 5 मिनट की खोज तुरंत हो।')},ans];}};
SC['https-tls']={title:t3('HTTPS: the TLS 1.3 handshake','HTTPS: TLS 1.3 handshake','एचटीटीपीएस: टीएलएस 1.3 हैंडशेक'),actors:[['br','🌐',t3('Browser','Browser','ब्राउज़र'),'#FFD23F'],SV],toggles:()=>tog('fake',t3('Attacker\'s fake certificate','Attacker ka nakli certificate','हमलावर का नकली प्रमाणपत्र')),
 intro:t3('TLS gives three things: confidentiality (encryption), integrity (tamper detection) and authentication (you really are talking to the site).','TLS teen cheezein deta hai: confidentiality (encryption), integrity (tamper detection) aur authentication (tum sach mein sahi site se baat kar rahe ho).','टीएलएस तीन चीज़ें देता है: गोपनीयता (एन्क्रिप्शन), अखंडता (छेड़छाड़ पहचान) और प्रमाणीकरण (आप सच में सही साइट से बात कर रहे हो)।'),
 steps:s=>{const a=[{from:'br',to:'server',label:'ClientHello',fields:{version:'TLS 1.3',cipher_suites:'TLS_AES_128_GCM_SHA256, TLS_CHACHA20_POLY1305_SHA256',key_share:'x25519 public key (32 bytes)',SNI:'www.myschool.in',random:'32 random bytes'},text:t3('Browser offers ciphers and already sends its half of an ephemeral Diffie-Hellman key exchange (key_share).','Browser ciphers offer karta hai aur ephemeral Diffie-Hellman key exchange ka apna aadha hissa (key_share) pehle hi bhej deta hai.','ब्राउज़र सिफ़र प्रस्तावित करता है और क्षणिक डिफ़ी-हेलमैन कुंजी-विनिमय का अपना आधा भाग (key_share) पहले ही भेज देता है।')},
  {from:'server',to:'br',label:'ServerHello',fields:{cipher:'TLS_AES_128_GCM_SHA256',key_share:'server x25519 public key'},text:t3('Server picks a cipher and sends its key share. Both sides now compute the same shared secret — it never crossed the network.','Server cipher chunta hai aur apna key share bhejta hai. Dono ab wahi shared secret compute karte hain — jo network par kabhi gaya hi nahi.','सर्वर सिफ़र चुनता है और अपना कुंजी-भाग भेजता है। दोनों अब वही साझा रहस्य गणना करते हैं — जो नेटवर्क पर कभी गया ही नहीं।')},
  {from:'br',to:'br',label:'derive keys',cls:'enc',text:t3('ECDHE + HKDF turn the shared secret into session keys. Ephemeral keys give forward secrecy: stealing the server\'s long-term key later cannot decrypt today\'s traffic.','ECDHE + HKDF shared secret ko session keys banate hain. Ephemeral keys forward secrecy deti hain: baad mein server ki long-term key churane se aaj ka traffic decrypt nahi hota.','ECDHE + HKDF साझा रहस्य को सत्र कुंजियाँ बनाते हैं। क्षणिक कुंजियाँ अग्र गोपनीयता देती हैं: बाद में सर्वर की दीर्घकालिक कुंजी चुराने से आज का ट्रैफ़िक नहीं खुलता।')},
  {from:'server',to:'br',label:'Certificate + Verify + Finished',cls:'enc',fields:{certificate:s.fake?'CN=www.myschool.in, issuer: "Totally Real CA" (self-signed)':'CN=www.myschool.in, issuer: a public CA (e.g. Let\'s Encrypt) → trusted root',CertificateVerify:'signature over the handshake with the site\'s private key',Finished:'MAC of the whole handshake'},text:t3('Already encrypted. The certificate binds the site name to a public key; the signature proves the server holds the matching private key.','Ab encrypted. Certificate site ke naam ko public key se jodta hai; signature saabit karta hai ki server ke paas matching private key hai.','अब एन्क्रिप्टेड। प्रमाणपत्र साइट के नाम को सार्वजनिक कुंजी से जोड़ता है; हस्ताक्षर सिद्ध करता है कि सर्वर के पास मेल खाती निजी कुंजी है।')}];
  if(s.fake)return a.concat([{from:'br',to:'br',label:'✗ untrusted issuer',cls:'bad',text:t3('Chain does not lead to a root in the device\'s trust store → browser stops and shows "Your connection is not private" (NET::ERR_CERT_AUTHORITY_INVALID). Never click through on a bank or school login.','Chain device ke trust store ke kisi root tak nahi pahunchti → browser ruk kar "Your connection is not private" (NET::ERR_CERT_AUTHORITY_INVALID) dikhata hai. Bank ya school login par kabhi aage mat badho.','शृंखला डिवाइस के विश्वसनीय भंडार के किसी रूट तक नहीं पहुँचती → ब्राउज़र रुककर "आपका संयोजन निजी नहीं है" (NET::ERR_CERT_AUTHORITY_INVALID) दिखाता है। बैंक या स्कूल लॉगिन पर कभी आगे मत बढ़ो।')},{from:'br',to:'server',label:'alert: bad_certificate',cls:'bad',text:t3('Handshake aborted. No password was sent. This check is what defeats a man-in-the-middle on public Wi-Fi.','Handshake abort. Koi password nahi gaya. Yahi check public Wi-Fi par man-in-the-middle ko harata hai.','हैंडशेक रद्द। कोई पासवर्ड नहीं गया। यही जाँच सार्वजनिक वाई-फ़ाई पर बीच-के-आदमी को हराती है।')}]);
  return a.concat([{from:'br',to:'br',label:'✓ chain + name + date',cls:'enc',text:t3('Browser checks: chain ends at a trusted root, name matches www.myschool.in, not expired, not revoked.','Browser check karta hai: chain trusted root par khatam, naam www.myschool.in se match, expire nahi, revoke nahi.','ब्राउज़र जाँचता है: शृंखला विश्वसनीय रूट पर ख़त्म, नाम मेल खाता, समाप्त नहीं, रद्द नहीं।')},
  {from:'br',to:'server',label:'Finished',cls:'enc',text:t3('Handshake complete in 1 round trip (TLS 1.2 needed 2).','1 round trip mein handshake poora (TLS 1.2 ko 2 lagte the).','1 राउंड ट्रिप में हैंडशेक पूरा (TLS 1.2 को 2 लगते थे)।')},
  {from:'br',to:'server',label:'GET /results',cls:'enc',fields:{on_the_wire:'17 03 03 00 4a 9f e2 1c … (AES-GCM ciphertext)',inside:'GET /results HTTP/2, cookie: session=…'},text:t3('An eavesdropper sees the IP address and the server name (SNI) but not the page, cookies or password.','Eavesdropper ko IP address aur server name (SNI) dikhta hai par page, cookies ya password nahi.','छिपकर सुनने वाले को आईपी पता और सर्वर नाम (SNI) दिखता है पर पेज, कुकी या पासवर्ड नहीं।')},
  {from:'server',to:'br',label:'200 OK',cls:'enc',text:t3('Encrypted response. The padlock means the connection is private — not that the website itself is honest.','Encrypted response. Padlock ka matlab connection private hai — yeh nahi ki website khud imaandaar hai.','एन्क्रिप्टेड उत्तर। ताले का अर्थ है संयोजन निजी है — यह नहीं कि वेबसाइट स्वयं ईमानदार है।')}]);}};
SC['http-api']={title:t3('Client–server: a REST API call','Client–server: ek REST API call','क्लाइंट–सर्वर: एक REST API कॉल'),actors:[['app','📱',t3('App','App','ऐप'),'#FFD23F'],['api','🧩',t3('API server','API server','एपीआई सर्वर'),'#8B3DFF'],['db','🗄️',t3('Database','Database','डेटाबेस'),'#22C55E']],toggles:()=>tog('notoken',t3('Forget the login token','Login token bhool jao','लॉगिन टोकन भूल जाओ')),
 intro:t3('A client asks, a server answers. APIs are the menus servers publish so apps can ask in a fixed format.','Client poochta hai, server jawab deta hai. APIs woh menu hain jo servers publish karte hain taaki apps fixed format mein pooch sakein.','क्लाइंट पूछता है, सर्वर उत्तर देता है। एपीआई वे मेनू हैं जो सर्वर प्रकाशित करते हैं ताकि ऐप तय प्रारूप में पूछ सकें।'),
 steps:s=>{const a=[{from:'app',to:'api',label:'GET /api/v1/marks?term=1',fields:{method:'GET',url:'https://api.myschool.in/api/v1/marks?term=1',Authorization:s.notoken?'(missing)':'Bearer eyJhbGciOi… (JWT)',Accept:'application/json'},text:t3('HTTP request: a method (GET = read), a path, query parameters and headers.','HTTP request: method (GET = padhna), path, query parameters aur headers.','एचटीटीपी अनुरोध: विधि (GET = पढ़ना), पथ, क्वेरी मापदंड और हेडर।')}];
  if(s.notoken)return a.concat([{from:'api',to:'api',label:'auth ✗',cls:'bad',text:t3('No valid token — the server must never trust the client. It refuses before touching the database.','Koi valid token nahi — server ko client par kabhi bharosa nahi karna. Database chhoone se pehle mana.','कोई वैध टोकन नहीं — सर्वर को क्लाइंट पर कभी भरोसा नहीं करना। डेटाबेस छूने से पहले मना।')},{from:'api',to:'app',label:'401 Unauthorized',cls:'bad',fields:{status:401,body:'{"error":"login required"}'},text:t3('401 = who are you? (403 = I know you, but you are not allowed; 404 = not found; 500 = server bug.)','401 = tum kaun? (403 = pehchaanta hoon par permission nahi; 404 = nahi mila; 500 = server bug.)','401 = आप कौन? (403 = पहचानता हूँ पर अनुमति नहीं; 404 = नहीं मिला; 500 = सर्वर त्रुटि।)')}]);
  return a.concat([{from:'api',to:'api',label:'verify JWT ✓',cls:'enc',fields:{sub:'student:2026-09-14',role:'student',exp:'in 55 min'},text:t3('Server checks the token signature and expiry, and learns who is asking. Authorisation: a student may read only their own marks.','Server token ka signature aur expiry check karta hai, aur jaanta hai kaun pooch raha. Authorisation: student sirf apne marks padh sakta hai.','सर्वर टोकन का हस्ताक्षर और समाप्ति जाँचता है, और जानता है कौन पूछ रहा। प्राधिकरण: छात्र सिर्फ़ अपने अंक पढ़ सकता है।')},
  {from:'api',to:'db',label:'SELECT … WHERE id=$1',fields:{sql:'SELECT subject, marks FROM marks WHERE student_id = $1 AND term = $2',params:'["2026-09-14", 1]'},text:t3('A parameterised query: user input is passed separately from the SQL text, so it can never become code (this is how SQL injection is prevented).','Parameterised query: user input SQL text se alag jaata hai, isliye kabhi code nahi ban sakta (aise SQL injection roka jaata hai).','प्राचलित क्वेरी: उपयोगकर्ता इनपुट SQL पाठ से अलग जाता है, इसलिए कभी कोड नहीं बन सकता (ऐसे SQL इंजेक्शन रोका जाता है)।')},
  {from:'db',to:'api',label:'3 rows',fields:{rows:'[Maths 91] [Science 88] [Hindi 84]'},text:t3('Database returns rows in ~2 ms because student_id is indexed.','Database ~2 ms mein rows deta hai kyunki student_id indexed hai.','डेटाबेस ~2 ms में पंक्तियाँ देता है क्योंकि student_id अनुक्रमित है।')},
  {from:'api',to:'app',label:'200 OK · JSON',cls:'enc',fields:{status:200,'Content-Type':'application/json',body:'{"term":1,"marks":[{"subject":"Maths","marks":91},…]}','Cache-Control':'private, max-age=60'},text:t3('Server responds with JSON. The app draws it. REST verbs: GET read, POST create, PUT/PATCH update, DELETE remove.','Server JSON bhejta hai. App use draw karta hai. REST verbs: GET padho, POST banao, PUT/PATCH badlo, DELETE hatao.','सर्वर JSON भेजता है। ऐप उसे दिखाता है। REST क्रियाएँ: GET पढ़ो, POST बनाओ, PUT/PATCH बदलो, DELETE हटाओ।')}]);}};
SC['nat-router']={title:t3('NAT: many devices, one public IP','NAT: kai devices, ek public IP','एनएटी: कई डिवाइस, एक सार्वजनिक आईपी'),actors:[['lap','💻',t3('Laptop .5','Laptop .5','लैपटॉप .5'),'#FFD23F'],['ph','📱',t3('Phone .8','Phone .8','फ़ोन .8'),'#c4a3ff'],['rt','📡',t3('Home router','Home router','घरेलू राउटर'),'#FF7A1A'],['sv','🖥️',t3('Website','Website','वेबसाइट'),'#02CFF9']],
 intro:t3('There are only about 4.3 billion IPv4 addresses. Home routers share one public address among all your devices using Network Address Translation.','IPv4 addresses sirf lagbhag 4.3 billion hain. Home routers Network Address Translation se ek public address saare devices mein baant-te hain.','IPv4 पते सिर्फ़ लगभग 4.3 अरब हैं। घरेलू राउटर नेटवर्क एड्रेस ट्रांसलेशन से एक सार्वजनिक पता सभी डिवाइसों में बाँटते हैं।'),
 steps:[{from:'lap',to:'rt',label:'192.168.1.5:50001 →',fields:{src:'192.168.1.5:50001',dst:'198.51.100.20:443'},text:t3('192.168.x.x is a private range (RFC 1918): usable at home, never routed on the internet.','192.168.x.x private range hai (RFC 1918): ghar par use, internet par kabhi route nahi.','192.168.x.x निजी श्रेणी है (RFC 1918): घर पर उपयोग, इंटरनेट पर कभी मार्गित नहीं।')},
 {from:'rt',to:'rt',label:'NAT: 62001 ↔ .5:50001',cls:'warn',fields:{table:'203.0.113.7:62001 ↔ 192.168.1.5:50001'},text:t3('Router rewrites the source to its public IP and a fresh port, and remembers the mapping in its NAT table.','Router source ko apne public IP aur naye port se badalta hai, aur mapping NAT table mein yaad rakhta hai.','राउटर स्रोत को अपने सार्वजनिक आईपी और नए पोर्ट से बदलता है, और मैपिंग NAT तालिका में याद रखता है।')},
 {from:'rt',to:'sv',label:'203.0.113.7:62001 →',fields:{src:'203.0.113.7:62001',dst:'198.51.100.20:443'},text:t3('The website only ever sees the router\'s public address.','Website ko sirf router ka public address dikhta hai.','वेबसाइट को सिर्फ़ राउटर का सार्वजनिक पता दिखता है।')},
 {from:'ph',to:'rt',label:'192.168.1.8:40222 →',fields:{src:'192.168.1.8:40222',dst:'198.51.100.20:443'},text:t3('The phone connects to the same site at the same time.','Phone usi time usi site se connect karta hai.','फ़ोन उसी समय उसी साइट से जुड़ता है।')},
 {from:'rt',to:'sv',label:'203.0.113.7:62002 →',fields:{table:'62001 ↔ .5:50001 | 62002 ↔ .8:40222'},text:t3('Different public port keeps the two conversations apart (this is PAT, port address translation).','Alag public port do baatcheet ko alag rakhta hai (yeh PAT, port address translation hai).','अलग सार्वजनिक पोर्ट दो वार्तालापों को अलग रखता है (यह PAT, पोर्ट एड्रेस ट्रांसलेशन है)।')},
 {from:'sv',to:'rt',label:'→ 203.0.113.7:62002',cls:'enc',text:t3('Reply comes back to port 62002.','Reply port 62002 par wapas aata hai.','उत्तर पोर्ट 62002 पर वापस आता है।')},
 {from:'rt',to:'ph',label:'→ 192.168.1.8:40222',cls:'enc',text:t3('Router looks up 62002 in the table and forwards to the phone. Unsolicited inbound packets have no table entry and are dropped — a side-effect that acts like a basic firewall. IPv6 (2^128 addresses) removes the need for NAT.','Router table mein 62002 dekhkar phone ko bhejta hai. Bina maange aaye packets ki koi entry nahi, drop ho jaate hain — basic firewall jaisa side-effect. IPv6 (2^128 addresses) NAT ki zaroorat khatam karta hai.','राउटर तालिका में 62002 देखकर फ़ोन को भेजता है। बिना माँगे आए पैकेट की कोई प्रविष्टि नहीं, गिरा दिए जाते हैं — मूल फ़ायरवॉल जैसा प्रभाव। IPv6 (2^128 पते) NAT की ज़रूरत ख़त्म करता है।')}]};
SC['cdn-edge']={title:t3('CDN: serve from the nearest edge','CDN: sabse paas ke edge se serve','सीडीएन: सबसे पास के एज से परोसना'),actors:[['u1','🧑',t3('User 1 Chennai','User 1 Chennai','उपयोगकर्ता 1 चेन्नई'),'#FFD23F'],['u2','👩',t3('User 2 Chennai','User 2 Chennai','उपयोगकर्ता 2 चेन्नई'),'#c4a3ff'],['edge','⚡',t3('Edge (Chennai)','Edge (Chennai)','एज (चेन्नई)'),'#22C55E'],['origin','🏭',t3('Origin (Mumbai)','Origin (Mumbai)','मूल (मुंबई)'),'#02CFF9']],
 intro:t3('Light in fibre covers about 200 km per millisecond. A CDN keeps copies of files close to users so fewer requests travel far.','Fibre mein light lagbhag 200 km per millisecond chalti hai. CDN files ki copies users ke paas rakhta hai taaki kam requests door jaayein.','फ़ाइबर में प्रकाश लगभग 200 किमी प्रति मिलीसेकंड चलता है। सीडीएन फ़ाइलों की प्रतियाँ उपयोगकर्ताओं के पास रखता है ताकि कम अनुरोध दूर जाएँ।'),
 steps:[{from:'u1',to:'edge',label:'GET /logo.png',text:t3('DNS (or anycast) sends User 1 to the nearest edge server.','DNS (ya anycast) User 1 ko sabse paas ke edge server par bhejta hai.','डीएनएस (या एनीकास्ट) उपयोगकर्ता 1 को सबसे पास के एज सर्वर पर भेजता है।')},{from:'edge',to:'edge',label:'cache MISS',cls:'warn',text:t3('Edge does not have it yet.','Edge ke paas abhi nahi hai.','एज के पास अभी नहीं है।')},
 {from:'edge',to:'origin',label:'GET /logo.png',fields:{distance:'≈1,030 km straight line, longer by cable',round_trip:'≈30–40 ms typical'},text:t3('Edge fetches from the origin in Mumbai.','Edge Mumbai ke origin se laata hai.','एज मुंबई के मूल से लाता है।')},{from:'origin',to:'edge',label:'200 · max-age=86400',fields:{'Cache-Control':'public, max-age=86400',ETag:'"v42"'},text:t3('Origin says: anyone may cache this for 86,400 s (1 day).','Origin kehta hai: koi bhi ise 86,400 s (1 din) cache kar sakta hai.','मूल कहता है: कोई भी इसे 86,400 s (1 दिन) कैश कर सकता है।')},
 {from:'edge',to:'u1',label:'200 (≈45 ms)',text:t3('User 1 gets it after the long trip.','User 1 ko lambi trip ke baad milta hai.','उपयोगकर्ता 1 को लंबी यात्रा के बाद मिलता है।')},{from:'u2',to:'edge',label:'GET /logo.png',text:t3('A minute later User 2 asks for the same file.','Ek minute baad User 2 wahi file maangta hai.','एक मिनट बाद उपयोगकर्ता 2 वही फ़ाइल माँगता है।')},
 {from:'edge',to:'u2',label:'cache HIT (≈5 ms)',cls:'enc',text:t3('Served from the edge — about 9× faster, and the origin did no work. CDNs also absorb DDoS floods and terminate TLS near users. Private pages (marks, chats) are marked "private" and never cached at the edge.','Edge se serve — lagbhag 9× tez, aur origin ne koi kaam nahi kiya. CDN DDoS floods bhi jhelte hain aur TLS users ke paas terminate karte hain. Private pages (marks, chats) "private" mark hote hain aur edge par kabhi cache nahi hote.','एज से परोसा — लगभग 9× तेज़, और मूल ने कोई काम नहीं किया। सीडीएन DDoS बाढ़ भी झेलते हैं और TLS उपयोगकर्ताओं के पास समाप्त करते हैं। निजी पेज (अंक, चैट) "private" चिह्नित होते हैं और एज पर कभी कैश नहीं होते।')}]};
SC['routing-ttl']={title:t3('Routing: hop by hop, TTL counting down','Routing: hop by hop, TTL ghatta hua','रूटिंग: हॉप दर हॉप, घटता टीटीएल'),actors:[['me','💻',t3('You','Tum','आप'),'#FFD23F'],['r1','📡',t3('Home','Home','घर'),'#FF7A1A'],['r2','🏙️',t3('ISP','ISP','आईएसपी'),'#c4a3ff'],['r3','🔀',t3('IXP/backbone','IXP/backbone','IXP/बैकबोन'),'#8B3DFF'],['dst','🖥️',t3('Server','Server','सर्वर'),'#02CFF9']],
 intro:t3('No router knows the whole path. Each looks at the destination IP, finds the longest matching prefix in its routing table, and passes the packet one hop on.','Koi router poora raasta nahi jaanta. Har ek destination IP dekhta hai, routing table mein longest matching prefix dhoondta hai, aur packet ek hop aage bhejta hai.','कोई राउटर पूरा रास्ता नहीं जानता। हर एक गंतव्य आईपी देखता है, तालिका में सबसे लंबा मेल खाता उपसर्ग ढूँढता है, और पैकेट एक हॉप आगे भेजता है।'),
 steps:[{from:'me',to:'r1',label:'TTL 64',fields:{dst:'198.51.100.20',TTL:64},text:t3('Your OS sends to its default gateway (the home router). TTL starts at 64.','Tumhara OS default gateway (home router) ko bhejta hai. TTL 64 se shuru.','आपका ओएस डिफ़ॉल्ट गेटवे (घरेलू राउटर) को भेजता है। TTL 64 से शुरू।')},
 {from:'r1',to:'r2',label:'TTL 63',fields:{route:'0.0.0.0/0 → ISP (default route)'},text:t3('Home router has one rule: everything not local goes to the ISP. TTL − 1.','Home router ka ek rule: jo local nahi woh ISP ko. TTL − 1.','घरेलू राउटर का एक नियम: जो स्थानीय नहीं वह आईएसपी को। TTL − 1।')},
 {from:'r2',to:'r3',label:'TTL 62',fields:{route:'198.51.100.0/24 via backbone (learned by BGP)'},text:t3('ISP routers learn routes from other networks with BGP, the protocol that glues the ~75,000+ autonomous systems of the internet together.','ISP routers doosre networks se BGP se routes seekhte hain, woh protocol jo internet ke ~75,000+ autonomous systems ko jodta hai.','आईएसपी राउटर दूसरे नेटवर्कों से BGP द्वारा मार्ग सीखते हैं, वह प्रोटोकॉल जो इंटरनेट के ~75,000+ स्वायत्त तंत्रों को जोड़ता है।')},
 {from:'r3',to:'dst',label:'TTL 61',cls:'enc',text:t3('Delivered after 4 hops. If TTL ever hit 0, the router would drop it and send back an ICMP "Time Exceeded" — that is exactly how the traceroute tool maps each hop.','4 hops ke baad deliver. Agar TTL 0 ho jaata to router use drop karke ICMP "Time Exceeded" wapas bhejta — traceroute tool isi se har hop map karta hai.','4 हॉप के बाद पहुँचा। यदि TTL कभी 0 होता तो राउटर उसे गिराकर ICMP "समय समाप्त" वापस भेजता — traceroute उपकरण इसी से हर हॉप मैप करता है।')},
 {from:'dst',to:'me',label:'reply (may take another path)',cls:'enc',text:t3('Replies are routed independently; the return path can differ. TTL exists so a packet stuck in a routing loop dies instead of circling forever.','Replies alag se route hote hain; wapsi ka raasta alag ho sakta hai. TTL isliye hai ki routing loop mein phansa packet hamesha ghoomne ki jagah khatam ho jaaye.','उत्तर अलग से मार्गित होते हैं; वापसी का रास्ता अलग हो सकता है। TTL इसलिए है कि लूप में फँसा पैकेट हमेशा घूमने के बजाय ख़त्म हो जाए।')}]};
SC['dhcp-dora']={title:t3('DHCP: how your phone gets an IP','DHCP: phone ko IP kaise milta hai','डीएचसीपी: फ़ोन को आईपी कैसे मिलता है'),actors:[PH,['dh','📡',t3('Router (DHCP)','Router (DHCP)','राउटर (DHCP)'),'#FF7A1A']],intro:t3('When you join Wi-Fi you have no address yet. DHCP hands one out in four messages: D-O-R-A.','Wi-Fi join karte waqt tumhare paas address nahi hota. DHCP chaar messages mein deta hai: D-O-R-A.','वाई-फ़ाई जुड़ते समय आपके पास पता नहीं होता। डीएचसीपी चार संदेशों में देता है: D-O-R-A।'),
 steps:[{from:'phone',to:'dh',label:'Discover (broadcast)',fields:{src:'0.0.0.0:68',dst:'255.255.255.255:67',MAC:'a4:5e:60:12:9b:01'},text:t3('"Is there a DHCP server?" Sent to everyone, from address 0.0.0.0.','"Koi DHCP server hai?" Sabko bheja, address 0.0.0.0 se.','"कोई DHCP सर्वर है?" सबको भेजा, पता 0.0.0.0 से।')},{from:'dh',to:'phone',label:'Offer 192.168.1.23',fields:{yiaddr:'192.168.1.23',mask:'255.255.255.0',gateway:'192.168.1.1',DNS:'192.168.1.1',lease:'86400 s'},text:t3('Server offers an address plus gateway, DNS server and lease time.','Server address ke saath gateway, DNS server aur lease time offer karta hai.','सर्वर पते के साथ गेटवे, DNS सर्वर और पट्टा-समय देता है।')},{from:'phone',to:'dh',label:'Request',text:t3('"I\'ll take 192.168.1.23." (Broadcast, so other DHCP servers know their offers were declined.)','"Main 192.168.1.23 lunga." (Broadcast, taaki doosre DHCP servers jaanein unke offers mana hue.)','"मैं 192.168.1.23 लूँगा।" (प्रसारण, ताकि अन्य DHCP सर्वर जानें उनके प्रस्ताव अस्वीकृत।)')},{from:'dh',to:'phone',label:'Ack',cls:'enc',text:t3('Confirmed for 24 h; the phone renews at half-time (T1 = 12 h). A rogue DHCP server on public Wi-Fi could hand out a malicious DNS server — one reason to prefer trusted networks or a VPN.','24 h ke liye pakka; phone aadhe time (T1 = 12 h) par renew karta hai. Public Wi-Fi par rogue DHCP server galat DNS server de sakta hai — trusted networks ya VPN pasand karne ki ek wajah.','24 घंटे के लिए पक्का; फ़ोन आधे समय (T1 = 12 घंटे) पर नवीनीकरण करता है। सार्वजनिक वाई-फ़ाई पर दुष्ट DHCP सर्वर ग़लत DNS दे सकता है — विश्वसनीय नेटवर्क या VPN चुनने का एक कारण।')}]};
SC['osi-encapsulation']={title:t3('Layers: wrapping a message for the journey','Layers: message ko safar ke liye lapetna','परतें: यात्रा के लिए संदेश लपेटना'),actors:[['a','💻',t3('Sender','Sender','प्रेषक'),'#FFD23F'],['sw','🔌',t3('Switch (L2)','Switch (L2)','स्विच (L2)'),'#22C55E'],['rt','📡',t3('Router (L3)','Router (L3)','राउटर (L3)'),'#FF7A1A'],['b','🖥️',t3('Receiver','Receiver','प्राप्तकर्ता'),'#02CFF9']],intro:t3('Each layer adds its own header (encapsulation). TCP/IP has 4 layers; the OSI model names 7 for teaching.','Har layer apna header jodti hai (encapsulation). TCP/IP ki 4 layers; OSI model padhane ke liye 7 naam deta hai.','हर परत अपना हेडर जोड़ती है (एनकैप्सुलेशन)। TCP/IP में 4 परतें; OSI मॉडल शिक्षण के लिए 7 नाम देता है।'),
 steps:[{from:'a',to:'a',label:'L7 data',layers:['HTTP: GET /index.html'],text:t3('Application layer (L7): the message itself.','Application layer (L7): khud message.','अनुप्रयोग परत (L7): स्वयं संदेश।')},{from:'a',to:'a',label:'+ TCP (L4)',layers:['TCP hdr: src port 51514 · dst port 443 · seq 1001','HTTP: GET /index.html'],text:t3('Transport (L4) adds ports (which app) and sequence numbers → a segment.','Transport (L4) ports (kaun sa app) aur sequence numbers jodta hai → segment.','परिवहन (L4) पोर्ट (कौन-सा ऐप) और क्रम संख्याएँ जोड़ता है → खंड।')},{from:'a',to:'a',label:'+ IP (L3)',layers:['IP hdr: 192.168.1.5 → 203.0.113.25 · TTL 64','TCP hdr: 51514 → 443','HTTP: GET /index.html'],text:t3('Network (L3) adds IP addresses (which computer) → a packet.','Network (L3) IP addresses (kaun sa computer) jodta hai → packet.','नेटवर्क (L3) आईपी पते (कौन-सा कंप्यूटर) जोड़ता है → पैकेट।')},{from:'a',to:'a',label:'+ Ethernet (L2)',layers:['Eth hdr: MAC a4:5e… → router MAC 00:1a…','IP hdr: 192.168.1.5 → 203.0.113.25','TCP hdr: 51514 → 443','HTTP: GET /index.html','FCS (CRC-32 checksum)'],text:t3('Data link (L2) adds MAC addresses for the next hop only, plus a checksum → a frame. Physical (L1) sends bits as light, voltage or radio.','Data link (L2) sirf agle hop ke MAC addresses aur checksum jodta hai → frame. Physical (L1) bits ko light, voltage ya radio banata hai.','डेटा लिंक (L2) सिर्फ़ अगले हॉप के MAC पते और चेकसम जोड़ता है → फ़्रेम। भौतिक (L1) बिट को प्रकाश, वोल्टेज या रेडियो बनाता है।')},{from:'a',to:'sw',label:'frame',text:t3('A switch reads only the L2 MAC address and forwards on the right port.','Switch sirf L2 MAC address padhta hai aur sahi port par bhejta hai.','स्विच सिर्फ़ L2 MAC पता पढ़ता है और सही पोर्ट पर भेजता है।')},{from:'sw',to:'rt',label:'frame',text:t3('Into the router.','Router mein.','राउटर में।')},{from:'rt',to:'rt',label:'new L2, TTL 63',cls:'warn',layers:['Eth hdr: NEW MACs for next link','IP hdr: same IPs · TTL 63','TCP hdr: unchanged','HTTP: unchanged'],text:t3('Router strips the old frame, reads L3, decrements TTL and wraps a new L2 frame. IP addresses stay end-to-end (unless NAT); MACs change every hop.','Router purana frame hatata hai, L3 padhta hai, TTL ghatata hai aur naya L2 frame lapet-ta hai. IP addresses end-to-end same (NAT ke bina); MAC har hop par badalte hain.','राउटर पुराना फ़्रेम हटाता है, L3 पढ़ता है, TTL घटाता है और नया L2 फ़्रेम लपेटता है। आईपी पते अंत-से-अंत वही (NAT के बिना); MAC हर हॉप पर बदलते हैं।')},{from:'rt',to:'b',label:'frame',cls:'enc',text:t3('Receiver unwraps L2 → L3 → L4 and hands "GET /index.html" to the web server on port 443 (decapsulation).','Receiver L2 → L3 → L4 kholta hai aur "GET /index.html" port 443 ke web server ko deta hai (decapsulation).','प्राप्तकर्ता L2 → L3 → L4 खोलता है और "GET /index.html" पोर्ट 443 के वेब सर्वर को देता है (डीकैप्सुलेशन)।')}]};
// ---------- cloud ----------
SC['serverless-coldstart']={title:t3('Serverless: cold start vs warm','Serverless: cold start vs warm','सर्वरलेस: ठंडी शुरुआत बनाम गर्म'),actors:[['u','📱',t3('Student','Student','छात्र'),'#FFD23F'],['gw','🚪',t3('API gateway','API gateway','एपीआई गेटवे'),'#8B3DFF'],['fn','λ',t3('Function','Function','फ़ंक्शन'),'#FF7A1A'],['db','🗄️',t3('Database','Database','डेटाबेस'),'#22C55E']],intro:t3('Serverless = you upload a function; the cloud runs, scales and bills it per request (per millisecond). There are still servers — you just do not manage them.','Serverless = tum function upload karo; cloud use chalata, scale karta aur per request (per millisecond) bill karta hai. Servers phir bhi hain — bas tum manage nahi karte.','सर्वरलेस = आप फ़ंक्शन अपलोड करो; क्लाउड उसे चलाता, बढ़ाता और प्रति अनुरोध (प्रति मिलीसेकंड) बिल करता है। सर्वर फिर भी हैं — बस आप प्रबंधित नहीं करते।'),
 steps:[{from:'u',to:'gw',label:'POST /submit-quiz',text:t3('First request after a quiet night.','Shaant raat ke baad pehli request.','शांत रात के बाद पहला अनुरोध।')},{from:'gw',to:'fn',label:'invoke',text:t3('Gateway triggers the function.','Gateway function trigger karta hai.','गेटवे फ़ंक्शन चलाता है।')},{from:'fn',to:'fn',label:'❄ cold start ~300 ms',cls:'warn',fields:{steps:'allocate micro-VM/container → load runtime → load your code → run init'},text:t3('No instance is running, so the platform creates one. Typical cold starts are 100 ms to over 1 s depending on runtime and package size.','Koi instance nahi chal raha, to platform naya banata hai. Typical cold start 100 ms se 1 s se zyada, runtime aur package size par nirbhar.','कोई उदाहरण नहीं चल रहा, तो प्लेटफ़ॉर्म नया बनाता है। सामान्य ठंडी शुरुआत 100 ms से 1 s से अधिक, रनटाइम और पैकेज आकार पर निर्भर।')},{from:'fn',to:'db',label:'INSERT score',text:t3('Function does its job.','Function apna kaam karta hai.','फ़ंक्शन अपना काम करता है।')},{from:'fn',to:'u',label:'200 (≈380 ms)',text:t3('Done, but slow because of the cold start.','Ho gaya, par cold start ki wajah se slow.','हो गया, पर ठंडी शुरुआत से धीमा।')},{from:'u',to:'gw',label:'POST /submit-quiz',text:t3('Second student, 2 seconds later.','Doosra student, 2 second baad.','दूसरा छात्र, 2 सेकंड बाद।')},{from:'gw',to:'fn',label:'invoke (warm)',cls:'enc',text:t3('The instance is still alive (warm).','Instance abhi zinda hai (warm).','उदाहरण अभी जीवित है (गर्म)।')},{from:'fn',to:'u',label:'200 (≈40 ms)',cls:'enc',text:t3('Warm call: ~10× faster. 500 students at once? The platform runs many instances in parallel automatically. Trade-offs: cold starts, time limits, and vendor lock-in.','Warm call: ~10× tez. 500 students ek saath? Platform apne aap kai instances parallel chalata hai. Trade-offs: cold starts, time limits, aur vendor lock-in.','गर्म कॉल: ~10× तेज़। 500 छात्र एक साथ? प्लेटफ़ॉर्म स्वतः कई उदाहरण समानांतर चलाता है। समझौते: ठंडी शुरुआत, समय सीमाएँ, और विक्रेता बंधन।')}]};
SC['container-lifecycle']={title:t3('Containers: build once, run anywhere','Containers: ek baar build, kahin bhi run','कंटेनर: एक बार बनाओ, कहीं भी चलाओ'),actors:[['dev','👩‍💻',t3('Developer','Developer','डेवलपर'),'#FFD23F'],['reg','📦',t3('Registry','Registry','रजिस्ट्री'),'#8B3DFF'],['k8s','☸️',t3('Orchestrator','Orchestrator','ऑर्केस्ट्रेटर'),'#02CFF9'],['node','🖥️',t3('Servers','Servers','सर्वर'),'#22C55E']],intro:t3('A container packages an app with its libraries so it runs the same on a laptop and in the cloud. It shares the host\'s OS kernel, so it starts in seconds — lighter than a virtual machine.','Container app ko uski libraries ke saath pack karta hai taaki laptop aur cloud mein ek jaisa chale. Yeh host ka OS kernel share karta hai, isliye seconds mein start — virtual machine se halka.','कंटेनर ऐप को उसकी लाइब्रेरी के साथ पैक करता है ताकि लैपटॉप और क्लाउड में एक-सा चले। यह मेज़बान का ओएस कर्नेल साझा करता है, इसलिए सेकंडों में शुरू — वर्चुअल मशीन से हल्का।'),
 steps:[{from:'dev',to:'dev',label:'docker build',fields:{Dockerfile:'FROM python:3.12-slim · COPY . /app · RUN pip install -r requirements.txt · CMD ["python","app.py"]'},text:t3('The Dockerfile is a recipe; building it produces an image made of read-only layers.','Dockerfile ek recipe hai; build karne se read-only layers wali image banti hai.','Dockerfile एक नुस्ख़ा है; बनाने से केवल-पठन परतों वाली इमेज बनती है।')},{from:'dev',to:'reg',label:'push quiz-app:1.4',text:t3('Image pushed to a registry with a version tag.','Image version tag ke saath registry mein push.','इमेज संस्करण टैग के साथ रजिस्ट्री में भेजी।')},{from:'dev',to:'k8s',label:'deploy replicas=3',fields:{image:'quiz-app:1.4',replicas:3,cpu:'250m',memory:'256Mi'},text:t3('You declare the desired state: 3 copies. The orchestrator (e.g. Kubernetes) makes reality match.','Tum desired state batate ho: 3 copies. Orchestrator (jaise Kubernetes) haqeeqat ko match karata hai.','आप वांछित स्थिति बताते हो: 3 प्रतियाँ। ऑर्केस्ट्रेटर (जैसे कुबरनेटीज़) वास्तविकता को मिलाता है।')},{from:'k8s',to:'node',label:'schedule 3 pods',text:t3('It picks servers with free CPU and memory.','Free CPU aur memory wale servers chunta hai.','ख़ाली CPU और मेमोरी वाले सर्वर चुनता है।')},{from:'node',to:'reg',label:'pull image',text:t3('Each server pulls the same image — identical everywhere.','Har server wahi image pull karta hai — har jagah same.','हर सर्वर वही इमेज लेता है — हर जगह समान।')},{from:'node',to:'node',label:'💥 one server dies',cls:'bad',text:t3('Hardware fails. Only 2 copies are running now.','Hardware fail. Ab sirf 2 copies chal rahi hain.','हार्डवेयर विफल। अब सिर्फ़ 2 प्रतियाँ चल रही हैं।')},{from:'k8s',to:'node',label:'self-heal: start pod #3',cls:'enc',text:t3('The control loop notices 2 ≠ 3 and starts a replacement within seconds. Declarative desired state + reconciliation is the core idea of cloud-native systems.','Control loop dekhta hai 2 ≠ 3 aur seconds mein replacement start karta hai. Declarative desired state + reconciliation cloud-native systems ka core idea hai.','नियंत्रण लूप देखता है 2 ≠ 3 और सेकंडों में प्रतिस्थापन शुरू करता है। घोषणात्मक वांछित स्थिति + मिलान क्लाउड-नेटिव प्रणालियों का मूल विचार है।')}]};
SC['lb-autoscale']={title:t3('Load balancer + autoscaling on results day','Results day par load balancer + autoscaling','परिणाम दिवस पर लोड बैलेंसर + स्वतः-विस्तार'),actors:[['users','👥',t3('Students','Students','छात्र'),'#FFD23F'],['lb','⚖️',t3('Load balancer','Load balancer','लोड बैलेंसर'),'#8B3DFF'],['s1','🖥️',t3('Server 1','Server 1','सर्वर 1'),'#22C55E'],['s2','🖥️',t3('Server 2','Server 2','सर्वर 2'),'#22C55E'],['s3','✨',t3('Server 3 (new)','Server 3 (naya)','सर्वर 3 (नया)'),'#02CFF9']],intro:t3('Results day: traffic jumps 20× at 10 am. Scaling out (more servers) beats scaling up (one bigger server) for this.','Results day: 10 baje traffic 20× badhta hai. Iske liye scale out (zyada servers) scale up (ek bada server) se behtar.','परिणाम दिवस: 10 बजे ट्रैफ़िक 20× बढ़ता है। इसके लिए क्षैतिज विस्तार (अधिक सर्वर) ऊर्ध्व विस्तार (एक बड़ा सर्वर) से बेहतर।'),
 steps:[{from:'users',to:'lb',label:'1,000 req/s',text:t3('Requests hit one public address: the load balancer.','Requests ek public address par aati hain: load balancer.','अनुरोध एक सार्वजनिक पते पर आते हैं: लोड बैलेंसर।')},{from:'lb',to:'s1',label:'round-robin',text:t3('It spreads requests across healthy servers…','Yeh requests healthy servers mein baant-ta hai…','यह अनुरोध स्वस्थ सर्वरों में बाँटता है…')},{from:'lb',to:'s2',label:'round-robin',text:t3('…taking turns.','…baari-baari.','…बारी-बारी।')},{from:'s2',to:'s2',label:'CPU 85% > 70%',cls:'warn',fields:{metric:'average CPU 85% for 3 min',policy:'target 70%'},text:t3('Monitoring sees CPU above the 70% target.','Monitoring dekhta hai CPU 70% target se upar.','निगरानी देखती है CPU 70% लक्ष्य से ऊपर।')},{from:'lb',to:'s3',label:'autoscale +1',cls:'enc',text:t3('The autoscaler launches server 3 from the same image; after its health check passes, the LB adds it.','Autoscaler usi image se server 3 launch karta hai; health check pass hone par LB use jodta hai.','स्वतः-विस्तारक उसी इमेज से सर्वर 3 चलाता है; स्वास्थ्य जाँच पास होने पर LB उसे जोड़ता है।')},{from:'lb',to:'s3',label:'traffic',cls:'enc',text:t3('CPU drops to ~57% each. At 2 pm traffic falls and the extra server is removed — you pay only for what you use. Servers must be stateless (sessions in a shared store) for this to work.','Har ek ka CPU ~57%. 2 baje traffic girta hai aur extra server hata diya jaata hai — jitna use utna paisa. Iske liye servers stateless hone chahiye (sessions shared store mein).','हर एक का CPU ~57%। 2 बजे ट्रैफ़िक गिरता है और अतिरिक्त सर्वर हटता है — जितना उपयोग उतना भुगतान। इसके लिए सर्वर स्टेटलेस होने चाहिए (सत्र साझा भंडार में)।')}]};
SC['mobile-5g']={title:t3('5G: from switch-on to streaming (with handover)','5G: on karne se streaming tak (handover ke saath)','5G: चालू करने से स्ट्रीमिंग तक (हैंडओवर सहित)'),actors:[['phone','📱',t3('Phone','Phone','फ़ोन'),'#FFD23F'],['gnb','📡',t3('Tower A','Tower A','टावर A'),'#8B3DFF'],['gnb2','📡',t3('Tower B','Tower B','टावर B'),'#02CFF9'],['core','🏢',t3('5G core','5G core','5G कोर'),'#22C55E'],['net','🌐',t3('Internet','Internet','इंटरनेट'),'#FF6B6B']],
 toggles:()=>tog('handover',t3('Move to the next tower mid-video','Video ke beech agle tower par jao','वीडियो के बीच अगले टावर पर जाओ')),
 intro:t3('A 5G phone talks by radio to a tower (gNB). The tower connects by fibre to the operator\'s core, which checks the SIM, gives an IP session and forwards data to the internet. In India 5G launched on 1 October 2022, mostly on the n78 band (3.3–3.6 GHz).','5G phone radio se tower (gNB) se baat karta hai. Tower fibre se operator ke core se juda hai, jo SIM check karta hai, IP session deta hai aur data internet tak bhejta hai. India mein 5G 1 October 2022 ko launch hua, zyaadatar n78 band (3.3–3.6 GHz) par.','5G फ़ोन रेडियो से टावर (gNB) से बात करता है। टावर फ़ाइबर से ऑपरेटर के कोर से जुड़ा है, जो सिम जाँचता है, आईपी सत्र देता है और डेटा इंटरनेट तक भेजता है। भारत में 5G 1 अक्टूबर 2022 को शुरू हुआ, ज़्यादातर n78 बैंड (3.3–3.6 GHz) पर।'),
 steps:s=>{const a=[{from:'phone',to:'gnb',label:'RRC setup',fields:{band:'n78 (3.5 GHz)',signal:'RSRP −85 dBm (good)'},text:t3('Switched on, the phone scans for the strongest tower and asks for a radio connection (RRC).','On hote hi phone sabse strong tower dhoondhta hai aur radio connection (RRC) maangta hai.','चालू होते ही फ़ोन सबसे मज़बूत टावर ढूँढता है और रेडियो कनेक्शन (RRC) माँगता है।')},
 {from:'gnb',to:'core',label:'Registration',fields:{id:'SUCI (encrypted SIM identity)'},text:t3('The tower forwards a registration request. 5G sends the SIM identity encrypted (SUCI), so eavesdroppers cannot track you by it.','Tower registration request aage bhejta hai. 5G SIM identity encrypted (SUCI) bhejta hai, taaki chhupkar sunne wale tumhe track na kar sakein.','टावर पंजीकरण अनुरोध आगे भेजता है। 5G सिम पहचान एन्क्रिप्ट करके (SUCI) भेजता है, ताकि छिपकर सुनने वाले आपको ट्रैक न कर सकें।')},
 {from:'core',to:'phone',label:'AKA challenge',cls:'enc',fields:{method:'5G-AKA',secret:'key K stays inside SIM'},text:t3('The core sends a challenge only the real SIM can answer, using a secret key that never leaves the SIM. Both sides also prove the network is genuine.','Core ek challenge bhejta hai jiska jawab sirf asli SIM de sakta hai, ek secret key se jo SIM se kabhi bahar nahi jaati. Dono taraf network ke asli hone ka bhi saboot hota hai.','कोर एक चुनौती भेजता है जिसका उत्तर सिर्फ़ असली सिम दे सकता है, एक गुप्त कुंजी से जो सिम से कभी बाहर नहीं जाती। दोनों तरफ़ नेटवर्क असली होने का भी प्रमाण होता है।')},
 {from:'core',to:'phone',label:'PDU session · IP',fields:{ip:'2001:db8:4f::27 (IPv6)',slice:'eMBB'},text:t3('Authenticated. The core sets up a data session (PDU session) and gives the phone an IP address — usually IPv6 in India.','Authenticated. Core data session (PDU session) banata hai aur phone ko IP address deta hai — India mein aksar IPv6.','प्रमाणित। कोर डेटा सत्र (PDU सत्र) बनाता है और फ़ोन को आईपी पता देता है — भारत में अक्सर IPv6।')},
 {from:'phone',to:'net',label:'video request',fields:{path:'phone → tower → UPF → internet',rtt:'≈20–30 ms'},text:t3('Now video packets flow: phone → tower → core user-plane (UPF) → internet, and back.','Ab video packets chalte hain: phone → tower → core user-plane (UPF) → internet, aur wapas.','अब वीडियो पैकेट चलते हैं: फ़ोन → टावर → कोर यूज़र-प्लेन (UPF) → इंटरनेट, और वापस।')}];
 if(s.handover)a.push({from:'phone',to:'gnb',label:'Measurement report',cls:'warn',fields:{towerA:'−110 dBm (weak)',towerB:'−82 dBm (strong)'},text:t3('You are in a moving auto. Tower A fades, tower B is stronger, and the phone reports this.','Tum chalti auto mein ho. Tower A kamzor, tower B strong, aur phone yeh report karta hai.','आप चलते ऑटो में हो। टावर A कमज़ोर, टावर B मज़बूत, और फ़ोन यह बताता है।')},
 {from:'gnb',to:'gnb2',label:'Handover request',fields:{link:'Xn interface'},text:t3('Tower A asks tower B to take over and passes your context.','Tower A, tower B se kaam sambhalne ko kehta hai aur tumhara context deta hai.','टावर A, टावर B से काम सँभालने को कहता है और आपका संदर्भ देता है।')},
 {from:'gnb2',to:'core',label:'Path switch',cls:'enc',fields:{ip:'unchanged',gap:'tens of ms'},text:t3('The core switches the data path to tower B. Your IP and session stay the same, so the video keeps playing.','Core data path tower B par switch karta hai. Tumhara IP aur session wahi rehta hai, to video chalta rehta hai.','कोर डेटा पथ टावर B पर बदलता है। आपका आईपी और सत्र वही रहता है, तो वीडियो चलता रहता है।')});
 return a.concat([{from:'net',to:'phone',label:'video stream',fields:{target:'IMT-2020 peak 20 Gbps, 1 ms (lab targets)',typical:'100–500 Mbps real world'},text:t3('Data streams back. IMT-2020 targets (20 Gbps peak, 1 ms radio latency) are ideal-lab numbers; real phones usually see a few hundred Mbps.','Data wapas stream hota hai. IMT-2020 targets (20 Gbps peak, 1 ms radio latency) ideal lab numbers hain; asli phones aam taur par kuch sau Mbps dekhte hain.','डेटा वापस आता है। IMT-2020 लक्ष्य (20 Gbps शिखर, 1 ms रेडियो विलंब) आदर्श प्रयोगशाला अंक हैं; असली फ़ोन आम तौर पर कुछ सौ Mbps देखते हैं।')}]);}};
