SC['fetch-execute']={title:t3('Fetch–decode–execute: one instruction','Fetch–decode–execute: ek instruction','फ़ेच–डिकोड–एक्ज़ीक्यूट: एक निर्देश'),actors:[['cu','🧭',t3('Control unit','Control unit','नियंत्रण इकाई'),'#8B3DFF'],['reg','🗂️',t3('Registers','Registers','रजिस्टर'),'#FFD23F'],['alu','➕',t3('ALU','ALU','ALU'),'#22C55E'],['ram','🧠',t3('RAM','RAM','RAM'),'#02CFF9']],
 intro:t3('In a von Neumann machine, program and data share one memory. The CPU repeats fetch → decode → execute billions of times a second. Here: ADD R1, [100] — add the number at address 100 to register R1.','Von Neumann machine mein program aur data ek hi memory share karte hain. CPU fetch → decode → execute har second arbon baar dohraata hai. Yahan: ADD R1, [100] — address 100 ka number register R1 mein jodo.','वॉन न्यूमैन मशीन में प्रोग्राम और डेटा एक ही मेमोरी बाँटते हैं। CPU फ़ेच → डिकोड → एक्ज़ीक्यूट हर सेकंड अरबों बार दोहराता है। यहाँ: ADD R1, [100] — पता 100 की संख्या को रजिस्टर R1 में जोड़ो।'),
 steps:[{from:'cu',to:'ram',label:'fetch @PC=40',fields:{PC:40,bus:'address bus → 40'},text:t3('The program counter (PC) holds 40, the address of the next instruction. The control unit asks RAM for it.','Program counter (PC) mein 40 hai, agle instruction ka address. Control unit RAM se use maangta hai.','प्रोग्राम काउंटर (PC) में 40 है, अगले निर्देश का पता। नियंत्रण इकाई RAM से उसे माँगती है।')},
 {from:'ram',to:'cu',label:'ADD R1,[100]',fields:{IR:'ADD R1,[100]',PC:'40 → 44'},text:t3('The instruction arrives in the instruction register (IR) and the PC moves on to 44.','Instruction, instruction register (IR) mein aata hai aur PC 44 par badh jaata hai.','निर्देश, निर्देश रजिस्टर (IR) में आता है और PC 44 पर बढ़ता है।')},
 {from:'cu',to:'cu',label:'decode',fields:{opcode:'ADD',operands:'R1, memory[100]'},text:t3('Decode: the opcode says ADD; one operand is register R1, the other is in memory at 100.','Decode: opcode kehta hai ADD; ek operand register R1, doosra memory mein 100 par.','डिकोड: ऑपकोड कहता है ADD; एक ऑपरेंड रजिस्टर R1, दूसरा मेमोरी में 100 पर।')},
 {from:'cu',to:'ram',label:'read [100]',text:t3('Fetch the data: read memory address 100.','Data fetch karo: memory address 100 padho.','डेटा लाओ: मेमोरी पता 100 पढ़ो।')},
 {from:'ram',to:'alu',label:'7',fields:{'memory[100]':7},text:t3('RAM returns 7 to the ALU.','RAM ALU ko 7 deta hai.','RAM, ALU को 7 देता है।')},
 {from:'reg',to:'alu',label:'R1 = 5',fields:{R1:5},text:t3('Register R1 (value 5) goes to the ALU too.','Register R1 (value 5) bhi ALU mein jaata hai.','रजिस्टर R1 (मान 5) भी ALU में जाता है।')},
 {from:'alu',to:'reg',label:'R1 ← 12',cls:'enc',fields:{result:12,flags:'Z=0 C=0'},text:t3('Execute: 5 + 7 = 12 is written back to R1, and flags record facts like zero or carry. Then the cycle repeats at PC = 44. A 3 GHz core runs 3 billion clock ticks a second, and modern cores overlap several instructions (pipelining).','Execute: 5 + 7 = 12 wapas R1 mein likha jaata hai, aur flags zero ya carry jaisi baatein note karte hain. Phir cycle PC = 44 par dohraata hai. 3 GHz core har second 3 arab clock ticks chalata hai, aur modern cores kai instructions overlap karte hain (pipelining).','एक्ज़ीक्यूट: 5 + 7 = 12 वापस R1 में लिखा जाता है, और फ़्लैग शून्य या कैरी जैसी बातें दर्ज करते हैं। फिर चक्र PC = 44 पर दोहराता है। 3 GHz कोर हर सेकंड 3 अरब घड़ी-टिक चलाता है, और आधुनिक कोर कई निर्देश एक साथ आगे बढ़ाते हैं (पाइपलाइनिंग)।')}]};
SC['cache-lookup']={title:t3('Cache hit vs miss: the memory hierarchy','Cache hit vs miss: memory hierarchy','कैश हिट बनाम मिस: मेमोरी पदानुक्रम'),actors:[['cpu','⚙️',t3('CPU core','CPU core','CPU कोर'),'#8B3DFF'],['l1','⚡',t3('L1 cache','L1 cache','L1 कैश'),'#22C55E'],['l3','📦',t3('L2/L3 cache','L2/L3 cache','L2/L3 कैश'),'#FFD23F'],['ram','🧠',t3('RAM','RAM','RAM'),'#02CFF9'],['ssd','💾',t3('SSD','SSD','SSD'),'#FF6B6B']],
 toggles:()=>tog('miss',t3('First touch (cache miss)','Pehli baar (cache miss)','पहली बार (कैश मिस)')),
 intro:t3('Fast memory is small and costly; big memory is slow. CPUs keep recently used data in caches close to the core. Typical times: L1 ≈1 ns, L3 ≈10 ns, RAM ≈80–100 ns, NVMe SSD ≈20–100 µs.','Fast memory chhoti aur mehengi; badi memory slow. CPUs haal mein use hua data core ke paas caches mein rakhte hain. Typical time: L1 ≈1 ns, L3 ≈10 ns, RAM ≈80–100 ns, NVMe SSD ≈20–100 µs.','तेज़ मेमोरी छोटी और महँगी; बड़ी मेमोरी धीमी। CPU हाल में इस्तेमाल डेटा कोर के पास कैश में रखते हैं। सामान्य समय: L1 ≈1 ns, L3 ≈10 ns, RAM ≈80–100 ns, NVMe SSD ≈20–100 µs।'),
 steps:s=>s.miss?[{from:'cpu',to:'l1',label:'load x',text:t3('The core needs variable x. It checks L1 first…','Core ko variable x chahiye. Pehle L1 check karta hai…','कोर को चर x चाहिए। पहले L1 जाँचता है…')},{from:'l1',to:'l3',label:'miss → L3',cls:'warn',text:t3('…L1 miss. Ask the bigger, slower L3.','…L1 miss. Bade, slower L3 se poocho.','…L1 मिस। बड़े, धीमे L3 से पूछो।')},{from:'l3',to:'ram',label:'miss → RAM',cls:'warn',fields:{cost:'≈100 ns ≈ 300 clock cycles at 3 GHz'},text:t3('L3 miss too. Fetch from RAM — about 300 wasted clock cycles.','L3 bhi miss. RAM se laao — lagbhag 300 clock cycles bekaar.','L3 भी मिस। RAM से लाओ — लगभग 300 घड़ी-चक्र बेकार।')},{from:'ram',to:'l1',label:'64-byte line',fields:{line:'x and its 15 neighbours (int32)'},text:t3('RAM sends a whole 64-byte cache line, not just x. Neighbours come too, because programs often use nearby data next (spatial locality).','RAM poori 64-byte cache line bhejta hai, sirf x nahi. Padosi bhi aate hain, kyunki programs aksar paas wala data agla use karte hain (spatial locality).','RAM पूरी 64-बाइट कैश लाइन भेजता है, सिर्फ़ x नहीं। पड़ोसी भी आते हैं, क्योंकि प्रोग्राम अक्सर पास का डेटा आगे इस्तेमाल करते हैं (स्थानिक निकटता)।')},{from:'l1',to:'cpu',label:'x (slow)',text:t3('Now x is in L1. The next access will be a hit. Untick to see it.','Ab x L1 mein hai. Agla access hit hoga. Untick karke dekho.','अब x L1 में है। अगली पहुँच हिट होगी। हटाकर देखो।')}]
 :[{from:'cpu',to:'l1',label:'load x',text:t3('The core needs x again…','Core ko x phir chahiye…','कोर को x फिर चाहिए…')},{from:'l1',to:'cpu',label:'hit ≈1 ns',cls:'enc',fields:{cost:'≈4 cycles'},text:t3('L1 hit: about 4 cycles. Loops that reuse data (temporal locality) and walk arrays in order (spatial locality) stay fast. A program that jumps randomly through huge memory can be 10–100× slower.','L1 hit: lagbhag 4 cycles. Data dobaara use karne wale loops (temporal locality) aur arrays ko kram se chalne wale (spatial locality) tez rehte hain. Badi memory mein random koodne wala program 10–100× slow ho sakta hai.','L1 हिट: लगभग 4 चक्र। डेटा दोबारा इस्तेमाल करने वाले लूप (कालिक निकटता) और सरणियों को क्रम से चलने वाले (स्थानिक निकटता) तेज़ रहते हैं। बड़ी मेमोरी में बेतरतीब कूदने वाला प्रोग्राम 10–100× धीमा हो सकता है।')},{from:'cpu',to:'ssd',label:'(if not in RAM)',cls:'warn',fields:{cost:'≈50 µs ≈ 150,000 cycles'},text:t3('For scale: data only on the SSD costs about 150,000 cycles. That is why the OS keeps hot files in RAM (page cache).','Andaaze ke liye: sirf SSD par data lagbhag 150,000 cycles leta hai. Isliye OS garam files RAM mein rakhta hai (page cache).','अंदाज़े के लिए: सिर्फ़ SSD पर डेटा लगभग 1,50,000 चक्र लेता है। इसलिए OS गरम फ़ाइलें RAM में रखता है (पेज कैश)।')}]};
SC['syscall-read']={title:t3('A system call: reading a file','System call: file padhna','सिस्टम कॉल: फ़ाइल पढ़ना'),actors:[['app','📝',t3('App (user mode)','App (user mode)','ऐप (उपयोगकर्ता मोड)'),'#FFD23F'],['k','🛡️',t3('Kernel','Kernel','कर्नेल'),'#8B3DFF'],['fs','🗃️',t3('File system','File system','फ़ाइल सिस्टम'),'#22C55E'],['disk','💾',t3('SSD driver','SSD driver','SSD ड्राइवर'),'#02CFF9']],
 intro:t3('Apps cannot touch hardware directly. They ask the kernel through system calls. The CPU switches from user mode to kernel mode and back, which keeps one buggy app from crashing everything.','Apps hardware ko seedha chhoo nahi sakte. Woh system calls se kernel se maangte hain. CPU user mode se kernel mode aur wapas switch karta hai, jisse ek buggy app sab kuch crash nahi kar paata.','ऐप हार्डवेयर को सीधे नहीं छू सकते। वे सिस्टम कॉल से कर्नेल से माँगते हैं। CPU उपयोगकर्ता मोड से कर्नेल मोड और वापस बदलता है, जिससे एक गड़बड़ ऐप सब कुछ क्रैश नहीं कर पाता।'),
 steps:[{from:'app',to:'k',label:'open("notes.txt")',cls:'warn',fields:{mode:'user → kernel (trap)'},text:t3('The app calls open(). A special instruction traps into the kernel.','App open() call karta hai. Ek special instruction kernel mein trap karta hai.','ऐप open() बुलाता है। एक ख़ास निर्देश कर्नेल में ट्रैप करता है।')},
 {from:'k',to:'fs',label:'lookup + permission',fields:{inode:1842,perms:'rw-r--r-- owner riya'},text:t3('The kernel asks the file system to find the file\'s inode and checks permissions: may this user read it?','Kernel file system se file ka inode dhoondhne ko kehta hai aur permissions check karta hai: kya yeh user padh sakta hai?','कर्नेल फ़ाइल सिस्टम से फ़ाइल का inode ढूँढने को कहता है और अनुमतियाँ जाँचता है: क्या यह उपयोगकर्ता पढ़ सकता है?')},
 {from:'k',to:'app',label:'fd = 3',fields:{fd:3},text:t3('Allowed. The app gets a file descriptor — a small number standing for the open file.','Allowed. App ko file descriptor milta hai — khuli file ke liye ek chhota number.','अनुमति। ऐप को फ़ाइल डिस्क्रिप्टर मिलता है — खुली फ़ाइल के लिए छोटी संख्या।')},
 {from:'app',to:'k',label:'read(3, buf, 4096)',cls:'warn',text:t3('The app asks to read 4 KB.','App 4 KB padhne ko kehta hai.','ऐप 4 KB पढ़ने को कहता है।')},
 {from:'k',to:'disk',label:'block 77310',fields:{note:'not in page cache'},text:t3('Not cached in RAM, so the kernel asks the SSD driver for the block. The app waits (blocked); the scheduler runs something else meanwhile.','RAM mein cached nahi, to kernel SSD driver se block maangta hai. App wait karta hai (blocked); scheduler tab tak kuch aur chalata hai.','RAM में कैश नहीं, तो कर्नेल SSD ड्राइवर से ब्लॉक माँगता है। ऐप रुकता है (blocked); शेड्यूलर तब तक कुछ और चलाता है।')},
 {from:'disk',to:'k',label:'interrupt: done',text:t3('The SSD finishes and raises an interrupt. The kernel copies data into the page cache and the app\'s buffer.','SSD khatam karke interrupt bhejta hai. Kernel data page cache aur app ke buffer mein copy karta hai.','SSD पूरा करके इंटरप्ट भेजता है। कर्नेल डेटा पेज कैश और ऐप के बफ़र में कॉपी करता है।')},
 {from:'k',to:'app',label:'4096 bytes',cls:'enc',fields:{mode:'kernel → user'},text:t3('Back to user mode with the data. On Linux you can watch every system call a program makes with the strace tool.','Data ke saath wapas user mode. Linux par strace tool se program ki har system call dekh sakte ho.','डेटा के साथ वापस उपयोगकर्ता मोड। लिनक्स पर strace टूल से प्रोग्राम की हर सिस्टम कॉल देख सकते हो।')}]};
SC['page-fault']={title:t3('Virtual memory and a page fault','Virtual memory aur page fault','वर्चुअल मेमोरी और पेज फ़ॉल्ट'),actors:[['p','📝',t3('Process','Process','प्रोसेस'),'#FFD23F'],['mmu','🧮',t3('MMU + TLB','MMU + TLB','MMU + TLB'),'#8B3DFF'],['k','🛡️',t3('Kernel','Kernel','कर्नेल'),'#22C55E'],['ram','🧠',t3('RAM','RAM','RAM'),'#02CFF9'],['sw','💾',t3('Swap / file','Swap / file','स्वैप / फ़ाइल'),'#FF6B6B']],
 toggles:()=>tog('fault',t3('Page not in RAM (page fault)','Page RAM mein nahi (page fault)','पेज RAM में नहीं (पेज फ़ॉल्ट)')),
 intro:t3('Every process sees its own private address space. The MMU translates virtual addresses to physical RAM in 4 KB pages, using page tables set up by the kernel. Processes cannot see each other\'s memory.','Har process apna private address space dekhta hai. MMU kernel ki banayi page tables se virtual addresses ko 4 KB pages mein physical RAM mein badalta hai. Processes ek-doosre ki memory nahi dekh sakte.','हर प्रोसेस अपना निजी पता-स्थान देखता है। MMU कर्नेल की बनाई पेज तालिकाओं से वर्चुअल पतों को 4 KB पेजों में भौतिक RAM में बदलता है। प्रोसेस एक-दूसरे की मेमोरी नहीं देख सकते।'),
 steps:s=>{const a=[{from:'p',to:'mmu',label:'read 0x7f3a2010',fields:{page:'0x7f3a2',offset:'0x010'},text:t3('The process reads a virtual address. The top bits are the page number, the low 12 bits the offset inside the 4 KB page.','Process ek virtual address padhta hai. Upar ke bits page number, neeche ke 12 bits 4 KB page ke andar offset.','प्रोसेस एक वर्चुअल पता पढ़ता है। ऊपर के बिट पेज संख्या, नीचे के 12 बिट 4 KB पेज के अंदर ऑफ़सेट।')}];
 if(!s.fault)return a.concat([{from:'mmu',to:'ram',label:'frame 0x1b4 + 0x010',cls:'enc',fields:{TLB:'hit',physical:'0x1b4010'},text:t3('The TLB (a tiny cache of translations) has it: virtual page 0x7f3a2 → physical frame 0x1b4. Read happens in nanoseconds.','TLB (translations ka chhota cache) mein hai: virtual page 0x7f3a2 → physical frame 0x1b4. Read nanoseconds mein.','TLB (अनुवादों का छोटा कैश) में है: वर्चुअल पेज 0x7f3a2 → भौतिक फ़्रेम 0x1b4। पढ़ना नैनोसेकंड में।')},{from:'ram',to:'p',label:'data',text:t3('Data returns. Tick "page fault" to see what happens when the page is not in RAM.','Data wapas. "Page fault" tick karke dekho page RAM mein na ho to kya hota hai.','डेटा वापस। "पेज फ़ॉल्ट" चुनकर देखो पेज RAM में न हो तो क्या होता है।')}]);
 return a.concat([{from:'mmu',to:'k',label:'PAGE FAULT',cls:'bad',fields:{present:0},text:t3('The page table says "not present". The MMU raises a page fault and the kernel takes over.','Page table kehta hai "not present". MMU page fault uthata hai aur kernel sambhalta hai.','पेज तालिका कहती है "मौजूद नहीं"। MMU पेज फ़ॉल्ट उठाता है और कर्नेल सँभालता है।')},{from:'k',to:'ram',label:'free a frame',cls:'warn',fields:{policy:'evict least-recently-used page'},text:t3('RAM is full, so the kernel picks a page not used recently and writes it out if it was modified.','RAM full hai, to kernel haal mein na use hua page chunta hai aur badla ho to bahar likh deta hai.','RAM भरी है, तो कर्नेल हाल में इस्तेमाल न हुआ पेज चुनता है और बदला हो तो बाहर लिख देता है।')},{from:'sw',to:'ram',label:'load page',fields:{cost:'≈0.05–10 ms (SSD vs HDD)'},text:t3('The needed page is loaded from swap or from the program file. This is thousands of times slower than RAM.','Zaroori page swap ya program file se load hota hai. Yeh RAM se hazaaron guna slow hai.','ज़रूरी पेज स्वैप या प्रोग्राम फ़ाइल से लोड होता है। यह RAM से हज़ारों गुना धीमा है।')},{from:'k',to:'mmu',label:'update page table',text:t3('The kernel updates the page table and restarts the instruction.','Kernel page table update karta hai aur instruction dobaara chalata hai.','कर्नेल पेज तालिका अपडेट करता है और निर्देश दोबारा चलाता है।')},{from:'ram',to:'p',label:'data (slow)',cls:'enc',text:t3('It works, just slower. When too many pages bounce in and out, the system "thrashes" — the reason a phone with too many apps open feels sluggish.','Kaam hota hai, bas slow. Jab bahut pages andar-bahar hote hain, system "thrash" karta hai — isi wajah se bahut apps khule phone sust lagta hai.','काम होता है, बस धीमा। जब बहुत पेज अंदर-बाहर होते हैं, प्रणाली "थ्रैश" करती है — इसी वजह से बहुत ऐप खुले फ़ोन सुस्त लगता है।')}]);}};
SC['rr-scheduler']={title:t3('CPU scheduling: round robin','CPU scheduling: round robin','CPU शेड्यूलिंग: राउंड रॉबिन'),actors:[['sch','⏱️',t3('Scheduler','Scheduler','शेड्यूलर'),'#8B3DFF'],['cpu','⚙️',t3('CPU core','CPU core','CPU कोर'),'#22C55E'],['A','🎵',t3('Music (A)','Music (A)','संगीत (A)'),'#FFD23F'],['B','🌐',t3('Browser (B)','Browser (B)','ब्राउज़र (B)'),'#02CFF9'],['C','📦',t3('Backup (C)','Backup (C)','बैकअप (C)'),'#FF6B6B']],
 intro:t3('One core runs one thread at a time, yet music, a browser and a backup all seem to run together. The scheduler gives each a short time slice (here 10 ms) and switches quickly — a context switch.','Ek core ek samay mein ek thread chalata hai, phir bhi music, browser aur backup saath chalte lagte hain. Scheduler har ek ko chhota time slice (yahan 10 ms) deta hai aur jaldi switch karta hai — context switch.','एक कोर एक समय में एक थ्रेड चलाता है, फिर भी संगीत, ब्राउज़र और बैकअप साथ चलते लगते हैं। शेड्यूलर हर एक को छोटा समय-खंड (यहाँ 10 ms) देता है और जल्दी बदलता है — संदर्भ परिवर्तन।'),
 steps:[{from:'sch',to:'A',label:'run 0–10 ms',fields:{queue:'A B C'},text:t3('A gets the CPU for 10 ms.','A ko 10 ms ke liye CPU milta hai.','A को 10 ms के लिए CPU मिलता है।')},
 {from:'A',to:'sch',label:'slice over',cls:'warn',fields:{saved:'registers, PC of A'},text:t3('A timer interrupt fires. The scheduler saves A\'s registers and program counter (its context).','Timer interrupt aata hai. Scheduler A ke registers aur program counter (uska context) save karta hai.','टाइमर इंटरप्ट आता है। शेड्यूलर A के रजिस्टर और प्रोग्राम काउंटर (उसका संदर्भ) सहेजता है।')},
 {from:'sch',to:'B',label:'run 10–20 ms',fields:{queue:'B C A'},text:t3('B runs next; A goes to the back of the queue.','Agla B chalta hai; A queue ke peeche jaata hai.','अगला B चलता है; A कतार के पीछे जाता है।')},
 {from:'B',to:'sch',label:'waits for network',cls:'warn',fields:{state:'B → blocked'},text:t3('B asks for a web page and must wait for the network, so it gives up the CPU early (blocked).','B web page maangta hai aur network ka wait karna hai, to jaldi CPU chhod deta hai (blocked).','B वेब पेज माँगता है और नेटवर्क का इंतज़ार करना है, तो जल्दी CPU छोड़ देता है (blocked)।')},
 {from:'sch',to:'C',label:'run 14–24 ms',fields:{queue:'C A'},text:t3('C (backup) runs. Its slice is not wasted waiting for B.','C (backup) chalta hai. B ke intezaar mein slice bekaar nahi jaata.','C (बैकअप) चलता है। B के इंतज़ार में खंड बेकार नहीं जाता।')},
 {from:'sch',to:'A',label:'priority boost',cls:'enc',fields:{reason:'audio must not stutter'},text:t3('Real schedulers mix in priorities: interactive and audio tasks get the CPU quickly so music never stutters, while the backup takes leftover time. Linux has used the Completely Fair Scheduler and, since kernel 6.6 (2023), the EEVDF scheduler; phones also choose between fast and power-saving cores.','Asli schedulers priorities milate hain: interactive aur audio tasks ko jaldi CPU milta hai taaki music na atke, aur backup bacha hua time leta hai. Linux ne Completely Fair Scheduler use kiya aur kernel 6.6 (2023) se EEVDF scheduler; phones fast aur power-saving cores ke beech bhi chunte hain.','असली शेड्यूलर प्राथमिकताएँ मिलाते हैं: इंटरैक्टिव और ऑडियो काम को जल्दी CPU मिलता है ताकि संगीत न अटके, और बैकअप बचा समय लेता है। लिनक्स ने Completely Fair Scheduler इस्तेमाल किया और कर्नेल 6.6 (2023) से EEVDF शेड्यूलर; फ़ोन तेज़ और बिजली-बचत कोर के बीच भी चुनते हैं।')}]};
// ---------- UPI with fraud scoring (three runs) ----------
const RISK={low:{label:t3('₹120 to a regular chai shop','Regular chai shop ko ₹120','नियमित चाय दुकान को ₹120'),score:0.04,f:{amount:'₹120',payee:'known, paid 30 times',device:'same phone, 2 years',time:'8:10 am',score:'0.04 (low)'}},medium:{label:t3('₹9,500 to a new payee at night','Raat ko naye payee ko ₹9,500','रात को नए प्राप्तकर्ता को ₹9,500'),score:0.46,f:{amount:'₹9,500 (≈12× usual)',payee:'first time',device:'same phone',time:'11:40 pm',score:'0.46 (medium)'}},high:{label:t3('₹49,000 "refund" collect request from a stranger','Anjaan se ₹49,000 "refund" collect request','अनजान से ₹49,000 "रिफ़ंड" कलेक्ट अनुरोध'),score:0.93,f:{amount:'₹49,000',type:'collect request ("approve to receive refund")',device:'app re-installed 10 min ago',payee:'account flagged as possible mule',score:'0.93 (high)'}}};
SC['upi-fraud-score']={title:t3('UPI: where the fraud model scores a payment','UPI: fraud model payment ko kahan score karta hai','यूपीआई: धोखाधड़ी मॉडल भुगतान को कहाँ अंक देता है'),actors:[['app','📱',t3('UPI app','UPI app','यूपीआई ऐप'),'#FFD23F'],['psp','🏦',t3('Your bank','Tumhara bank','आपका बैंक'),'#8B3DFF'],['npci','🔁',t3('NPCI switch','NPCI switch','NPCI स्विच'),'#02CFF9'],['pb','🏛️',t3('Payee bank','Payee bank','प्राप्तकर्ता बैंक'),'#22C55E']],
 intro:t3('Pick a payment type below, then press ▶. Run all three risk levels.','Neeche payment type chuno, phir ▶ dabao. Teeno risk levels chalao.','नीचे भुगतान प्रकार चुनो, फिर ▶ दबाओ। तीनों जोखिम स्तर चलाओ।'),
 extra(el){el.style.display='';el.innerHTML=`<h2>${K.t(t3('Payment','Payment','भुगतान'))}</h2>`+Object.keys(RISK).map(k=>`<button class="btn chk ${st.risk===k?'on':''}" data-k="${k}">${st.done&&st.done[k]?'✓ ':''}${K.t(RISK[k].label)}</button>`).join('')+`<div class="explain">${K.t(t3('Banks and NPCI run fraud-risk models within the few seconds a UPI payment takes. UPI is real-time and normally irreversible, so stopping fraud before money moves matters. Never enter your UPI PIN to "receive" money — a PIN is only ever needed to pay.','Banks aur NPCI UPI payment ke kuch seconds ke andar fraud-risk models chalate hain. UPI real-time aur aam taur par wapas na hone wala hai, isliye paisa chalne se pehle fraud rokna zaroori. Paisa "receive" karne ke liye kabhi UPI PIN mat daalo — PIN sirf pay karne ke liye lagta hai.','बैंक और NPCI यूपीआई भुगतान के कुछ सेकंडों के भीतर धोखाधड़ी-जोखिम मॉडल चलाते हैं। यूपीआई तत्काल और आम तौर पर अपरिवर्तनीय है, इसलिए पैसा चलने से पहले धोखाधड़ी रोकना ज़रूरी। पैसा "पाने" के लिए कभी यूपीआई पिन मत डालो — पिन सिर्फ़ भुगतान के लिए लगता है।'))}</div>`;
  K.$$('button[data-k]',el).forEach(b=>b.onclick=()=>{st.risk=b.dataset.k;cur=0;st.finished=false;S.extra(el);drawSeq(-1,1);showDetail(null);});},
 steps:s=>{const r=RISK[s.risk||'low'];const a=[{from:'app',to:'psp',label:'pay + PIN (encrypted)',fields:{...r.f,PIN:'encrypted on the phone; only your bank can verify it'},text:t3('You approve with your UPI PIN. The app sends the request to your bank (the payer PSP).','Tum UPI PIN se approve karte ho. App request tumhare bank (payer PSP) ko bhejta hai.','आप यूपीआई पिन से स्वीकृति देते हो। ऐप अनुरोध आपके बैंक (भुगतानकर्ता PSP) को भेजता है।')},
  {from:'psp',to:'npci',label:'route',text:t3('Your bank forwards it to NPCI\'s UPI switch, which finds the payee\'s bank from the UPI ID.','Tumhara bank ise NPCI ke UPI switch ko bhejta hai, jo UPI ID se payee ka bank dhoondhta hai.','आपका बैंक इसे NPCI के यूपीआई स्विच को भेजता है, जो यूपीआई आईडी से प्राप्तकर्ता का बैंक ढूँढता है।')},
  {from:'npci',to:'npci',label:'risk score '+r.score,cls:s.risk==='high'?'bad':s.risk==='medium'?'warn':'enc',fields:r.f,text:t3('Fraud models (at the banks and NPCI) score features: amount vs your habit, new payee, new device, time, collect-request type, payee reputation.','Fraud models (banks aur NPCI par) features score karte hain: amount vs tumhari aadat, naya payee, naya device, time, collect-request type, payee ki reputation.','धोखाधड़ी मॉडल (बैंकों और NPCI पर) फ़ीचरों को अंक देते हैं: राशि बनाम आपकी आदत, नया प्राप्तकर्ता, नया डिवाइस, समय, कलेक्ट-अनुरोध प्रकार, प्राप्तकर्ता की साख।')}];
  if(s.risk==='high')return a.concat([{from:'npci',to:'app',label:'DECLINED',cls:'bad',text:t3('High risk → payment blocked before money moves. The app warns you and suggests reporting at 1930 / cybercrime.gov.in. The flagged account is reported for review (RBI\'s MuleHunter.AI helps banks find such mule accounts).','High risk → paisa chalne se pehle payment block. App warn karta hai aur 1930 / cybercrime.gov.in par report karne ko kehta hai. Flagged account review ke liye report (RBI ka MuleHunter.AI banks ko aise mule accounts dhoondhne mein madad karta hai).','ऊँचा जोखिम → पैसा चलने से पहले भुगतान रोका गया। ऐप चेताता है और 1930 / cybercrime.gov.in पर रिपोर्ट सुझाता है। चिह्नित खाता समीक्षा के लिए भेजा जाता है (आरबीआई का MuleHunter.AI बैंकों को ऐसे म्यूल खाते ढूँढने में मदद करता है)।')}]);
  const warn=s.risk==='medium'?[{from:'app',to:'app',label:'⚠ confirm?',cls:'warn',text:t3('Medium risk → not blocked, but you are asked to confirm: "First payment to this person. Do you know them?" Friction, not refusal.','Medium risk → block nahi, par confirm karne ko kaha jaata hai: "Is vyakti ko pehla payment. Kya aap inhe jaante hain?" Rukawat, inkaar nahi.','मध्यम जोखिम → रोका नहीं, पर पुष्टि माँगी जाती है: "इस व्यक्ति को पहला भुगतान। क्या आप इन्हें जानते हैं?" रुकावट, इनकार नहीं।')}]:[];
  return a.concat(warn,[{from:'npci',to:'psp',label:'debit',text:t3('NPCI asks your bank to debit your account.','NPCI tumhare bank se account debit karne ko kehta hai.','NPCI आपके बैंक से खाता नामे करने को कहता है।')},{from:'npci',to:'pb',label:'credit',cls:'enc',text:t3('Payee\'s bank credits the receiver.','Payee ka bank receiver ko credit karta hai.','प्राप्तकर्ता का बैंक राशि जमा करता है।')},{from:'npci',to:'app',label:'SUCCESS ✓',cls:'enc',text:t3('Done in a few seconds. Most payments are low risk and pass with no friction at all.','Kuch seconds mein ho gaya. Zyaadatar payments low risk hote hain aur bina rukawat pass hote hain.','कुछ सेकंड में हो गया। ज़्यादातर भुगतान कम जोखिम वाले होते हैं और बिना रुकावट पास होते हैं।')}]);},
 onDone:s=>{s.done=s.done||{};s.done[s.risk||'low']=1;S.extra(K.$('#extra'));if(Object.keys(s.done).length===3){K.check('scenario-complete',{scenario:'upi-fraud-score'});}else K.toast(K.t(t3('Now try another risk level','Ab doosra risk level try karo','अब दूसरा जोखिम स्तर आज़माओ')));}};
// ---------- AI timeline ----------
const MS=[['1950',t3('Alan Turing asks "Can machines think?" and proposes the imitation game.','Alan Turing poochte hain "Kya machines soch sakti hain?" aur imitation game dete hain.','एलन ट्यूरिंग पूछते हैं "क्या मशीनें सोच सकती हैं?" और नकल-खेल प्रस्तावित करते हैं।')],['1956',t3('Dartmouth workshop: the term "artificial intelligence" is born.','Dartmouth workshop: "artificial intelligence" shabd ka janm.','डार्टमाउथ कार्यशाला: "कृत्रिम बुद्धि" शब्द का जन्म।')],['1958',t3('Rosenblatt\'s perceptron: an early learning neuron.','Rosenblatt ka perceptron: ek shuruaati seekhne wala neuron.','रोज़ेनब्लैट का परसेप्ट्रॉन: एक शुरुआती सीखने वाला न्यूरॉन।')],['1966',t3('ELIZA, a rule-based chatbot, fools some users.','ELIZA, rule-based chatbot, kuch users ko bewakoof banata hai.','एलिज़ा, नियम-आधारित चैटबॉट, कुछ उपयोगकर्ताओं को भ्रमित करता है।')],['1970s–80s',t3('AI winters: big promises, too little compute and data. Expert systems boom, then fade.','AI winters: bade vaade, kam compute aur data. Expert systems ka boom, phir dheema.','एआई सर्दियाँ: बड़े वादे, कम कंप्यूट और डेटा। विशेषज्ञ प्रणालियों का उछाल, फिर गिरावट।')],['1997',t3('IBM Deep Blue beats world chess champion Garry Kasparov.','IBM Deep Blue world chess champion Garry Kasparov ko harata hai.','आईबीएम डीप ब्लू विश्व शतरंज विजेता गैरी कास्पारोव को हराता है।')],['2012',t3('AlexNet wins ImageNet using GPUs: the deep-learning era starts.','AlexNet GPUs se ImageNet jeetta hai: deep-learning yug shuru.','एलेक्सनेट GPU से इमेजनेट जीतता है: डीप-लर्निंग युग शुरू।')],['2016',t3('AlphaGo beats Lee Sedol at Go, 4–1.','AlphaGo Go mein Lee Sedol ko 4–1 se harata hai.','अल्फ़ागो गो में ली सेडोल को 4–1 से हराता है।')],['2017',t3('"Attention Is All You Need": the transformer.','"Attention Is All You Need": transformer.','"अटेंशन इज़ ऑल यू नीड": ट्रांसफ़ॉर्मर।')],['2020',t3('AlphaFold 2 predicts protein structures; GPT-3 shows large language models.','AlphaFold 2 protein structures predict karta hai; GPT-3 bade language models dikhata hai.','अल्फ़ाफ़ोल्ड 2 प्रोटीन संरचनाएँ बताता है; GPT-3 बड़े भाषा मॉडल दिखाता है।')],['2022',t3('ChatGPT launches (30 November) and reaches millions within days.','ChatGPT launch (30 November) aur dinon mein lakhon users.','चैटजीपीटी शुरू (30 नवंबर) और दिनों में लाखों उपयोगकर्ता।')],['2024',t3('Nobel Prizes: Hopfield & Hinton (Physics) for neural networks; Hassabis & Jumper (Chemistry) for AlphaFold. IndiaAI Mission approved.','Nobel Prizes: Hopfield & Hinton (Physics) neural networks ke liye; Hassabis & Jumper (Chemistry) AlphaFold ke liye. IndiaAI Mission approve.','नोबेल पुरस्कार: हॉपफ़ील्ड और हिंटन (भौतिकी) न्यूरल नेटवर्क के लिए; हसाबिस और जम्पर (रसायन) अल्फ़ाफ़ोल्ड के लिए। इंडियाएआई मिशन स्वीकृत।')],['2025',t3('Reasoning models and AI agents that use tools become mainstream; open standards like MCP connect them to apps.','Reasoning models aur tools use karne wale AI agents mainstream; MCP jaise open standards unhe apps se jodte hain.','तर्क करने वाले मॉडल और टूल इस्तेमाल करने वाले एआई एजेंट आम हो गए; MCP जैसे खुले मानक उन्हें ऐप से जोड़ते हैं।')]];
SC['mqtt-iot']={title:t3('IoT: a soil sensor talks MQTT','IoT: soil sensor MQTT bolta hai','आईओटी: मिट्टी सेंसर MQTT बोलता है'),actors:[['esp','🌱',t3('Soil sensor (ESP32)','Soil sensor (ESP32)','मिट्टी सेंसर (ESP32)'),'#22C55E'],['brk','📮',t3('MQTT broker','MQTT broker','MQTT ब्रोकर'),'#8B3DFF'],['app','📱',t3('Farmer app','Kisan app','किसान ऐप'),'#FFD23F'],['pump','🚰',t3('Pump relay','Pump relay','पंप रिले'),'#02CFF9']],toggles:()=>tog('offline',t3('Sensor battery dies','Sensor ki battery khatam','सेंसर की बैटरी ख़त्म')),
 intro:t3('MQTT is publish/subscribe: devices never talk to each other directly. They publish to topics on a broker, and whoever subscribed gets a copy.','MQTT publish/subscribe hai: devices seedhe ek-doosre se baat nahi karte. Woh broker par topics mein publish karte hain, aur jisne subscribe kiya use copy milti hai.','MQTT प्रकाशन/सदस्यता है: डिवाइस सीधे एक-दूसरे से बात नहीं करते। वे ब्रोकर पर विषयों में प्रकाशित करते हैं, और जिसने सदस्यता ली उसे प्रति मिलती है।'),
 steps:s=>{const a=[{from:'esp',to:'brk',label:'CONNECT (TLS :8883)',cls:'enc',fields:{clientId:'field-7',username:'farm-sensors','will topic':'farm/field7/status','will message':'offline'},text:t3('The sensor connects over TLS on port 8883 with its own login, and leaves a "last will": a message the broker must publish if the sensor vanishes.','Sensor TLS par port 8883 se apne login ke saath connect hota hai, aur "last will" chhodta hai: woh message jo sensor gayab hone par broker publish karega.','सेंसर TLS पर पोर्ट 8883 से अपने लॉगिन के साथ जुड़ता है, और "अंतिम इच्छा" छोड़ता है: वह संदेश जो सेंसर ग़ायब होने पर ब्रोकर प्रकाशित करेगा।')},
  {from:'app',to:'brk',label:'SUBSCRIBE farm/field7/#',fields:{topic:'farm/field7/#',qos:1},text:t3('The app subscribes to every topic under farm/field7 (# is a wildcard).','App farm/field7 ke neeche har topic ko subscribe karta hai (# wildcard hai).','ऐप farm/field7 के नीचे हर विषय की सदस्यता लेता है (# वाइल्डकार्ड है)।')},
  {from:'esp',to:'brk',label:'PUBLISH moisture 18%',fields:{topic:'farm/field7/moisture',payload:'{"pct":18}',qos:1,retain:true},text:t3('Every 10 minutes the sensor publishes a tiny message. QoS 1 means "deliver at least once"; retain means new subscribers get the latest value at once.','Har 10 minute sensor chhota message publish karta hai. QoS 1 = "kam se kam ek baar pahunchao"; retain = naye subscribers ko turant latest value.','हर 10 मिनट सेंसर छोटा संदेश प्रकाशित करता है। QoS 1 = "कम से कम एक बार पहुँचाओ"; retain = नए सदस्यों को तुरंत नवीनतम मान।')},
  {from:'brk',to:'app',label:'moisture 18%',fields:{topic:'farm/field7/moisture',payload:'{"pct":18}'},text:t3('The broker forwards a copy to each subscriber. The sensor does not even know the app exists — that is what makes IoT systems easy to grow.','Broker har subscriber ko copy bhejta hai. Sensor ko pata bhi nahi ki app hai — isi se IoT systems badhana aasaan hai.','ब्रोकर हर सदस्य को प्रति भेजता है। सेंसर को पता भी नहीं कि ऐप है — इसी से आईओटी तंत्र बढ़ाना आसान है।')}];
  if(s.offline)return a.concat([{from:'esp',to:'esp',label:'🔋 0%',cls:'bad',text:t3('The battery dies. The sensor stops sending keep-alive pings.','Battery khatam. Sensor keep-alive pings bhejna band kar deta hai.','बैटरी ख़त्म। सेंसर keep-alive संकेत भेजना बंद कर देता है।')},{from:'brk',to:'app',label:'status: offline (last will)',cls:'warn',fields:{topic:'farm/field7/status',payload:'offline'},text:t3('After the keep-alive time passes, the broker publishes the last will. The farmer is told the sensor is down instead of trusting an old reading.','Keep-alive time ke baad broker last will publish karta hai. Kisan ko batate hain ki sensor band hai, purani reading par bharosa karne ke bajaye.','keep-alive समय के बाद ब्रोकर अंतिम इच्छा प्रकाशित करता है। किसान को बताया जाता है कि सेंसर बंद है, पुरानी पढ़ाई पर भरोसा करने के बजाय।')}]);
  return a.concat([{from:'app',to:'brk',label:'PUBLISH pump ON 15 min',fields:{topic:'farm/field7/pump/set',payload:'{"on":true,"minutes":15}',qos:1},text:t3('Moisture is below the 25% threshold, so the app (or a rule on the server) publishes a command.','Moisture 25% threshold se kam hai, to app (ya server ka rule) command publish karta hai.','नमी 25% सीमा से कम है, इसलिए ऐप (या सर्वर का नियम) आदेश प्रकाशित करता है।')},
  {from:'brk',to:'pump',label:'pump ON',cls:'enc',fields:{topic:'farm/field7/pump/set'},text:t3('Only the pump relay is subscribed (and allowed, by the broker\'s access rules) to that command topic. It switches the pump on with a timer as a safety limit.','Sirf pump relay us command topic ko subscribe karta hai (aur broker ke access rules se allowed hai). Woh safety limit ke liye timer ke saath pump chalata hai.','केवल पंप रिले उस आदेश विषय की सदस्यता लेता है (और ब्रोकर के पहुँच नियमों से अनुमत है)। वह सुरक्षा सीमा के लिए टाइमर के साथ पंप चलाता है।')},
  {from:'pump',to:'brk',label:'PUBLISH pump: running',fields:{topic:'farm/field7/pump/state',payload:'running'},text:t3('The pump reports its real state back, so the app shows what actually happened — feedback, not hope.','Pump apni asli state wapas batata hai, taaki app dikhaye ki sach mein kya hua — feedback, umeed nahi.','पंप अपनी वास्तविक स्थिति वापस बताता है, ताकि ऐप दिखाए कि सच में क्या हुआ — प्रतिक्रिया, आशा नहीं।')}]);}};
SC['git-flow']={title:t3('Git: from your laptop to main','Git: laptop se main tak','गिट: लैपटॉप से main तक'),actors:[['dev','👩‍💻',t3('You','Tum','आप'),'#FFD23F'],['rep','🌐',t3('Remote repo','Remote repo','रिमोट रिपॉज़िटरी'),'#8B3DFF'],['ci','🤖',t3('CI tests','CI tests','सीआई परीक्षण'),'#02CFF9'],['rev','🧑‍🏫',t3('Reviewer','Reviewer','समीक्षक'),'#22C55E']],toggles:()=>tog('fail',t3('Push code with a bug','Bug wala code push karo','बग वाला कोड पुश करो')),
 intro:t3('Teams never edit the main copy directly. You work on a branch, open a pull request, and robots plus people check it before it is merged.','Teams main copy ko seedhe edit nahi karti. Tum branch par kaam karte ho, pull request kholte ho, aur robots aur log merge se pehle check karte hain.','टीमें मुख्य प्रति सीधे संपादित नहीं करतीं। आप शाखा पर काम करते हैं, पुल रिक्वेस्ट खोलते हैं, और रोबोट व लोग मर्ज से पहले जाँचते हैं।'),
 steps:s=>{const a=[{from:'dev',to:'dev',label:'git switch -c',fields:{command:'git switch -c fix-marks'},text:t3('Create a branch: your own safe copy of the history to change.','Branch banao: history ki apni safe copy jise badal sako.','शाखा बनाओ: इतिहास की अपनी सुरक्षित प्रति जिसे बदल सको।')},
  {from:'dev',to:'dev',label:'git commit',fields:{command:'git add report.py test_report.py · git commit',message:'Fix rounding of percentage on report card',files:'report.py, test_report.py'},text:t3('A commit is a snapshot with a message saying why. Small commits with clear messages are easy to review and undo.','Commit ek snapshot hai jiske saath message ki kyun. Chhote commits aur saaf messages review aur undo karna aasaan banate hain.','कमिट एक स्नैपशॉट है जिसके साथ संदेश कि क्यों। छोटे कमिट और स्पष्ट संदेश समीक्षा और वापसी आसान बनाते हैं।')},
  {from:'dev',to:'rep',label:'git push · open PR',fields:{branch:'fix-marks → main',title:'Fix percentage rounding'},text:t3('Push the branch and open a pull request: "please merge my change into main".','Branch push karo aur pull request kholo: "please mera change main mein merge karo".','शाखा पुश करो और पुल रिक्वेस्ट खोलो: "कृपया मेरा बदलाव main में मर्ज करो"।')},
  {from:'rep',to:'ci',label:'run tests',fields:{workflow:'pytest · lint'},text:t3('Continuous integration: a server runs every test automatically on every push.','Continuous integration: server har push par har test apne aap chalata hai.','निरंतर एकीकरण: सर्वर हर पुश पर हर परीक्षण अपने आप चलाता है।')}];
  if(s.fail)return a.concat([{from:'ci',to:'rep',label:'✗ 1 test failed',cls:'bad',fields:{test:'test_percentage_rounds_half_up',expected:'91.5',got:'91.0'},text:t3('A test fails. The merge button is blocked — the bug never reaches the students. Fix it, push again, and CI reruns.','Ek test fail. Merge button block — bug students tak kabhi nahi pahunchta. Theek karo, phir push karo, CI dobaara chalega.','एक परीक्षण विफल। मर्ज बटन बंद — बग छात्रों तक कभी नहीं पहुँचता। ठीक करो, फिर पुश करो, सीआई दोबारा चलेगा।')}]);
  return a.concat([{from:'ci',to:'rep',label:'✓ 42 tests passed',cls:'enc',text:t3('All green.','Sab green.','सब हरा।')},
  {from:'rev',to:'rep',label:'review: 1 suggestion',cls:'warn',fields:{comment:'Can we name this round_half_up() so it is clear?'},text:t3('A teammate reads the change. Reviews catch unclear names, missing tests and security mistakes — and spread knowledge.','Teammate change padhta hai. Reviews unclear naam, missing tests aur security galtiyaan pakadte hain — aur knowledge failaate hain.','साथी बदलाव पढ़ता है। समीक्षाएँ अस्पष्ट नाम, छूटे परीक्षण और सुरक्षा ग़लतियाँ पकड़ती हैं — और ज्ञान फैलाती हैं।')},
  {from:'dev',to:'rep',label:'push fix · approved',cls:'enc',text:t3('You rename it, push, and the reviewer approves.','Tum naam badalte ho, push karte ho, reviewer approve karta hai.','आप नाम बदलते हैं, पुश करते हैं, समीक्षक स्वीकृत करता है।')},
  {from:'rep',to:'rep',label:'merge → main',cls:'enc',text:t3('Merged. The history keeps who changed what and why, forever — so any bug can be traced and reverted.','Merged. History hamesha rakhti hai kisne kya aur kyun badla — taaki koi bhi bug trace aur revert ho sake.','मर्ज हो गया। इतिहास हमेशा रखता है किसने क्या और क्यों बदला — ताकि कोई भी बग खोजा और वापस किया जा सके।')}]);}};
SC['page-load']={title:t3('Loading a web page','Web page load hona','वेब पेज लोड होना'),actors:[['br','🌐',t3('Browser','Browser','ब्राउज़र'),'#FFD23F'],['web','🖥️',t3('Web server','Web server','वेब सर्वर'),'#02CFF9'],['cdn','🌍',t3('CDN','CDN','सीडीएन'),'#22C55E']],toggles:()=>tog('big',t3('Use a 4 MB hero photo','4 MB hero photo lagao','4 MB बड़ी फ़ोटो लगाओ')),
 intro:t3('What happens between typing a URL and seeing the page? A conversation of HTTP requests and responses.','URL type karne aur page dekhne ke beech kya hota hai? HTTP requests aur responses ki baatcheet.','URL टाइप करने और पेज देखने के बीच क्या होता है? HTTP अनुरोधों और उत्तरों की बातचीत।'),
 steps:s=>[{from:'br',to:'web',label:'GET / (HTTPS)',fields:{method:'GET',host:'school.example.in','user-agent':'Chrome on Android'},text:t3('After DNS and TLS, the browser sends an HTTP GET for the page.','DNS aur TLS ke baad browser page ke liye HTTP GET bhejta hai.','DNS और TLS के बाद ब्राउज़र पेज के लिए HTTP GET भेजता है।')},
  {from:'web',to:'br',label:'200 OK · index.html 14 KB',cls:'enc',fields:{status:200,'content-type':'text/html; charset=utf-8','content-encoding':'br (Brotli)'},text:t3('The server sends HTML, compressed. The browser starts building the DOM tree while it is still downloading.','Server compressed HTML bhejta hai. Browser download ke dauraan hi DOM tree banana shuru karta hai.','सर्वर संपीड़ित HTML भेजता है। ब्राउज़र डाउनलोड के दौरान ही DOM वृक्ष बनाना शुरू करता है।')},
  {from:'br',to:'cdn',label:'GET style.css · app.js',fields:{'cache-control (reply)':'public, max-age=31536000, immutable'},text:t3('HTML links CSS and JS. These come from a CDN near you and are cached for a year, so the next visit needs no download.','HTML CSS aur JS link karta hai. Yeh paas ke CDN se aate hain aur ek saal cache rehte hain, agli baar download nahi.','HTML CSS और JS जोड़ता है। ये पास के CDN से आते हैं और एक साल कैश रहते हैं, अगली बार डाउनलोड नहीं।')},
  {from:'br',to:'cdn',label:s.big?'GET hero.jpg 4 MB':'GET hero.webp 90 KB',cls:s.big?'bad':'enc',fields:{size:s.big?'4,000 KB':'90 KB',time_on_3G:s.big?'≈ 80 s at 400 kbps':'≈ 2 s at 400 kbps'},text:s.big?t3('A huge photo: on a 3G phone at 400 kbps it takes over a minute. Many people leave before it loads.','Bahut badi photo: 400 kbps 3G phone par ek minute se zyada. Bahut log load hone se pehle chale jaate hain.','बहुत बड़ी फ़ोटो: 400 kbps 3G फ़ोन पर एक मिनट से ज़्यादा। बहुत लोग लोड होने से पहले चले जाते हैं।'):t3('A resized, compressed WebP with width and height set: fast, and the layout does not jump.','Resized, compressed WebP jiski width aur height set hai: tez, aur layout nahi koodta.','आकार घटाई, संपीड़ित WebP जिसकी चौड़ाई और ऊँचाई तय है: तेज़, और लेआउट नहीं उछलता।')},
  {from:'br',to:'br',label:'layout → paint',cls:'enc',text:t3('The browser combines DOM and CSS, works out where every box goes (layout), paints pixels, then runs JavaScript to make buttons work.','Browser DOM aur CSS milata hai, har box kahan jaayega nikalta hai (layout), pixels paint karta hai, phir buttons chalane ke liye JavaScript chalata hai.','ब्राउज़र DOM और CSS मिलाता है, हर बॉक्स कहाँ जाएगा निकालता है (लेआउट), पिक्सेल रंगता है, फिर बटन चलाने के लिए JavaScript चलाता है।')}]};
SC['sprint-cycle']={title:t3('A two-week sprint: idea to users','Do hafte ka sprint: idea se users tak','दो सप्ताह का स्प्रिंट: विचार से उपयोगकर्ताओं तक'),actors:[['usr','🧑‍🎓',t3('Users','Users','उपयोगकर्ता'),'#FFD23F'],['pm','📋',t3('Product owner','Product owner','उत्पाद स्वामी'),'#8B3DFF'],['team','👩‍💻',t3('Dev team','Dev team','विकास टीम'),'#02CFF9'],['prod','🚀',t3('Live app','Live app','चालू ऐप'),'#22C55E']],toggles:()=>tog('skip',t3('Skip user testing','User testing chhodo','उपयोगकर्ता परीक्षण छोड़ो')),
 intro:t3('Modern teams ship in small loops: learn what users need, build a small slice, test it, release, measure, repeat.','Modern teams chhote loops mein ship karti hain: users ko kya chahiye seekho, chhota hissa banao, test karo, release karo, naapo, dohrao.','आधुनिक टीमें छोटे चक्रों में भेजती हैं: उपयोगकर्ताओं को क्या चाहिए जानो, छोटा हिस्सा बनाओ, जाँचो, जारी करो, मापो, दोहराओ।'),
 steps:s=>{const a=[{from:'usr',to:'pm',label:'feedback',fields:{quote:'"The homework app is confusing"',source:'app reviews · 40 student interviews'},text:t3('Requirements start with real users, not guesses. The product owner collects problems and ranks them.','Requirements asli users se shuru hoti hain, andaazon se nahi. Product owner problems ikattha karke rank karta hai.','आवश्यकताएँ असली उपयोगकर्ताओं से शुरू होती हैं, अनुमान से नहीं। उत्पाद स्वामी समस्याएँ इकट्ठी करके क्रम देता है।')},
  {from:'pm',to:'team',label:'user story + acceptance test',fields:{story:'As a student, I want to see today\'s homework first, so that I don\'t miss deadlines.',done_when:'Opening the app shows today\'s tasks within 1 s'},text:t3('A user story says who, what and why. "Done" is defined before coding starts.','User story batati hai kaun, kya aur kyun. "Done" coding se pehle tay hota hai.','उपयोगकर्ता कहानी बताती है कौन, क्या और क्यों। "पूरा" कोडिंग से पहले तय होता है।')},
  {from:'team',to:'team',label:'design · code · test',cls:'enc',fields:{days:'1–9',practice:'daily 15-minute stand-up, pull requests, CI'},text:t3('The team builds a small slice, with code review and automated tests on every change.','Team chhota hissa banati hai, har change par code review aur automated tests ke saath.','टीम छोटा हिस्सा बनाती है, हर बदलाव पर कोड समीक्षा और स्वचालित परीक्षणों के साथ।')}];
  if(s.skip)return a.concat([{from:'team',to:'prod',label:'release to everyone',cls:'warn',text:t3('Released without trying it on real students first…','Asli students par try kiye bina release…','असली छात्रों पर आज़माए बिना जारी…')},{from:'usr',to:'pm',label:'1★ "where did my timetable go?"',cls:'bad',fields:{crash_free:'97%',complaints:'+300 in a day'},text:t3('The new layout hid a feature students used daily. Cheap to find in a 10-person test; expensive after launch. Roll back and fix.','Naye layout ne woh feature chhupa diya jo students roz use karte the. 10 logon ke test mein sasta pakadna; launch ke baad mehenga. Roll back karo aur theek karo.','नए लेआउट ने वह सुविधा छिपा दी जो छात्र रोज़ इस्तेमाल करते थे। 10 लोगों के परीक्षण में सस्ता पकड़ना; लॉन्च के बाद महँगा। वापस लो और ठीक करो।')}]);
  return a.concat([{from:'team',to:'usr',label:'demo to 10 students',cls:'enc',fields:{finding:'2 of 10 could not find the timetable'},text:t3('Usability test with a few real users catches problems early. The team moves the timetable button back.','Kuch asli users ke saath usability test problems jaldi pakadta hai. Team timetable button wapas laati hai.','कुछ असली उपयोगकर्ताओं के साथ उपयोगिता परीक्षण समस्याएँ जल्दी पकड़ता है। टीम समय-सारणी बटन वापस लाती है।')},
  {from:'team',to:'prod',label:'release to 10% → 100%',cls:'enc',text:t3('Staged rollout: release to a small share first, watch crash and error rates, then everyone.','Staged rollout: pehle chhote hisse ko release, crash aur error rates dekho, phir sabko.','चरणबद्ध रोलआउट: पहले छोटे हिस्से को जारी करो, क्रैश और त्रुटि दर देखो, फिर सबको।')},
  {from:'prod',to:'pm',label:'metrics: missed deadlines −18%',cls:'enc',text:t3('Measure the outcome, not just the output. The retrospective asks: what went well, what to change next sprint?','Outcome naapo, sirf output nahi. Retrospective poochta hai: kya achha gaya, agle sprint mein kya badlein?','परिणाम मापो, केवल उत्पादन नहीं। पुनरावलोकन पूछता है: क्या अच्छा गया, अगले स्प्रिंट में क्या बदलें?')}]);}};
SC['licence-check']={title:t3('Can I use this code? Reading a licence','Kya main yeh code use kar sakta hoon? Licence padhna','क्या मैं यह कोड इस्तेमाल कर सकता हूँ? लाइसेंस पढ़ना'),actors:[['dev','👩‍💻',t3('You','Tum','आप'),'#FFD23F'],['lib','📦',t3('Library repo','Library repo','लाइब्रेरी रिपॉज़िटरी'),'#8B3DFF'],['app','📱',t3('Your app','Tumhara app','आपका ऐप'),'#22C55E']],toggles:()=>tog('none',t3('The repo has no LICENSE file','Repo mein LICENSE file nahi','रिपॉज़िटरी में LICENSE फ़ाइल नहीं')),
 intro:t3('Code on the internet is not automatically free to use. The licence decides.','Internet par code apne aap free to use nahi hota. Licence tay karta hai.','इंटरनेट पर कोड अपने आप इस्तेमाल के लिए मुक्त नहीं होता। लाइसेंस तय करता है।'),
 steps:s=>{const a=[{from:'dev',to:'lib',label:'open LICENSE',fields:{found:s.none?'(no licence file)':'MIT License · Copyright (c) 2024 A. Sharma'},text:t3('First, look for a LICENSE file and check package metadata.','Pehle LICENSE file dhoondho aur package metadata check karo.','पहले LICENSE फ़ाइल ढूँढो और पैकेज मेटाडेटा जाँचो।')}];
  if(s.none)return a.concat([{from:'dev',to:'dev',label:'no licence ✗',cls:'bad',text:t3('With no licence, copyright law applies: all rights reserved. You may read it, but not copy it into your app. Ask the author to add a licence, or choose another library.','Bina licence, copyright law lagta hai: all rights reserved. Padh sakte ho, par apne app mein copy nahi. Author se licence jodne ko kaho, ya doosri library chuno.','बिना लाइसेंस, कॉपीराइट क़ानून लागू: सर्वाधिकार सुरक्षित। पढ़ सकते हो, पर अपने ऐप में नक़ल नहीं। लेखक से लाइसेंस जोड़ने को कहो, या दूसरी लाइब्रेरी चुनो।')}]);
  return a.concat([{from:'dev',to:'dev',label:'MIT: permissive ✓',cls:'enc',fields:{may:'use, copy, modify, sell',must:'keep the copyright and licence notice',no:'warranty'},text:t3('MIT, Apache-2.0 and BSD are permissive: use them almost anywhere, even in paid apps, as long as you keep the notice. Apache-2.0 also grants patent rights.','MIT, Apache-2.0 aur BSD permissive hain: lagbhag kahin bhi use karo, paid apps mein bhi, bas notice rakho. Apache-2.0 patent rights bhi deta hai.','MIT, Apache-2.0 और BSD अनुमतिपूर्ण हैं: लगभग कहीं भी इस्तेमाल करो, सशुल्क ऐप में भी, बस सूचना रखो। Apache-2.0 पेटेंट अधिकार भी देता है।')},
  {from:'dev',to:'dev',label:'GPL? copyleft',cls:'warn',fields:{GPL:'if you distribute it, share your source under the GPL too',AGPL:'also applies when users reach it over a network'},text:t3('Copyleft licences (GPL, AGPL) are open too, but if you distribute software built on them you must share your source under the same licence. Fine for many projects — just know before you choose.','Copyleft licences (GPL, AGPL) bhi open hain, par agar unpar bana software distribute karo to apna source usi licence mein share karna hoga. Kai projects ke liye theek — bas chunne se pehle jaano.','कॉपीलेफ़्ट लाइसेंस (GPL, AGPL) भी खुले हैं, पर उन पर बना सॉफ़्टवेयर बाँटो तो अपना स्रोत उसी लाइसेंस में साझा करना होगा। कई परियोजनाओं के लिए ठीक — बस चुनने से पहले जानो।')},
  {from:'lib',to:'app',label:'add + credit in NOTICES',cls:'enc',fields:{file:'THIRD_PARTY_NOTICES.md',entry:'lib-name — MIT — © 2024 A. Sharma'},text:t3('Add the library and record its licence in your notices or attribution file. Images and text have licences too: CC BY needs credit, CC0 needs nothing.','Library jodo aur uska licence notices ya attribution file mein likho. Images aur text ke bhi licences hote hain: CC BY ko credit chahiye, CC0 ko kuch nahi.','लाइब्रेरी जोड़ो और उसका लाइसेंस सूचना या श्रेय फ़ाइल में लिखो। चित्रों और पाठ के भी लाइसेंस होते हैं: CC BY को श्रेय चाहिए, CC0 को कुछ नहीं।')}]);}};
SC['internship-hunt']={title:t3('Landing an internship (and dodging fake offers)','Internship paana (aur nakli offers se bachna)','इंटर्नशिप पाना (और नकली प्रस्तावों से बचना)'),actors:[['you','🧑‍🎓',t3('You','Tum','आप'),'#FFD23F'],['port','🗂️',t3('Portfolio','Portfolio','पोर्टफ़ोलियो'),'#8B3DFF'],['co','🏢',t3('Company','Company','कंपनी'),'#02CFF9']],toggles:()=>tog('fake',t3('A "recruiter" asks for a fee','"Recruiter" fees maangta hai','"भर्तीकर्ता" शुल्क माँगता है')),
 intro:t3('Employers hire people who can show work. Here is a realistic path for a Class 12 or first-year student.','Employers unhe rakhte hain jo kaam dikha sakein. Class 12 ya first-year student ke liye ek realistic raasta.','नियोक्ता उन्हें रखते हैं जो काम दिखा सकें। कक्षा 12 या प्रथम वर्ष के छात्र के लिए एक यथार्थ रास्ता।'),
 steps:s=>{const a=[{from:'you',to:'port',label:'3 projects + README',cls:'enc',fields:{projects:'spam filter · plant-watering IoT · school RAG helper',each_has:'problem, demo, code link, what I learned'},text:t3('Build a few real projects and explain each in plain words.','Kuch asli projects banao aur har ek ko saral shabdon mein samjhao.','कुछ असली परियोजनाएँ बनाओ और हर एक को सरल शब्दों में समझाओ।')},
  {from:'you',to:'co',label:'apply on official site',fields:{where:'company careers page · college placement cell · verified portals'},text:t3('Apply through official channels, with a one-page CV linking to your portfolio.','Official channels se apply karo, ek page ke CV ke saath jo portfolio se link ho.','आधिकारिक माध्यमों से आवेदन करो, एक पेज के CV के साथ जो पोर्टफ़ोलियो से जुड़ा हो।')}];
  if(s.fake)return a.concat([{from:'co',to:'you',label:'"Pay ₹2,999 to confirm"',cls:'bad',fields:{from:'hr.recruit.jobs@gmail.com',offer:'₹45,000/month, no interview'},text:t3('Red flags: a fee, a free email address, no interview, pressure to pay fast. Real employers never charge you to get hired.','Red flags: fees, free email address, koi interview nahi, jaldi pay karne ka dabaav. Asli employers hire karne ke paise kabhi nahi lete.','ख़तरे के संकेत: शुल्क, मुफ़्त ईमेल पता, कोई साक्षात्कार नहीं, जल्दी भुगतान का दबाव। असली नियोक्ता भर्ती के पैसे कभी नहीं लेते।')},{from:'you',to:'you',label:'don’t pay · report',cls:'enc',fields:{report:'cybercrime.gov.in or call 1930'},text:t3('Do not pay or share documents. Tell a parent or teacher, and report at cybercrime.gov.in or helpline 1930.','Pay mat karo, documents share mat karo. Parent ya teacher ko batao, aur cybercrime.gov.in ya helpline 1930 par report karo.','भुगतान मत करो, दस्तावेज़ साझा मत करो। माता-पिता या शिक्षक को बताओ, और cybercrime.gov.in या हेल्पलाइन 1930 पर शिकायत करो।')}]);
  return a.concat([{from:'co',to:'you',label:'take-home task',fields:{task:'clean a CSV and chart it · 48 h'},text:t3('Many companies give a small task. Do it honestly; if you use AI tools, say how.','Kai companies chhota task deti hain. Imaandaari se karo; AI tools use kiye to batao kaise.','कई कंपनियाँ छोटा काम देती हैं। ईमानदारी से करो; एआई टूल इस्तेमाल किए तो बताओ कैसे।')},
  {from:'you',to:'co',label:'interview: explain your project',cls:'enc',text:t3('Interviewers ask why you made each choice and what broke. Understanding beats memorising.','Interviewers poochte hain har choice kyun ki aur kya toota. Samajh rattne se behtar hai.','साक्षात्कारकर्ता पूछते हैं हर चुनाव क्यों किया और क्या टूटा। समझ रटने से बेहतर है।')},
  {from:'co',to:'you',label:'offer letter ✓',cls:'enc',fields:{from:'@company.com domain',stipend:'as discussed',fee:'none'},text:t3('A real offer comes from the company’s own domain, matches what was discussed, and asks for no money.','Asli offer company ke apne domain se aata hai, jo baat hui usse match karta hai, aur paise nahi maangta.','असली प्रस्ताव कंपनी के अपने डोमेन से आता है, जो बात हुई उससे मेल खाता है, और पैसे नहीं माँगता।')}]);}};
SC['portfolio-pages']={title:t3('Publishing your portfolio site','Apni portfolio site publish karna','अपनी पोर्टफ़ोलियो साइट प्रकाशित करना'),actors:[['you','👩‍💻',t3('You','Tum','आप'),'#FFD23F'],['gh','🐙',t3('GitHub repo','GitHub repo','GitHub रिपॉज़िटरी'),'#8B3DFF'],['web','🌍',t3('Visitors','Visitors','आगंतुक'),'#22C55E']],toggles:()=>tog('leak',t3('Phone number in the README','README mein phone number','README में फ़ोन नंबर')),
 intro:t3('A free static site from a GitHub repository is a simple, professional portfolio.','GitHub repository se free static site ek simple, professional portfolio hai.','GitHub रिपॉज़िटरी से मुफ़्त स्थिर साइट एक सरल, पेशेवर पोर्टफ़ोलियो है।'),
 steps:s=>[{from:'you',to:'you',label:'index.html + projects',fields:{files:'index.html · style.css · projects/*.md · LICENSE'},text:t3('One page: who you are, three projects with screenshots, links to code, and how to contact you safely.','Ek page: tum kaun ho, screenshots ke saath teen projects, code ke links, aur safely contact kaise karein.','एक पेज: आप कौन हो, स्क्रीनशॉट के साथ तीन परियोजनाएँ, कोड के लिंक, और सुरक्षित संपर्क कैसे करें।')},
  {from:'you',to:'gh',label:'git push',cls:s.leak?'warn':'enc',fields:{contact:s.leak?'+91 98xxx xxxxx (public!)':'contact form / school email'},text:s.leak?t3('Careful: anything pushed to a public repo is visible to everyone and stays in history. Remove personal phone numbers and addresses.','Dhyaan do: public repo mein push kiya sab kuch sabko dikhta hai aur history mein rehta hai. Personal phone number aur address hatao.','सावधान: सार्वजनिक रिपॉज़िटरी में पुश हुआ सब कुछ सबको दिखता है और इतिहास में रहता है। निजी फ़ोन नंबर और पते हटाओ।'):t3('Contact via a form or a professional email — never your home address or phone.','Contact form ya professional email se — kabhi ghar ka address ya phone nahi.','संपर्क फ़ॉर्म या पेशेवर ईमेल से — कभी घर का पता या फ़ोन नहीं।')},
  {from:'gh',to:'gh',label:'Pages build',cls:'enc',fields:{url:'https://yourname.github.io'},text:t3('GitHub Pages builds and hosts the static site for free over HTTPS.','GitHub Pages static site ko HTTPS par free build aur host karta hai.','GitHub Pages स्थिर साइट को HTTPS पर मुफ़्त बनाता और होस्ट करता है।')},
  {from:'web',to:'gh',label:'GET yourname.github.io',fields:{status:200},text:t3('Anyone — a teacher, a college, an employer — can now see your work.','Ab koi bhi — teacher, college, employer — tumhara kaam dekh sakta hai.','अब कोई भी — शिक्षक, कॉलेज, नियोक्ता — आपका काम देख सकता है।')}]};
SC['ai-timeline']={title:t3('AI timeline: 1950 to today','AI timeline: 1950 se aaj tak','एआई समयरेखा: 1950 से आज तक'),kind:'timeline',intro:t3('Press Step to light up each milestone.','Har milestone ke liye Step dabao.','हर पड़ाव के लिए Step दबाओ।'),n:MS.length};
// ---------- fact-check flow ----------
const POSTS=[{title:t3('Photo: "Mumbai airport flooded TODAY, planes under water!"','Photo: "Mumbai airport AAJ doob gaya, planes paani mein!"','फ़ोटो: "मुंबई हवाई अड्डा आज डूबा, विमान पानी में!"'),truth:'fake',checks:[[t3('Reverse image search','Reverse image search','उल्टी तस्वीर खोज'),t3('Same photo appears in news from years ago, from a different flood.','Wahi photo saalon pehle ki news mein, kisi aur baadh ki.','वही फ़ोटो सालों पहले की ख़बर में, किसी और बाढ़ की।')],[t3('Check official accounts','Official accounts check','आधिकारिक खाते जाँचो'),t3('Airport and IMD posts today: heavy rain, operations normal with delays.','Airport aur IMD ke aaj ke posts: tez baarish, operations normal, kuch delay.','हवाई अड्डे और IMD की आज की पोस्ट: भारी बारिश, संचालन सामान्य, कुछ देरी।')],[t3('Date and emotional push','Date aur emotional push','तिथि और भावनात्मक दबाव'),t3('"TODAY!" in capitals plus "share before deleted" — classic urgency trick.','Capitals mein "AAJ!" aur "delete hone se pehle share" — classic urgency trick.','बड़े अक्षरों में "आज!" और "हटने से पहले साझा करो" — पुरानी जल्दबाज़ी वाली चाल।')]],why:t3('Manipulated by context: a real old photo re-dated.','Context se manipulated: asli purani photo nayi date ke saath.','संदर्भ से हेरफेर: असली पुरानी फ़ोटो नई तिथि के साथ।')},
 {title:t3('Audio: "Principal announces school closed for a week, pay ₹500 online for notes"','Audio: "Principal ne ek hafte school band ka elaan kiya, notes ke liye ₹500 online bharo"','ऑडियो: "प्रधानाचार्य ने एक सप्ताह विद्यालय बंद की घोषणा की, नोट्स के लिए ₹500 ऑनलाइन भरो"'),truth:'fake',checks:[[t3('Find the original source','Original source dhoondho','मूल स्रोत ढूँढो'),t3('No circular on the school website or app; the number that sent it is unknown.','School website ya app par koi circular nahi; bhejne wala number anjaan.','विद्यालय वेबसाइट या ऐप पर कोई परिपत्र नहीं; भेजने वाला नंबर अनजान।')],[t3('Listen for clone signs','Clone ke nishaan suno','क्लोन के संकेत सुनो'),t3('Flat emotion, odd pauses, no background sound, and it asks for money — common in voice-clone scams.','Flat emotion, ajeeb pause, koi background awaaz nahi, aur paisa maangta hai — voice-clone scams mein aam.','सपाट भाव, अजीब ठहराव, कोई पृष्ठभूमि आवाज़ नहीं, और पैसे माँगता है — आवाज़-क्लोन घोटालों में आम।')],[t3('Call back on a known number','Jaane-pehchaane number par call','जाने-पहचाने नंबर पर कॉल'),t3('The school office confirms: no closure, no fee. It was a cloned voice.','School office confirm karta hai: na band, na fee. Cloned voice tha.','विद्यालय कार्यालय पुष्टि करता है: न बंद, न शुल्क। क्लोन की गई आवाज़ थी।')]],why:t3('Synthetic: an AI-cloned voice used for a scam.','Synthetic: scam ke liye AI-cloned voice.','कृत्रिम: घोटाले के लिए एआई-क्लोन आवाज़।')},
 {title:t3('Post: "ISRO\'s Aditya-L1 reached its halo orbit around the L1 point on 6 January 2024."','Post: "ISRO ka Aditya-L1 6 January 2024 ko L1 point ke aaspaas halo orbit mein pahuncha."','पोस्ट: "इसरो का आदित्य-L1 6 जनवरी 2024 को L1 बिंदु के आसपास हेलो कक्षा में पहुँचा।"'),truth:'real',checks:[[t3('Check official source','Official source check','आधिकारिक स्रोत जाँचो'),t3('isro.gov.in has the press release for 6 January 2024.','isro.gov.in par 6 January 2024 ki press release hai.','isro.gov.in पर 6 जनवरी 2024 की प्रेस विज्ञप्ति है।')],[t3('Other reliable outlets','Doosre bharosemand outlets','अन्य विश्वसनीय समाचार'),t3('Multiple national newspapers reported it the same day.','Kai national akhbaaron ne usi din report kiya.','कई राष्ट्रीय अख़बारों ने उसी दिन रिपोर्ट किया।')],[t3('Emotional push?','Emotional push?','भावनात्मक दबाव?'),t3('Calm wording, links to the source, no "forward now". Signs of a genuine post.','Shaant shabd, source ka link, koi "abhi forward karo" nahi. Asli post ke nishaan.','शांत शब्द, स्रोत का लिंक, कोई "अभी आगे भेजो" नहीं। असली पोस्ट के संकेत।')]],why:t3('Genuine, and verifiable at the primary source.','Asli, aur primary source par verify ho sakta hai.','असली, और प्राथमिक स्रोत पर सत्यापित।')}];
SC['fact-check-flow']={title:t3('Fact-check three viral posts','Teen viral posts ka fact-check','तीन वायरल पोस्ट की तथ्य-जाँच'),kind:'factcheck',intro:t3('Run the checks for each post, then give your verdict.','Har post ke checks chalao, phir verdict do.','हर पोस्ट की जाँच चलाओ, फिर निर्णय दो।')};
// ---------- Linux shell (simulated, safe) ----------
const SHT={pwd:t3('Print where you are (pwd)','Pata karo tum kahan ho (pwd)','पता करो आप कहाँ हो (pwd)'),ls:t3('List files with details (ls -l)','Files details ke saath list karo (ls -l)','फ़ाइलें विवरण सहित दिखाओ (ls -l)'),cat:t3('Read notice.txt (cat)','notice.txt padho (cat)','notice.txt पढ़ो (cat)'),mkdir:t3('Make a folder called projects (mkdir)','projects naam ka folder banao (mkdir)','projects नाम का फ़ोल्डर बनाओ (mkdir)'),chmod:t3('Make marks.csv readable only by you (chmod 600)','marks.csv sirf tumhare liye readable banao (chmod 600)','marks.csv सिर्फ़ आपके लिए पढ़ने योग्य बनाओ (chmod 600)'),grep:t3('Find lines with "exam" in notice.txt (grep)','notice.txt mein "exam" wali lines dhoondho (grep)','notice.txt में "exam" वाली पंक्तियाँ ढूँढो (grep)')};
function newFS(){return{'/home/riya':{t:'d',m:'rwxr-xr-x'},'/home/riya/notice.txt':{t:'f',m:'rw-r--r--',c:'School notice\nUnit test: 12 Dec\nexam hall: Room 4\nBring your ID card.\nexam timing: 9 am'},'/home/riya/marks.csv':{t:'f',m:'rw-r--r--',c:'subject,marks\nmaths,88\nscience,91'},'/home/riya/hello.py':{t:'f',m:'rwxr-xr-x',c:'print("namaste")'},'/etc/passwd':{t:'f',m:'rw-r--r--',c:'root:x:0:0:root:/root:/bin/bash\nriya:x:1000:1000::/home/riya:/bin/bash'},'/etc/shadow':{t:'f',m:'rw-r-----',o:'root',c:''},'/home':{t:'d',m:'rwxr-xr-x',o:'root'},'/etc':{t:'d',m:'rwxr-xr-x',o:'root'},'/':{t:'d',m:'rwxr-xr-x',o:'root'}};}
function permNum(n){return[...String(n)].map(d=>{d=+d;return(d&4?'r':'-')+(d&2?'w':'-')+(d&1?'x':'-');}).join('');}
function shRun(line){const fs=st.fs;const out=[];const a=line.trim().split(/\s+/).filter(Boolean);if(!a.length)return '';const [c,...r]=a;
 const abs=x=>{if(!x)return st.cwd;let p=x.startsWith('/')?x:(st.cwd==='/'?'':st.cwd)+'/'+x;const parts=[];p.split('/').forEach(q=>{if(!q||q==='.')return;if(q==='..')parts.pop();else parts.push(q);});return '/'+parts.join('/');};
 const kids=d=>Object.keys(fs).filter(k=>k!==d&&k.startsWith(d==='/'?'/':d+'/')&&!k.slice(d==='/'?1:d.length+1).includes('/'));
 const done=k=>{if(!st.tasks[k]){st.tasks[k]=1;K.emit('shell-task-done',{task:k});renderTasks();if(Object.keys(SHT).every(x=>st.tasks[x]))K.check('shell-mission-complete',{tasks:Object.keys(SHT).length});}};
 switch(c){case 'help':return 'pwd  ls [-l]  cd DIR  cat FILE  mkdir DIR  touch FILE  echo TEXT  grep WORD FILE  wc -l FILE  chmod NNN FILE  whoami  id  ps  date  clear  sudo';
 case 'pwd':done('pwd');return st.cwd;case 'whoami':return 'riya';case 'id':return 'uid=1000(riya) gid=1000(riya) groups=1000(riya),27(students)';
 case 'date':return 'Fri Nov 27 10:00:00 IST 2026';case 'clear':st.log=[];return null;
 case 'ps':return '  PID TTY      TIME CMD\n 4120 pts/0 00:00:00 bash\n 4188 pts/0 00:00:00 ps';
 case 'ls':{const l=r.includes('-l');const d=abs(r.find(x=>!x.startsWith('-')));if(!fs[d]||fs[d].t!=='d')return 'ls: cannot access: No such file or directory';if(l&&d===st.cwd)done('ls');return kids(d).map(k=>{const n=k.split('/').pop(),e=fs[k];return l?`${e.t==='d'?'d':'-'}${e.m} 1 ${e.o||'riya'} ${e.o||'riya'} ${String((e.c||'').length).padStart(4)} ${n}${e.t==='d'?'/':''}`:n+(e.t==='d'?'/':'');}).join(l?'\n':'  ');}
 case 'cd':{const d=r[0]==='~'||!r[0]?'/home/riya':abs(r[0]);if(!fs[d]||fs[d].t!=='d')return 'cd: '+r[0]+': No such file or directory';st.cwd=d;return '';}
 case 'cat':{const f=abs(r[0]);const e=fs[f];if(!e)return 'cat: '+(r[0]||'')+': No such file or directory';if(e.t==='d')return 'cat: '+r[0]+': Is a directory';if(e.o==='root'&&e.m[6]!=='r')return 'cat: '+r[0]+': Permission denied   ← only root can read password hashes';if(f==='/home/riya/notice.txt')done('cat');return e.c;}
 case 'mkdir':{if(!r[0])return 'mkdir: missing operand';const d=abs(r[0]);if(fs[d])return 'mkdir: cannot create directory: File exists';if(!d.startsWith('/home/riya'))return 'mkdir: cannot create directory: Permission denied';fs[d]={t:'d',m:'rwxr-xr-x'};if(d==='/home/riya/projects')done('mkdir');return '';}
 case 'touch':{if(!r[0])return 'touch: missing file operand';const f=abs(r[0]);if(!f.startsWith('/home/riya'))return 'touch: Permission denied';fs[f]=fs[f]||{t:'f',m:'rw-r--r--',c:''};return '';}
 case 'echo':return r.join(' ');
 case 'grep':{const f=abs(r[1]);const e=fs[f];if(!r[0]||!e)return 'usage: grep WORD FILE';const m=e.c.split('\n').filter(x=>x.includes(r[0]));if(r[0]==='exam'&&f==='/home/riya/notice.txt')done('grep');return m.join('\n');}
 case 'wc':{const f=abs(r[r.length-1]);const e=fs[f];if(!e)return 'wc: No such file';return e.c.split('\n').length+' '+r[r.length-1];}
 case 'chmod':{if(!/^[0-7]{3}$/.test(r[0]||''))return 'chmod: use three digits, e.g. chmod 600 marks.csv (6=rw-, 4=r--, 0=---)';const f=abs(r[1]);const e=fs[f];if(!e)return 'chmod: cannot access: No such file';if(e.o==='root')return 'chmod: changing permissions: Operation not permitted';e.m=permNum(r[0]);if(f==='/home/riya/marks.csv'&&r[0]==='600')done('chmod');return '';}
 case 'sudo':return 'riya is not in the sudoers file. This incident will be reported.   ← least privilege: students are not admins';
 case 'rm':return 'rm is switched off in this practice terminal. On a real system rm has no recycle bin — think twice.';
 default:return c+': command not found (type help)';}}
function renderTasks(){const el=K.$('#extra');el.style.display='';el.innerHTML=`<h2>${K.t(t3('Missions','Missions','मिशन'))}</h2>`+Object.keys(SHT).map(k=>`<div class="mut" style="padding:3px 0">${st.tasks[k]?'✅':'⬜'} ${K.esc(K.t(SHT[k]))}</div>`).join('')+`<div class="explain">${K.t(t3('This is a safe simulated terminal: nothing here touches a real computer. Type help for commands. Permissions read owner|group|others, each r w x.','Yeh ek safe simulated terminal hai: yahan kuch bhi asli computer ko nahi chhoota. Commands ke liye help likho. Permissions owner|group|others padhte hain, har ek r w x.','यह एक सुरक्षित नकली टर्मिनल है: यहाँ कुछ भी असली कंप्यूटर को नहीं छूता। आदेशों के लिए help लिखो। अनुमतियाँ owner|group|others पढ़ी जाती हैं, हर एक r w x।'))}</div>`;}
SC['linux-shell']={title:t3('Linux command line (practice terminal)','Linux command line (practice terminal)','लिनक्स कमांड लाइन (अभ्यास टर्मिनल)'),kind:'shell'};
// ---------- special renderers ----------
function renderSpecial(){const v=K.$('#vis');
 if(S.kind==='timeline'){const n=MS.length,W=360,rowH=30,H=n*rowH+20;let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><line x1="70" y1="10" x2="70" y2="${H-10}" stroke="rgba(255,255,255,.2)" stroke-width="3"/>`;
  MS.forEach((m,i)=>{const y=18+i*rowH,on=i<cur,act=i===cur-1;s+=`<circle cx="70" cy="${y}" r="${act?8:6}" fill="${on?['#8B3DFF','#02CFF9','#22C55E','#F5B90A','#FF6B57'][i%5]:'#1e2b55'}" ${act?'filter="url(#gl)"':''}/><text x="60" y="${y+4}" text-anchor="end" font-size="10" font-weight="800" fill="${on?'#fff':'#5b6b95'}">${m[0]}</text><text x="82" y="${y+4}" font-size="9.5" fill="${on?'#e2e8f0':'#5b6b95'}">${K.esc(K.t(m[1]).slice(0,52))}${K.t(m[1]).length>52?'…':''}</text>`;});
  v.innerHTML=s+'<defs><filter id="gl"><feGaussianBlur stdDeviation="1.5"/></filter></defs></svg>';return;}
 if(S.kind==='factcheck'){const P=POSTS[st.pi||0];v.innerHTML=`<div class="mut" style="font-size:12px">${(st.pi||0)+1} / ${POSTS.length}</div><div class="post">${K.esc(K.t(P.title))}</div>`+P.checks.map((c,i)=>`<div class="chkrow">${i<(st.ci||0)?'✅':'🔎'} <b>${K.esc(K.t(c[0]))}</b>${i<(st.ci||0)?'<div class="mut">'+K.esc(K.t(c[1]))+'</div>':''}</div>`).join('')+((st.ci||0)>=P.checks.length?`<div class="row" style="margin-top:8px"><button class="btn" data-v="real">✔ ${K.t(t3('Genuine','Asli','असली'))}</button><button class="btn" data-v="fake">✖ ${K.t(t3('Fake / manipulated','Fake / manipulated','नकली / हेरफेर'))}</button></div>`:'');
  K.$$('button[data-v]',v).forEach(b=>b.onclick=()=>{const ok=b.dataset.v===P.truth;st.score=(st.score||0)+(ok?1:0);K.emit('verdict',{post:st.pi||0,verdict:b.dataset.v,correct:ok});K.$('#now').innerHTML=(ok?'✅ ':'❌ ')+K.esc(K.t(P.why));st.pi=(st.pi||0)+1;st.ci=0;if(st.pi>=POSTS.length){v.innerHTML=`<div class="post">${K.t(t3('Score','Score','अंक'))}: ${st.score} / ${POSTS.length}</div>`;if(st.score===POSTS.length)K.check('scenario-complete',{scenario:'fact-check-flow',score:st.score});else K.toast(K.t(t3('Reset and try again for 3/3','Reset karke 3/3 ke liye phir try karo','रीसेट करके 3/3 के लिए फिर आज़माओ')));}else setTimeout(renderSpecial,K.reduced?0:1200);});return;}
 if(S.kind==='shell'){v.innerHTML=`<div class="term" id="term">${st.log.map(l=>`<div class="${l[0]}">${K.esc(l[1])}</div>`).join('')}<div class="pr"><span>riya@school:${st.cwd.replace('/home/riya','~')}$</span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="command"></div></div><div class="row" style="margin-top:6px;flex-wrap:wrap">${['help','pwd','ls -l','cat notice.txt','grep exam notice.txt','mkdir projects','chmod 600 marks.csv','sudo cat /etc/shadow'].map(x=>`<button class="btn chip" data-c="${x}">${x}</button>`).join('')}</div>`;
  const inp=K.$('#cmd');const run=x=>{st.log.push(['in','riya@school:'+st.cwd.replace('/home/riya','~')+'$ '+x]);const o=shRun(x);if(o!==null&&o!=='')st.log.push(['out',o]);if(st.log.length>60)st.log=st.log.slice(-60);renderSpecial();const t=K.$('#term');t.scrollTop=t.scrollHeight;K.$('#cmd').focus({preventScroll:true});};
  inp.onkeydown=e=>{if(e.key==='Enter'){run(inp.value);}};K.$$('button[data-c]',v).forEach(b=>b.onclick=()=>run(b.dataset.c));}}
// ---------- boot ----------
function load(id){stop();S=SC[id]||SC['tcp-handshake'];S.id=id;cur=0;const keep=st.done&&id==='upi-fraud-score'?{done:st.done,risk:st.risk}:{};st=keep;
 K.$('#sTitle').textContent=K.t(S.title);const ex=K.$('#extra');ex.style.display='none';ex.innerHTML='';
 K.$('#tog').innerHTML=S.toggles?S.toggles():'';K.$$('#tog input').forEach(i=>i.onchange=()=>{st[i.id]=i.checked;cur=0;st.finished=false;drawSeq(-1,1);showDetail(null);});
 const sp=!!S.kind;K.$('#step').style.display=S.kind==='shell'?'none':'';K.$('#play').style.display=(S.kind==='shell'||S.kind==='factcheck')?'none':'';K.$('#detail').style.display=S.kind==='shell'?'none':'';
 if(S.kind==='shell'){st.fs=newFS();st.cwd='/home/riya';st.log=[['out',K.t(t3('Welcome! Type help, or tap a chip below.','Swagat! help likho, ya neeche chip dabao.','स्वागत! help लिखो, या नीचे चिप दबाओ।'))]];st.tasks={};renderTasks();}
 if(S.extra)S.extra(ex);
 if(sp){showDetail(null);renderSpecial();}else{drawSeq(-1,1);showDetail(null);}}
const _seqStep=seqStep;
seqStep=async function(){if(S.kind==='timeline'){if(cur>=MS.length){finish();return false;}cur++;renderSpecial();K.$('#now').innerHTML=`<b>${MS[cur-1][0]}</b> — ${K.esc(K.t(MS[cur-1][1]))}`;if(cur>=MS.length)finish();return cur<MS.length;}
 if(S.kind==='factcheck'){const P=POSTS[st.pi||0];if(!P)return false;if((st.ci||0)<P.checks.length){st.ci=(st.ci||0)+1;K.$('#now').innerHTML=K.esc(K.t(P.checks[st.ci-1][1]));renderSpecial();}return false;}
 return _seqStep();};
(async()=>{K.lab='seq-flow';K.header(t3('Protocol Flow Visualiser','Protocol Flow Visualiser','प्रोटोकॉल प्रवाह दर्शक'),t3('Watch packets, handshakes and systems step by step','Packets, handshakes aur systems ko step by step dekho','पैकेट, हैंडशेक और सिस्टम चरण-दर-चरण देखो'));
 cfg=await K.boot({scenario:'tcp-handshake',speed:1});
 const sel=K.$('#scn');const fill=()=>{sel.innerHTML=Object.keys(SC).map(k=>`<option value="${k}" ${k===S?.id?'selected':''}>${K.esc(K.t(SC[k].title))}</option>`).join('');};
 S={id:cfg.scenario};fill();sel.value=SC[cfg.scenario]?cfg.scenario:'tcp-handshake';sel.onchange=()=>{load(sel.value);K.emit('scenario-opened',{scenario:sel.value});};
 K.$('#play').onclick=play;K.$('#step').onclick=()=>{stop();if(S.kind)seqStep();else stepOnce();};K.$('#reset').onclick=()=>load(S.id);
 load(sel.value);K.onLang(()=>{const id=S.id;fill();sel.value=id;K.$('#sTitle').textContent=K.t(S.title);if(S.kind==='shell')renderTasks();if(S.kind)renderSpecial();else{drawSeq(cur-1,1);showDetail(cur?seqSteps()[cur-1]:null);}if(S.extra)S.extra(K.$('#extra'));});})();
</script>
