(function(g){

  K.reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

  K.esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  K.rng=(seed)=>{let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};};
  K.clamp=(v,a,b)=>Math.max(a,Math.min(b,v));K.lerp=(a,b,t)=>a+(b-a)*t;K.ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  K.sleep=(ms)=>new Promise(r=>setTimeout(r,K.reduced?0:ms));
  K.tween=(ms,fn)=>new Promise(res=>{if(K.reduced||ms<=0){fn(1);return res();}const t0=performance.now();const f=n=>{const t=Math.min(1,(n-t0)/ms);fn(K.ease(t));t<1?requestAnimationFrame(f):res();};requestAnimationFrame(f);});
  // Toasts never cover content (readability rule): the message temporarily replaces the header subtitle, then the subtitle returns after 2.5 s.
  K.toast=(msg)=>{const h=K.$('header.top h1');if(!h)return;let st=h.querySelector('.hstat');if(!st){st=K.el('span',{class:'hstat',role:'status','aria-live':'polite'});h.appendChild(st);}st.textContent=msg;h.classList.add('toasting');clearTimeout(K._tt);K._tt=setTimeout(()=>h.classList.remove('toasting'),2500);};
  K.events=[];
  // emit a lab event; the lesson player listens via postMessage and matches it against try.questions[type=lab-check].answer
  K.emit=(event,data)=>{const m={type:'nca-lab-event',lab:K.lab,event,data:data||{},at:Date.now()};K.events.push(m);try{parent!==window&&parent.postMessage(m,'*');}catch(e){}g.dispatchEvent(new CustomEvent('nca-lab-event',{detail:m}));document.documentElement.dataset.lastEvent=event;};
  K.check=(event,data,msg)=>{K.emit(event,data);K.toast('✓ '+(msg||K.t({en:'Mission check passed',hinglish:'Mission check pass!',hi:'मिशन जाँच पास!'})));};
  K.onLang=(fn)=>K.listeners.push(fn);
  K.setLang=(l)=>{K.lang=l;localStorage.setItem('nca-lang',l);K.$$('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));K.$$('[data-t]').forEach(e=>{const o=K.T[e.dataset.t];if(o)e.innerHTML=K.t(o);});K.renderGoal();K.listeners.forEach(f=>f(l));};
  K.T={};// string table: key -> {en,hi,hinglish}
  K.renderGoal=()=>{const gEl=K.$('#goal');if(!gEl)return;const goal=K.goal||K.T.__goal;gEl.style.display=goal?'flex':'none';if(goal)gEl.innerHTML='<span>🎯</span><div><b>'+K.esc(K.t({en:'Goal',hinglish:'Goal',hi:'लक्ष्य'}))+':</b> '+K.esc(K.t(goal))+'</div>';};
  K.header=(title,sub)=>{const h=K.el('header',{class:'top'});h.innerHTML='<span class="badge">L3</span><h1>'+K.esc(K.t(title))+'<small>'+K.esc(K.t(sub))+'</small></h1><div class="langs" role="group" aria-label="Language"><button data-l="hinglish">Hinglish</button><button data-l="en">EN</button><button data-l="hi">हिं</button></div>';document.body.prepend(h);K.$$('.langs button',h).forEach(b=>b.onclick=()=>{K.setLang(b.dataset.l);h.querySelector('h1').firstChild.textContent=K.t(title);h.querySelector('small').textContent=K.t(sub);});};
  // Readability rule: native <select> boxes cut long option text on phones, so every select is shown as a wrapping row of chips.
  K.chipify=(sel)=>{if(sel._chips||sel.dataset.keep!=null)return;const box=K.el('div',{class:'seg chips',role:'radiogroup','aria-label':sel.getAttribute('aria-label')||'options'});sel.after(box);sel.style.display='none';sel._chips=box;let last='';
    let open=false;const render=(force)=>{const n=sel.options.length,big=n>6;const sig=[...sel.options].map(o=>o.value+'\u0001'+o.textContent).join('\u0002')+'|'+sel.value+'|'+open;if(sig===last&&!force)return;last=sig;box.innerHTML='';box.classList.toggle('big',big);
      if(big){const cur=sel.options[sel.selectedIndex];const t=K.el('button',{class:'btn on pick',type:'button','aria-expanded':open?'true':'false'});t.textContent=(open?'▴ ':'▾ ')+(cur?cur.textContent:'');t.onclick=()=>{open=!open;render(true);};box.appendChild(t);if(!open)return;}
      [...sel.options].forEach(o=>{if(big&&o.value===sel.value)return;const b=K.el('button',{class:'btn'+(o.value===sel.value?' on':''),type:'button',role:'radio','aria-checked':o.value===sel.value?'true':'false'});b.textContent=o.textContent;b.onclick=()=>{if(sel.disabled)return;sel.value=o.value;open=false;render(true);sel.dispatchEvent(new Event('change',{bubbles:true}));};box.appendChild(b);});};
    render();new MutationObserver(render).observe(sel,{childList:true,subtree:true,characterData:true});setInterval(render,250);};
  K.chipAll=()=>{K.$$('select').forEach(K.chipify);if(!K._mo){K._mo=new MutationObserver(()=>K.$$('select').forEach(K.chipify));K._mo.observe(document.body,{childList:true,subtree:true});}};
  K.boot=async(defaults)=>{let cfg=Object.assign({},defaults||{});
    const inl=document.getElementById('lesson-inline');
    try{if(inl){const L=JSON.parse(inl.textContent);if(L.play){Object.assign(cfg,L.play.config||{});K.goal=L.play.goal;}}}catch(e){}
    const lp=qs.get('lesson');if(lp){try{const L=await (await fetch(lp)).json();if(L.play&&L.play.lab===K.lab){Object.assign(cfg,L.play.config||{});K.goal=L.play.goal;}}catch(e){}}
    const c=qs.get('cfg');if(c){try{Object.assign(cfg,JSON.parse(c));}catch(e){}}
    for(const [k,v] of qs){if(!['cfg','lesson','lang'].includes(k))cfg[k]=v;}
    K.cfg=cfg;K.setLang(K.lang);setTimeout(K.chipAll,0);return cfg;};
  g.K=K;
})(window);

<style>.st{width:100%;border-collapse:collapse;font-size:13px}.st th,.st td{padding:5px 6px;text-align:left;border-top:1px solid rgba(255,255,255,.08)}.st th{color:#02CFF9;font-size:12px}.best{color:#22C55E;font-weight:800}.lg{display:inline-flex;align-items:center;gap:4px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}</style>
<script>
const T=K.T,t3=(en,hinglish,hi)=>({en,hinglish,hi});
Object.assign(T,{stats:t3('Results','Results','परिणाम'),how:t3('How it works','Yeh kaise kaam karta hai','यह कैसे काम करता है')});
const GRIDS={
'maze-1':['###############','#S....#.......#','#.###.#.#####.#','#.#...#.#...#.#','#.#.###.#.#.#.#','#.#.....#.#...#','#.#######.###.#','#.......#...#.#','#######.###.#.#','#.........#..G#','###############'],
'city-1':['###############','#S....~~~.....#','#.##.#~~~.##..#','#.##.#~~~.##..#','#....#.........#','####.#.####.###','#....~~~~~....#','#.##.~~~~~.##.#','#.##.......##.#','#..........#.G#','###############'],
'open':['###############','#S............#','#.............#','#.............#','#.....####....#','#........#....#','#........#....#','#....#####....#','#.............#','#............G#','###############'],
'rl-5x5':['S....','.#.X.','...#.','.X...','....G']};
let cfg,mode,G,W,H,S,Gl,cost,anim=null,res={},lastRun=null;
const cv=()=>K.$('#cv'),ctx=()=>cv().getContext('2d');
function load(name){const g=GRIDS[name]||GRIDS['maze-1'];H=g.length;W=g[0].length;G=[];cost=[];
 for(let y=0;y<H;y++){G.push([]);cost.push([]);for(let x=0;x<W;x++){const c=g[y][x];G[y].push(c==='#'?1:c==='X'?2:0);cost[y].push(c==='~'?5:1);if(c==='S')S=[x,y];if(c==='G')Gl=[x,y];}}
 const c=cv();const cell=Math.floor(Math.min(600/W,440/H));c.width=cell*W;c.height=cell*H;res={};lastRun=null;}
const cs=()=>cv().width/W;
function drawBase(){const c=ctx(),s=cs();c.clearRect(0,0,cv().width,cv().height);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=G[y][x];c.fillStyle=v===1?'#1e2b55':v===2?'#3b0f14':cost[y][x]>1?'#3a2a0a':'#0b1533';c.fillRect(x*s+1,y*s+1,s-2,s-2);
  if(v===2){c.font=`${s*.6}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('🕳️',x*s+s/2,y*s+s/2);}
  else if(cost[y][x]>1){c.fillStyle='rgba(245,185,10,.35)';c.fillRect(x*s+s*.2,y*s+s*.55,s*.6,s*.12);}}
 c.font=`${s*.7}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('🤖',S[0]*s+s/2,S[1]*s+s/2+1);c.fillText(mode==='qlearn'?'🔋':'🏁',Gl[0]*s+s/2,Gl[1]*s+s/2+1);}
const N4=[[1,0],[-1,0],[0,1],[0,-1]];
const hfn=(a,b,h)=>h==='euclid'?Math.hypot(a[0]-b[0],a[1]-b[1]):h==='zero'?0:Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
function search(algo,h){const key=p=>p[1]*W+p[0];const g=new Map([[key(S),0]]),prev=new Map(),order=[],closed=new Set();let open=[{p:S,f:0,g:0,i:0}],tick=0,frontierMax=1;
 while(open.length){let n;if(algo==='bfs')n=open.shift();else if(algo==='dfs')n=open.pop();else{let bi=0;for(let i=1;i<open.length;i++){const a=open[i],b=open[bi];if(a.f<b.f-1e-9||(Math.abs(a.f-b.f)<1e-9&&(a.g>b.g||(a.g===b.g&&a.i<b.i))))bi=i;}n=open.splice(bi,1)[0];}
  const k=key(n.p);if(closed.has(k))continue;closed.add(k);order.push({p:n.p,open:open.map(o=>o.p)});
  if(n.p[0]===Gl[0]&&n.p[1]===Gl[1]){const path=[n.p];let c=k;while(prev.has(c)){c=prev.get(c);path.unshift([c%W,Math.floor(c/W)]);}return{order,path,cost:g.get(k),expanded:order.length,frontierMax};}
  for(const [dx,dy] of (algo==='dfs'?[...N4].reverse():N4)){const q=[n.p[0]+dx,n.p[1]+dy];if(q[0]<0||q[1]<0||q[0]>=W||q[1]>=H||G[q[1]][q[0]]===1)continue;const qk=key(q);if(closed.has(qk))continue;const ng=g.get(k)+cost[q[1]][q[0]];
   if(algo==='bfs'||algo==='dfs'){if(g.has(qk))continue;g.set(qk,ng);prev.set(qk,k);open.push({p:q,g:ng,f:0,i:tick++});}
   else if(!g.has(qk)||ng<g.get(qk)){g.set(qk,ng);prev.set(qk,k);const f=algo==='ucs'?ng:algo==='greedy'?hfn(q,Gl,h):ng+hfn(q,Gl,h);open.push({p:q,g:ng,f,i:tick++});}}
  frontierMax=Math.max(frontierMax,open.length);}
 return{order,path:null,expanded:order.length,frontierMax};}
const ALGOS={bfs:t3('BFS (queue)','BFS (queue)','BFS (कतार)'),dfs:t3('DFS (stack)','DFS (stack)','DFS (ढेर)'),ucs:t3('Dijkstra (cost)','Dijkstra (cost)','डाइक्स्ट्रा (लागत)'),greedy:t3('Greedy best-first','Greedy best-first','लालची सर्वोत्तम-पहले'),astar:t3('A*','A*','A*')};
const COL={bfs:'#02CFF9',dfs:'#FF7A1A',ucs:'#c4a3ff',greedy:'#F5B90A',astar:'#22C55E'};
async function animate(algo,r){const c=ctx(),s=cs();drawBase();const fast=K.reduced||cfg.instant;const per=fast?1e9:Math.max(1,Math.round(r.order.length/60));
 for(let i=0;i<r.order.length;i++){const o=r.order[i];if(!(o.p[0]===S[0]&&o.p[1]===S[1])&&!(o.p[0]===Gl[0]&&o.p[1]===Gl[1])){c.fillStyle=COL[algo]+'55';c.fillRect(o.p[0]*s+3,o.p[1]*s+3,s-6,s-6);}
  if(i%per===0&&!fast){for(const f of o.open){c.strokeStyle='#ffffffaa';c.lineWidth=1.5;c.strokeRect(f[0]*s+4,f[1]*s+4,s-8,s-8);}await K.sleep(16);}}
 if(r.path){c.strokeStyle=COL[algo];c.lineWidth=s*.22;c.lineCap='round';c.lineJoin='round';c.shadowColor=COL[algo];c.shadowBlur=12;c.beginPath();r.path.forEach((p,i)=>{const X=p[0]*s+s/2,Y=p[1]*s+s/2;i?c.lineTo(X,Y):c.moveTo(X,Y);});c.stroke();c.shadowBlur=0;
  c.font=`${s*.7}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('🏁',Gl[0]*s+s/2,Gl[1]*s+s/2+1);
  if(!fast){for(const p of r.path){drawRobotAt(p);await K.sleep(28);}}}}
function drawRobotAt(p){const c=ctx(),s=cs();c.font=`${s*.55}px sans-serif`;c.fillText('🤖',p[0]*s+s/2,p[1]*s+s/2+1);}
let busy=false;
async function runAlgo(algo){if(busy)return;busy=true;const r=search(algo,cfg.heuristic||'manhattan');res[algo]=r;lastRun=algo;renderStats();await animate(algo,r);busy=false;
 if(r.path){K.emit('path-found',{algo,expanded:r.expanded,cost:r.cost,length:r.path.length-1,grid:cfg.grid});const names=Object.keys(res);if(['bfs','dfs','astar'].every(a=>names.includes(a))&&!cfg._cmp){cfg._cmp=1;K.check('compare-done',{algos:names});}
  if(algo==='astar')K.toast('✓ '+K.t(t3('A* found the goal','A* ne goal dhoondh liya','A* ने लक्ष्य ढूँढ लिया')));}}
function renderStats(){const best=Math.min(...Object.values(res).filter(r=>r.path).map(r=>r.cost));const bestE=Math.min(...Object.values(res).filter(r=>r.path).map(r=>r.expanded));
 K.$('#stats').innerHTML=Object.keys(res).length?`<table class="st"><tr><th>${K.t(t3('Algorithm','Algorithm','एल्गोरिद्म'))}</th><th>${K.t(t3('Cells explored','Cells explore','खोजे गए खाने'))}</th><th>${K.t(t3('Path cost','Path cost','पथ लागत'))}</th></tr>${Object.entries(res).map(([a,r])=>`<tr><td style="color:${COL[a]}">${K.esc(K.t(ALGOS[a]))}</td><td class="${r.expanded===bestE?'best':''}">${r.expanded}</td><td class="${r.cost===best?'best':''}">${r.path?r.cost+(r.cost===best?' ✓':''):'—'}</td></tr>`).join('')}</table>`:`<div class="mut">${K.t(t3('Run an algorithm to see how many cells it explores and how good its path is.','Algorithm chalao aur dekho woh kitne cells explore karta hai aur uska path kitna acha hai.','एल्गोरिद्म चलाओ और देखो वह कितने खाने खोजता है और उसका पथ कितना अच्छा है।'))}</div>`;}
// ---------- Q-learning ----------
let Q,ep=0,qrng;
const ACT=[[0,-1],[1,0],[0,1],[-1,0]],ARW=['↑','→','↓','←'];
function qReset(){Q={};for(let y=0;y<H;y++)for(let x=0;x<W;x++)Q[x+','+y]=[0,0,0,0];ep=0;qrng=K.rng(7);}
function qStep(st){const e=+cfg.epsilon,al=+cfg.alpha,ga=+cfg.gamma;const k=st[0]+','+st[1];let a;if(qrng()<e)a=Math.floor(qrng()*4);else{const q=Q[k];const m=Math.max(...q);const best=q.map((v,i)=>v===m?i:-1).filter(i=>i>=0);a=best[Math.floor(qrng()*best.length)];}
 let nx=[st[0]+ACT[a][0],st[1]+ACT[a][1]];if(nx[0]<0||nx[1]<0||nx[0]>=W||nx[1]>=H||G[nx[1]][nx[0]]===1)nx=st;
 let r=-1,done=false;if(G[nx[1]][nx[0]]===2){r=-10;done=true;}else if(nx[0]===Gl[0]&&nx[1]===Gl[1]){r=10;done=true;}
 const nk=nx[0]+','+nx[1];Q[k][a]+=al*(r+(done?0:ga*Math.max(...Q[nk]))-Q[k][a]);return{nx,done,r};}
function episode(){let s=[...S],tot=0;for(let i=0;i<100;i++){const o=qStep(s);tot+=o.r;s=o.nx;if(o.done)break;}ep++;return tot;}
function greedyPath(){let s=[...S];const path=[s];for(let i=0;i<30;i++){const q=Q[s[0]+','+s[1]];const a=q.indexOf(Math.max(...q));let nx=[s[0]+ACT[a][0],s[1]+ACT[a][1]];if(nx[0]<0||nx[1]<0||nx[0]>=W||nx[1]>=H||G[nx[1]][nx[0]]===1)return null;path.push(nx);s=nx;if(G[s[1]][s[0]]===2)return null;if(s[0]===Gl[0]&&s[1]===Gl[1])return path;}return null;}
function drawQ(){drawBase();const c=ctx(),s=cs();let mx=0;for(const k in Q)mx=Math.max(mx,...Q[k].map(Math.abs));
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(G[y][x]!==0||(x===Gl[0]&&y===Gl[1]))continue;const q=Q[x+','+y],m=Math.max(...q);if(q.every(v=>v===0))continue;
  const a=q.indexOf(m);const v=mx?m/mx:0;c.fillStyle=v>=0?`rgba(34,197,94,${.15+.5*Math.max(0,v)})`:`rgba(255,107,87,${.15+.5*Math.min(1,-v)})`;c.fillRect(x*s+2,y*s+2,s-4,s-4);
  if(!(x===S[0]&&y===S[1])){c.fillStyle='#fff';c.font=`bold ${s*.45}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(ARW[a],x*s+s/2,y*s+s/2);c.font=`${s*.17}px sans-serif`;c.fillStyle='#cbd5e1';c.fillText(m.toFixed(1),x*s+s/2,y*s+s*.85);}}
 const p=greedyPath();if(p){c.strokeStyle='#22C55E';c.lineWidth=s*.12;c.setLineDash([s*.15,s*.12]);c.beginPath();p.forEach((q,i)=>{const X=q[0]*s+s/2,Y=q[1]*s+s/2;i?c.lineTo(X,Y):c.moveTo(X,Y);});c.stroke();c.setLineDash([]);}
 return p;}
let optimalLen=null;
async function train(n){if(busy)return;busy=true;const step=K.reduced||cfg.instant?n:10;let tot=0;for(let i=0;i<n;i+=step){for(let j=0;j<step&&i+j<n;j++)tot=episode();const p=drawQ();K.$('#stats').innerHTML=qStats(p,tot);if(!(K.reduced||cfg.instant))await K.sleep(30);}
 const p=drawQ();K.emit('rl-episode',{episodes:ep});if(p&&p.length-1===optimalLen&&!cfg._opt){cfg._opt=1;K.check('rl-optimal',{episodes:ep,steps:p.length-1});}busy=false;}
function qStats(p,tot){return `<div class="row" style="gap:8px;flex-wrap:wrap"><div class="stat"><b>${ep}</b><span>${K.t(t3('episodes','episodes','एपिसोड'))}</span></div><div class="stat"><b>${tot}</b><span>${K.t(t3('last reward','last reward','पिछला इनाम'))}</span></div><div class="stat"><b>${p?p.length-1:'—'}</b><span>${K.t(t3('greedy path steps','greedy path steps','लालची पथ कदम'))}</span></div><div class="stat"><b>${optimalLen}</b><span>${K.t(t3('shortest possible','sabse chhota possible','सबसे छोटा संभव'))}</span></div></div>`;}
// ---------- UI ----------
const HOW={search:t3('BFS explores in rings (shortest steps). DFS dives down one corridor. Dijkstra expands the cheapest-so-far cell, so it respects mud (cost 5). Greedy rushes toward the goal using only the heuristic h — fast but can be fooled. A* uses f = g + h: cost so far plus an estimate to go. With an admissible heuristic (never overestimates, like Manhattan distance on a 4-way grid) A* is guaranteed to find the cheapest path while exploring far fewer cells. Tap cells to add or remove walls.','BFS rings mein explore karta hai (sabse kam steps). DFS ek corridor mein ghus jaata hai. Dijkstra ab tak ka sabse sasta cell kholta hai, isliye mud (cost 5) ka dhyaan rakhta hai. Greedy sirf heuristic h se goal ki taraf bhaagta hai — tez par dhokha kha sakta hai. A* f = g + h use karta hai: ab tak ki cost plus aage ka andaaza. Admissible heuristic (kabhi zyaada andaaza nahi, jaise 4-way grid par Manhattan distance) ke saath A* sabse sasta path pakka dhoondhta hai aur bahut kam cells explore karta hai. Walls lagane ya hatane ke liye cells tap karo.','BFS छल्लों में खोजता है (सबसे कम कदम)। DFS एक गलियारे में घुस जाता है। डाइक्स्ट्रा अब तक का सबसे सस्ता खाना खोलता है, इसलिए कीचड़ (लागत 5) का ध्यान रखता है। लालची खोज सिर्फ़ अनुमान h से लक्ष्य की ओर भागती है — तेज़ पर धोखा खा सकती है। A* f = g + h इस्तेमाल करता है: अब तक की लागत और आगे का अनुमान। स्वीकार्य अनुमान (कभी ज़्यादा नहीं, जैसे 4-दिशा ग्रिड पर मैनहट्टन दूरी) के साथ A* सबसे सस्ता पथ पक्का ढूँढता है और बहुत कम खाने खोजता है। दीवार लगाने या हटाने के लिए खाने टैप करो।'),
 qlearn:t3('The robot does not know the map. Each step costs −1, the pit 🕳️ gives −10 and the charger 🔋 gives +10. After every move it updates Q(s,a) ← Q(s,a) + α[r + γ·max Q(s′) − Q(s,a)]. Arrows show the best action learned in each cell; green means good, red means risky. With ε = 0.1 it still explores 10% of the time.','Robot map nahi jaanta. Har step −1, pit 🕳️ −10 aur charger 🔋 +10 deta hai. Har move ke baad woh Q(s,a) ← Q(s,a) + α[r + γ·max Q(s′) − Q(s,a)] update karta hai. Arrows har cell mein seekha hua best action dikhate hain; green matlab acha, red matlab risky. ε = 0.1 ke saath woh 10% baar ab bhi explore karta hai.','रोबोट नक़्शा नहीं जानता। हर कदम −1, गड्ढा 🕳️ −10 और चार्जर 🔋 +10 देता है। हर चाल के बाद वह Q(s,a) ← Q(s,a) + α[r + γ·max Q(s′) − Q(s,a)] अपडेट करता है। तीर हर खाने में सीखा गया सबसे अच्छा कदम दिखाते हैं; हरा मतलब अच्छा, लाल मतलब जोखिम। ε = 0.1 के साथ वह 10% बार अब भी खोजता है।')};
function renderCtl(){const el=K.$('#ctl');
 if(mode==='qlearn'){el.innerHTML=`<button class="btn pri" id="t50">▶ +50</button><button class="btn" id="t200">⏩ +200</button><button class="btn" id="qr">↺</button>`;K.$('#t50').onclick=()=>train(50);K.$('#t200').onclick=()=>train(200);K.$('#qr').onclick=()=>{qReset();cfg._opt=0;const p=drawQ();K.$('#stats').innerHTML=qStats(p,0);};
  K.$('#legend').innerHTML=`<span class="lg">🤖 ${K.t(t3('start','start','शुरुआत'))}</span><span class="lg">🔋 +10</span><span class="lg">🕳️ −10</span><span class="lg"><i style="background:#1e2b55"></i>${K.t(t3('wall','wall','दीवार'))}</span>`;return;}
 el.innerHTML=Object.keys(ALGOS).map(a=>`<button class="btn" data-a="${a}" style="border-color:${COL[a]}">${K.esc(K.t(ALGOS[a]))}</button>`).join('')+`<select id="grid">${['maze-1','city-1','open'].map(g=>`<option ${g===cfg.grid?'selected':''}>${g}</option>`).join('')}</select><select id="heur">${['manhattan','euclid','zero'].map(h=>`<option ${h===(cfg.heuristic||'manhattan')?'selected':''}>${h}</option>`).join('')}</select>`;
 K.$$('button[data-a]',el).forEach(b=>b.onclick=()=>runAlgo(b.dataset.a));K.$('#grid').onchange=e=>{cfg.grid=e.target.value;cfg._cmp=0;load(cfg.grid);drawBase();renderStats();};K.$('#heur').onchange=e=>{cfg.heuristic=e.target.value;res={};renderStats();};
 K.$('#legend').innerHTML=`<span class="lg"><i style="background:#1e2b55"></i>${K.t(t3('wall (tap to edit)','wall (tap karke badlo)','दीवार (टैप करके बदलो)'))}</span><span class="lg"><i style="background:#3a2a0a"></i>${K.t(t3('mud: cost 5','mud: cost 5','कीचड़: लागत 5'))}</span><span class="lg"><i style="border:1.5px solid #fff"></i>${K.t(t3('frontier','frontier','सीमांत'))}</span>`;}
function setMode(m){mode=m;K.$$('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 if(m==='qlearn'){cfg.grid='rl-5x5';load('rl-5x5');qReset();const saveG=G;const r=search('bfs');optimalLen=r.path?r.path.length-1:null;// BFS on grid treating pits as walls
  G=G.map(row=>row.map(v=>v===2?1:v));optimalLen=(search('bfs').path||[]).length-1;G=saveG;const p=drawQ();K.$('#stats').innerHTML=qStats(p,0);}
 else{if(cfg.grid==='rl-5x5')cfg.grid='maze-1';load(cfg.grid);drawBase();renderStats();}
 K.$('#vt').textContent=K.t(m==='qlearn'?t3('Q-learning: a robot learns by trial and error','Q-learning: robot trial and error se seekhta hai','क्यू-लर्निंग: रोबोट प्रयास और भूल से सीखता है'):t3('Search: find a path to the flag','Search: flag tak path dhoondho','खोज: झंडे तक पथ ढूँढो'));
 K.$('#how').textContent=K.t(HOW[m]);renderCtl();}
cv().addEventListener('pointerdown',e=>{if(mode!=='search'||busy)return;const r=cv().getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);if(x<=0||y<=0||x>=W-1||y>=H-1)return;if((x===S[0]&&y===S[1])||(x===Gl[0]&&y===Gl[1]))return;G[y][x]=G[y][x]===1?0:1;res={};cfg._cmp=0;drawBase();renderStats();K.emit('wall-edited',{x,y});});
(async()=>{K.lab='astar-arena';K.header(t3('Pathfinding Arena','Pathfinding Arena','पथ-खोज अखाड़ा'),t3('Search algorithms and a learning robot','Search algorithms aur seekhne wala robot','खोज एल्गोरिद्म और सीखने वाला रोबोट'));
 cfg=await K.boot({mode:'search',algo:'compare',grid:'maze-1',heuristic:'manhattan',epsilon:0.1,gamma:0.9,alpha:0.5});
 K.$('#modes').innerHTML=[['search',t3('🧭 Search (BFS, DFS, Dijkstra, A*)','🧭 Search (BFS, DFS, Dijkstra, A*)','🧭 खोज (BFS, DFS, डाइक्स्ट्रा, A*)')],['qlearn',t3('🎮 Q-learning robot','🎮 Q-learning robot','🎮 क्यू-लर्निंग रोबोट')]].map(([k,l])=>`<button class="btn" data-m="${k}">${K.t(l)}</button>`).join('');
 K.$$('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode(cfg.mode==='qlearn'?'qlearn':'search');
 if(cfg.mode!=='qlearn'&&cfg.algo&&ALGOS[cfg.algo]&&cfg.autorun)runAlgo(cfg.algo);
 K.onLang(()=>setMode(mode));window.__arena={search,runAlgo,train};})();
</script>
