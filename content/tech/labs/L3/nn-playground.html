<!doctype html><html lang="en" data-lab="nn-playground"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061233"><title>Neural Network Playground · NCA Tech Lab L3</title><style>:root{--bg:#061233;--bg2:#0b1b4a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#eef4ff;--mut:#9fb0d6;--grape:#8B3DFF;--cyan:#02CFF9;--leaf:#22C55E;--coral:#FF6B57;--gold:#F5B90A;--tang:#FF7A1A;--royal:#2563EB;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(120% 80% at 10% -10%,#22145e 0%,transparent 55%),radial-gradient(120% 80% at 110% 10%,#04395e 0%,transparent 50%),var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;min-height:100%}
body{padding:0 0 24px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(6,18,51,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0;flex:1;letter-spacing:.2px}
.top h1 small{display:block;font-size:11px;color:var(--mut);font-weight:500}

.langs{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.langs button{background:none;border:0;color:var(--mut);padding:5px 8px;font:inherit;font-size:12px;min-height:30px}
.langs button.on{background:var(--grape);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.goal{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:linear-gradient(135deg,rgba(139,61,255,.22),rgba(2,207,249,.12));border:1px solid rgba(139,61,255,.4);margin-bottom:12px;font-size:14px}
.goal b{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{font-size:14px;margin:0 0 8px;color:var(--cyan);letter-spacing:.3px;text-transform:uppercase}
.grid{display:grid;gap:12px}
@media(min-width:720px){.grid.two{grid-template-columns:1.25fr 1fr}}
@media(orientation:landscape) and (max-height:500px){.grid.two{grid-template-columns:1.2fr 1fr}.top{padding:6px 12px}}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--tx);border-radius:12px;padding:9px 12px;font:inherit;font-weight:600;min-height:40px;cursor:pointer;transition:transform .12s,background .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--grape),#5b2be0);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(139,61,255,.4)}
.btn.ok{background:var(--leaf);color:#062;border-color:transparent}
.btn.on{outline:2px solid var(--cyan)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border-radius:99px;padding:6px 11px;min-height:34px;font-size:13px}
label.sl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);flex:1;min-width:120px}
input[type=range]{width:100%;accent-color:var(--grape)}
input[type=text],textarea,select{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px;font:inherit}
.stat{display:flex;flex-direction:column;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.22);min-width:80px}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mut)}
.mut{color:var(--mut)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
canvas,svg{display:block;max-width:100%;touch-action:none}


.explain{font-size:13.5px;color:#d7e2ff;background:rgba(0,0,0,.2);border-left:3px solid var(--cyan);padding:8px 10px;border-radius:8px;margin-top:8px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(2,207,249,.0)}50%{box-shadow:0 0 0 6px rgba(2,207,249,.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top h1 .hstat{display:none;font-size:12px;font-weight:700;color:#4ade80;animation:pop .3s both}.top h1.toasting small{display:none}.top h1.toasting .hstat{display:block}
.seg.chips{margin:4px 0}.seg.chips button{white-space:normal;text-align:left;line-height:1.25;max-width:100%}
.seg.chips.big .pick{width:100%;font-weight:700}
</style></head><body><script>// NCA Tech Lab L3 shared kit: language, config from ?cfg= / ?lesson= / inline, mission events, small helpers. No eval.
(function(g){
  const qs=new URLSearchParams(location.search);
  const K={lang:qs.get('lang')||localStorage.getItem('nca-lang')||'hinglish',cfg:{},goal:null,lab:document.documentElement.dataset.lab,listeners:[]};
  K.reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  K.t=(o)=>o==null?'':typeof o==='string'?o:(o[K.lang]||o.hinglish||o.en||'');
  K.$=(s,r)=>(r||document).querySelector(s);K.$$=(s,r)=>[...(r||document).querySelectorAll(s)];
  K.el=(tag,attrs,html)=>{const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='on')for(const ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;};
  K.esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  K.rng=(seed)=>{let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};};
  K.clamp=(v,a,b)=>Math.max(a,Math.min(b,v));K.lerp=(a,b,t)=>a+(b-a)*t;K.ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  K.sleep=(ms)=>new Promise(r=>setTimeout(r,K.reduced?0:ms));
  K.tween=(ms,fn)=>new Promise(res=>{if(K.reduced||ms<=0){fn(1);return res();}const t0=performance.now();const f=n=>{const t=Math.min(1,(n-t0)/ms);fn(K.ease(t));t<1?requestAnimationFrame(f):res();};requestAnimationFrame(f);});
  // Toasts never cover content (readability rule): the message temporarily replaces the header subtitle, then the subtitle returns after 2.5 s.
  K.toast=(msg)=>{const h=K.$('header.top h1');if(!h)return;let st=h.querySelector('.hstat');if(!st){st=K.el('span',{class:'hstat',role:'status','aria-live':'polite'});h.appendChild(st);}st.textContent=msg;h.classList.add('toasting');clearTimeout(K._tt);K._tt=setTimeout(()=>h.classList.remove('toasting'),2500);};
  K.events=[];
  // emit a lab event; the lesson player listens via postMessage and matches it against try.questions[type=lab-check].answer
  K.emit=(event,data)=>{const m={type:'nca-lab-event',lab:K.lab,event,data:data||{},at:Date.now()};K.events.push(m);try{parent!==window&&parent.postMessage(m,'*');}catch(e){}g.dispatchEvent(new CustomEvent('nca-lab-event',{detail:m}));document.documentElement.dataset.lastEvent=event;};
  K.check=(event,data,msg)=>{K.emit(event,data);K.toast('✓ '+(msg||K.t({en:'Mission check passed',hinglish:'Mission check pass!',hi:'मिशन जाँच पास!'})));};
  K.onLang=(fn)=>K.listeners.push(fn);
  K.setLang=(l)=>{K.lang=l;localStorage.setItem('nca-lang',l);K.$$('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));K.$$('[data-t]').forEach(e=>{const o=K.T[e.dataset.t];if(o)e.innerHTML=K.t(o);});K.renderGoal();K.listeners.forEach(f=>f(l));};
  K.T={};// string table: key -> {en,hi,hinglish}
  K.renderGoal=()=>{const gEl=K.$('#goal');if(!gEl)return;const goal=K.goal||K.T.__goal;gEl.style.display=goal?'flex':'none';if(goal)gEl.innerHTML='<span>🎯</span><div><b>'+K.esc(K.t({en:'Goal',hinglish:'Goal',hi:'लक्ष्य'}))+':</b> '+K.esc(K.t(goal))+'</div>';};
  K.header=(title,sub)=>{const h=K.el('header',{class:'top'});h.innerHTML='<span class="badge">L3</span><h1>'+K.esc(K.t(title))+'<small>'+K.esc(K.t(sub))+'</small></h1><div class="langs" role="group" aria-label="Language"><button data-l="hinglish">Hinglish</button><button data-l="en">EN</button><button data-l="hi">हिं</button></div>';document.body.prepend(h);K.$$('.langs button',h).forEach(b=>b.onclick=()=>{K.setLang(b.dataset.l);h.querySelector('h1').firstChild.textContent=K.t(title);h.querySelector('small').textContent=K.t(sub);});};
  // Readability rule: native <select> boxes cut long option text on phones, so every select is shown as a wrapping row of chips.
  K.chipify=(sel)=>{if(sel._chips||sel.dataset.keep!=null)return;const box=K.el('div',{class:'seg chips',role:'radiogroup','aria-label':sel.getAttribute('aria-label')||'options'});sel.after(box);sel.style.display='none';sel._chips=box;let last='';
    let open=false;const render=(force)=>{const n=sel.options.length,big=n>6;const sig=[...sel.options].map(o=>o.value+'\u0001'+o.textContent).join('\u0002')+'|'+sel.value+'|'+open;if(sig===last&&!force)return;last=sig;box.innerHTML='';box.classList.toggle('big',big);
      if(big){const cur=sel.options[sel.selectedIndex];const t=K.el('button',{class:'btn on pick',type:'button','aria-expanded':open?'true':'false'});t.textContent=(open?'▴ ':'▾ ')+(cur?cur.textContent:'');t.onclick=()=>{open=!open;render(true);};box.appendChild(t);if(!open)return;}
      [...sel.options].forEach(o=>{if(big&&o.value===sel.value)return;const b=K.el('button',{class:'btn'+(o.value===sel.value?' on':''),type:'button',role:'radio','aria-checked':o.value===sel.value?'true':'false'});b.textContent=o.textContent;b.onclick=()=>{if(sel.disabled)return;sel.value=o.value;open=false;render(true);sel.dispatchEvent(new Event('change',{bubbles:true}));};box.appendChild(b);});};
    render();new MutationObserver(render).observe(sel,{childList:true,subtree:true,characterData:true});setInterval(render,250);};
  K.chipAll=()=>{K.$$('select').forEach(K.chipify);if(!K._mo){K._mo=new MutationObserver(()=>K.$$('select').forEach(K.chipify));K._mo.observe(document.body,{childList:true,subtree:true});}};
  K.boot=async(defaults)=>{let cfg=Object.assign({},defaults||{});
    const inl=document.getElementById('lesson-inline');
    try{if(inl){const L=JSON.parse(inl.textContent);if(L.play){Object.assign(cfg,L.play.config||{});K.goal=L.play.goal;}}}catch(e){}
    const lp=qs.get('lesson');if(lp){try{const L=await (await fetch(lp)).json();if(L.play&&L.play.lab===K.lab){Object.assign(cfg,L.play.config||{});K.goal=L.play.goal;}}catch(e){}}
    const c=qs.get('cfg');if(c){try{Object.assign(cfg,JSON.parse(c));}catch(e){}}
    for(const [k,v] of qs){if(!['cfg','lesson','lang'].includes(k))cfg[k]=v;}
    K.cfg=cfg;K.setLang(K.lang);setTimeout(K.chipAll,0);return cfg;};
  g.K=K;
})(window);
</script><div class="wrap">

 <div class="seg" id="modes" style="margin-bottom:10px"></div>
 <div class="grid two">
  <div class="card"><h2 id="vizTitle"></h2><canvas id="cv" width="640" height="640" style="width:100%;aspect-ratio:1;border-radius:12px;background:#08163f"></canvas>

<script>
const T=K.T;Object.assign(T,{stats:{en:'Live numbers',hinglish:'Live numbers',hi:'लाइव संख्याएँ'},net:{en:'The network',hinglish:'Network',hi:'नेटवर्क'},
 classify:{en:'Classify',hinglish:'Classify',hi:'वर्गीकरण'},regress:{en:'Regression',hinglish:'Regression',hi:'रिग्रेशन'},kmeans:{en:'k-means',hinglish:'k-means',hi:'के-मीन्स'},conv:{en:'Convolution',hinglish:'Convolution',hi:'कन्वोल्यूशन'},diffusion:{en:'Diffusion',hinglish:'Diffusion',hi:'डिफ़्यूज़न'}});
const cv=K.$('#cv'),cx=cv.getContext('2d'),lc=K.$('#loss'),lx=lc.getContext('2d');let mode,cfg,raf=0,running=false;
const PAL={a:'#FF7A1A',b:'#02CFF9',ga:'#FFD23F',gb:'#8B3DFF'};
// ---------- datasets (deterministic) ----------
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function makeData(name,noise){const r=K.rng(42),P=[];const n=(name==='imbalanced-groups')?220:200;noise=noise==null?0.1:noise;
 for(let i=0;i<n;i++){let x,y,l,grp=0;
  if(name==='two-blobs'){l=i%2;x=(l?0.45:-0.45)+gauss(r)*0.18;y=(l?0.35:-0.35)+gauss(r)*0.18;}
  else if(name==='xor'){x=r()*2-1;y=r()*2-1;if(Math.abs(x)<0.08||Math.abs(y)<0.08){i--;continue;}l=(x*y>0)?1:0;}
  else if(name==='circle'||name==='noisy-circle'){const a=r()*Math.PI*2;l=i%2;const rad=l?r()*0.42:0.6+r()*0.35;x=Math.cos(a)*rad;y=Math.sin(a)*rad;}
  else if(name==='spiral'){l=i%2;const t=(i>>1)/(n/2)*3.2;const rad=t/3.4*0.95;const a=t*1.9+(l?Math.PI:0);x=Math.cos(a)*rad;y=Math.sin(a)*rad;}
  else if(name==='imbalanced-groups'){grp=r()<0.12?1:0;l=r()<0.5?1:0;if(grp===0){x=(l?0.45:-0.45)+gauss(r)*0.18;y=-0.3+gauss(r)*0.25;}else{x=(l?-0.45:0.45)+gauss(r)*0.14;y=0.72+gauss(r)*0.1;}}
  if(name!=='imbalanced-groups'&&noise>0.1&&r()<noise*0.35)l=1-l;
  x+=gauss(r)*noise*0.15;y+=gauss(r)*noise*0.15;P.push({x:K.clamp(x,-1,1),y:K.clamp(y,-1,1),l,grp,test:(i%5===0)});}
 return P;}
// ---------- tiny MLP ----------
function MLP(sizes,act){const r=K.rng(7);this.L=[];this.act=act;for(let i=0;i<sizes.length-1;i++){const a=sizes[i],b=sizes[i+1],s=Math.sqrt(2/a);this.L.push({W:Array.from({length:b},()=>Array.from({length:a},()=>gauss(r)*s)),b:Array.from({length:b},()=>gauss(r)*0.3)});}}
const ACT={relu:[z=>z>0?z:0.01*z,(z,a)=>z>0?1:0.01],tanh:[z=>Math.tanh(z),(z,a)=>1-a*a]};
MLP.prototype.fwd=function(x){const zs=[],as=[x];let a=x;this.L.forEach((ly,li)=>{const last=li===this.L.length-1;const z=ly.W.map((w,j)=>w.reduce((s,wi,k)=>s+wi*a[k],ly.b[j]));const f=last?(v=>1/(1+Math.exp(-v))):ACT[this.act][0];a=z.map(f);zs.push(z);as.push(a);});return{zs,as,out:a[0]};};
MLP.prototype.train=function(P,lr,weight){const G=this.L.map(ly=>({W:ly.W.map(w=>w.map(()=>0)),b:ly.b.map(()=>0)}));let loss=0,n=0;
 for(const p of P){const w=weight?weight(p):1;const {zs,as,out}=this.fwd([p.x,p.y]);const o=K.clamp(out,1e-7,1-1e-7);loss+=-w*(p.l?Math.log(o):Math.log(1-o));n+=w;
  let d=[(out-p.l)*w];for(let li=this.L.length-1;li>=0;li--){const ly=this.L[li],aPrev=as[li];d.forEach((dj,j)=>{G[li].b[j]+=dj;aPrev.forEach((ak,k)=>G[li].W[j][k]+=dj*ak);});
   if(li>0){const nd=aPrev.map((ak,k)=>{let s=0;d.forEach((dj,j)=>s+=dj*ly.W[j][k]);return s*ACT[this.act][1](zs[li-1][k],ak);});d=nd;}}}
 if(!this.V)this.V=this.L.map(ly=>({W:ly.W.map(w=>w.map(()=>0)),b:ly.b.map(()=>0)}));const V=this.V,mu=0.9;this.L.forEach((ly,li)=>{ly.W.forEach((w,j)=>w.forEach((_,k)=>{V[li].W[j][k]=mu*V[li].W[j][k]-lr*G[li].W[j][k]/n;w[k]+=V[li].W[j][k];}));ly.b.forEach((_,j)=>{V[li].b[j]=mu*V[li].b[j]-lr*G[li].b[j]/n;ly.b[j]+=V[li].b[j];});});this.grad=G;return loss/n;};
// ---------- classify mode ----------
const C={};
function setupClassify(){const c=cfg;C.dataset=c.dataset||'two-blobs';C.hidden=Array.isArray(c.hidden)?c.hidden:(c.hidden?JSON.parse(c.hidden):[4]);C.act=c.activation||'tanh';C.lr=+c.lr||(C.act==='relu'?0.1:0.2);C.noise=c.noise!=null?+c.noise:0.1;C.balanced=false;resetClassify();
 const presets=[[],[4],[8],[8,8]];K.$('#ctrl').innerHTML=`<h2>${K.t({en:'Controls',hinglish:'Controls',hi:'नियंत्रण'})}</h2>
 <div class="seg" id="ds">${['two-blobs','xor','circle','spiral','noisy-circle','imbalanced-groups'].map(d=>`<button class="btn" data-d="${d}">${d}</button>`).join('')}</div>
 <div class="mut" style="margin:8px 0 4px">${K.t({en:'Hidden layers',hinglish:'Hidden layers',hi:'छिपी परतें'})}</div><div class="seg" id="hl">${presets.map(p=>`<button class="btn" data-h="${JSON.stringify(p)}">${p.length?p.join(' → '):K.t({en:'none',hinglish:'koi nahi',hi:'कोई नहीं'})}</button>`).join('')}</div>
 <div class="row" style="margin-top:8px"><label class="sl">${K.t({en:'Learning rate',hinglish:'Learning rate',hi:'लर्निंग रेट'})} <b id="lrv"></b><input type="range" id="lr" min="0.005" max="1" step="0.005"></label>
 <label class="sl">${K.t({en:'Activation',hinglish:'Activation',hi:'एक्टिवेशन'})}<select id="act"><option>tanh</option><option>relu</option></select></label></div>
 <div class="row" style="margin-top:8px"><button class="btn pri" id="play">▶</button><button class="btn" id="step">+1 epoch</button><button class="btn" id="reset">↺</button>${C.dataset==='imbalanced-groups'?`<button class="btn" id="bal">⚖ ${K.t({en:'Balance groups',hinglish:'Groups balance karo',hi:'समूह संतुलित करो'})}</button>`:''}</div>`;
 K.$$('#ds button').forEach(b=>{b.classList.toggle('on',b.dataset.d===C.dataset);b.onclick=()=>{cfg.dataset=b.dataset.d;stop();setupClassify();};});
 K.$$('#hl button').forEach(b=>{b.classList.toggle('on',b.dataset.h===JSON.stringify(C.hidden));b.onclick=()=>{C.hidden=JSON.parse(b.dataset.h);K.$$('#hl button').forEach(x=>x.classList.toggle('on',x===b));resetClassify();};});
 const lr=K.$('#lr');lr.value=C.lr;K.$('#lrv').textContent=C.lr;lr.oninput=()=>{C.lr=+lr.value;K.$('#lrv').textContent=C.lr;};
 const ac=K.$('#act');ac.value=C.act;ac.onchange=()=>{C.act=ac.value;resetClassify();};
 K.$('#play').onclick=()=>running?stop():start(classifyTick);K.$('#step').onclick=()=>{classifyTick(true);};K.$('#reset').onclick=()=>{stop();resetClassify();};
 const bb=K.$('#bal');if(bb)bb.onclick=()=>{C.balanced=!C.balanced;bb.classList.toggle('on',C.balanced);};
 K.$('#legend').innerHTML=`<span class="pill" style="background:${PAL.a};color:#000">● class 0</span><span class="pill" style="background:${PAL.b};color:#000">● class 1</span><span class="mut">○ = test</span>${C.dataset==='imbalanced-groups'?'<span class="pill" style="background:#fff;color:#000">◆ group B</span>':''}`;

function setupConv(){Cv.I=leaf();Cv.f=(cfg.filters&&cfg.filters[0])||'edge-v';Cv.pos=-1;Cv.out=null;
 K.$('#ctrl').innerHTML=`<h2>${K.t({en:'Pick a 3×3 filter',hinglish:'3×3 filter chuno',hi:'3×3 फ़िल्टर चुनो'})}</h2><div class="seg" id="fs">${Object.keys(FILT).map(f=>`<button class="btn" data-f="${f}">${f}</button>`).join('')}</div><div class="mono" id="kern" style="margin:10px 0"></div><div class="row"><button class="btn pri" id="run">▶ ${K.t({en:'Slide filter',hinglish:'Filter sarkao',hi:'फ़िल्टर सरकाओ'})}</button><button class="btn" id="fast">⏩</button></div><div class="explain" id="calc"></div>`;
 K.$$('#fs button').forEach(b=>{b.classList.toggle('on',b.dataset.f===Cv.f);b.onclick=()=>{Cv.f=b.dataset.f;Cv.pos=-1;Cv.out=null;K.$$('#fs button').forEach(x=>x.classList.toggle('on',x===b));drawConv();};});
 K.$('#run').onclick=()=>runConv(false);K.$('#fast').onclick=()=>runConv(true);K.$('#vizTitle').textContent=K.t({en:'16×16 leaf image (left) → feature map (right)',hinglish:'16×16 leaf image (left) → feature map (right)',hi:'16×16 पत्ती तस्वीर (बाएँ) → फ़ीचर मैप (दाएँ)'});K.$('#legend').innerHTML='';K.$('#netCard').style.display='none';
 K.$('#explain').innerHTML=K.t({en:'At each position the filter\'s 9 weights multiply the 9 pixels under it and the products are added: that sum is one feature-map value. The same 9 weights are reused everywhere (weight sharing).',hinglish:'Har position par filter ke 9 weights neeche ke 9 pixels se multiply hote hain aur products jude jaate hain: woh sum feature map ki ek value hai. Wahi 9 weights har jagah reuse hote hain (weight sharing).',hi:'हर स्थान पर फ़िल्टर के 9 भार नीचे के 9 पिक्सेल से गुणा होते हैं और गुणनफल जुड़ते हैं: वह योग फ़ीचर मैप का एक मान है। वही 9 भार हर जगह दोबारा इस्तेमाल होते हैं (भार साझा)।'});
 K.$('#stats').innerHTML='';drawLoss([]);drawConv();}
function convAt(i,j){const F=FILT[Cv.f];let s=0;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const v=(Cv.I[i+a]||[])[j+b];s+=(v==null?0:v)*F[a+1][b+1];}return s;}
async function runConv(fast){Cv.out=Array.from({length:16},()=>new Array(16).fill(null));for(let p=0;p<256;p++){Cv.pos=p;const i=p>>4,j=p&15;Cv.out[i][j]=convAt(i,j);if(!fast&&(p%3===0)){drawConv();await K.sleep(18);}}Cv.pos=-1;drawConv();K.check('filter-applied',{filter:Cv.f});}
function drawConv(){const W=cv.width,cs=W/2/16;cx.fillStyle='#08163f';cx.fillRect(0,0,W,W);const top=W/2-cs*8;
 for(let i=0;i<16;i++)for(let j=0;j<16;j++){const v=Cv.I[i][j];cx.fillStyle=`rgb(${30+v*40|0},${60+v*180|0},${40+v*60|0})`;cx.fillRect(j*cs,top+i*cs,cs-1,cs-1);
  if(Cv.out&&Cv.out[i][j]!=null){const o=Cv.out[i][j];const m=Cv.f==='blur'?o:Math.abs(o)/2.2;cx.fillStyle=Cv.f==='blur'||Cv.f==='sharpen'?`rgb(${K.clamp(m*255,0,255)|0},${K.clamp(m*255,0,255)|0},${K.clamp(m*255,0,255)|0})`:(o>0?`rgba(2,207,249,${K.clamp(m,0,1)})`:`rgba(255,122,26,${K.clamp(m,0,1)})`);cx.fillRect(W/2+j*cs,top+i*cs,cs-1,cs-1);}}
 cx.strokeStyle='rgba(255,255,255,.2)';cx.strokeRect(W/2,top,cs*16,cs*16);
 if(Cv.pos>=0){const i=Cv.pos>>4,j=Cv.pos&15;cx.strokeStyle='#FFD23F';cx.lineWidth=4;cx.strokeRect((j-1)*cs,top+(i-1)*cs,cs*3,cs*3);cx.strokeStyle='#fff';cx.strokeRect(W/2+j*cs,top+i*cs,cs,cs);
  cx.strokeStyle='rgba(255,210,63,.6)';cx.lineWidth=2;cx.beginPath();cx.moveTo((j+2)*cs,top+(i+.5)*cs);cx.lineTo(W/2+j*cs,top+(i+.5)*cs);cx.stroke();
  const F=FILT[Cv.f];let terms=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const v=(Cv.I[i+a]||[])[j+b];terms.push(((v==null?0:v)).toFixed(2)+'×'+(+F[a+1][b+1].toFixed(2)));}K.$('#calc').innerHTML='<span class="mono">'+terms.slice(0,4).join(' + ')+' + … = <b>'+convAt(i,j).toFixed(2)+'</b></span>';}
 const F=FILT[Cv.f];K.$('#kern')&&(K.$('#kern').innerHTML='<table style="border-collapse:collapse">'+F.map(r=>'<tr>'+r.map(v=>`<td style="border:1px solid #334;padding:4px 8px;text-align:center;color:${v>0?'#02CFF9':v<0?'#FF7A1A':'#9fb0d6'}">${+v.toFixed(2)}</td>`).join('')+'</tr>').join('')+'</table>');
 cx.fillStyle='#9fb0d6';cx.font='18px system-ui';cx.fillText('input',8,top-10);cx.fillText('feature map',W/2+8,top-10);}
// ---------- diffusion ----------
const Df={};const ICONS={peacock:(x,y)=>{const r=Math.hypot(x-16,y-12);let c=[8,22,63];if(r<11&&y<20){const a=Math.atan2(y-12,x-16);const ring=Math.floor(r/3.2)%2;c=ring?[2,180,170]:[30,90,200];if(Math.abs(Math.sin(a*6))<.18&&r>5)c=[245,185,10];}if((x-16)**2/6+(y-20)**2/22<1)c=[37,99,235];if((x-16)**2+(y-12.5)**2<3&&y>19)c=[37,99,235];if(Math.hypot(x-16,y-15.5)<1.9)c=[20,60,180];if(y>27&&Math.abs(x-16)<4&&y<29)c=[245,185,10];return c;},
 lotus:(x,y)=>{let c=[8,22,63];for(let k=-2;k<=2;k++){const cxp=16+k*4.2,ang=k*0.35;const dx=x-cxp,dy=y-15;const rx=dx*Math.cos(ang)+dy*Math.sin(ang),ry=-dx*Math.sin(ang)+dy*Math.cos(ang);if(rx*rx/5+ry*ry/42<1&&y<21)c=k===0?[255,140,190]:[240,100,160];}if(y>21&&y<25&&Math.abs(x-16)<12)c=[34,197,94];if(y>=25)c=[2,100,160];return c;}};
function setupDiff(){Df.prompt='peacock';Df.t=+cfg.steps||20;Df.T=+cfg.steps||20;const r=K.rng(99);Df.noise=Array.from({length:32*32*3},()=>gauss(r));Df.fired=false;
 K.$('#ctrl').innerHTML=`<h2>${K.t({en:'Denoise step by step',hinglish:'Step-by-step denoise',hi:'कदम-दर-कदम शोर हटाओ'})}</h2><div class="seg" id="pr"><button class="btn" data-p="peacock">"a peacock, folk-art style"</button><button class="btn" data-p="lotus">"a lotus on a pond"</button></div><label class="sl" style="margin-top:10px">${K.t({en:'Step t (noise level)',hinglish:'Step t (noise level)',hi:'कदम t (शोर स्तर)'})} <b id="tv"></b><input type="range" id="t" min="0" max="${Df.T}" value="${Df.T}"></label><div class="row" style="margin-top:8px"><button class="btn pri" id="go">▶ ${K.t({en:'Denoise',hinglish:'Denoise karo',hi:'शोर हटाओ'})}</button><button class="btn" id="noise">↺ ${K.t({en:'Back to noise',hinglish:'Wapas noise',hi:'वापस शोर'})}</button></div>`;
 K.$$('#pr button').forEach(b=>{b.classList.toggle('on',b.dataset.p===Df.prompt);b.onclick=()=>{Df.prompt=b.dataset.p;K.$$('#pr button').forEach(x=>x.classList.toggle('on',x===b));drawDiff();};});
 K.$('#t').oninput=e=>{Df.t=+e.target.value;drawDiff();};K.$('#go').onclick=async()=>{for(let t=Df.t;t>=0;t--){Df.t=t;K.$('#t').value=t;drawDiff();await K.sleep(140);}};K.$('#noise').onclick=()=>{Df.t=Df.T;K.$('#t').value=Df.T;drawDiff();};
 K.$('#vizTitle').textContent=K.t({en:'From pure noise to a picture',hinglish:'Pure noise se tasveer tak',hi:'शुद्ध शोर से तस्वीर तक'});K.$('#legend').innerHTML='';K.$('#netCard').style.display='none';K.$('#stats').innerHTML='';drawLoss([]);
 K.$('#explain').innerHTML=K.t({en:'This visualiser uses the real diffusion noise schedule: xₜ = √ᾱₜ·x₀ + √(1−ᾱₜ)·ε. A trained model predicts ε from xₜ and the prompt; here the picture the prompt points to is built in, so you can see exactly what each denoising step removes. Same noise + different prompt = different image.',hinglish:'Yeh visualiser asli diffusion noise schedule use karta hai: xₜ = √ᾱₜ·x₀ + √(1−ᾱₜ)·ε. Trained model xₜ aur prompt se ε predict karta hai; yahan prompt wali tasveer built-in hai, taaki tum dekh sako har denoising step kya hatata hai. Same noise + alag prompt = alag image.',hi:'यह विज़ुअलाइज़र असली डिफ़्यूज़न शोर-अनुसूची इस्तेमाल करता है: xₜ = √ᾱₜ·x₀ + √(1−ᾱₜ)·ε। प्रशिक्षित मॉडल xₜ और प्रॉम्प्ट से ε अनुमानित करता है; यहाँ प्रॉम्प्ट वाली तस्वीर अंदर बनी है, ताकि आप देख सकें हर कदम क्या हटाता है। वही शोर + अलग प्रॉम्प्ट = अलग तस्वीर।'});drawDiff();}
function drawDiff(){const N=32,W=cv.width,cs=W/N;const ab=Math.cos((Df.t/Df.T)*Math.PI/2*0.98)**2;const sa=Math.sqrt(ab),sn=Math.sqrt(1-ab);const f=ICONS[Df.prompt];
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=f(x,y);const k=(y*N+x)*3;const px=[0,1,2].map(i=>K.clamp((c[i]/127.5-1)*sa+Df.noise[k+i]*sn,-1,1));cx.fillStyle=`rgb(${(px[0]+1)*127.5|0},${(px[1]+1)*127.5|0},${(px[2]+1)*127.5|0})`;cx.fillRect(x*cs,y*cs,cs+0.5,cs+0.5);}
 K.$('#tv').textContent=Df.t+' / '+Df.T+'  (√ᾱ = '+sa.toFixed(2)+')';if(Df.t===0&&!Df.fired){Df.fired=true;K.check('diffusion-complete',{prompt:Df.prompt});}}
// ---------- loop & boot ----------
function start(fn){running=true;const b=K.$('#play');if(b)b.textContent='⏸';const f=()=>{if(!running)return;fn();raf=requestAnimationFrame(f);};raf=requestAnimationFrame(f);}
function stop(){running=false;cancelAnimationFrame(raf);const b=K.$('#play');if(b)b.textContent='▶';}
const SETUP={classify:setupClassify,regress:setupRegress,kmeans:setupKmeans,conv:setupConv,diffusion:setupDiff};
function go(m){stop();mode=m;K.$$('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));SETUP[m]();}
K.header({en:'Neural Network Playground',hinglish:'Neural Network Playground',hi:'न्यूरल नेटवर्क प्लेग्राउंड'},{en:'Train real models in your browser',hinglish:'Browser mein asli models train karo',hi:'ब्राउज़र में असली मॉडल प्रशिक्षित करो'});
K.boot({mode:'classify',dataset:'circle',hidden:[4]}).then(c=>{cfg=c;K.$('#modes').innerHTML=Object.keys(SETUP).map(m=>`<button class="btn" data-m="${m}" data-t="${m}">${K.t(T[m])}</button>`).join('');K.$$('#modes button').forEach(b=>b.onclick=()=>go(b.dataset.m));K.onLang(()=>go(mode));go(c.mode||'classify');});
</script>
