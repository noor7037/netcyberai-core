<script>
const T=K.T,t3=(en,hinglish,hi)=>({en,hinglish,hi});
Object.assign(T,{mission:t3('Mission','Mission','मिशन'),query:t3('Your SQL','Tumhara SQL','आपका SQL'),schema:t3('Tables (tap to preview)','Tables (preview ke liye tap karo)','तालिकाएँ (देखने के लिए टैप करो)'),sqliTitle:t3('Login form: unsafe vs safe','Login form: unsafe vs safe','लॉगिन फ़ॉर्म: असुरक्षित बनाम सुरक्षित')});
// ---------- data (fictional school) ----------
const DB={
 houses:{cols:['id','name','colour'],pk:'id',rows:[[1,'Aryabhata','red'],[2,'Raman','blue'],[3,'Kalpana','green'],[4,'Sarabhai','yellow']]},
 students:{cols:['id','name','class','house_id','city'],pk:'id',fk:{house_id:'houses.id'},rows:[[1,'Aanya',9,1,'Pune'],[2,'Kabir',9,2,'Lucknow'],[3,'Meera',10,3,'Chennai'],[4,'Arjun',10,1,'Pune'],[5,'Zoya',11,4,'Srinagar'],[6,'Rohan',11,2,'Patna'],[7,'Ishita',12,3,'Kolkata'],[8,'Dev',12,4,'Jaipur'],[9,'Sana',10,2,'Hyderabad'],[10,'Vikram',9,3,'Chennai'],[11,'Priya',11,1,'Bhopal'],[12,'Nikhil',12,2,'Guwahati']]},
 marks:{cols:['student_id','subject','marks'],fk:{student_id:'students.id'},rows:[]},
 users:{cols:['id','username','password_hash'],pk:'id',rows:[[1,'admin','$2b$12$Q9…(bcrypt hash)'],[2,'teacher1','$2b$12$x7…(bcrypt hash)'],[3,'aanya','$2b$12$Lm…(bcrypt hash)']]}};
{const r=K.rng(42),subs=['maths','science','english'];for(let s=1;s<=12;s++)for(const sb of subs)DB.marks.rows.push([s,sb,45+Math.floor(r()*55)]);}
// ---------- tokenizer ----------
const KW=new Set('SELECT DISTINCT FROM WHERE AND OR NOT JOIN INNER LEFT ON GROUP BY HAVING ORDER ASC DESC LIMIT AS LIKE IN IS NULL BETWEEN COUNT SUM AVG MIN MAX ROUND UPPER LOWER LENGTH'.split(' '));
function lex(s){const out=[];let i=0;while(i<s.length){const c=s[i];if(/\s/.test(c)){i++;continue;}
 if(c==='-'&&s[i+1]==='-'){while(i<s.length&&s[i]!=='\n')i++;continue;}
 if(c==="'"){let j=i+1,v='';for(;;){if(j>=s.length)throw err('unclosed',"Unclosed text quote ' — add the closing quote.");if(s[j]==="'"){if(s[j+1]==="'"){v+="'";j+=2;continue;}break;}v+=s[j++];}out.push({t:'str',v});i=j+1;continue;}

 const two=s.slice(i,i+2);if(['<=','>=','!=','<>'].includes(two)){out.push({t:'op',v:two==='<>'?'!=':two});i+=2;continue;}
 if('=<>+-*/(),.;'.includes(c)){out.push({t:'op',v:c});i++;continue;}

function err(code,msg){const e=new Error(msg);e.code=code;return e;}
// ---------- parser ----------
function parse(src){const tk=lex(src).filter(x=>!(x.t==='op'&&x.v===';'));let p=0;const pk=()=>tk[p],nx=()=>tk[p++];
 const is=(t,v)=>tk[p]&&tk[p].t===t&&(v===undefined||tk[p].v===v),kw=v=>is('kw',v),eat=(t,v)=>{if(!is(t,v))throw err('expect','Expected '+(v||t)+(pk()?' near "'+pk().v+'"':' at the end')+'.');return nx();};
 function primary(){const x=pk();if(!x)throw err('end','The query ended too early.');
  if(x.t==='num'){p++;return{k:'lit',v:x.v};}if(x.t==='str'){p++;return{k:'lit',v:x.v};}
  if(kw('NULL')){p++;return{k:'lit',v:null};}
  if(x.t==='op'&&x.v==='('){p++;const e=expr();eat('op',')');return e;}
  if(x.t==='op'&&x.v==='-'){p++;return{k:'neg',e:primary()};}
  if(x.t==='kw'&&['COUNT','SUM','AVG','MIN','MAX','ROUND','UPPER','LOWER','LENGTH'].includes(x.v)){p++;eat('op','(');let a;if(is('op','*')){p++;a={k:'star'};}else{const d=kw('DISTINCT');if(d)p++;a=expr();a.distinct=d;}const args=[a];while(is('op',',')){p++;args.push(expr());}eat('op',')');return{k:'fn',f:x.v,args};}

  throw err('unexpected','Did not expect "'+x.v+'" here.');}

  if(is('op')&&['=','!=','<','>','<=','>='].includes(pk().v)){const o=nx().v;return{k:'bin',o,l,r:add()};}
  if(kw('LIKE')){p++;return wrap({k:'like',l,r:add()});}
  if(kw('IN')){p++;eat('op','(');const xs=[expr()];while(is('op',',')){p++;xs.push(expr());}eat('op',')');return wrap({k:'in',l,xs});}
  if(kw('BETWEEN')){p++;const a=add();eat('kw','AND');const b=add();return wrap({k:'between',l,a,b});}

 const q={items:[],joins:[],group:[],order:[]};
 if(!kw('SELECT'))throw err('select','This playground runs SELECT queries only (reading data). Start with SELECT.');
 p++;if(kw('DISTINCT')){p++;q.distinct=true;}
 do{if(is('op',',')&&q.items.length)p++;if(is('op','*')){p++;q.items.push({e:{k:'star'}});}else{const e=expr();let as=null;if(kw('AS')){p++;as=eat('id').v;}else if(is('id'))as=nx().v;q.items.push({e,as});}}while(is('op',','));
 eat('kw','FROM');const tb=()=>{const n=eat('id').v;if(!DB[n])throw err('table','There is no table called "'+n+'". Tables: '+Object.keys(DB).join(', ')+'.');let a=n;if(kw('AS')){p++;a=eat('id').v;}else if(is('id'))a=nx().v;return{n,a};};
