.mut{color:var(--mut)}

</style></head><body><script>// NCA Tech Lab L3 shared kit: language, config from ?cfg= / ?lesson= / inline, mission events, small helpers. No eval.
(function(g){
  const qs=new URLSearchParams(location.search);
  const K={lang:qs.get('lang')||localStorage.getItem('nca-lang')||'hinglish',cfg:{},goal:null,lab:document.documentElement.dataset.lab,listeners:[]};
  K.reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  K.t=(o)=>o==null?'':typeof o==='string'?o:(o[K.lang]||o.hinglish||o.en||'');
  K.$=(s,r)=>(r||document).querySelector(s);K.$$=(s,r)=>[...(r||document).querySelectorAll(s)];
  K.el=(tag,attrs,html)=>{const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='on')for(const ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;};
  K.esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  K.rng=(seed)=>{let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};};
  K.clamp=(v,a,b)=>Math.max(a,Math.min(b,v));K.lerp=(a,b,t)=>a+(b-a)*t;K.ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  K.sleep=(ms)=>new Promise(r=>setTimeout(r,K.reduced?0:ms));
  K.tween=(ms,fn)=>new Promise(res=>{if(K.reduced||ms<=0){fn(1);return res();}const t0=performance.now();const f=n=>{const t=Math.min(1,(n-t0)/ms);fn(K.ease(t));t<1?requestAnimationFrame(f):res();};requestAnimationFrame(f);});
  // Toasts never cover content (readability rule): the message temporarily replaces the header subtitle, then the subtitle returns after 2.5 s.
  K.toast=(msg)=>{const h=K.$('header.top h1');if(!h)return;let st=h.querySelector('.hstat');if(!st){st=K.el('span',{class:'hstat',role:'status','aria-live':'polite'});h.appendChild(st);}st.textContent=msg;h.classList.add('toasting');clearTimeout(K._tt);K._tt=setTimeout(()=>h.classList.remove('toasting'),2500);};
  K.events=[];
  // emit a lab event; the lesson player listens via postMessage and matches it against try.questions[type=lab-check].answer
  K.emit=(event,data)=>{const m={type:'nca-lab-event',lab:K.lab,event,data:data||{},at:Date.now()};K.events.push(m);try{parent!==window&&parent.postMessage(m,'*');}catch(e){}g.dispatchEvent(new CustomEvent('nca-lab-event',{detail:m}));document.documentElement.dataset.lastEvent=event;};
  K.check=(event,data,msg)=>{K.emit(event,data);K.toast('✓ '+(msg||K.t({en:'Mission check passed',hinglish:'Mission check pass!',hi:'मिशन जाँच पास!'})));};
  K.onLang=(fn)=>K.listeners.push(fn);
  K.setLang=(l)=>{K.lang=l;localStorage.setItem('nca-lang',l);K.$$('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));K.$$('[data-t]').forEach(e=>{const o=K.T[e.dataset.t];if(o)e.innerHTML=K.t(o);});K.renderGoal();K.listeners.forEach(f=>f(l));};
  K.T={};// string table: key -> {en,hi,hinglish}
  K.renderGoal=()=>{const gEl=K.$('#goal');if(!gEl)return;const goal=K.goal||K.T.__goal;gEl.style.display=goal?'flex':'none';if(goal)gEl.innerHTML='<span>🎯</span><div><b>'+K.esc(K.t({en:'Goal',hinglish:'Goal',hi:'लक्ष्य'}))+':</b> '+K.esc(K.t(goal))+'</div>';};
  K.header=(title,sub)=>{const h=K.el('header',{class:'top'});h.innerHTML='<span class="badge">L3</span><h1>'+K.esc(K.t(title))+'<small>'+K.esc(K.t(sub))+'</small></h1><div class="langs" role="group" aria-label="Language"><button data-l="hinglish">Hinglish</button><button data-l="en">EN</button><button data-l="hi">हिं</button></div>';document.body.prepend(h);K.$$('.langs button',h).forEach(b=>b.onclick=()=>{K.setLang(b.dataset.l);h.querySelector('h1').firstChild.textContent=K.t(title);h.querySelector('small').textContent=K.t(sub);});};
  // Readability rule: native <select> boxes cut long option text on phones, so every select is shown as a wrapping row of chips.
  K.chipify=(sel)=>{if(sel._chips||sel.dataset.keep!=null)return;const box=K.el('div',{class:'seg chips',role:'radiogroup','aria-label':sel.getAttribute('aria-label')||'options'});sel.after(box);sel.style.display='none';sel._chips=box;let last='';
    let open=false;const render=(force)=>{const n=sel.options.length,big=n>6;const sig=[...sel.options].map(o=>o.value+'\u0001'+o.textContent).join('\u0002')+'|'+sel.value+'|'+open;if(sig===last&&!force)return;last=sig;box.innerHTML='';box.classList.toggle('big',big);
      if(big){const cur=sel.options[sel.selectedIndex];const t=K.el('button',{class:'btn on pick',type:'button','aria-expanded':open?'true':'false'});t.textContent=(open?'▴ ':'▾ ')+(cur?cur.textContent:'');t.onclick=()=>{open=!open;render(true);};box.appendChild(t);if(!open)return;}
      [...sel.options].forEach(o=>{if(big&&o.value===sel.value)return;const b=K.el('button',{class:'btn'+(o.value===sel.value?' on':''),type:'button',role:'radio','aria-checked':o.value===sel.value?'true':'false'});b.textContent=o.textContent;b.onclick=()=>{if(sel.disabled)return;sel.value=o.value;open=false;render(true);sel.dispatchEvent(new Event('change',{bubbles:true}));};box.appendChild(b);});};
    render();new MutationObserver(render).observe(sel,{childList:true,subtree:true,characterData:true});setInterval(render,250);};
  K.chipAll=()=>{K.$$('select').forEach(K.chipify);if(!K._mo){K._mo=new MutationObserver(()=>K.$$('select').forEach(K.chipify));K._mo.observe(document.body,{childList:true,subtree:true});}};
  K.boot=async(defaults)=>{let cfg=Object.assign({},defaults||{});
    const inl=document.getElementById('lesson-inline');
    try{if(inl){const L=JSON.parse(inl.textContent);if(L.play){Object.assign(cfg,L.play.config||{});K.goal=L.play.goal;}}}catch(e){}
    const lp=qs.get('lesson');if(lp){try{const L=await (await fetch(lp)).json();if(L.play&&L.play.lab===K.lab){Object.assign(cfg,L.play.config||{});K.goal=L.play.goal;}}catch(e){}}
    const c=qs.get('cfg');if(c){try{Object.assign(cfg,JSON.parse(c));}catch(e){}}
    for(const [k,v] of qs){if(!['cfg','lesson','lang'].includes(k))cfg[k]=v;}
    K.cfg=cfg;K.setLang(K.lang);setTimeout(K.chipAll,0);return cfg;};
  g.K=K;
})(window);

 {id:'json',ev:'json-rendered',name:t3('5 · APIs & JSON','5 · APIs aur JSON','5 · API और JSON'),
  task:t3('API_URL is a pretend school API that returns today’s timetable as JSON. Use fetch, turn the reply into data with .json(), add one <li> per period to #list, and show a message if loading fails (.catch).','API_URL ek pretend school API hai jo aaj ka timetable JSON mein deta hai. fetch use karo, .json() se data banao, har period ke liye #list mein ek <li> jodo, aur load fail ho to message dikhao (.catch).','API_URL एक नक़ली स्कूल API है जो आज की समय-सारणी JSON में देता है। fetch इस्तेमाल करो, .json() से डेटा बनाओ, हर पीरियड के लिए #list में एक <li> जोड़ो, और लोड विफल हो तो संदेश दिखाओ (.catch)।'),
  checks:{items:t3('All 5 periods appear as list items','Saare 5 periods list items mein','सभी 5 पीरियड सूची में'),fetch:t3('Data comes from fetch(API_URL)','Data fetch(API_URL) se aata hai','डेटा fetch(API_URL) से आता है'),errors:t3('Errors are handled with .catch or try/catch','Errors .catch ya try/catch se handle','त्रुटियाँ .catch या try/catch से सँभाली')},

<ul id="list"></ul>`,css:`body{font-family:system-ui;margin:12px}
li{padding:4px 0}`,js:`// API_URL is a pretend school API. Fetch it and show each period.
fetch(API_URL)
  .then(r => r.json())
  .then(data => {
    console.log(data);
    // TODO: add one <li> per period to #list
  });
`},
  fix:{js:`const list = document.querySelector('#list');
fetch(API_URL)
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    for (const p of data) {
      const li = document.createElement('li');
      li.textContent = p.time + ' · ' + p.subject;

    console.log('Loaded', data.length, 'periods');
  })
  .catch(err => { list.textContent = 'Could not load: ' + err.message; });`}},
 {id:'a11y',ev:'a11y-fixed',name:t3('6 · Accessibility & speed','6 · Accessibility aur speed','6 · सुलभता और गति'),
  task:t3('Make the library page work for everyone and load fast: alt text on the image, text contrast of at least 4.5 : 1, a real <button> instead of a clickable <div>, and width, height and loading="lazy" on the image.','Library page ko sabke liye kaam karne wala aur tez banao: image par alt text, text contrast kam se kam 4.5 : 1, clickable <div> ki jagah asli <button>, aur image par width, height aur loading="lazy".','पुस्तकालय पेज को सबके लिए उपयोगी और तेज़ बनाओ: चित्र पर alt पाठ, पाठ कंट्रास्ट कम से कम 4.5 : 1, क्लिक होने वाले <div> की जगह असली <button>, और चित्र पर width, height और loading="lazy"।'),
  checks:{alt:t3('Image has alt text','Image par alt text','चित्र पर alt पाठ'),contrast:t3('All text has contrast ≥ 4.5 : 1','Saare text ka contrast ≥ 4.5 : 1','सारे पाठ का कंट्रास्ट ≥ 4.5 : 1'),button:t3('Uses a real <button>, no clickable div','Asli <button>, clickable div nahi','असली <button>, क्लिक वाला div नहीं'),speed:t3('Image has width, height and loading="lazy"','Image par width, height aur loading="lazy"','चित्र पर width, height और loading="lazy"')},
  start:{html:`<h1>Library</h1>
<img src="${IMG}">
<p class="note">Books are due back in 14 days.</p>
<div class="btn" onclick="renew()">Renew book</div>`,css:`body{font-family:system-ui;margin:12px}
.note{color:#bbb}
.btn{background:#00C2B8;color:#fff;padding:10px;display:inline-block}`,js:`function renew(){ console.log('Renewed!'); }`},
  fix:{html:`<h1>Library</h1>
<img src="${IMG}" alt="Students reading in the school library" width="160" height="90" loading="lazy">
<p class="note">Books are due back in 14 days.</p>
<button id="renew" type="button">Renew book</button>`,css:`body{font-family:system-ui;margin:12px}
.note{color:#444}
button{background:#00796B;color:#fff;padding:10px;border:0;border-radius:8px;font:inherit}`,js:`document.querySelector('#renew').addEventListener('click', () => {
  console.log('Renewed for 14 more days');
});`}}];
const FILES=['html','css','js'];
// --- runs INSIDE the sandboxed preview only (never in this page) ---
const BRIDGE=`(function(){var P=function(k,m){parent.postMessage({type:'wl-log',k:k,m:String(m).slice(0,400)},'*');};
var S=function(a){return Array.prototype.map.call(a,function(x){try{return typeof x==='object'?JSON.stringify(x):String(x);}catch(e){return String(x);}}).join(' ');};
console.log=function(){P('l',S(arguments));};console.info=console.log;console.warn=function(){P('e','⚠ '+S(arguments));};console.error=function(){P('e',S(arguments));};
window.onerror=function(msg,src,line){P('e','✗ '+msg+(line?' (line '+line+')':''));return true;};
window.addEventListener('unhandledrejection',function(e){P('e','✗ '+(e.reason&&e.reason.message||e.reason));e.preventDefault();});
document.addEventListener('submit',function(e){e.preventDefault();var f=e.target,o=[];try{new FormData(f).forEach(function(v,k){o.push(k+'='+v);});}catch(x){}P('l','📨 Form submitted (demo, not sent): '+o.join(', '));},true);})();`;
const CHECKER=`(function(){var Q=function(s){return document.querySelector(s);},A=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
function rgb(c){var m=c.match(/[\\d.]+/g)||[0,0,0,0];return [+m[0],+m[1],+m[2],m[3]==null?1:+m[3]];}
function lum(c){var a=[c[0],c[1],c[2]].map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];}
function bgOf(e){for(var a=e;a;a=a.parentElement){var c=rgb(getComputedStyle(a).backgroundColor);if(c[3]>0.5)return c;}return [255,255,255,1];}
function ratio(e){var f=rgb(getComputedStyle(e).color),b=bgOf(e),l1=lum(f),l2=lum(b);return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);}
var R={
 html:function(){return {landmarks:!!(Q('header')&&Q('nav')&&Q('main')&&Q('footer')),h1:A('h1').length===1&&!!Q('h2'),alt:A('img').length>0&&A('img').every(function(i){return (i.getAttribute('alt')||'').trim().length>0;})};},
 form:function(){var f=Q('form');if(!f)return {labels:false,email:false,submit:false,valid:false};var F=A('form input:not([type=submit]):not([type=hidden]):not([type=button]), form select, form textarea');
  var labels=F.length>0&&F.every(function(i){return i.labels&&i.labels.length>0;});var email=!!Q('form input[type=email]');var submit=!!Q('form button:not([type=button]):not([type=reset]), form input[type=submit]');
  var empty=!f.checkValidity();F.forEach(function(i){if(i.tagName==='SELECT'){i.selectedIndex=Math.min(1,i.options.length-1);}else if(i.type==='email')i.value='asha@example.com';else if(i.type==='number')i.value='14';else i.value='Asha';});var full=f.checkValidity();
  return {labels:labels,email:email,submit:submit,valid:empty&&full};},
 css:function(w){var c=A('.card');var top=c.length?c[0].getBoundingClientRect().top:0;var first=c.filter(function(x){return Math.abs(x.getBoundingClientRect().top-top)<3;}).length;
  var o={overflow:document.documentElement.scrollWidth<=innerWidth+1};if(w<500)o.phone=c.length>1&&first===1;else o.tablet=first>=2;return o;},
 dom:function(){var b=Q('#like'),c=Q('#count');if(!b||!c)return {click:false};var n0=parseInt(c.textContent,10)||0;b.click();b.click();var n1=parseInt(c.textContent,10);return {click:n1===n0+2};},
 json:function(){var li=A('#list li');return {items:li.length===5&&li.some(function(x){return /Maths/.test(x.textContent);})};},
 a11y:function(){var im=A('img');var T=A('body *').filter(function(e){return Array.prototype.some.call(e.childNodes,function(n){return n.nodeType===3&&n.textContent.trim();});});
  var bad=T.filter(function(e){return ratio(e)<4.5;});
  return {alt:im.length>0&&im.every(function(i){return (i.getAttribute('alt')||'').trim().length>0;}),contrast:bad.length===0,button:!!Q('button')&&A('[onclick]').filter(function(e){return e.tagName!=='BUTTON';}).length===0,
   speed:im.length>0&&im.every(function(i){return i.getAttribute('width')&&i.getAttribute('height')&&i.getAttribute('loading')==='lazy';}),_low:bad.map(function(e){return e.tagName.toLowerCase()+' '+ratio(e).toFixed(1)+':1';}).slice(0,3)};}};
window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='wl-check')return;var res={};try{res=R[d.mission]?R[d.mission](d.w):{};}catch(x){res={_err:x.message};}parent.postMessage({type:'wl-result',id:d.id,res:res},'*');});
parent.postMessage({type:'wl-ready'},'*');})();`;
// --- parent page ---
let mi=0,file='html',code={},dev='phone',reqId=0,waiters={},readyFn=null,results={},done={};
const cur=()=>M[mi];
const scr=s=>String(s).replace(/<\/(script)/gi,'<\\/$1');
function doc(){const c=code[cur().id];return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+String(c.css).replace(/<\/style/gi,'<\\/style')+'</style><script>'+BRIDGE+'var API_URL='+JSON.stringify('data:application/json,'+encodeURIComponent(JSON.stringify(TT)))+';<\/script></head><body>'+c.html+'<script>'+scr(c.js)+'\n<\/script><script>'+CHECKER+'<\/script></body></html>';}
const fr=()=>K.$('#frame');
function size(){const pv=K.$('#pv'),f=fr(),cw=pv.clientWidth,w=dev==='tablet'?700:Math.max(280,Math.min(320,cw)),s=Math.min(1,cw/w);f.style.width=w+'px';f.style.height=Math.round(340/s)+'px';f.style.transform='scale('+s+')';f.style.left=Math.max(0,(cw-w*s)/2)+'px';}
function logLine(k,m){const L=K.$('#log');const d=K.el('div',{class:k});d.textContent=m;L.appendChild(d);while(L.children.length>40)L.firstChild.remove();L.scrollTop=L.scrollHeight;}
addEventListener('message',e=>{if(e.source!==fr().contentWindow)return;const d=e.data||{};if(d.type==='wl-log')logLine(d.k==='e'?'e':'l',d.m);else if(d.type==='wl-ready'&&readyFn){const f=readyFn;readyFn=null;f();}else if(d.type==='wl-result'&&waiters[d.id]){waiters[d.id](d.res);delete waiters[d.id];}});
function run(){return new Promise(res=>{K.$('#log').innerHTML='';readyFn=res;fr().srcdoc=doc();setTimeout(()=>{if(readyFn===res){readyFn=null;res();}},2500);K.emit('preview-run',{mission:cur().id});});}
function ask(w){return new Promise(res=>{const id=++reqId;waiters[id]=res;fr().contentWindow.postMessage({type:'wl-check',mission:cur().id,w,id},'*');setTimeout(()=>{if(waiters[id]){delete waiters[id];res({});}},2000);});}
function stat(m,c){const o={};if(m.id==='dom'){o.listener=/addEventListener\s*\(/.test(c.js)&&!/onclick\s*=/i.test(c.html);o.text=/textContent/.test(c.js)&&!/innerHTML/.test(c.js);}
 if(m.id==='json'){o.fetch=/fetch\s*\(\s*API_URL/.test(c.js);o.errors=/\.catch\s*\(|catch\s*\(/.test(c.js);}return o;}
async function check(){const m=cur(),c=code[m.id];let r={};
 if(m.id==='css'){const keep=dev;dev='phone';size();await run();await K.sleep(150);const a=await ask(320);dev='tablet';size();await run();await K.sleep(150);const b=await ask(700);r={phone:!!a.phone,tablet:!!b.tablet,overflow:!!(a.overflow&&b.overflow)};dev=keep;setDev(dev);}
 else{await run();if(m.id==='json')await new Promise(x=>setTimeout(x,500));r=await ask(dev==='tablet'?700:320);}
 Object.assign(r,stat(m,c));results[m.id]=r;const keys=Object.keys(m.checks),passed=keys.filter(k=>r[k]===true).length;drawChecks();
 K.emit('mission-checked',{mission:m.id,passed,total:keys.length});
 if(passed===keys.length){done[m.id]=1;drawTabs();K.check(m.ev,{mission:m.id});}else K.toast(K.t(t3(passed+' of '+keys.length+' checks pass — keep going',passed+'/'+keys.length+' checks pass — lage raho',keys.length+' में से '+passed+' जाँच पास — जारी रखो')));
 if(r._low&&r._low.length)logLine('e','Low contrast: '+r._low.join(', '));}
function drawChecks(){const m=cur(),r=results[m.id];K.$('#mTitle').textContent=K.t(m.name);K.$('#mTask').textContent=K.t(m.task);
 K.$('#checks').innerHTML=Object.keys(m.checks).map(k=>{const st=r?(r[k]===true?'pass':'fail'):'';return `<div class="ckl ${st}"><span class="ck">${st==='pass'?'✓':st==='fail'?'✗':''}</span><div>${K.esc(K.t(m.checks[k]))}</div></div>`;}).join('');}
function drawTabs(){K.$$('#missions button').forEach((b,i)=>{b.classList.toggle('on',i===mi);b.classList.toggle('done',!!done[M[i].id]);b.textContent=K.t(M[i].name);});
 K.$$('#files button').forEach(b=>b.classList.toggle('on',b.dataset.f===file));}
function loadFile(){K.$('#code').value=code[cur().id][file];const c=code[cur().id];K.$('#size').textContent=K.t(t3('Page size: ','Page size: ','पेज आकार: '))+(new Blob([c.html,c.css,c.js]).size)+' bytes';}
function go(id){const i=M.findIndex(m=>m.id===id);mi=i<0?0:i;if(!code[cur().id])code[cur().id]=Object.assign({},cur().start);file='html';drawTabs();drawChecks();loadFile();run();}
function setDev(d){dev=d;K.$$('#dev button').forEach(b=>b.classList.toggle('on',b.dataset.w===d));size();}
function fix(){const m=cur();Object.assign(code[m.id],m.start,code[m.id],m.fix);for(const f of FILES)if(m.fix[f]!=null)code[m.id][f]=m.fix[f];loadFile();run();K.emit('fix-shown',{mission:m.id});}
(async()=>{K.lab='web-lab';K.header(t3('Web Dev Lab','Web Dev Lab','वेब डेव लैब'),t3('Write HTML, CSS and JS — see it live','HTML, CSS aur JS likho — live dekho','HTML, CSS और JS लिखो — लाइव देखो'));
 const cfg=await K.boot({mission:'html'});
 K.$('#missions').innerHTML=M.map(m=>`<button class="btn" data-m="${m.id}"></button>`).join('');K.$$('#missions button').forEach(b=>b.onclick=()=>go(b.dataset.m));
 K.$('#files').innerHTML=FILES.map(f=>`<button class="btn" data-f="${f}">${f.toUpperCase()}</button>`).join('');K.$$('#files button').forEach(b=>b.onclick=()=>{file=b.dataset.f;drawTabs();loadFile();});
 let tm;K.$('#code').addEventListener('input',e=>{code[cur().id][file]=e.target.value;clearTimeout(tm);tm=setTimeout(()=>{loadFile();run();},700);});
 K.$('#run').onclick=run;K.$('#chk').onclick=check;K.$('#fix').onclick=fix;K.$('#reset').onclick=()=>{code[cur().id]=Object.assign({},cur().start);delete results[cur().id];drawChecks();loadFile();run();};
 K.$$('#dev button').forEach(b=>b.onclick=()=>setDev(b.dataset.w));addEventListener('resize',size);
 K.onLang(()=>{drawTabs();drawChecks();loadFile();});setDev('phone');go(cfg.mission);
 window.__w={go,fix,check,run,setDev,set:(f,v)=>{code[cur().id][f]=v;loadFile();},results:()=>results};})();
</script>
</body></html>
