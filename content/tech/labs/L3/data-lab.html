.btn:active{transform:scale(.96)}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.seg button{border-radius:99px;padding:6px 11px;min-height:34px;font-size:13px}
label.sl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);flex:1;min-width:120px}
input[type=range]{width:100%;accent-color:var(--grape)}
input[type=text],textarea,select{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px;font:inherit}

.mut{color:var(--mut)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
canvas,svg{display:block;max-width:100%;touch-action:none}

</style></head><body><script>// NCA Tech Lab L3 shared kit: language, config from ?cfg= / ?lesson= / inline, mission events, small helpers. No eval.

  K.clamp=(v,a,b)=>Math.max(a,Math.min(b,v));K.lerp=(a,b,t)=>a+(b-a)*t;K.ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

  K.renderGoal=()=>{const gEl=K.$('#goal');if(!gEl)return;const goal=K.goal||K.T.__goal;gEl.style.display=goal?'flex':'none';if(goal)gEl.innerHTML='<span>🎯</span><div><b>'+K.esc(K.t({en:'Goal',hinglish:'Goal',hi:'लक्ष्य'}))+':</b> '+K.esc(K.t(goal))+'</div>';};
  K.header=(title,sub)=>{const h=K.el('header',{class:'top'});h.innerHTML='<span class="badge">L3</span><h1>'+K.esc(K.t(title))+'<small>'+K.esc(K.t(sub))+'</small></h1><div class="langs" role="group" aria-label="Language"><button data-l="hinglish">Hinglish</button><button data-l="en">EN</button><button data-l="hi">हिं</button></div>';document.body.prepend(h);K.$$('.langs button',h).forEach(b=>b.onclick=()=>{K.setLang(b.dataset.l);h.querySelector('h1').firstChild.textContent=K.t(title);h.querySelector('small').textContent=K.t(sub);});};

    let open=false;const render=(force)=>{const n=sel.options.length,big=n>6;const sig=[...sel.options].map(o=>o.value+'\u0001'+o.textContent).join('\u0002')+'|'+sel.value+'|'+open;if(sig===last&&!force)return;last=sig;box.innerHTML='';box.classList.toggle('big',big);
      if(big){const cur=sel.options[sel.selectedIndex];const t=K.el('button',{class:'btn on pick',type:'button','aria-expanded':open?'true':'false'});t.textContent=(open?'▴ ':'▾ ')+(cur?cur.textContent:'');t.onclick=()=>{open=!open;render(true);};box.appendChild(t);if(!open)return;}
      [...sel.options].forEach(o=>{if(big&&o.value===sel.value)return;const b=K.el('button',{class:'btn'+(o.value===sel.value?' on':''),type:'button',role:'radio','aria-checked':o.value===sel.value?'true':'false'});b.textContent=o.textContent;b.onclick=()=>{if(sel.disabled)return;sel.value=o.value;open=false;render(true);sel.dispatchEvent(new Event('change',{bubbles:true}));};box.appendChild(b);});};
    render();new MutationObserver(render).observe(sel,{childList:true,subtree:true,characterData:true});setInterval(render,250);};
  K.chipAll=()=>{K.$$('select').forEach(K.chipify);if(!K._mo){K._mo=new MutationObserver(()=>K.$$('select').forEach(K.chipify));K._mo.observe(document.body,{childList:true,subtree:true});}};

    const inl=document.getElementById('lesson-inline');

<script>
const T=K.T,t3=(en,hinglish,hi)=>({en,hinglish,hi});
Object.assign(T,{addOut:t3('➕ Add an outlier','➕ Outlier jodo','➕ बाहरी मान जोड़ो'),sim:t3('Simulate chance','Chance simulate karo','संयोग का अनुकरण'),bayes:t3('Bayes: what does a positive test mean?','Bayes: positive test ka matlab kya?','बेयस: पॉज़िटिव परीक्षण का अर्थ क्या?'),prev:t3('People who have it','Jinhe sach mein hai','जिन्हें सच में है'),sens:t3('Test catches the sick (sensitivity)','Test bimaar ko pakadta hai (sensitivity)','परीक्षण बीमार को पकड़ता है (संवेदनशीलता)'),fpr:t3('False alarms in healthy people','Swasth logon mein galat alarm','स्वस्थ लोगों में ग़लत चेतावनी'),trunc:t3('Start the y-axis at 18 (the "dramatic" trick)','y-axis 18 se shuru karo ("dramatic" trick)','y-अक्ष 18 से शुरू करो ("नाटकीय" चाल)')});
const MODES={dist:t3('📊 Spread','📊 Spread','📊 फैलाव'),corr:t3('🔗 Correlation','🔗 Correlation','🔗 सहसंबंध'),prob:t3('🎲 Probability','🎲 Probability','🎲 प्रायिकता'),chart:t3('📈 Charts','📈 Charts','📈 चार्ट')};
let cfg,mode='dist';const R=K.rng(2026);const gauss=(r)=>{let u=0,v=0;while(!u)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};

// ---------- distributions (sample data, generated)
const DS={heights:{t:t3('Heights of 30 Class 10 students (cm)','30 Class 10 students ki height (cm)','कक्षा 10 के 30 छात्रों की ऊँचाई (सेमी)'),u:'cm',d:(()=>{const r=K.rng(5);return Array.from({length:30},()=>Math.round(158+7*gauss(r)));})(),out:198},
 screen:{t:t3('Daily screen time of 30 teens (hours)','30 teens ka daily screen time (ghante)','30 किशोरों का रोज़ का स्क्रीन समय (घंटे)'),u:'h',d:(()=>{const r=K.rng(9);return Array.from({length:30},()=>Math.round(Math.min(11,Math.exp(1.2+0.45*gauss(r)))*2)/2);})(),out:16},
 pocket:{t:t3('Weekly pocket money of 30 students (₹)','30 students ki weekly pocket money (₹)','30 छात्रों का साप्ताहिक जेब ख़र्च (₹)'),u:'₹',d:(()=>{const r=K.rng(13);return Array.from({length:30},()=>Math.round(Math.max(0,Math.exp(5+0.5*gauss(r)))/10)*10);})(),out:2500}};
let dk='heights',data=[],outAdded=false;
function st(a){const s=a.slice().sort((x,y)=>x-y),n=s.length,m=s.reduce((p,c)=>p+c,0)/n;const q=p=>{const i=(n-1)*p,l=Math.floor(i),h=Math.ceil(i);return s[l]+(s[h]-s[l])*(i-l);};const sd=Math.sqrt(s.reduce((p,c)=>p+(c-m)**2,0)/(n-1));const f={};let mo=s[0];s.forEach(v=>{f[v]=(f[v]||0)+1;if(f[v]>f[mo])mo=v;});return{s,n,mean:m,med:q(.5),q1:q(.25),q3:q(.75),sd,min:s[0],max:s[n-1],mode:mo};}

 let g=bins.map((c,i)=>{const h=c/mx*110;return `<rect x="${X(lo+i*bw)+1}" y="${125-h}" width="${296/nb-2}" height="${h}" rx="3" fill="url(#hg)"><animate attributeName="height" from="0" to="${h}" dur=".4s"/><animate attributeName="y" from="125" to="${125-h}" dur=".4s"/></rect>`;}).join('');

 const by=165;g+=`<line x1="${X(S.min)}" y1="${by}" x2="${X(S.max)}" y2="${by}" stroke="#9fb0d6"/><rect x="${X(S.q1)}" y="${by-10}" width="${Math.max(2,X(S.q3)-X(S.q1))}" height="20" fill="#8B3DFF55" stroke="#8B3DFF" rx="3"/><line x1="${X(S.med)}" y1="${by-10}" x2="${X(S.med)}" y2="${by+10}" stroke="#00C2B8" stroke-width="3"/>`;

let cqi=0,cpick=null,cdone={};const CT={bar:t3('Bar','Bar','बार'),line:t3('Line','Line','रेखा'),pie:t3('Pie','Pie','पाई')};const PAL=['#00C2B8','#8B3DFF','#FFD23F','#f472b6','#22C55E','#60a5fa'];
function lab(x){return typeof x==='string'?x:K.t(x);}
function drawChart(){const Q=CQ[cqi];K.$('#cq').textContent=(cqi+1)+'/'+CQ.length+' · '+K.t(Q.q);K.$('#ctypes').innerHTML=Object.keys(CT).map(k=>`<button class="btn ${cpick===k?(k===Q.best?'ok':'on'):''}" data-c="${k}">${K.esc(K.t(CT[k]))}</button>`).join('')+`<button class="btn" id="cnext">→</button>`;
 K.$$('#ctypes [data-c]').forEach(b=>b.onclick=()=>pickChart(b.dataset.c));K.$('#cnext').onclick=()=>{cqi=(cqi+1)%CQ.length;cpick=null;K.$('#trunc').checked=false;drawChart();};
 K.$('#truncWrap').style.display=Q.trunc?'':'none';const ty=cpick||'bar',d=Q.d,mx=Math.max(...d.map(x=>x[1]));let g='';
 if(ty==='bar'){const tr=Q.trunc&&K.$('#trunc').checked,base=tr?18:0,top=Q.trunc?(tr?20.5:25):mx;const bw=280/d.length;d.forEach(([l,v],i)=>{const h=(v-base)/(top-base)*150;g+=`<rect x="${32+i*bw+4}" y="${170-h}" width="${bw-8}" height="${h}" rx="4" fill="${PAL[i%6]}"><animate attributeName="height" from="0" to="${h}" dur=".4s"/><animate attributeName="y" from="170" to="${170-h}" dur=".4s"/></rect><text x="${32+i*bw+bw/2}" y="${165-h}" fill="#fff" font-size="10" text-anchor="middle">${v}</text><text x="${32+i*bw+bw/2}" y="186" fill="#9fb0d6" font-size="9.5" text-anchor="middle">${K.esc(lab(l))}</text>`;});g+=`<line x1="30" y1="170" x2="314" y2="170" stroke="#334155"/><text x="27" y="173" fill="${tr?'#f87171':'#64748b'}" font-size="10" text-anchor="end">${base}</text><text x="27" y="24" fill="#64748b" font-size="10" text-anchor="end">${fmt(top,1)}</text>`;}
 else if(ty==='line'){let p='';d.forEach(([l,v],i)=>{const x=36+i*(272/(d.length-1)),y=170-v/mx*150;p+=(i?'L':'M')+x+','+y;g+=`<circle cx="${x}" cy="${y}" r="4" fill="#FFD23F"/><text x="${x}" y="186" fill="#9fb0d6" font-size="9.5" text-anchor="middle">${K.esc(lab(l))}</text>`;});g=`<path d="${p}" fill="none" stroke="#00C2B8" stroke-width="3" stroke-linejoin="round"/>`+g+`<line x1="30" y1="170" x2="314" y2="170" stroke="#334155"/>`;}
 else{const tot=d.reduce((a,x)=>a+x[1],0);let a0=-Math.PI/2;d.forEach(([l,v],i)=>{const a1=a0+v/tot*2*Math.PI,cx=110,cy=100,r=80;const p=`M${cx},${cy}L${cx+r*Math.cos(a0)},${cy+r*Math.sin(a0)}A${r},${r} 0 ${a1-a0>Math.PI?1:0} 1 ${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)}Z`;g+=`<path d="${p}" fill="${PAL[i%6]}" stroke="#061233" stroke-width="2"/><rect x="210" y="${30+i*20}" width="10" height="10" rx="2" fill="${PAL[i%6]}"/><text x="225" y="${39+i*20}" fill="#cbd5e1" font-size="10">${K.esc(lab(l))} ${(v/tot*100).toFixed(0)}%</text>`;a0=a1;});}
 K.$('#csvg').innerHTML=g;K.$('#cprog').textContent=Object.keys(cdone).length+' / '+CQ.length+' ✓';
 K.$('#chartInfo').innerHTML=cpick?`<span class="${cpick===Q.best?'ok2':'no2'}">${cpick===Q.best?'✓':'✗'}</span> `+K.esc(K.t(cpick===Q.best?Q.why:t3('Not the best fit here — try another chart type.','Yahan best fit nahi — doosra chart type try karo.','यहाँ सबसे उपयुक्त नहीं — दूसरा चार्ट प्रकार आज़माओ।'))):K.esc(K.t(t3('Pick the chart type that answers the question best.','Woh chart type chuno jo sawaal ka sabse achha jawab de.','वह चार्ट प्रकार चुनो जो प्रश्न का सबसे अच्छा उत्तर दे।')));}
function pickChart(k){cpick=k;const Q=CQ[cqi],ok=k===Q.best;K.emit('chart-picked',{question:cqi,chart:k,correct:ok});if(ok&&!cdone[cqi]){cdone[cqi]=1;if(Object.keys(cdone).length===CQ.length)K.check('charts-all',{});}drawChart();}
// ---------- modes
function setMode(m){mode=MODES[m]?m:'dist';K.$$('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));K.$$('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+mode));if(mode==='dist')drawDist();if(mode==='corr')drawCorr();if(mode==='prob'){drawSim();drawBayes(false);}if(mode==='chart')drawChart();K.emit('mode-opened',{mode});}
function fillSel(){K.$('#dset').innerHTML=Object.keys(DS).map(k=>`<option value="${k}">${K.esc(K.t(DS[k].t))}</option>`).join('');K.$('#dset').value=dk;K.$('#cset').innerHTML=Object.keys(CS).map(k=>`<option value="${k}">${K.esc(K.t(CS[k].t))}</option>`).join('');K.$('#cset').value=ck;K.$('#sim').innerHTML=Object.keys(SIMS).map(k=>`<option value="${k}">${K.esc(K.t(SIMS[k]))}</option>`).join('');K.$('#sim').value=sim;if(CS[ck].z)K.$('#confLbl').textContent=K.t(CS[ck].z);}
(async()=>{K.lab='data-lab';K.header(t3('Data Science Lab','Data Science Lab','डेटा विज्ञान लैब'),t3('Spread, correlation, chance and honest charts','Spread, correlation, chance aur imaandaar charts','फैलाव, सहसंबंध, संयोग और ईमानदार चार्ट'));
 cfg=await K.boot({mode:'dist',dataset:'heights',corr:'study',sim:'coin',question:0,prevalence:1});
 K.$('#modes').innerHTML=Object.keys(MODES).map(k=>`<button class="btn" data-m="${k}">${K.esc(K.t(MODES[k]))}</button>`).join('');K.$$('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
 dk=DS[cfg.dataset]?cfg.dataset:'heights';ck=CS[cfg.corr]?cfg.corr:'study';sim=SIMS[cfg.sim]?cfg.sim:'coin';cqi=K.clamp(+cfg.question||0,0,CQ.length-1);fillSel();
 K.$('#dset').onchange=e=>loadDS(e.target.value);K.$('#outl').onclick=addOutlier;K.$('#reset').onclick=()=>loadDS(dk);
 K.$('#cset').onchange=e=>loadCS(e.target.value);K.$('#conf').onchange=()=>{drawCorr();if(K.$('#conf').checked&&!confSeen[ck]){confSeen[ck]=1;K.check('confounder-revealed',{dataset:ck});}};
 K.$('#sim').onchange=e=>{sim=e.target.value;drawSim();};K.$('#s10').onclick=()=>runSim(10);K.$('#s100').onclick=()=>runSim(100);K.$('#s1000').onclick=()=>runSim(1000);K.$('#sClr').onclick=()=>{flips=[];heads=0;dice=Array(13).fill(0);dn=0;drawSim();};
 K.$('#pv').value=String(K.clamp(Math.round(+cfg.prevalence*10),1,200));['#pv','#sn','#fp'].forEach(s=>K.$(s).oninput=()=>drawBayes(true));K.$('#trunc').onchange=()=>{drawChart();if(K.$('#trunc').checked)K.check('misleading-spotted',{});};
 loadDS(dk);loadCS(ck);setMode(cfg.mode);
 K.onLang(()=>{K.$$('#modes button').forEach(b=>b.textContent=K.t(MODES[b.dataset.m]));fillSel();setMode(mode);});
 window.__d={addOutlier,loadCS,runSim,pickChart,bayes:(p,s,f)=>{K.$('#pv').value=p;K.$('#sn').value=s;K.$('#fp').value=f;drawBayes(true);},conf:()=>{const c=K.$('#conf');c.checked=true;c.onchange();},q:i=>{cqi=i;cpick=null;drawChart();}};})();
</script>
</body></html>
