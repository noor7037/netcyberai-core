<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1D4ED8">
<title>Meet the computer's body · Tech & AI Lab</title>
<!-- Lab: computer-body (Level 1). Own work, MIT. Modes: find-computers | name-parts | io-sort | brain-desk-bag | phone-teardown -->
<style>/* L1 lab kit (own work, MIT). Family App palette from src/lib/design-tokens.ts */
:root{--royal:#1D4ED8;--sapphire:#002357;--grape:#8B3DFF;--violet:#4400F0;--tangerine:#FF7A1A;--coral:#FF6B57;--gold:#F5B90A;--turq:#14B8A6;--emerald:#0F766E;--cyan:#02CFF9;--slate:#1E293B;--off:#F9FAFB;--ink2:#475569;--r:18px;--sh:0 6px 18px rgba(30,41,59,.12),0 1px 3px rgba(30,41,59,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--off);color:var(--slate);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overscroll-behavior:none}
body{background:transparent;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.kbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(120deg,var(--sapphire),var(--royal) 60%,var(--grape));color:#fff;box-shadow:0 2px 10px rgba(0,35,87,.25)}
.kbar{flex-wrap:wrap;row-gap:6px}
.kbar h1{flex:1 1 9em;min-width:0;margin:0;font-size:16px;line-height:1.2;font-weight:800;letter-spacing:.2px;overflow-wrap:break-word}/* title never cut: controls move to a 2nd row when needed */
.kctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.kbar .kemo{font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.kpill{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.kpill button{padding:5px 9px;border-radius:999px;font-size:12.5px;font-weight:700;color:#e0e7ff;min-height:32px}
.kpill button[aria-pressed=true]{background:#fff;color:var(--royal)}
.kstars{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;font-weight:800;font-size:14px;min-width:54px;justify-content:center}
.kstars.bump{animation:kbump .5s}
@keyframes kbump{40%{transform:scale(1.35)}}
.kgoal{margin:10px 12px 0;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.kgoal b{color:var(--royal)}
.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:800;background:var(--royal);color:#fff;box-shadow:0 4px 0 #1239a8,var(--sh);transition:transform .08s}
.kbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1239a8}
.kbtn.alt{background:#fff;color:var(--royal);box-shadow:0 4px 0 #c7d2fe,var(--sh)}
.kbtn.go{background:var(--turq);box-shadow:0 4px 0 #0d8a7c,var(--sh)}
.kbtn.warn{background:var(--tangerine);box-shadow:0 4px 0 #c75a0c,var(--sh)}
.kbtn[disabled]{opacity:.45;pointer-events:none}
.ktoast{pointer-events:none;position:fixed;left:0;top:0;width:max-content;z-index:60;max-width:min(92vw,360px);padding:12px 16px;border-radius:16px;background:var(--slate);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center;line-height:1.35;font-size:15px;opacity:0;visibility:hidden;transform:scale(.9);transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1),visibility 0s .3s}
.ktoast.show{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1)}
.ktoast.inline{position:static;display:block;width:auto;max-width:none;margin:10px 12px;grid-column:1/-1;flex:0 0 auto}
.ktoast.good{background:var(--emerald)}.ktoast.bad{background:#b4321f}
#kconf{position:fixed;inset:0;pointer-events:none;z-index:-1}/* behind content; inside the win dialog it sits behind the card */
.kwin #kconf{position:absolute;z-index:0}.kwin>div{position:relative;z-index:1}
.kwin{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:rgba(6,18,51,.55);backdrop-filter:blur(3px);padding:20px}
.kwin.show{display:flex}
.kwin>div{background:#fff;border-radius:24px;padding:22px;text-align:center;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:kpop .5s cubic-bezier(.2,1.5,.4,1)}
.kwin .big{font-size:64px;line-height:1;animation:kspin 1.2s ease-out}
.kwin h2{margin:10px 0 6px;font-size:22px}
.kwin p{margin:0 0 14px;color:var(--ink2)}
@keyframes kpop{from{transform:scale(.6);opacity:0}}
@keyframes kspin{from{transform:rotateY(-540deg) scale(.4)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.kvoice{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);font-size:17px;opacity:.6}
.kvoice[aria-pressed=true]{background:#fff;opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
</style>
<style>
main{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 12px 16px}
.modes{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px;}
.modes button{flex:0 1 auto;max-width:100%;white-space:normal;text-align:center;padding:7px 12px;border-radius:999px;background:#fff;box-shadow:var(--sh);font-weight:700;font-size:13px;min-height:36px}
.modes button[aria-pressed=true]{background:var(--slate);color:#fff}
.stage{position:relative;height:min(46vh,360px);min-height:250px;border-radius:24px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#dbeafe,#eef2ff 45%,#e0e7ff);box-shadow:inset 0 -30px 60px rgba(29,78,216,.10),var(--sh);perspective:900px;touch-action:pan-y}
.stage.small{height:min(30vh,240px);min-height:170px}
.stage .floor{position:absolute;left:-20%;right:-20%;bottom:-40%;height:70%;background:repeating-linear-gradient(90deg,rgba(29,78,216,.08) 0 2px,transparent 2px 40px),repeating-linear-gradient(0deg,rgba(29,78,216,.08) 0 2px,transparent 2px 40px);transform:rotateX(70deg);transform-origin:top}
.hint3d{position:absolute;right:10px;top:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.8);padding:4px 9px;border-radius:999px;color:var(--royal)}
.world{position:absolute;left:50%;top:54%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(var(--ry,-18deg));will-change:transform}
.part{position:absolute;transform-style:preserve-3d}
.box3d{position:absolute;transform-style:preserve-3d}
.face{position:absolute;backface-visibility:hidden;border-radius:4px}
.part.glow .face{box-shadow:0 0 0 3px var(--gold) inset,0 0 18px var(--gold)}
.part.done .face.front{box-shadow:0 0 0 3px var(--turq) inset}
.tag3d{position:absolute;white-space:nowrap;padding:4px 10px;border-radius:999px;background:var(--turq);color:#fff;font-weight:800;font-size:13px;transform:translate(-50%,-100%);animation:kpop .4s;box-shadow:var(--sh)}
.screen{background:linear-gradient(160deg,#0b1a3a,#1D4ED8);display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;overflow:hidden}
.screen .face-ico{transition:transform .4s}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.chip{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #cbd5e1,var(--sh);font-weight:800;font-size:15px;min-height:46px;user-select:none;-webkit-user-select:none}
.chip .e{font-size:22px}
.chip.used{visibility:hidden}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bins.five{grid-template-columns:repeat(3,1fr)}
.bin{border:3px dashed #c7d2fe;border-radius:18px;padding:8px;min-height:84px;background:#fff;text-align:center;transition:transform .15s,background .15s}
.bin h3{margin:0 0 4px;font-size:14px}
.bin.hot{transform:scale(1.04);background:#eef2ff;border-color:var(--royal)}
.bin .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:22px}
.bin.in h3{color:var(--royal)}.bin.out h3{color:var(--tangerine)}.bin.pr h3{color:var(--grape)}.bin.st h3{color:var(--emerald)}.bin.pw h3{color:#b45309}
.room{position:absolute;inset:0}
.obj{position:absolute;transform:translate(-50%,-50%);font-size:clamp(34px,10vw,52px);line-height:1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18));transition:transform .2s;padding:6px}
.obj.yes{animation:kpop .4s;filter:drop-shadow(0 0 10px var(--gold))}
.obj.yes::after{content:"✓";position:absolute;right:-4px;top:-4px;font-size:16px;background:var(--turq);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.obj.no{animation:shake .45s}
@keyframes shake{25%{transform:translate(-56%,-50%) rotate(-6deg)}75%{transform:translate(-44%,-50%) rotate(6deg)}}
.flow{position:absolute;font-size:18px;pointer-events:none;z-index:5}
.bdb{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;height:100%;padding:10px;align-items:stretch}
.zone{border-radius:18px;background:rgba(255,255,255,.85);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;box-shadow:var(--sh)}
.zone h3{margin:0;font-size:13px;text-align:center}
.zone .big{font-size:40px;line-height:1}
.slots{display:flex;flex-direction:column;gap:5px;width:100%}
.slot{min-height:34px;border:2px dashed #cbd5e1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;gap:4px}
.slot.fill{border-style:solid;border-color:var(--royal);background:#eef2ff}
.app{padding:6px 8px;border-radius:10px;background:#fff;box-shadow:0 2px 0 #cbd5e1;font-weight:800;font-size:13px;display:flex;gap:4px;align-items:center;min-height:36px;user-select:none}
.cpu.busy .big{animation:kbump .35s infinite}
.mini{width:100%;aspect-ratio:4/3;background:#fff;border-radius:10px;border:2px solid #e2e8f0}
.dark{position:absolute;inset:0;background:#020617;opacity:0;pointer-events:none;transition:opacity .4s;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;z-index:8}
.dark.on{opacity:.92}
.stage:has(>.dark.on)>:not(.dark){visibility:hidden}/* lights out: the room is hidden, not covered */
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.count{font-weight:900;color:#b4321f}
.why{font-size:14px;background:#fff7ed;border-left:4px solid var(--tangerine);padding:8px 10px;border-radius:10px}

  const devs = K.shuffle([['⌨️', 'in', ['Keyboard', 'कीबोर्ड', 'Keyboard']], ['🖱️', 'in', ['Mouse', 'माउस', 'Mouse']], ['🎤', 'in', ['Microphone', 'माइक्रोफ़ोन', 'Microphone']], ['📷', 'in', ['Camera', 'कैमरा', 'Camera']], ['🕹️', 'in', ['Joystick', 'जॉयस्टिक', 'Joystick']], ['🖨️', 'out', ['Printer', 'प्रिंटर', 'Printer']], ['🔊', 'out', ['Speaker', 'स्पीकर', 'Speaker']], ['🎧', 'out', ['Headphones', 'हेडफ़ोन', 'Headphones']], ['📽️', 'out', ['Projector', 'प्रोजेक्टर', 'Projector']], ['📱', 'both', ['Touchscreen', 'टचस्क्रीन', 'Touchscreen']]]);

  const tray = el('div', { class: 'tray' }); ui.append(bins, tray); let done = 0;
  K._hover = (x, y) => $$('.bin', bins).forEach((b) => b.classList.toggle('hot', x > 0 && K.hit(b, x, y)));
  devs.forEach(([e, kind, label]) => { const c = chip(e, label, kind); tray.append(c); K.draggable(c, (node, x, y) => { const b = $$('.bin', bins).find((b) => K.hit(b, x, y)); if (!b) return false; const bk = b.dataset.b;
    if (kind !== 'both' && kind !== bk) { K.toast(kind === 'in' ? [`${label[0]} sends information INTO the computer.`, `${label[1]} जानकारी कंप्यूटर के अंदर भेजता है।`, `${label[2]} jaankari computer ke ANDAR bhejta hai.`] : [`${label[0]} brings the result OUT to us.`, `${label[1]} परिणाम बाहर लाता है।`, `${label[2]} result BAHAR laata hai.`], 'bad', 2600); K.sfx('bad'); return false; }
    c.classList.add('used'); c.dataset.locked = 1; done++; b.querySelector('.got').append(el('span', { title: t(label) }, e)); K.star(); K.sfx('good');
    const scr = $('#scr'); if (scr) flyTo(bk === 'in' ? b : scr, bk === 'in' ? scr : b, bk === 'in' ? '🔵' : '🟠');
    if (kind === 'both') K.toast(['Touchscreen is BOTH: it feels your touch and shows pictures!', 'टचस्क्रीन दोनों है: स्पर्श महसूस करती है और तस्वीर दिखाती है!', 'Touchscreen DONO hai: touch feel karti hai aur picture dikhati hai!'], 'good', 3000);

    return true; }); });
}

function bdbMode() {
  room.style.background = 'none';
  room.innerHTML = `<div class="bdb"><div class="zone st" id="bag"><h3>🎒 ${t(['Storage (bag)', 'स्टोरेज (बैग)', 'Storage (bag)'])}</h3><div class="slots" id="bagS"></div></div><div class="zone" id="desk"><h3>🪑 ${t(['RAM (desk)', 'RAM (मेज़)', 'RAM (desk)'])}</h3><div class="slots" id="deskS"><div class="slot">—</div><div class="slot">—</div></div><canvas class="mini" id="mini" width="160" height="120"></canvas></div><div class="zone cpu" id="cpu"><h3>🧠 CPU</h3><div class="big">🧠</div><small id="cpuS">${t(['waiting…', 'इंतज़ार…', 'wait kar raha…'])}</small></div></div>`;
  const apps = [['🎨', 'draw', ['Drawing app', 'ड्रॉइंग ऐप', 'Drawing app']], ['🎮', 'game', ['Game', 'गेम', 'Game']], ['🎵', 'music', ['Music', 'संगीत', 'Music']]];
  const bagS = $('#bagS'), deskS = $('#deskS'), mini = $('#mini').getContext('2d'); let onDesk = [], strokes = 0, saved = false, phase = 1;
  const ctrl = el('div', { class: 'ctrl' }); const why = el('div', { class: 'why' }); ui.append(why, ctrl);
  const say = (m) => why.textContent = t(m);
  say(['Step 1: drag the 🎨 Drawing app from the bag onto the RAM desk.', 'कदम 1: 🎨 ड्रॉइंग ऐप को बैग से RAM मेज़ पर खींचो।', 'Step 1: 🎨 Drawing app ko bag se RAM desk par drag karo.']);
  function renderDesk() { $$('.slot', deskS).forEach((s, i) => { const a = onDesk[i]; s.className = 'slot' + (a ? ' fill' : ''); s.textContent = a ? `${a[0]} ${t(a[2])}` : '—'; }); }
  apps.forEach((a) => { const c = el('div', { class: 'app' }, `${a[0]} ${t(a[2])}`); bagS.append(c); K.draggable(c, (n, x, y) => { if (!K.hit($('#desk'), x, y)) return false; if (onDesk.find((o) => o[1] === a[1])) return false;
    if (onDesk.length >= 2) { K.toast(['The desk is full! Small RAM = fewer apps at once. Tap an app on the desk to close it.', 'मेज़ भर गई! कम RAM = एक साथ कम ऐप। बंद करने के लिए मेज़ पर ऐप टैप करो।', 'Desk bhar gaya! Kam RAM = ek saath kam apps. Band karne ke liye desk par app tap karo.'], 'bad', 3200); K.sfx('bad'); return false; }
    onDesk.push(a); renderDesk(); K.sfx('good'); flyTo(c, $('#desk'), a[0]);
    if (a[1] === 'draw' && phase === 1) { phase = 2; K.star(); say(['Step 2: the app is on the desk (RAM). Tap "CPU, draw!" 3 times.', 'कदम 2: ऐप मेज़ (RAM) पर है। "CPU, ड्रॉ करो!" 3 बार दबाओ।', 'Step 2: app desk (RAM) par hai. "CPU, draw karo!" 3 baar dabao.']); drawBtn.disabled = false; }
    return false; }); });
  deskS.addEventListener('click', (e) => { const s = e.target.closest('.slot'); if (!s) return; const i = $$('.slot', deskS).indexOf(s); if (onDesk[i] && !(onDesk[i][1] === 'draw' && phase > 1 && phase < 5)) { onDesk.splice(i, 1); renderDesk(); K.sfx('tap'); } });
  const drawBtn = el('button', { class: 'kbtn', disabled: '' }, '🧠 ' + t(['CPU, draw!', 'CPU, ड्रॉ करो!', 'CPU, draw karo!']));
  const saveBtn = el('button', { class: 'kbtn go', disabled: '' }, '💾 ' + t(['Save', 'सेव', 'Save']));
  ctrl.append(drawBtn, saveBtn);
  const cols = ['#FF7A1A', '#1D4ED8', '#14B8A6'];
  drawBtn.onclick = () => { if (phase !== 2) return; $('#cpu').classList.add('busy'); $('#cpuS').textContent = t(['working…', 'काम कर रहा…', 'kaam kar raha…']); K.sfx('move');
    setTimeout(() => { $('#cpu').classList.remove('busy'); $('#cpuS').textContent = t(['done ✓', 'हो गया ✓', 'ho gaya ✓']); }, 500);
    mini.strokeStyle = cols[strokes]; mini.lineWidth = 6; mini.lineCap = 'round'; mini.beginPath(); if (strokes === 0) { mini.arc(80, 60, 30, 0, Math.PI * 2); } else if (strokes === 1) { mini.moveTo(20, 100); mini.lineTo(140, 100); } else { mini.moveTo(80, 10); mini.lineTo(80, 28); mini.moveTo(30, 30); mini.lineTo(44, 42); mini.moveTo(130, 30); mini.lineTo(116, 42); } mini.stroke();
    if (++strokes === 3) { phase = 3; drawBtn.disabled = true; saveBtn.disabled = false; K.star(); let n = 8; say(['⚠️ Power cut coming! The drawing is only on the desk (RAM). Press Save to put it in the bag (storage)!', '⚠️ बिजली जाने वाली है! ड्रॉइंग सिर्फ़ मेज़ (RAM) पर है। बैग (स्टोरेज) में रखने के लिए Save दबाओ!', '⚠️ Power cut aane wala hai! Drawing sirf desk (RAM) par hai. Bag (storage) mein rakhne ke liye Save dabao!']);
      const cnt = el('span', { class: 'count' }, ` ${n}s`); why.append(cnt); K._iv = setInterval(() => { n--; cnt.textContent = ` ${n}s`; if (n <= 0) { clearInterval(K._iv); powerCut(); } }, 1000); } };
  saveBtn.onclick = () => { if (phase !== 3 || saved) return; saved = true; saveBtn.disabled = true; K.star(); K.sfx('good'); const f = el('div', { class: 'app', style: 'border:2px solid var(--emerald)' }, '🖼️ my-drawing.png'); flyTo($('#desk'), $('#bag'), '🖼️'); setTimeout(() => bagS.append(f), 600); K.toast(['Saved! Copied from RAM to storage.', 'सेव हो गया! RAM से स्टोरेज में कॉपी।', 'Save ho gaya! RAM se storage mein copy.'], 'good'); };
  function powerCut() { phase = 4; const d = $('#dark'); d.textContent = '🔌 ' + t(['Power cut!', 'बिजली गई!', 'Power cut!']); d.classList.add('on'); K.sfx('bad');
    setTimeout(() => { d.classList.remove('on'); onDesk = []; renderDesk(); mini.clearRect(0, 0, 160, 120); $('#cpuS').textContent = t(['restarted', 'फिर से चालू', 'restart hua']);

      else { say(['Oh no! The drawing was only in RAM, so it is gone. Try again and press Save in time.', 'अरे! ड्रॉइंग सिर्फ़ RAM में थी, इसलिए चली गई। फिर कोशिश करो और समय पर Save दबाओ।', 'Arre! Drawing sirf RAM mein thi, isliye chali gayi. Phir try karo aur time par Save dabao.']); ctrl.innerHTML = ''; const r = el('button', { class: 'kbtn warn' }, '↻ ' + t(['Try again', 'फिर कोशिश', 'Phir try karo'])); r.onclick = start; ctrl.append(r); } }, 1300); }
}

function phoneMode() {

  const ph = part('phone', 0, -20 * S, 0, box(W, H, D, { front: '#0f172a', side: '#334155', back: '#1e293b' }, { front: `<div class="screen" style="position:absolute;inset:4%;border-radius:12px;font-size:28px">📱</div>`, back: '' }));
  world.append(ph);
  const back = el('div', { class: 'face', style: `width:${W}px;height:${H}px;left:${-W / 2}px;top:${-H / 2 - 20 * S}px;transform-origin:left center;transform:translateZ(${-D / 2 - 1}px) rotateY(180deg);background:linear-gradient(150deg,#6d28d9,#1D4ED8);transition:transform 1s cubic-bezier(.5,0,.2,1);backface-visibility:visible;border-radius:14px` }, '<div style="position:absolute;left:10%;top:5%;width:30%;height:15%;border-radius:10px;background:#0f172a;box-shadow:0 0 0 2px #94a3b8"></div>');
  world.append(back);
  const inner = el('div', { class: 'face', style: `width:${W * .9}px;height:${H * .92}px;left:${-W * .45}px;top:${-H * .46 - 20 * S}px;transform:translateZ(${-D / 2}px) rotateY(180deg);background:#064e3b;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;font-size:${20 * S}px;backface-visibility:hidden;border-radius:10px` });
  world.append(inner);
  const parts = [['📷', 'in', ['Camera', 'कैमरा', 'Camera']], ['🎤', 'in', ['Microphone', 'माइक्रोफ़ोन', 'Microphone']], ['👆', 'in', ['Fingerprint sensor', 'फ़िंगरप्रिंट सेंसर', 'Fingerprint sensor']], ['🧭', 'in', ['GPS', 'GPS', 'GPS']], ['🧠', 'pr', ['Chip with CPU', 'CPU वाली चिप', 'CPU wali chip']], ['💾', 'st', ['Storage chip', 'स्टोरेज चिप', 'Storage chip']], ['🔊', 'out', ['Speaker', 'स्पीकर', 'Speaker']], ['📳', 'out', ['Vibration motor', 'वाइब्रेशन मोटर', 'Vibration motor']], ['🔋', 'pw', ['Battery', 'बैटरी', 'Battery']], ['📶', 'both', ['Antenna (Wi-Fi, mobile)', 'एंटीना (Wi-Fi, मोबाइल)', 'Antenna (Wi-Fi, mobile)']]];
  parts.forEach((p) => inner.append(el('div', { style: 'display:grid;place-items:center;background:rgba(255,255,255,.08);border-radius:6px' }, p[0])));
  const ctrl = el('div', { class: 'ctrl' }); const open = el('button', { class: 'kbtn' }, '🪛 ' + t(['Open the back', 'पीछे का ढक्कन खोलो', 'Peeche ka cover kholo'])); ctrl.append(open); ui.append(ctrl);
  open.onclick = () => { idle = false; ry = 180; world.style.transition = 'transform 1s'; world.style.setProperty('--ry', '160deg'); setTimeout(() => { world.style.transition = ''; back.style.transform = `translateZ(${-D / 2 - 1}px) rotateY(180deg) rotateY(-110deg)`; }, 900); ctrl.remove(); K.sfx('good'); setTimeout(() => { stage.classList.add('small'); sorter(); }, 1700); };
  function sorter() {
    const bins = el('div', { class: 'bins five' }, [['in', '⬅ Input'], ['pr', '🧠 Process'], ['out', 'Output ➡'], ['st', '💾 Storage'], ['pw', '🔋 Power']].map(([k, n]) => `<div class="bin ${k}" data-b="${k}"><h3>${n}</h3><div class="got"></div></div>`).join(''));
    const tray = el('div', { class: 'tray' }); const why = el('div', { class: 'why' }, t(['Drag each part into its group.', 'हर हिस्से को उसके समूह में खींचो।', 'Har part ko uske group mein drag karo.'])); ui.append(bins, tray, why); let n = 0;
    K._hover = (x, y) => $$('.bin', bins).forEach((b) => b.classList.toggle('hot', x > 0 && K.hit(b, x, y)));
    const WHY = { in: ['takes information in', 'जानकारी अंदर लेता है', 'jaankari andar leta hai'], pr: ['does the thinking (processing)', 'सोचने का काम (प्रोसेसिंग) करता है', 'sochne ka kaam (processing) karta hai'], out: ['gives something out to you', 'तुम्हें कुछ बाहर देता है', 'tumhe kuch bahar deta hai'], st: ['keeps photos and apps when off', 'बंद होने पर भी फ़ोटो और ऐप रखता है', 'band hone par bhi photos aur apps rakhta hai'], pw: ['stores energy to run everything', 'सब चलाने के लिए ऊर्जा रखती है', 'sab chalane ke liye energy rakhti hai'] };
    K.shuffle(parts).forEach(([e, k, label]) => { const c = chip(e, label, k); tray.append(c); K.draggable(c, (node, x, y) => { const b = $$('.bin', bins).find((b) => K.hit(b, x, y)); if (!b) return false; const bk = b.dataset.b; const ok = k === bk || (k === 'both' && (bk === 'in' || bk === 'out'));

      c.classList.add('used'); c.dataset.locked = 1; n++; b.querySelector('.got').append(el('span', {}, e)); K.star(); K.sfx('good');
      why.textContent = k === 'both' ? t(['The antenna both receives (input) and sends (output) radio signals.', 'एंटीना रेडियो सिग्नल लेता (इनपुट) और भेजता (आउटपुट) दोनों है।', 'Antenna radio signal leta (input) aur bhejta (output) dono hai.']) : `${t(label)}: ${t(WHY[k])}.`;
      if (n === parts.length) { K.done('computer-body', mode, { sorted: n }); K.win(['Phone engineer!', 'फ़ोन इंजीनियर!', 'Phone engineer!'], ['A phone has input, processing, output, storage and power — a full computer in your pocket.', 'फ़ोन में इनपुट, प्रोसेसिंग, आउटपुट, स्टोरेज और पावर है — जेब में पूरा कंप्यूटर।', 'Phone mein input, processing, output, storage aur power hai — jeb mein poora computer.'], null, '🔧', start); }
      return true; }); });
  }
}
requestAnimationFrame(loop); start();
})();
