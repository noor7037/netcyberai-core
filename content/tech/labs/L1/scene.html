"hi":"एक कतार में दो 1.5 V सेल 3 V का धक्का देते हैं — दो बल्बों को तेज़ चमकाने के लिए काफ़ी।"}},"L1.electricity.05.s3":{"dsl":"bg:#7F1D1D | 🔋@30,50,24:shake | ➖@60,30,14 | ➖@60,70,14 | 🔥@30,25,14:blink+0.4 | ⚠️@80,50,18:pulse",
"cap":{"en":"No bulb, just wire: short circuit! Hot!",
"hi":"बल्ब नहीं, बस तार: शॉर्ट सर्किट! गर्म!",
"hinglish":"Bulb nahin, bas taar: short circuit! Garam!"},"narr":{"en":"Joining a cell's ends with only a wire lets a huge current rush round. The cell and wire get hot. At home, a short circuit can start a fire — that is why we have fuses and MCBs.",
"hinglish":"Cell ke dono sire sirf taar se jodne par bahut bada current daudta hai. Cell aur taar garam ho jaate hain. Ghar mein short circuit se aag lag sakti hai — isiliye fuse aur MCB hote hain.",
"hi":"सेल के दोनों सिरे सिर्फ़ तार से जोड़ने पर बहुत बड़ा करंट दौड़ता है। सेल और तार गर्म हो जाते हैं। घर में शॉर्ट सर्किट से आग लग सकती है — इसीलिए फ़्यूज़ और MCB होते हैं।"}},"L1.electricity.06.s1":{"dsl":"bg:#FEF9C3 | 🚪@20,50,18 \"leaving\" | 💡@50,35,18:blink | 🌀@75,35,18:spin | 👆@50,68,14:bob \"switch off\"",
"cap":{"en":"Leaving the room? Switch off.",
"hi":"कमरे से जा रहे हो? बंद करो।",
"hinglish":"Kamre se ja rahe ho? Band karo."},"narr":{"en":"When you leave a room, switch off the lights and the fan.",
"hinglish":"Jab kamre se jao, toh light aur pankha band kar do.",
"hi":"जब कमरे से जाओ, तो बत्ती और पंखा बंद कर दो।"}},"L1.electricity.06.s2":{"dsl":"bg:#ECFDF5 | 💡@30,45,22:pulse \"LED\" | 🔥@70,45,20 \"old bulb\"",
"cap":{"en":"LED bulbs use much less power.",
"hi":"LED बल्ब बहुत कम बिजली लेते हैं।",
"hinglish":"LED bulbs bahut kam bijli lete hain."},"narr":{"en":"An LED bulb gives the same light as an old bulb but uses far less electricity.",
"hinglish":"LED bulb purane bulb jitni roshni deta hai par bahut kam bijli leta hai.",
"hi":"LED बल्ब पुराने बल्ब जितनी रोशनी देता है पर बहुत कम बिजली लेता है।"}},"L1.electricity.06.s3":{"dsl":"bg:#EFF6FF | ⭐@30,45,14:pop | ⭐@42,45,14:pop+0.1 | ⭐@54,45,14:pop+0.2 | ⭐@66,45,14:pop+0.3 | ⭐@78,45,14:pop+0.4",
"cap":{"en":"More stars on the label = less power.",
"hi":"लेबल पर ज़्यादा स्टार = कम बिजली।",
"hinglish":"Label par zyaada stars = kam bijli."},"narr":{"en":"Fridges, ACs and fans in India carry a star label. 5 stars saves the most power.",
"hinglish":"India mein fridge, AC aur pankhon par star label hota hai. 5 star sabse zyaada bijli bachaata hai.",
"hi":"भारत में फ़्रिज, AC और पंखों पर स्टार लेबल होता है। 5 स्टार सबसे ज़्यादा बिजली बचाता है।"}},"L1.electricity.06.s4":{"dsl":"bg:#E0F2FE | 🏭@25,45,20 \"power station\" | 💨@25,20,14:float | 🌍@72,45,24:spin",
"cap":{"en":"Saving power helps the Earth.",
"hi":"बिजली बचाने से धरती की मदद होती है।",
"hinglish":"Bijli bachaane se dharti ki madad hoti hai."},"narr":{"en":"Much of our electricity is made by burning coal, which makes smoke. Using less means less smoke.",
"hinglish":"Hamari bahut si bijli koyla jala kar banti hai, jisse dhuaan hota hai. Kam bijli matlab kam dhuaan.",
"hi":"हमारी बहुत सी बिजली कोयला जलाकर बनती है, जिससे धुआँ होता है। कम बिजली मतलब कम धुआँ।"}},"L1.friendly-ai.01.s1":{"dsl":"bg:#EDE9FE | 🧒@25,50,26:bob | 🍎@50,30,14:pop+0.3 | 🍌@58,50,14:pop+0.5 | 🥭@50,70,14:pop+0.7 | 💻@80,50,24:pulse+1",
"cap":{"en":"We show the computer many examples.",
"hi":"हम कंप्यूटर को कई उदाहरण दिखाते हैं।",
"hinglish":"Hum computer ko kai examples dikhaate hain."},"narr":{"en":"We show the computer lots of pictures: this is an apple, this is a banana, this is a mango.",
"hinglish":"Hum computer ko bahut saari pictures dikhaate hain: yeh seb hai, yeh kela hai, yeh aam hai.",
"hi":"हम कंप्यूटर को बहुत सारे चित्र दिखाते हैं: यह सेब है, यह केला है, यह आम है।"}},"L1.friendly-ai.01.s2":{"dsl":"bg:#DCFCE7 | 💻@30,50,24 | 🍊@60,50,22:pop+0.3 | 💡@78,28,16:pulse+0.8 \"Fruit!\"",
"cap":{"en":"Then it guesses new ones by itself.",
"hi":"फिर वह नए चित्र ख़ुद पहचानता है।",
"hinglish":"Phir woh nayi pictures khud pehchaanta hai."},"narr":{"en":"Then we show a new picture. The computer guesses: \"Fruit!\" That is AI — a computer that learns.",
"hinglish":"Phir hum nayi picture dikhaate hain. Computer guess karta hai: \"Fruit!\" Yahi AI hai — seekhne wala computer.",
"hi":"फिर हम नया चित्र दिखाते हैं। कंप्यूटर अंदाज़ा लगाता है: \"फल!\" यही AI है — सीखने वाला कंप्यूटर।"}},"L1.friendly-ai.01.s3":{"dsl":"bg:#FEF3C7 | 🗣️@20,45,18:pop \"Voice helper\" | 🗺️@50,45,18:pop+0.3 \"Maps\" | 📷@80,45,18:pop+0.6 \"Photos\"",
"cap":{"en":"AI helpers are all around us.",
"hi":"AI सहायक हमारे चारों ओर हैं।",
"hinglish":"AI helpers hamare chaaron taraf hain."},"narr":{"en":"Voice helpers that answer questions, maps that find the fastest road, and cameras that find faces all use AI.",
"hinglish":"Sawaal ka jawab dene wale voice helper, sabse tez raasta dhoondhne wale maps, aur chehre dhoondhne wale camera — sab AI use karte hain.",
"hi":"सवालों का जवाब देने वाले वॉइस सहायक, सबसे तेज़ रास्ता ढूँढने वाले मैप्स, और चेहरे ढूँढने वाले कैमरे — सब AI इस्तेमाल करते हैं।"}},"L1.friendly-ai.02.s1":{"dsl":"bg:#FFF7ED | 🐯@30,50,30:pop | 🔍@55,45,16:pulse+0.4 | 🟧@75,35,10:pop+0.8 | 🟫@85,35,10:pop+0.9 | ⬛@75,55,10:pop+1 | 🟧@85,55,10:pop+1.1",
"cap":{"en":"Zoom in: a picture is tiny squares!",
"hi":"ज़ूम करो: चित्र छोटे-छोटे वर्ग हैं!",
"hinglish":"Zoom karo: picture chhote-chhote squares hai!"},"narr":{"en":"Zoom into any photo on a screen and you will see tiny squares called pixels. A phone photo can have more than 10 million of them.",
"hinglish":"Screen par kisi bhi photo mein zoom karo, chhote squares dikhenge — inhe pixels kehte hain. Phone ki photo mein 1 crore se zyada ho sakte hain.",
"hi":"स्क्रीन पर किसी भी फ़ोटो में ज़ूम करो, छोटे वर्ग दिखेंगे — इन्हें पिक्सेल कहते हैं। फ़ोन की फ़ोटो में 1 करोड़ से ज़्यादा हो सकते हैं।"}},"L1.friendly-ai.02.s2":{"dsl":"bg:#F1F5F9 | 🔴@25,40,18:pulse \"R 255\" | 🟢@50,40,18:pulse+0.3 \"G 140\" | 🔵@75,40,18:pulse+0.6 \"B 0\" | 🟧@50,76,18:pop+1 \"= orange\"",
"cap":{"en":"Each pixel is 3 numbers: red, green, blue.",
"hi":"हर पिक्सेल 3 संख्याएँ है: लाल, हरा, नीला।",
"hinglish":"Har pixel 3 numbers hai: red, green, blue."},"narr":{"en":"The computer stores each pixel as three numbers from 0 to 255 for red, green and blue light. Mixing them makes over 16 million colours.",
"hinglish":"Computer har pixel ko red, green aur blue roshni ke liye 0 se 255 tak ke teen numbers mein rakhta hai. Inko milaane se 1.6 crore se zyada rang bante hain.",
"hi":"कंप्यूटर हर पिक्सेल को लाल, हरी और नीली रोशनी के लिए 0 से 255 तक की तीन संख्याओं में रखता है। इन्हें मिलाने से 1.6 करोड़ से ज़्यादा रंग बनते हैं।"}},"L1.friendly-ai.02.s3":{"dsl":"bg:#EDE9FE | 🟧@20,35,10 | ⬛@28,35,10 | 🟧@20,45,10 | ⬛@28,45,10 | ->35,40>55,40+0.4 | 🧠@65,40,18:pulse+0.6 | 🐯@85,40,18:pop+1.1 \"Tiger!\"",
"cap":{"en":"AI finds patterns in the numbers: stripes = tiger!",
"hi":"AI संख्याओं में पैटर्न ढूँढता है: धारियाँ = बाघ!",
"hinglish":"AI numbers mein patterns dhoondhta hai: dhaariyan = tiger!"},"narr":{"en":"AI looks at millions of pixel numbers and learns patterns — edges, then shapes like ears and stripes — until it can say \"tiger\".",
"hinglish":"AI laakhon pixel numbers dekh kar patterns seekhta hai — pehle kinaare, phir kaan aur dhaariyon jaisi shapes — jab tak woh \"tiger\" na bol sake.",
"hi":"AI लाखों पिक्सेल संख्याएँ देखकर पैटर्न सीखता है — पहले किनारे, फिर कान और धारियों जैसी आकृतियाँ — जब तक वह \"बाघ\" न बोल सके।"}},"L1.friendly-ai.03.s1":{"dsl":"bg:#FEE2E2 | 🍎@20,35,16:pop \"fruit\" | 🍌@40,35,16:pop+0.2 \"fruit\" | 🥦@60,35,16:pop+0.4 \"veg\" | 🥔@80,35,16:pop+0.6 \"veg\" | 🧠@50,75,20:pulse+1 \"training\"",
"cap":{"en":"Training: examples WITH the right answer.",
"hi":"ट्रेनिंग: सही जवाब के साथ उदाहरण।",
"hinglish":"Training: sahi jawab ke SAATH examples."},"narr":{"en":"First we train: we give the AI examples with labels — \"this is a fruit\", \"this is a vegetable\".",
"hinglish":"Pehle training: hum AI ko label ke saath examples dete hain — \"yeh fruit hai\", \"yeh sabzi hai\".",
"hi":"पहले ट्रेनिंग: हम AI को लेबल के साथ उदाहरण देते हैं — \"यह फल है\", \"यह सब्ज़ी है\"।"}},"L1.friendly-ai.03.s2":{"dsl":"bg:#FAF5FF | 🍬@15,85,10 \"sweet →\" | 🍎@75,25,14 | 🥭@85,20,14 | 🥦@15,75,14 | 🥔@25,65,14 | 🍊@72,30,14:pulse+0.4 | ->70,32>76,27+0.6 | ->70,32>84,22+0.7",
"cap":{"en":"On the map, it looks for the closest examples.",
"hi":"नक्शे पर वह सबसे पास के उदाहरण ढूँढता है।",
"hinglish":"Map par woh sabse paas ke examples dhoondhta hai."},"narr":{"en":"The AI turns each example into numbers called features, like \"how sweet\" and \"how bright\". A new orange lands near the apples and mangoes, so they vote: fruit!",
"hinglish":"AI har example ko features naam ke numbers mein badalta hai, jaise \"kitna meetha\" aur \"kitna chatak\". Naya santra seb aur aam ke paas girta hai, toh woh vote karte hain: fruit!",
"hi":"AI हर उदाहरण को फ़ीचर नाम की संख्याओं में बदलता है, जैसे \"कितना मीठा\" और \"कितना चटक\"। नया संतरा सेब और आम के पास आता है, तो वे वोट करते हैं: फल!"}},"L1.friendly-ai.03.s3":{"dsl":"bg:#DCFCE7 | 🥕@50,40,26:shake | 📊@50,78,16:pop+0.4 \"65% fruit?\"",
"cap":{"en":"Testing: new examples. Is it sure?",
"hi":"टेस्टिंग: नए उदाहरण। क्या वह पक्का है?",
"hinglish":"Testing: naye examples. Kya woh pakka hai?"},"narr":{"en":"Then we test with new examples it has never seen. A carrot is quite sweet and bright, so the AI may wrongly say \"fruit\" — with low confidence.",
"hinglish":"Phir naye examples se test karte hain jo usne kabhi nahin dekhe. Gaajar kaafi meethi aur chatak hai, toh AI galti se \"fruit\" bol sakta hai — kam confidence ke saath.",
"hi":"फिर नए उदाहरणों से जाँचते हैं जो उसने कभी नहीं देखे। गाजर काफ़ी मीठी और चटक है, तो AI ग़लती से \"फल\" कह सकता है — कम भरोसे के साथ।"}},"L1.friendly-ai.04.s1":{"dsl":"bg:#E0F2FE | 🧒@20,50,22:bob | 💬@38,30,12:pop+0.2 \"Hey…\" | 🔊@75,50,24:pulse+0.5 | 💡@75,25,12:blink+0.8",
"cap":{"en":"A wake word wakes the speaker.",
"hi":"वेक वर्ड स्पीकर को जगाता है।",
"hinglish":"Wake word speaker ko jagaata hai."},"narr":{"en":"A smart speaker waits for its wake word. Only then does it start sending what you say to be understood.",
"hinglish":"Smart speaker apne wake word ka intezaar karta hai. Tabhi woh tumhari baat samajhne ke liye bhejna shuru karta hai.",
"hi":"स्मार्ट स्पीकर अपने वेक वर्ड का इंतज़ार करता है। तभी वह तुम्हारी बात समझने के लिए भेजना शुरू करता है।"}},"L1.friendly-ai.04.s2":{"dsl":"bg:#FEF3C7 | 〰️@15,45,18:pulse \"sound\" | ->25,45>38,45+0.3 | 📝@45,45,16:pop+0.5 \"text\" | ->52,45>64,45+0.7 | 🧠@70,45,16:pulse+0.9 \"meaning\" | ->76,45>86,45+1.1 | 🌦️@92,45,14:pop+1.3",
"cap":{"en":"Sound → words → meaning → answer.",
"hi":"आवाज़ → शब्द → मतलब → जवाब।",
"hinglish":"Awaaz → words → matlab → jawab."},"narr":{"en":"Your voice becomes sound waves. AI turns the waves into words, works out what you mean, and finds an answer — like today's weather.",
"hinglish":"Tumhari awaaz sound waves banti hai. AI waves ko words mein badalta hai, matlab samajhta hai, aur jawab dhoondhta hai — jaise aaj ka mausam.",
"hi":"तुम्हारी आवाज़ ध्वनि तरंगें बनती है। AI तरंगों को शब्दों में बदलता है, मतलब समझता है, और जवाब ढूँढता है — जैसे आज का मौसम।"}},"L1.friendly-ai.04.s3":{"dsl":"bg:#FEE2E2 | 😏@25,45,22:tilt3d \"So smart… NOT\" | 🤖@70,45,22:shake+0.4 | ❓@82,25,14:blink+0.7",
"cap":{"en":"Jokes and sarcasm can confuse AI.",
"hi":"मज़ाक और व्यंग्य AI को उलझा सकते हैं।",
"hinglish":"Mazaak aur taana AI ko confuse kar sakte hain."},"narr":{"en":"AI learns from words, so it can miss the real meaning when people joke, use sarcasm, or have an accent it heard less often.",
"hinglish":"AI words se seekhta hai, isliye jab log mazaak karte hain, taana maarte hain, ya aisa accent ho jo usne kam suna, toh woh asli matlab miss kar sakta hai.",
"hi":"AI शब्दों से सीखता है, इसलिए जब लोग मज़ाक करते हैं, व्यंग्य करते हैं, या ऐसा लहजा हो जो उसने कम सुना, तो वह असली मतलब चूक सकता है।"}},"L1.friendly-ai.05.s1":{"dsl":"bg:#FEF2F2 | 🍎@20,35,14 | 🍓@32,35,14 | 🍒@44,35,14 | 🥦@60,35,14 | 🥒@72,35,14 | 🥬@84,35,14 | 🧠@50,72,18:pulse+0.6 \"red = fruit?\"",
"cap":{"en":"Only red fruits and green vegetables…",
"hi":"सिर्फ़ लाल फल और हरी सब्ज़ियाँ…",
"hinglish":"Sirf laal fruits aur hari sabziyan…"},"narr":{"en":"This AI was trained only with red fruits and green vegetables. It learnt a wrong shortcut: red means fruit, green means vegetable.",
"hinglish":"Is AI ko sirf laal fruits aur hari sabziyon se train kiya gaya. Usne galat shortcut seekh liya: laal matlab fruit, hara matlab sabzi.",
"hi":"इस AI को सिर्फ़ लाल फलों और हरी सब्ज़ियों से सिखाया गया। उसने ग़लत शॉर्टकट सीख लिया: लाल मतलब फल, हरा मतलब सब्ज़ी।"}},"L1.friendly-ai.05.s2":{"dsl":"bg:#FFF7ED | 🌶️@30,45,26:shake | 🤖@70,45,22 | 💬@70,20,12:pop+0.4 \"Fruit!\" | ❌@40,20,14:pop+0.8",
"cap":{"en":"So it calls a red chilli a fruit!",
"hi":"इसलिए वह लाल मिर्च को फल कहता है!",
"hinglish":"Isliye woh laal mirch ko fruit kehta hai!"},"narr":{"en":"When it sees a red chilli, it says \"fruit!\" — and a green kiwi becomes a \"vegetable\". The AI is only as fair as its data.",
"hinglish":"Laal mirch dekh kar woh bolta hai \"fruit!\" — aur hara kiwi \"sabzi\" ban jaata hai. AI utna hi fair hai jitna uska data.",
"hi":"लाल मिर्च देखकर वह कहता है \"फल!\" — और हरा कीवी \"सब्ज़ी\" बन जाता है। AI उतना ही निष्पक्ष है जितना उसका डेटा।"}},"L1.friendly-ai.05.s3":{"dsl":"bg:#EDE9FE | 💬@30,40,22:pop \"Chatbot\" | 📜@60,40,16:pop+0.3 \"made-up fact\" | 🔎@82,40,18:pulse+0.7 \"check!\"",
"cap":{"en":"Chat AI can sound sure and still be wrong.",
"hi":"चैट AI पक्का लगकर भी ग़लत हो सकता है।",
"hinglish":"Chat AI pakka lag kar bhi galat ho sakta hai."},"narr":{"en":"Chat AI writes answers by predicting likely words. Sometimes it makes up facts that sound real — this is called a hallucination. Always check with a book, a teacher or a trusted website.",
"hinglish":"Chat AI agle sambhavit words ka andaaza laga kar jawab likhta hai. Kabhi-kabhi woh asli lagne wale jhoothe facts bana deta hai — ise hallucination kehte hain. Hamesha kitaab, teacher ya trusted website se check karo.",
"hi":"चैट AI अगले संभावित शब्दों का अंदाज़ा लगाकर जवाब लिखता है। कभी-कभी वह असली लगने वाले झूठे तथ्य गढ़ देता है — इसे \"हैलुसिनेशन\" कहते हैं। हमेशा किताब, शिक्षक या भरोसेमंद वेबसाइट से जाँचो।"}},"L1.friendly-ai.06.s1":{"dsl":"bg:#E0F2FE | 🛰️@15,18,14:float | 🛰️@50,10,14:float+0.4 | 🛰️@85,18,14:float+0.8 | 📱@50,70,22:pulse | ->18,24>46,62 | ->50,16>50,60+0.3 | ->82,24>54,62+0.6",
"cap":{"en":"Satellites help the phone find where it is.",
"hi":"उपग्रह फ़ोन को उसकी जगह बताने में मदद करते हैं।",
"hinglish":"Satellites phone ko uski jagah batane mein madad karte hain."},"narr":{"en":"GPS satellites send time signals. Your phone listens to at least four of them and works out exactly where you are. India also has its own system, called NavIC.",
"hinglish":"GPS satellites time signals bhejte hain. Tumhara phone kam se kam chaar ko sun kar pata lagaata hai ki tum kahan ho. India ka apna system bhi hai — NavIC.",

<script>
(function () {
  const q = new URLSearchParams(location.search), id = q.get('id');
  const LG = q.get('lang') || (function () { try { return localStorage.getItem('techlab.lang'); } catch (e) { return null; } })() || 'hinglish';
  const pick = (o) => o ? (o[LG] || o.hinglish || o.en) : '';
  function speak(o) { if (!window.speechSynthesis || !o) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(pick(o)); u.lang = LG === 'hi' ? 'hi-IN' : 'en-IN'; const v = speechSynthesis.getVoices().find((v) => v.lang === u.lang); if (v) u.voice = v; u.rate = .9; speechSynthesis.speak(u); }
  function render(sc0, host) { const dsl = typeof sc0 === 'string' ? sc0 : sc0.dsl;
    const sc = document.createElement('div'); sc.className = 'sc'; const world = document.createElement('div'); world.className = 'world'; sc.append(Object.assign(document.createElement('div'), { className: 'grid' }), Object.assign(document.createElement('div'), { className: 'shine' }), world); /* gloss under the pictures */
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'ar'); svg.setAttribute('viewBox', '0 0 100 75'); svg.setAttribute('preserveAspectRatio', 'none');

    const travellers = [];
    dsl.split('|').map((s) => s.trim()).filter(Boolean).forEach((it) => {
      let m;
      if ((m = it.match(/^bg:(#[0-9a-fA-F]{3,8})$/))) { sc.style.background = `linear-gradient(180deg, ${m[1]}, #fff 140%)`; return; }
      if ((m = it.match(/^->([\d.]+),([\d.]+)>([\d.]+),([\d.]+)(?:\+([\d.]+))?$/))) { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); const [x1, y1, x2, y2] = [m[1], m[2] * .75, m[3], m[4] * .75].map(Number); const cy = Math.min(y1, y2) - 6; p.setAttribute('d', `M${x1},${y1} Q${(x1 + x2) / 2},${cy} ${x2},${y2}`); p.setAttribute('marker-end', 'url(#h)'); svg.append(p); setTimeout(() => p.classList.add('on'), (+m[5] || 0) * 1000); return; }
      if ((m = it.match(/^(.*?)~([\d.]+),([\d.]+)>([\d.]+),([\d.]+)(?:\+([\d.]+))?$/))) { const d = document.createElement('div'); d.className = 'tr'; d.dataset.ovSprite = ''; d.textContent = m[1].trim() || '🔵'; world.append(d); travellers.push({ d, x1: +m[2], y1: +m[3], x2: +m[4], y2: +m[5], t0: (+m[6] || 0) * 1000 }); return; }
      if ((m = it.match(/^(.+?)@([\d.]+),([\d.]+),([\d.]+)(?::(\w+))?(?:\+([\d.]+))?(?:\s+"(.*)")?$/))) {
        const a = document.createElement('div'); a.className = 'a in ' + (m[5] || ''); a.style.left = m[2] + '%'; a.style.top = m[3] + '%'; a.style.animationDelay = (+m[6] || 0) + 's';
        const g = document.createElement('span'); g.className = 'g'; g.textContent = m[1].trim(); g.style.fontSize = m[4] + 'cqw'; g.style.animationDelay = (+m[6] || 0) + .5 + 's'; a.append(g);
        if (m[7]) { const l = document.createElement('span'); l.className = 'l'; l.textContent = m[7]; a.append(l); }
        world.append(a); return; }
      console.warn('scene: cannot parse', it);
    });
    let cap = null;
    if (typeof sc0 === 'object') {
      if (q.get('cap') !== '0') { cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = pick(sc0.cap); } /* caption is its own card under the scene: it can never cover a label */
      if (q.get('ui') !== '0') { const b = document.createElement('button'); b.className = 'say'; b.setAttribute('aria-label', 'Listen'); b.textContent = '🔊'; b.onclick = (e) => { e.stopPropagation(); speak(sc0.narr); }; sc.append(b); }
      if (q.get('speak') === '1') setTimeout(() => speak(sc0.narr), 600);
    }
    if (cap) { const w = document.createElement('div'); w.className = 'scw'; w.append(sc, cap); host.append(w); } else host.append(sc);
    // keep every picture and label inside the stage (nudge in from the edges once it has popped in)
    const fit = (a) => { const R = sc.getBoundingClientRect(); if (!R.width) return; let r = a.getBoundingClientRect(); { const rg = document.createRange(); rg.selectNodeContents(a); const q = rg.getBoundingClientRect(); if (q.width) r = { left: Math.min(r.left, q.left), right: Math.max(r.right, q.right), top: Math.min(r.top, q.top), bottom: Math.max(r.bottom, q.bottom) }; } const m = 2, mv = R.height * 0.05; /* glyph ink box, not just the line box */ let dx = 0, dy = 0; if (r.left < R.left + m) dx = R.left + m - r.left; else if (r.right > R.right - m) dx = R.right - m - r.right; if (r.top < R.top + mv) dy = R.top + mv - r.top; else if (r.bottom > R.bottom - mv) dy = R.bottom - mv - r.bottom; if (dx || dy) { a.style.left = (parseFloat(a.style.left) + dx / R.width * 100) + '%'; a.style.top = (parseFloat(a.style.top) + dy / R.height * 100) + '%'; } };
    // pictures that touch get a little smaller until every picture and label stands clear
    const ov = (p, q) => Math.min(p.right, q.right) - Math.max(p.left, q.left) > 1 && Math.min(p.bottom, q.bottom) - Math.max(p.top, q.top) > 1;
    // pictures that touch first get a little smaller, then are pushed apart (and away from the 🔊 button) until every picture and label stands clear
    const mv = (a, dx, dy) => { const R = sc.getBoundingClientRect(); a.style.left = (parseFloat(a.style.left) + dx / R.width * 100) + '%'; a.style.top = (parseFloat(a.style.top) + dy / R.height * 100) + '%'; };
    const push = (a, p, q, both, b) => { const ox = Math.min(p.right, q.right) - Math.max(p.left, q.left) + 2, oy = Math.min(p.bottom, q.bottom) - Math.max(p.top, q.top) + 2; const k = both ? 0.5 : 1;
      if (ox <= oy) { const s0 = (p.left + p.right) <= (q.left + q.right) ? -1 : 1; mv(a, s0 * ox * k, 0); if (both) mv(b, -s0 * ox * k, 0); } else { const s0 = (p.top + p.bottom) <= (q.top + q.bottom) ? -1 : 1; mv(a, 0, s0 * oy * k); if (both) mv(b, 0, -s0 * oy * k); } };
    // a picture's box includes the room its motion needs (pulse grows, bob and float rise, shake swings)
    const box = (a) => { const r = a.getBoundingClientRect(), cq = sc.getBoundingClientRect().width / 100, c = a.classList; let x = 0, up = 0, dn = 0;
      if (c.contains('pulse') || c.contains('shake')) { x = r.width * 0.07; up = dn = r.height * 0.07; } if (c.contains('bob')) up += 1.6 * cq; if (c.contains('float')) { up += 3 * cq; dn += cq; x += cq; }
      return { left: r.left - x, right: r.right + x, top: r.top - up, bottom: r.bottom + dn, width: r.width + 2 * x, height: r.height + up + dn }; };
    const settle = () => { const as = [...sc.querySelectorAll('.a')], say = sc.querySelector('.say'); for (let it = 0; it < 40; it++) { let hit = false; const rs = as.map(box);
        for (let i = 0; i < as.length; i++) for (let j = i + 1; j < as.length; j++) if (ov(rs[i], rs[j])) { hit = true;
          if (it < 3) { for (const a of [as[i], as[j]]) { const g = a.querySelector('.g'); const f = parseFloat(g.style.fontSize); if (f > 6) g.style.fontSize = (f * 0.9).toFixed(2) + 'cqw'; const l = a.querySelector('.l'); if (l) l.style.fontSize = Math.max(11, parseFloat(getComputedStyle(l).fontSize) * 0.94).toFixed(1) + 'px'; } }
          else push(as[i], rs[i], rs[j], true, as[j]); }
        if (say) { const sr = say.getBoundingClientRect(); as.forEach((a, i) => { if (ov(rs[i], sr)) { hit = true; push(a, rs[i], sr, false); } }); }
        as.forEach(fit); if (!hit) break; } };
    const lastIn = Math.max(0, ...[...sc.querySelectorAll('.a')].map((a) => parseFloat(a.style.animationDelay) || 0));
    let sp = 0; const soon = () => { if (!sp) sp = requestAnimationFrame(() => { sp = 0; settle(); }); };
    sc.querySelectorAll('.a').forEach((a) => a.addEventListener('animationend', (e) => { if (e.target === a) { fit(a); soon(); } })); /* clear overlaps as soon as each picture lands */
    setTimeout(settle, (lastIn + 0.6) * 1000); addEventListener('resize', () => { sc.querySelectorAll('.a').forEach(fit); settle(); });
    const T0 = performance.now();
    (function tick(now) { travellers.forEach((t) => { const k = Math.max(0, ((now - T0 - t.t0) % 1800) / 1800); const on = now - T0 > t.t0; t.d.style.opacity = on ? Math.sin(k * Math.PI) : 0; t.d.style.left = t.x1 + (t.x2 - t.x1) * k + '%'; t.d.style.top = t.y1 + (t.y2 - t.y1) * k + '%'; }); if (travellers.length) requestAnimationFrame(tick); })(T0);
    sc.addEventListener('pointermove', (e) => { const r = sc.getBoundingClientRect(); world.style.transform = `rotateY(${((e.clientX - r.left) / r.width - .5) * 10}deg) rotateX(${-((e.clientY - r.top) / r.height - .5) * 8}deg)`; });
    sc.addEventListener('pointerleave', () => { world.style.transform = ''; });
  }
  const S = window.L1_SCENES || {};
  if (id) { if (S[id]) render(S[id], document.body); else document.body.innerHTML = '<p style="color:#fff;padding:20px">Scene not found: ' + id.replace(/</g, '&lt;') + '</p>'; }
  else { document.body.className = 'gal'; const keys = Object.keys(S); const only = q.get('unit'); keys.filter((k) => !only || k.includes('.' + only + '.')).forEach((k) => { const h = document.createElement('h4'); h.textContent = k; document.body.append(h); render(S[k], document.body); }); }
})();
