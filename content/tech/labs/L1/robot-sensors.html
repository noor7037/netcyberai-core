<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1D4ED8">
<title>Robot sensor playground · Tech & AI Lab</title>
<!-- Lab: robot-sensors (Level 1). Canvas robot with an ultrasonic distance sensor, two IR line sensors, a light sensor and two motors.
     Kids set IF-THEN-ELSE rules and watch the Sense → Think → Act loop run. Deterministic fixed-step simulation. Own work, MIT.
     Modes (config.mode / ?mode=): sense | avoid | line | night -->
<style>/* L1 lab kit (own work, MIT). Family App palette from src/lib/design-tokens.ts */
:root{--royal:#1D4ED8;--sapphire:#002357;--grape:#8B3DFF;--violet:#4400F0;--tangerine:#FF7A1A;--coral:#FF6B57;--gold:#F5B90A;--turq:#14B8A6;--emerald:#0F766E;--cyan:#02CFF9;--slate:#1E293B;--off:#F9FAFB;--ink2:#475569;--r:18px;--sh:0 6px 18px rgba(30,41,59,.12),0 1px 3px rgba(30,41,59,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--off);color:var(--slate);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overscroll-behavior:none}
body{background:transparent;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.kbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(120deg,var(--sapphire),var(--royal) 60%,var(--grape));color:#fff;box-shadow:0 2px 10px rgba(0,35,87,.25)}
.kbar{flex-wrap:wrap;row-gap:6px}
.kbar h1{flex:1 1 9em;min-width:0;margin:0;font-size:16px;line-height:1.2;font-weight:800;letter-spacing:.2px;overflow-wrap:break-word}/* title never cut: controls move to a 2nd row when needed */
.kctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.kbar .kemo{font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.kpill{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.kpill button{padding:5px 9px;border-radius:999px;font-size:12.5px;font-weight:700;color:#e0e7ff;min-height:32px}
.kpill button[aria-pressed=true]{background:#fff;color:var(--royal)}
.kstars{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;font-weight:800;font-size:14px;min-width:54px;justify-content:center}
.kstars.bump{animation:kbump .5s}
@keyframes kbump{40%{transform:scale(1.35)}}
.kgoal{margin:10px 12px 0;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.kgoal b{color:var(--royal)}
.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:800;background:var(--royal);color:#fff;box-shadow:0 4px 0 #1239a8,var(--sh);transition:transform .08s}
.kbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1239a8}
.kbtn.alt{background:#fff;color:var(--royal);box-shadow:0 4px 0 #c7d2fe,var(--sh)}
.kbtn.go{background:var(--turq);box-shadow:0 4px 0 #0d8a7c,var(--sh)}
.kbtn.warn{background:var(--tangerine);box-shadow:0 4px 0 #c75a0c,var(--sh)}
.kbtn[disabled]{opacity:.45;pointer-events:none}
.ktoast{pointer-events:none;position:fixed;left:0;top:0;width:max-content;z-index:60;max-width:min(92vw,360px);padding:12px 16px;border-radius:16px;background:var(--slate);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center;line-height:1.35;font-size:15px;opacity:0;visibility:hidden;transform:scale(.9);transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1),visibility 0s .3s}
.ktoast.show{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1)}
.ktoast.inline{position:static;display:block;width:auto;max-width:none;margin:10px 12px;grid-column:1/-1;flex:0 0 auto}
.ktoast.good{background:var(--emerald)}.ktoast.bad{background:#b4321f}
#kconf{position:fixed;inset:0;pointer-events:none;z-index:-1}/* behind content; inside the win dialog it sits behind the card */
.kwin #kconf{position:absolute;z-index:0}.kwin>div{position:relative;z-index:1}
.kwin{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:rgba(6,18,51,.55);backdrop-filter:blur(3px);padding:20px}
.kwin.show{display:flex}
.kwin>div{background:#fff;border-radius:24px;padding:22px;text-align:center;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:kpop .5s cubic-bezier(.2,1.5,.4,1)}
.kwin .big{font-size:64px;line-height:1;animation:kspin 1.2s ease-out}
.kwin h2{margin:10px 0 6px;font-size:22px}
.kwin p{margin:0 0 14px;color:var(--ink2)}
@keyframes kpop{from{transform:scale(.6);opacity:0}}
@keyframes kspin{from{transform:rotateY(-540deg) scale(.4)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.kvoice{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);font-size:17px;opacity:.6}
.kvoice[aria-pressed=true]{background:#fff;opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
</style>
<style>
main{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px 10px 14px}
.modes{display:flex;flex-wrap:wrap;gap:6px;}
.modes button{flex:0 1 auto;max-width:100%;white-space:normal;text-align:center;padding:7px 12px;border-radius:999px;background:#fff;box-shadow:var(--sh);font-weight:700;font-size:13px;min-height:36px}
.modes button[aria-pressed=true]{background:var(--slate);color:#fff}
.arena{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--sh);background:#f8fafc;touch-action:none}
canvas#c{display:block;width:100%;height:auto}
.loop{position:absolute;left:8px;top:8px;display:flex;gap:4px}
.loop span{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:900;background:rgba(255,255,255,.85);color:#94a3b8;transition:all .15s}
.loop span.on{background:var(--royal);color:#fff;transform:scale(1.08)}
.loop span.on.t{background:var(--grape)}.loop span.on.a{background:var(--tangerine)}
.readings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rd{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:7px 6px;text-align:center}
.rd b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.rd small{font-size:11px;color:var(--ink2);font-weight:700}
.motors{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:8px 10px;font-size:13px;font-weight:700}
.motors .m{flex:1}.motors .bar{height:10px;border-radius:99px;background:#e2e8f0;position:relative;overflow:hidden;margin-top:3px}
.motors .bar i{position:absolute;top:0;bottom:0;left:50%;background:var(--turq);transition:all .1s}
.rules{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:10px;display:flex;flex-direction:column;gap:8px}
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:800;font-size:14px}
.kw{padding:4px 8px;border-radius:8px;color:#fff;font-size:13px}.kw.if{background:#d97706}.kw.then{background:var(--grape)}.kw.else{background:#64748b}
.sel{display:flex;gap:4px;flex-wrap:wrap}
.sel button{padding:6px 9px;border-radius:10px;background:#f1f5f9;font-weight:800;font-size:13px;min-height:36px;border:2px solid transparent}
.sel button[aria-pressed=true]{background:#eef2ff;border-color:var(--royal);color:var(--royal)}
input[type=range]{width:130px;accent-color:var(--royal)}
.btns{display:flex;gap:8px}.btns .kbtn{flex:1}
.why{font-size:14px;background:#eff6ff;border-left:4px solid var(--royal);padding:8px 10px;border-radius:10px}
.lamp{display:flex;gap:12px;align-items:center;justify-content:center;padding:6px}
@media (orientation:landscape) and (max-height:520px){main{display:grid;grid-template-columns:1.1fr 1fr;align-items:start}.modes{grid-column:1/-1}.arena{grid-row:2/6}canvas#c{max-height:calc(100vh - 120px);width:auto;margin:auto}}

      if (mode === 'line') { const ang = Math.atan2((bot.y - 75) / 48, (bot.x - 100) / 72); if (lastAng != null) { let da = ang - lastAng; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI; lapAng += da; } lastAng = ang; const off = Math.abs(Math.hypot((bot.x - 100) / 72, (bot.y - 75) / 48) - 1); if (off > .35) { stop(); K.sfx('bad'); why(['The robot left the line. When only the LEFT eye sees black, the line is on the left — which way should it turn?', 'रोबोट लाइन से हट गया। जब सिर्फ़ बायाँ सेंसर काला देखे, लाइन बाईं तरफ़ है — किधर मुड़ना चाहिए?', 'Robot line se hat gaya. Jab sirf LEFT eye kaala dekhe, line left mein hai — kidhar mudna chahiye?']); break; } if (Math.abs(lapAng) >= 2 * Math.PI) { stop(); win(); break; } if (simT > 60) { stop(); why(['Too slow — is the robot moving forward when both eyes see white?', 'बहुत धीमा — क्या दोनों सेंसर सफ़ेद देखें तब रोबोट आगे चलता है?', 'Bahut slow — kya dono eyes white dekhein tab robot aage chalta hai?']); break; } }
      if (mode === 'avoid' && simT >= 25) { stop(); if (odo >= 150) win(); else { K.sfx('bad'); why(['No crash — but the robot hardly moved! A robot vacuum must keep exploring. Make it go forward when the way is clear.', 'टक्कर नहीं — पर रोबोट मुश्किल से चला! रोबोट वैक्यूम को घूमते रहना है। रास्ता खाली हो तो आगे चलाओ।', 'Takkar nahin — par robot mushkil se chala! Robot vacuum ko ghoomte rehna hai. Raasta khaali ho toh aage chalao.']); } break; } } }
  phase = (phase + 1) % 30; ['lS', 'lT', 'lA'].forEach((id, k) => $('#' + id).classList.toggle('on', running && Math.floor(phase / 10) === k));
  draw(s); if (phase % 3 === 0) readings(s); if (mode === 'sense') senseCheck(s);
}
let senseDone = { near: false, line: false };
function senseCheck(s) { if (s.d < 15 && !senseDone.near) { senseDone.near = true; K.star(); K.sfx('good'); K.toast(['📡 The ultrasonic sensor sends a sound "ping" and times the echo — the box is close!', '📡 अल्ट्रासोनिक सेंसर आवाज़ की "पिंग" भेजकर गूँज का समय नापता है — डिब्बा पास है!', '📡 Ultrasonic sensor awaaz ki "ping" bhej kar echo ka time naapta hai — box paas hai!'], 'good', 3200); }
  if ((s.L || s.R) && !senseDone.line) { senseDone.line = true; K.star(); K.sfx('good'); K.toast(['👁 The IR eye shines light down: white reflects it, black soaks it up — so it knows it is on the line!', '👁 IR सेंसर नीचे रोशनी डालता है: सफ़ेद लौटाता है, काला सोख लेता है — इसलिए उसे पता चलता है कि वह लाइन पर है!', '👁 IR eye neeche light daalta hai: white wapas bhejta hai, kaala sokh leta hai — isliye use pata chalta hai ki woh line par hai!'], 'good', 3400); }
  if (senseDone.near && senseDone.line && !senseDone.won) { senseDone.won = true; setTimeout(win, 1500); } }
function checkLamp() { const on = lampOn(); if (lightLevel < 20 && on) lampTests.night = true; if (lightLevel > 70 && !on) lampTests.day = true; if (lampTests.day && lampTests.night && !lampTests.won) { lampTests.won = true; win(); } }
function win() { K.star(3); K.done('robot-sensors', mode, { mode, solved: true, t: +simT.toFixed(1) });
  const M = { sense: L('Sensors are a robot\'s senses: sound echoes for distance, light for lines.', 'सेंसर रोबोट की इंद्रियाँ हैं: दूरी के लिए गूँज, लाइन के लिए रोशनी।', 'Sensors robot ki indriyan hain: distance ke liye echo, line ke liye light.'), avoid: L('25 seconds, no crash! Sense → Think → Act is how robot vacuums dodge sofas.', '25 सेकंड, कोई टक्कर नहीं! सेंस → थिंक → ऐक्ट से ही रोबोट वैक्यूम सोफ़े से बचते हैं।', '25 second, koi takkar nahin! Sense → Think → Act se hi robot vacuum sofa se bachte hain.'), line: L('A full lap! Factory and warehouse robots follow lines and tapes exactly like this.', 'पूरा चक्कर! फ़ैक्टरी और गोदाम के रोबोट ठीक ऐसे ही लाइन पर चलते हैं।', 'Poora chakkar! Factory aur warehouse robots bilkul aise hi line follow karte hain.'), night: L('Your lamp switches itself on at night and off by day — just like real street lights with light sensors.', 'तुम्हारा लैंप रात में ख़ुद जलता और दिन में बुझता है — असली स्ट्रीट लाइट की तरह।', 'Tumhara lamp raat mein khud jalta aur din mein bujhta hai — asli street lights ki tarah.') };
  K.win(['Robot engineer!', 'रोबोट इंजीनियर!', 'Robot engineer!'], M[mode], null, '🤖', () => { senseDone = { near: false, line: false }; lampTests = { day: false, night: false }; start(); }); }
// drag robot in sense mode / tap to add box in avoid mode when stopped
function cpos(e) { const r = C.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
C.addEventListener('pointerdown', (e) => { if (running || mode === 'night') return; const [x, y] = cpos(e); if (Math.hypot(x - bot.x, y - bot.y) < 14) { dragBot = true; C.setPointerCapture(e.pointerId); } else if (mode === 'sense') { const near = boxes.find((b) => Math.hypot(x - b.x, y - b.y) < b.r + 4); if (near) { near.drag = true; C.setPointerCapture(e.pointerId); } } });
C.addEventListener('pointermove', (e) => { const [x, y] = cpos(e); if (dragBot) { bot.x = Math.max(9, Math.min(W - 9, x)); bot.y = Math.max(9, Math.min(H - 9, y)); } boxes.forEach((b) => { if (b.drag) { b.x = x; b.y = y; } }); });
C.addEventListener('pointerup', () => { dragBot = false; boxes.forEach((b) => b.drag = false); });
C.addEventListener('dblclick', () => { if (mode === 'sense') bot.a += Math.PI / 4; });
function tick0() { draw(sense()); readings(sense()); }
function drawModes() { const m = $('#modes'); m.innerHTML = ''; for (const k in MODES) { const b = el('button', { 'aria-pressed': k === mode }, t(MODES[k].n)); b.onclick = () => { stop(); mode = k; start(); }; m.append(b); } }
function start() { drawModes(); $('#goal').innerHTML = `<span style="font-size:22px">🎯</span><div><b>${t(['Goal', 'लक्ष्य', 'Goal'])}:</b> ${esc(t(cfg.mode === mode && cfg.goal ? [cfg.goal.en, cfg.goal.hi || cfg.goal.en, cfg.goal.hinglish] : MODES[mode].goal))}</div>`; place(); drawRules(); btns();
  why({ sense: L('Drag the blue robot. Drag the box too. Double-tap to turn the robot. Watch the readings change.', 'नीले रोबोट को खींचो। डिब्बा भी खींचो। मोड़ने के लिए दो बार टैप करो। रीडिंग बदलती देखो।', 'Neele robot ko drag karo. Box bhi drag karo. Ghumane ke liye double-tap karo. Readings badalti dekho.'), avoid: L('Tip: the robot needs time to turn. Try a distance of 20–30 cm.', 'संकेत: रोबोट को मुड़ने में समय लगता है। 20–30 सेमी दूरी आज़माओ।', 'Tip: robot ko mudne mein time lagta hai. 20–30 cm distance try karo.'), line: L('Both eyes start on white, either side of the line. The robot drives anticlockwise.', 'दोनों सेंसर लाइन के दोनों ओर सफ़ेद पर शुरू होते हैं। रोबोट उल्टी घड़ी की दिशा में चलता है।', 'Dono eyes line ke dono taraf white par shuru hote hain. Robot anticlockwise chalta hai.'), night: L('A light sensor (LDR) measures brightness. Street lights in many Indian cities switch on this way.', 'लाइट सेंसर (LDR) रोशनी मापता है। भारत के कई शहरों में स्ट्रीट लाइट ऐसे ही जलती हैं।', 'Light sensor (LDR) brightness naapta hai. India ke kai shehron mein street lights aise hi jalti hain.') }[mode]);
  drawTrack(); trackData = TX.getImageData(0, 0, track.width, track.height).data; tick0(); }
K.onLang(() => start());
start(); requestAnimationFrame(frame);
})();
