*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--off);color:var(--slate);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overscroll-behavior:none}
body{background:transparent;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.kbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(120deg,var(--sapphire),var(--royal) 60%,var(--grape));color:#fff;box-shadow:0 2px 10px rgba(0,35,87,.25)}
.kbar{flex-wrap:wrap;row-gap:6px}
.kbar h1{flex:1 1 9em;min-width:0;margin:0;font-size:16px;line-height:1.2;font-weight:800;letter-spacing:.2px;overflow-wrap:break-word}/* title never cut: controls move to a 2nd row when needed */
.kctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.kbar .kemo{font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.kpill{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.kpill button{padding:5px 9px;border-radius:999px;font-size:12.5px;font-weight:700;color:#e0e7ff;min-height:32px}

.kstars{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;font-weight:800;font-size:14px;min-width:54px;justify-content:center}

.kbtn.alt{background:#fff;color:var(--royal);box-shadow:0 4px 0 #c7d2fe,var(--sh)}
.kbtn.go{background:var(--turq);box-shadow:0 4px 0 #0d8a7c,var(--sh)}
.kbtn.warn{background:var(--tangerine);box-shadow:0 4px 0 #c75a0c,var(--sh)}
.kbtn[disabled]{opacity:.45;pointer-events:none}

.kwin>div{background:#fff;border-radius:24px;padding:22px;text-align:center;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:kpop .5s cubic-bezier(.2,1.5,.4,1)}
.kwin .big{font-size:64px;line-height:1;animation:kspin 1.2s ease-out}
.kwin h2{margin:10px 0 6px;font-size:22px}
.kwin p{margin:0 0 14px;color:var(--ink2)}
@keyframes kpop{from{transform:scale(.6);opacity:0}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.kvoice{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);font-size:17px;opacity:.6}

  else if (n[0] === 'paint') { const c = $(`.cell[data-x="${st.x}"][data-y="${st.y}"]`); c.classList.add('painted'); c.style.background = COL[n[1]]; st.painted[st.x + ',' + st.y] = n[1]; K.sfx('tap'); await sleep(260); }
  else if (n[0] === 'fwd') { const [dx, dy] = DIRS[st.d]; const nx = st.x + dx, ny = st.y + dy; const ch = cell(nx, ny);
    if (ch === undefined || ch === '#') { st.crashed = true; const b = $('#bot'); b.classList.add('crash'); K.sfx('bad'); await sleep(520); b.classList.remove('crash'); }
    else { st.x = nx; st.y = ny; const b = $('#bot'); b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop'); place(); K.sfx('move'); await sleep(360); const key = nx + ',' + ny; const it = st.items[key];
      if (it === '*') { delete st.items[key]; st.stars++; K.star(); K.sfx('good'); $(`.cell[data-x="${nx}"][data-y="${ny}"] .itm`).classList.add('got'); hud(); }
      if (it === 'M') { st.reachedMango = true; st.done = true; } } }
  hl && hl[1].classList.remove('now');
}
async function run() {
  if (running) return; if (!prog.length) { K.toast(['Add some blocks first!', 'पहले कुछ ब्लॉक जोड़ो!', 'Pehle kuch blocks jodo!']); return; }
  if (cnt(prog) > LEVELS[li].max) { K.toast(['Too many blocks for this level.', 'इस स्तर के लिए बहुत ज़्यादा ब्लॉक।', 'Is level ke liye bahut zyada blocks.'], 'bad'); return; }
  running = true; reset(); $('#run').disabled = true; let steps = 0;
  for (const n of prog) { await exec(n); if (st.crashed || st.reachedMango) break; if (++steps > 400) break; }
  running = false; $('#run').disabled = false; judge();
}
function judge() {
  const lv = LEVELS[li]; const paintOK = lv.map.every((row, y) => [...row].every((ch, x) => !COL[ch] || st.painted[x + ',' + y] === ch));
  const starsLeft = Object.values(st.items).filter((v) => v === '*').length; const needStars = lv.needStars != null ? st.stars >= lv.needStars : (lv.allStars === false ? true : starsLeft === 0);
  if (st.crashed) return K.toast(['Bonk! Chintu hit a wall or the edge. Find the step that went wrong (debug!) and run again.', 'धड़ाम! चिंटू दीवार या किनारे से टकराया। गलत कदम ढूँढो (डीबग!) और फिर चलाओ।', 'Dhadaam! Chintu deewar ya kinaare se takraya. Galat step dhoondo (debug!) aur phir run karo.'], 'bad', 3200);
  if (!st.reachedMango) return K.toast(['Chintu stopped before the mango. Add more steps!', 'चिंटू आम से पहले रुक गया। और कदम जोड़ो!', 'Chintu mango se pehle ruk gaya. Aur steps jodo!'], 'bad', 2600);
  if (!paintOK) return K.toast(['The pattern is not right yet: red, blue, red, blue.', 'पैटर्न अभी सही नहीं: लाल, नीला, लाल, नीला।', 'Pattern abhi sahi nahin: laal, neela, laal, neela.'], 'bad', 2600);
  if (!needStars) return K.toast(lv.needStars ? [`stars = ${st.stars}. You need ${lv.needStars}!`, `stars = ${st.stars}। ${lv.needStars} चाहिए!`, `stars = ${st.stars}. ${lv.needStars} chahiye!`] : ['You missed a ⭐. Collect them all!', 'एक ⭐ छूट गया। सब उठाओ!', 'Ek ⭐ chhoot gaya. Sab uthao!'], 'bad', 2600);
  $(`.cell .itm`) && $$('.cell .itm').forEach((i) => i.textContent === '🥭' && i.classList.add('got'));
  if (!saved.includes(li)) { saved.push(li); try { localStorage.setItem('techlab.loopcoder', JSON.stringify(saved)); } catch (e) {} }
  K.star(2); K.done('loop-coder', 'level-' + (li + 1), { level: li + 1, solved: true, blocks: cnt(prog), stars: st.stars });
  const msg = { sequence: L('Steps in the right order = a sequence. That is an algorithm!', 'सही क्रम में कदम = क्रम (sequence)। यही एल्गोरिदम है!', 'Sahi order mein steps = sequence. Yahi algorithm hai!'), pattern: L('You followed a repeating pattern.', 'तुमने दोहराने वाला पैटर्न अपनाया।', 'Tumne repeat hone wala pattern follow kiya.'), loop: L('A loop repeats blocks so programs stay short.', 'लूप ब्लॉक दोहराता है ताकि प्रोग्राम छोटा रहे।', 'Loop blocks repeat karta hai taaki program chhota rahe.'), ifthen: L('IF-THEN lets a robot decide by itself using a sensor.', 'अगर-तो से रोबोट सेंसर से ख़ुद फ़ैसला करता है।', 'IF-THEN se robot sensor se khud decide karta hai.'), debug: L('You found and fixed the bug. Real programmers debug every day!', 'तुमने बग ढूँढकर ठीक किया। असली प्रोग्रामर रोज़ डीबग करते हैं!', 'Tumne bug dhoondh kar theek kiya. Asli programmers roz debug karte hain!'), variable: L('A variable is a labelled box that remembers a value, like stars.', 'वेरिएबल एक नाम वाला डिब्बा है जो मान याद रखता है, जैसे stars।', 'Variable ek naam wala dabba hai jo value yaad rakhta hai, jaise stars.') }[lv.topic];
  K.win(['Mango mission complete!', 'आम मिशन पूरा!', 'Mango mission complete!'], msg, li < LEVELS.length - 1 ? ['Next level ➜', 'अगला स्तर ➜', 'Next level ➜'] : ['Play again', 'फिर खेलो', 'Phir khelo'], '🥭', () => { if (li < LEVELS.length - 1) li++; load(); });
}
$('#run').onclick = run; $('#reset').onclick = () => !running && reset(); $('#clear').onclick = () => { if (running) return; prog = []; openRepeat = null; drawProg(); };
$('#codeB').onclick = () => { showCode = !showCode; drawCode(); };
K.onLang(() => { $('#run').textContent = '▶ ' + t(['Run', 'चलाओ', 'Run']); load(); });
$('#run').textContent = '▶ ' + t(['Run', 'चलाओ', 'Run']);
if (cfg.code || K.q.get('code')) showCode = true;
addEventListener('resize', () => !running && reset());
load();
})();
