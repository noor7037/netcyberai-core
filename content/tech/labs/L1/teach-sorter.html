<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8B3DFF">
<title>Teach the computer · Tech & AI Lab</title>
<!-- Lab: teach-sorter (Level 1). Children teach a tiny AI by sorting examples, then test it.
     The model is a real k-nearest-neighbours classifier (k=3, distance-weighted) on two visible features, drawn on a live "feature map".
     Modes (?mode=): teach | bias | recommend | words | pixels. Own work, MIT. No network, no eval. -->
<style>/* L1 lab kit (own work, MIT). Family App palette from src/lib/design-tokens.ts */
:root{--royal:#1D4ED8;--sapphire:#002357;--grape:#8B3DFF;--violet:#4400F0;--tangerine:#FF7A1A;--coral:#FF6B57;--gold:#F5B90A;--turq:#14B8A6;--emerald:#0F766E;--cyan:#02CFF9;--slate:#1E293B;--off:#F9FAFB;--ink2:#475569;--r:18px;--sh:0 6px 18px rgba(30,41,59,.12),0 1px 3px rgba(30,41,59,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--off);color:var(--slate);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overscroll-behavior:none}
body{background:transparent;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.kbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(120deg,var(--sapphire),var(--royal) 60%,var(--grape));color:#fff;box-shadow:0 2px 10px rgba(0,35,87,.25)}
.kbar{flex-wrap:wrap;row-gap:6px}
.kbar h1{flex:1 1 9em;min-width:0;margin:0;font-size:16px;line-height:1.2;font-weight:800;letter-spacing:.2px;overflow-wrap:break-word}/* title never cut: controls move to a 2nd row when needed */
.kctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.kbar .kemo{font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.kpill{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.kpill button{padding:5px 9px;border-radius:999px;font-size:12.5px;font-weight:700;color:#e0e7ff;min-height:32px}
.kpill button[aria-pressed=true]{background:#fff;color:var(--royal)}
.kstars{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;font-weight:800;font-size:14px;min-width:54px;justify-content:center}
.kstars.bump{animation:kbump .5s}
@keyframes kbump{40%{transform:scale(1.35)}}
.kgoal{margin:10px 12px 0;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.kgoal b{color:var(--royal)}
.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:800;background:var(--royal);color:#fff;box-shadow:0 4px 0 #1239a8,var(--sh);transition:transform .08s}
.kbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1239a8}
.kbtn.alt{background:#fff;color:var(--royal);box-shadow:0 4px 0 #c7d2fe,var(--sh)}
.kbtn.go{background:var(--turq);box-shadow:0 4px 0 #0d8a7c,var(--sh)}
.kbtn.warn{background:var(--tangerine);box-shadow:0 4px 0 #c75a0c,var(--sh)}
.kbtn[disabled]{opacity:.45;pointer-events:none}
.ktoast{pointer-events:none;position:fixed;left:0;top:0;width:max-content;z-index:60;max-width:min(92vw,360px);padding:12px 16px;border-radius:16px;background:var(--slate);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center;line-height:1.35;font-size:15px;opacity:0;visibility:hidden;transform:scale(.9);transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1),visibility 0s .3s}
.ktoast.show{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1)}
.ktoast.inline{position:static;display:block;width:auto;max-width:none;margin:10px 12px;grid-column:1/-1;flex:0 0 auto}
.ktoast.good{background:var(--emerald)}.ktoast.bad{background:#b4321f}
#kconf{position:fixed;inset:0;pointer-events:none;z-index:-1}/* behind content; inside the win dialog it sits behind the card */
.kwin #kconf{position:absolute;z-index:0}.kwin>div{position:relative;z-index:1}
.kwin{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:rgba(6,18,51,.55);backdrop-filter:blur(3px);padding:20px}
.kwin.show{display:flex}
.kwin>div{background:#fff;border-radius:24px;padding:22px;text-align:center;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:kpop .5s cubic-bezier(.2,1.5,.4,1)}
.kwin .big{font-size:64px;line-height:1;animation:kspin 1.2s ease-out}
.kwin h2{margin:10px 0 6px;font-size:22px}
.kwin p{margin:0 0 14px;color:var(--ink2)}
@keyframes kpop{from{transform:scale(.6);opacity:0}}
@keyframes kspin{from{transform:rotateY(-540deg) scale(.4)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.kvoice{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);font-size:17px;opacity:.6}
.kvoice[aria-pressed=true]{background:#fff;opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
</style>

@keyframes cardin{from{transform:rotateY(80deg) scale(.6);opacity:0}}
@keyframes float{50%{transform:translateY(-6px) rotate(2deg)}}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.bin{min-height:78px;border-radius:20px;background:#fff;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:16px;gap:2px;border:3px solid transparent;transition:all .15s}
.bin .be{font-size:30px}.bin .cnt{font-size:12px;color:var(--ink2);font-weight:700}
.bin.a{border-color:#fecaca}.bin.b{border-color:#bbf7d0}
.bin.hit{transform:scale(1.06);border-color:var(--grape)}
.bin .strip{display:flex;flex-wrap:wrap;justify-content:center;font-size:15px;max-width:100%;min-height:18px}
.guess{width:100%;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:10px 12px}
.guess h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:6px}
.cbar{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin:4px 0}
.cbar .tr{flex:1;height:14px;border-radius:99px;background:#f1f5f9;overflow:hidden}

.judge{display:flex;gap:8px;margin-top:8px}.judge .kbtn{flex:1;min-height:44px;font-size:15px}
.mapwrap{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:8px}
.mapwrap summary{font-weight:800;font-size:14px;cursor:pointer;padding:2px 4px}
canvas#map{width:100%;height:auto;display:block;margin-top:6px;border-radius:12px;background:#faf5ff}
.why{font-size:14px;background:#f5f3ff;border-left:4px solid var(--grape);padding:8px 10px;border-radius:10px}
.score{font-size:15px;font-weight:900;text-align:center}
.clues{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px}
.clue{padding:3px 8px;border-radius:999px;font-size:13px;font-weight:800}

  const src = document.createElement('canvas'); src.width = src.height = 128; const sx = src.getContext('2d'); sx.fillStyle = '#fff'; sx.fillRect(0, 0, 128, 128); sx.font = '104px sans-serif'; sx.textAlign = 'center'; sx.textBaseline = 'middle'; sx.fillText(pic, 64, 72);
  const X = cv.getContext('2d'); let N;
  const paint = () => { zoom = S.zoom = +sl.value; N = Math.round(128 / Math.pow(2, zoom / 100 * 4)); N = Math.max(8, N); const sm = document.createElement('canvas'); sm.width = sm.height = N; sm.getContext('2d').drawImage(src, 0, 0, N, N); X.imageSmoothingEnabled = false; X.clearRect(0, 0, 320, 320); X.drawImage(sm, 0, 0, 320, 320); if (N <= 32) { X.strokeStyle = 'rgba(30,41,59,.25)'; X.lineWidth = 1; for (let i = 0; i <= N; i++) { const p = i * 320 / N; X.beginPath(); X.moveTo(p, 0); X.lineTo(p, 320); X.moveTo(0, p); X.lineTo(320, p); X.stroke(); } } S.data = sm.getContext('2d').getImageData(0, 0, N, N).data; S.N = N; };
  sl.oninput = paint; paint();
  why(['A camera turns light into a grid of pixels. Zoom in: each square is one colour, stored as 3 numbers from 0 to 255 for Red, Green and Blue.', 'कैमरा रोशनी को पिक्सेल के जाल में बदलता है। ज़ूम करो: हर वर्ग एक रंग है, जो लाल, हरा और नीला के लिए 0 से 255 तक की 3 संख्याओं में रखा जाता है।', 'Camera roshni ko pixels ke jaal mein badalta hai. Zoom karo: har square ek colour hai, jo Red, Green, Blue ke liye 0 se 255 tak ke 3 numbers mein rakha jaata hai.']);
  cv.addEventListener('pointerdown', (e) => { const r = cv.getBoundingClientRect(); const i = Math.floor((e.clientX - r.left) / r.width * S.N), j = Math.floor((e.clientY - r.top) / r.height * S.N); const o = (j * S.N + i) * 4, d = S.data; const [R, G, B] = [d[o], d[o + 1], d[o + 2]];
    $('#pxinfo').innerHTML = `<span class="sw" style="background:rgb(${R},${G},${B})"></span><span style="color:#dc2626">R ${R}</span><span style="color:#16a34a">G ${G}</span><span style="color:#2563eb">B ${B}</span>`; K.sfx('tap');
    X.strokeStyle = '#8B3DFF'; X.lineWidth = 3; X.strokeRect(i * 320 / S.N, j * 320 / S.N, 320 / S.N, 320 / S.N);
    if (S.N <= 32) { S.seen.add(i + ',' + j); if (S.seen.size === 3 && !S.won) { S.won = true; setTimeout(() => winMsg(3, 3), 400); } } else K.toast(['Zoom in more to see the squares clearly!', 'वर्ग साफ़ देखने के लिए और ज़ूम करो!', 'Squares saaf dekhne ke liye aur zoom karo!']); }); }
