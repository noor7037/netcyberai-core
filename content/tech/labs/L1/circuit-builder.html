<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F5B90A">
<title>Circuit builder · Tech & AI Lab</title>
<!-- Lab: circuit-builder (Level 1). Build a series circuit on a 6-slot loop with cells, bulbs, wires and a switch; test which
     materials conduct; see short circuits flagged. Brightness model: series loop, brightness = cells / bulbs (capped).
     Modes (?mode=): light | switch | test | bright. Own work, MIT. Uses only safe 1.5 V cells in the story. -->
<style>/* L1 lab kit (own work, MIT). Family App palette from src/lib/design-tokens.ts */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--off);color:var(--slate);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overscroll-behavior:none}
body{background:transparent;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.kbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(120deg,var(--sapphire),var(--royal) 60%,var(--grape));color:#fff;box-shadow:0 2px 10px rgba(0,35,87,.25)}
.kbar{flex-wrap:wrap;row-gap:6px}
.kbar h1{flex:1 1 9em;min-width:0;margin:0;font-size:16px;line-height:1.2;font-weight:800;letter-spacing:.2px;overflow-wrap:break-word}/* title never cut: controls move to a 2nd row when needed */
.kctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.kbar .kemo{font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.kpill{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.kpill button{padding:5px 9px;border-radius:999px;font-size:12.5px;font-weight:700;color:#e0e7ff;min-height:32px}
.kpill button[aria-pressed=true]{background:#fff;color:var(--royal)}
.kstars{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;font-weight:800;font-size:14px;min-width:54px;justify-content:center}
.kstars.bump{animation:kbump .5s}
@keyframes kbump{40%{transform:scale(1.35)}}
.kgoal{margin:10px 12px 0;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.kgoal b{color:var(--royal)}
.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:800;background:var(--royal);color:#fff;box-shadow:0 4px 0 #1239a8,var(--sh);transition:transform .08s}
.kbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1239a8}
.kbtn.alt{background:#fff;color:var(--royal);box-shadow:0 4px 0 #c7d2fe,var(--sh)}
.kbtn.go{background:var(--turq);box-shadow:0 4px 0 #0d8a7c,var(--sh)}
.kbtn.warn{background:var(--tangerine);box-shadow:0 4px 0 #c75a0c,var(--sh)}
.kbtn[disabled]{opacity:.45;pointer-events:none}
.ktoast{pointer-events:none;position:fixed;left:0;top:0;width:max-content;z-index:60;max-width:min(92vw,360px);padding:12px 16px;border-radius:16px;background:var(--slate);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center;line-height:1.35;font-size:15px;opacity:0;visibility:hidden;transform:scale(.9);transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1),visibility 0s .3s}
.ktoast.show{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1)}
.ktoast.inline{position:static;display:block;width:auto;max-width:none;margin:10px 12px;grid-column:1/-1;flex:0 0 auto}
.ktoast.good{background:var(--emerald)}.ktoast.bad{background:#b4321f}
#kconf{position:fixed;inset:0;pointer-events:none;z-index:-1}/* behind content; inside the win dialog it sits behind the card */
.kwin #kconf{position:absolute;z-index:0}.kwin>div{position:relative;z-index:1}
.kwin{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:rgba(6,18,51,.55);backdrop-filter:blur(3px);padding:20px}
.kwin.show{display:flex}
.kwin>div{background:#fff;border-radius:24px;padding:22px;text-align:center;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:kpop .5s cubic-bezier(.2,1.5,.4,1)}
.kwin .big{font-size:64px;line-height:1;animation:kspin 1.2s ease-out}
.kwin h2{margin:10px 0 6px;font-size:22px}
.kwin p{margin:0 0 14px;color:var(--ink2)}
@keyframes kpop{from{transform:scale(.6);opacity:0}}
@keyframes kspin{from{transform:rotateY(-540deg) scale(.4)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.kvoice{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);font-size:17px;opacity:.6}
.kvoice[aria-pressed=true]{background:#fff;opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
</style>
<style>
main{flex:1;display:flex;flex-direction:column;gap:9px;padding:8px 10px 16px}
.modes{display:flex;flex-wrap:wrap;gap:6px;}
.modes button{flex:0 1 auto;max-width:100%;white-space:normal;text-align:center;padding:7px 12px;border-radius:999px;background:#fff;box-shadow:var(--sh);font-weight:700;font-size:13px;min-height:36px}
.modes button[aria-pressed=true]{background:#b45309;color:#fff}
.board{position:relative;border-radius:22px;background:radial-gradient(120% 90% at 30% 10%,#1e3a8a,#0b1736);box-shadow:var(--sh),inset 0 0 0 2px rgba(255,255,255,.06);overflow:hidden;perspective:800px}

.board.dark{background:radial-gradient(120% 90% at 30% 10%,#111827,#030712)}
.slot{cursor:pointer}.slot .hit{fill:rgba(255,255,255,.0001)}
.slot.empty .ring{fill:none;stroke:#fde68a;stroke-width:2.5;stroke-dasharray:5 5;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.slot.hover .ring{stroke:#fff;stroke-width:4}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{fill:none;stroke:#fde047;stroke-width:5;stroke-linecap:round;stroke-dasharray:2 16;animation:flow var(--sp,1s) linear infinite;filter:drop-shadow(0 0 4px #fde047)}
@keyframes flow{to{stroke-dashoffset:-36}}
.hot{animation:hot .4s ease-in-out infinite alternate}@keyframes hot{to{filter:drop-shadow(0 0 10px #ef4444)}}
.status{position:absolute;left:10px;top:8px;padding:5px 10px;border-radius:999px;font-weight:900;font-size:13px;background:rgba(255,255,255,.92)}
.status.on{background:#fde047}.status.bad{background:#fecaca;color:#991b1b}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:10px;min-height:70px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;width:72px;height:72px;border-radius:16px;background:linear-gradient(160deg,#fff,#fef3c7);box-shadow:0 4px 0 #fcd34d,var(--sh);font-size:30px;line-height:1;user-select:none}
.chip small{font-size:10.5px;font-weight:800;margin-top:4px;text-align:center;line-height:1.1;color:var(--slate)}
.shelves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shelf{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:8px;min-height:64px}
.shelf h4{margin:0 0 4px;font-size:13px}.shelf div{font-size:24px;display:flex;flex-wrap:wrap;gap:4px}
.why{font-size:14px;background:#fffbeb;border-left:4px solid var(--gold);padding:8px 10px;border-radius:10px}
.predict{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(6,18,51,.45)}
.predict.show{display:flex}.predict>div{background:#fff;border-radius:22px;padding:18px;max-width:320px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.3);animation:kpop .4s}
.predict .big{font-size:54px}.predict .row{display:flex;gap:8px;margin-top:10px}.predict .row .kbtn{flex:1}
@media (orientation:landscape) and (max-height:520px){main{display:grid;grid-template-columns:1.2fr 1fr;align-items:start}.modes,#goal{grid-column:1/-1}.board{grid-row:3/7}.board svg{max-height:calc(100vh - 150px)}}

  if (mode === 'switch') { why(['A switch makes a gap (OFF) or closes it (ON). The light switches at home work the same way.', 'स्विच रास्ता तोड़ता (बंद) या जोड़ता (चालू) है। घर के स्विच भी ऐसे ही काम करते हैं।', 'Switch raasta todta (OFF) ya jodta (ON) hai. Ghar ke switch bhi aise hi kaam karte hain.']); const tg = st.toggles.join(''); if (/truefalsetrue/.test(tg) && !st.won) win(); }
  if (mode === 'test') { why([`Tested ${st.tested.length} of 6. Correct guesses: ${st.preds}.`, `${st.tested.length}/6 जाँचे। सही अंदाज़े: ${st.preds}।`, `${st.tested.length}/6 test kiye. Sahi guess: ${st.preds}.`]); if (st.tested.length >= 6 && !st.won) setTimeout(win, 1700); }
  if (mode === 'bright') { if (ev.br && ev.nl === 2 && ev.nb === 2 && !st.won) win(); else if (ev.br && ev.nl === 2) why(['Two bulbs share one cell\'s push, so each glows dimly. Add another cell!', 'दो बल्ब एक सेल का धक्का बाँटते हैं, इसलिए धीमे जलते हैं। एक और सेल लगाओ!', 'Do bulb ek cell ka push baant-te hain, isliye dheeme jalte hain. Ek aur cell lagao!']); else if (ev.br && ev.nb > ev.nl) why(['Very bright! More cells than bulbs push extra hard — real bulbs can burn out. Two bulbs with two cells is just right.', 'बहुत तेज़! बल्बों से ज़्यादा सेल ज़्यादा धक्का देते हैं — असली बल्ब फुँक सकते हैं। दो बल्ब और दो सेल बिल्कुल सही हैं।', 'Bahut tez! Bulbs se zyada cells zyada push dete hain — asli bulb fuse ho sakte hain. Do bulb aur do cell bilkul sahi hain.']); else why(['Fill every gap. A wire just connects; cells push; bulbs use the energy to make light.', 'हर ख़ाली जगह भरो। तार बस जोड़ता है; सेल धक्का देता है; बल्ब ऊर्जा से रोशनी बनाता है।', 'Har khaali jagah bharo. Taar bas jodta hai; cell push deta hai; bulb energy se roshni banaata hai.']); } }
function win() { st.won = true; K.star(3); K.done('circuit-builder', mode, { mode, solved: true, ...(mode === 'test' ? { tested: st.tested.length, correctGuesses: st.preds } : {}) });
  setTimeout(() => K.win(['Circuit champion!', 'सर्किट चैंपियन!', 'Circuit champion!'], { light: L('You made a closed circuit. Electricity flowed from the cell, through the bulb, and back.', 'तुमने बंद सर्किट बनाया। बिजली सेल से बल्ब होकर वापस बही।', 'Tumne closed circuit banaya. Bijli cell se bulb hokar wapas bahi.'), switch: L('Switches open and close the loop. Now you know how every light switch works!', 'स्विच घेरा खोलते और बंद करते हैं। अब तुम जानते हो हर स्विच कैसे काम करता है!', 'Switch ghera kholte aur band karte hain. Ab tum jaante ho har switch kaise kaam karta hai!'), test: L(`Metals conduct; plastic, rubber, wood, paper and glass insulate. You guessed ${st.preds} of ${st.tested.length} right.`, `धातुएँ बिजली चलाती हैं; प्लास्टिक, रबर, लकड़ी, काग़ज़ और काँच रोकते हैं। तुम्हारे ${st.tested.length} में से ${st.preds} अंदाज़े सही।`, `Metals conduct karte hain; plastic, rubber, lakdi, kaagaz aur kaanch rokte hain. Tumhare ${st.tested.length} mein se ${st.preds} guess sahi.`), bright: L('Two bulbs in one loop share the push. Two cells give enough push for both to shine.', 'एक घेरे में दो बल्ब धक्का बाँटते हैं। दो सेल दोनों को चमकाने लायक धक्का देते हैं।', 'Ek ghere mein do bulb push baant-te hain. Do cells dono ko chamkaane laayak push dete hain.') }[mode], null, '💡', () => start()), 1400); }
function drawModes() { const m = $('#modes'); m.innerHTML = ''; for (const k in MODES) { const b = el('button', { 'aria-pressed': k === mode }, t(MODES[k].n)); b.onclick = () => { mode = k; start(); }; m.append(b); } }
function start() { drawModes(); reset(); $('#goal').innerHTML = `<span style="font-size:22px">🎯</span><div><b>${t(['Goal', 'लक्ष्य', 'Goal'])}:</b> ${esc(t(cfg.mode === mode && cfg.goal ? [cfg.goal.en, cfg.goal.hi || cfg.goal.en, cfg.goal.hinglish] : MODES[mode].goal))}</div>`;
  $('#shelves').style.display = mode === 'test' ? '' : 'none'; $('#cond').innerHTML = ''; $('#ins').innerHTML = ''; $('#sh1').textContent = '⚡ ' + t(['Conductors', 'चालक', 'Conductors']); $('#sh2').textContent = '🚫 ' + t(['Insulators', 'कुचालक', 'Insulators']); afterChange(); }
K.onLang(() => { draw(); drawTray(); drawModes(); });
start();
})();
</script></body></html>
