<title>Think-first cards · create, credit, AI and safety · Tech & AI Lab</title>
<!-- Lab: think-cards (Level 1). Tara the parrot's sorting cards: read a card, choose a box, read why.
     Decks (?mode= / config.mode): apps (draw / music / story) | credit | ai-art | voice (voice-clone scam calls) | news (is it true?) | report (tell, block, report, 1930) | helper (AI is a helper, not magic).
     Defensive safety only. Deterministic, no eval, no network. Own work, MIT. -->
<style>/* L1 lab kit (own work, MIT). Family App palette from src/lib/design-tokens.ts */
:root{--royal:#1D4ED8;--sapphire:#002357;--grape:#8B3DFF;--violet:#4400F0;--tangerine:#FF7A1A;--coral:#FF6B57;--gold:#F5B90A;--turq:#14B8A6;--emerald:#0F766E;--cyan:#02CFF9;--slate:#1E293B;--off:#F9FAFB;--ink2:#475569;--r:18px;--sh:0 6px 18px rgba(30,41,59,.12),0 1px 3px rgba(30,41,59,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--off);color:var(--slate);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overscroll-behavior:none}
body{background:transparent;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.kbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(120deg,var(--sapphire),var(--royal) 60%,var(--grape));color:#fff;box-shadow:0 2px 10px rgba(0,35,87,.25)}
.kbar{flex-wrap:wrap;row-gap:6px}
.kbar h1{flex:1 1 9em;min-width:0;margin:0;font-size:16px;line-height:1.2;font-weight:800;letter-spacing:.2px;overflow-wrap:break-word}/* title never cut: controls move to a 2nd row when needed */
.kctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.kbar .kemo{font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.kpill{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.kpill button{padding:5px 9px;border-radius:999px;font-size:12.5px;font-weight:700;color:#e0e7ff;min-height:32px}
.kpill button[aria-pressed=true]{background:#fff;color:var(--royal)}
.kstars{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;font-weight:800;font-size:14px;min-width:54px;justify-content:center}
.kstars.bump{animation:kbump .5s}
@keyframes kbump{40%{transform:scale(1.35)}}
.kgoal{margin:10px 12px 0;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.kgoal b{color:var(--royal)}
.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:800;background:var(--royal);color:#fff;box-shadow:0 4px 0 #1239a8,var(--sh);transition:transform .08s}
.kbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1239a8}
.kbtn.alt{background:#fff;color:var(--royal);box-shadow:0 4px 0 #c7d2fe,var(--sh)}
.kbtn.go{background:var(--turq);box-shadow:0 4px 0 #0d8a7c,var(--sh)}
.kbtn.warn{background:var(--tangerine);box-shadow:0 4px 0 #c75a0c,var(--sh)}
.kbtn[disabled]{opacity:.45;pointer-events:none}
.ktoast{pointer-events:none;position:fixed;left:0;top:0;width:max-content;z-index:60;max-width:min(92vw,360px);padding:12px 16px;border-radius:16px;background:var(--slate);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center;line-height:1.35;font-size:15px;opacity:0;visibility:hidden;transform:scale(.9);transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1),visibility 0s .3s}
.ktoast.show{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1)}
.ktoast.inline{position:static;display:block;width:auto;max-width:none;margin:10px 12px;grid-column:1/-1;flex:0 0 auto}
.ktoast.good{background:var(--emerald)}.ktoast.bad{background:#b4321f}
#kconf{position:fixed;inset:0;pointer-events:none;z-index:-1}/* behind content; inside the win dialog it sits behind the card */
.kwin #kconf{position:absolute;z-index:0}.kwin>div{position:relative;z-index:1}
.kwin{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:rgba(6,18,51,.55);backdrop-filter:blur(3px);padding:20px}
.kwin.show{display:flex}
.kwin>div{background:#fff;border-radius:24px;padding:22px;text-align:center;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:kpop .5s cubic-bezier(.2,1.5,.4,1)}
.kwin .big{font-size:64px;line-height:1;animation:kspin 1.2s ease-out}
.kwin h2{margin:10px 0 6px;font-size:22px}
.kwin p{margin:0 0 14px;color:var(--ink2)}
@keyframes kpop{from{transform:scale(.6);opacity:0}}
@keyframes kspin{from{transform:rotateY(-540deg) scale(.4)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.kvoice{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);font-size:17px;opacity:.6}
.kvoice[aria-pressed=true]{background:#fff;opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
</style>
<style>
main{flex:1;display:flex;flex-direction:column;gap:9px;padding:8px 10px 16px}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button{padding:7px 12px;border-radius:999px;background:#fff;box-shadow:var(--sh);font-weight:700;font-size:13px;min-height:36px;white-space:normal;text-align:center;max-width:100%}
.modes button[aria-pressed=true]{background:#0F766E;color:#fff}
.scen{font-size:14px;background:#fff7ed;border-left:4px solid #f97316;padding:8px 10px;border-radius:10px;font-weight:700}
.stack{position:relative;perspective:800px;min-height:190px}
.card{background:#fff;border-radius:22px;box-shadow:0 10px 26px rgba(15,23,42,.16);padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:flip .45s cubic-bezier(.3,1.3,.5,1)}

.card .e{font-size:54px;line-height:1;animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.card .tx{font-size:17px;font-weight:800;color:#0f172a;overflow-wrap:anywhere}
.card.ok{outline:4px solid #22c55e}.card.no{outline:4px solid #f59e0b}
.bins{display:flex;flex-wrap:wrap;gap:8px}

.fb{border-radius:14px;padding:10px 12px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.fb.ok{background:#dcfce7}.fb.no{background:#fef3c7}
.fb .h{font-weight:900;display:block}
.prog{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.prog i{width:11px;height:11px;border-radius:50%;background:#cbd5e1}.prog i.r{background:#22c55e}.prog i.w{background:#f59e0b}
.go{display:flex;flex-wrap:wrap;gap:8px}.go .kbtn{flex:1 1 120px}
@media (orientation:landscape) and (max-height:520px){main{display:grid;grid-template-columns:1fr 1fr;align-items:start}.modes,#goal{grid-column:1/-1}.stack{min-height:150px}.card .e{font-size:40px}}

let mode = D[K.q.get('mode')] ? K.q.get('mode') : D[cfg.mode] ? cfg.mode : 'apps'; let st;
function drawModes() { const m = $('#modes'); m.innerHTML = ''; for (const k in D) { const b = el('button', { role: 'tab', 'aria-pressed': k === mode, 'aria-selected': k === mode }, esc(t(D[k].n))); b.onclick = () => { mode = k; start(); }; m.append(b); } }
function prog() { $('#prog').innerHTML = D[mode].cards.map((_, k) => `<i class="${st.res[k] === true ? 'r' : st.res[k] === false ? 'w' : ''}"></i>`).join(''); }
function show() { const d = D[mode]; prog(); const c = d.cards[st.i]; $('#fbHost').innerHTML = ''; $('#go').innerHTML = '';
  $('#stack').innerHTML = ''; $('#stack').append(el('div', { class: 'card', id: 'card' }, `<span class="e">${c.e}</span><span class="tx">${esc(t(c.tx))}</span>`));
  const B = $('#bins'); B.innerHTML = ''; B.className = 'bins' + (d.bins.length === 3 ? ' three' : ''); d.bins.forEach((b, k) => { const x = el('button', { id: 'bin' + k }, esc(t(b))); x.onclick = () => answer(k); B.append(x); }); }
function answer(k) { if (st.locked) return; st.locked = true; const d = D[mode], c = d.cards[st.i], ok = k === c.a; st.res[st.i] = ok; if (ok) st.right++; K.sfx(ok ? 'good' : 'bad'); prog();
  $('#card').classList.add(ok ? 'ok' : 'no'); $('#bins').querySelectorAll('button').forEach((b) => b.disabled = true);
  $('#fbHost').innerHTML = ''; $('#fbHost').append(el('div', { class: 'fb ' + (ok ? 'ok' : 'no'), id: 'fb' }, `<span style="font-size:22px">${ok ? '✅' : '💡'}</span><div><span class="h">${esc(t(ok ? ['Correct!', 'सही!', 'Sahi!'] : ['Think again: ' + t(d.bins[c.a]), 'फिर सोचो: ' + t(d.bins[c.a]), 'Phir socho: ' + t(d.bins[c.a])]))}</span>${esc(t(c.why))}</div>`));
  const last = st.i >= d.cards.length - 1; const n = el('button', { class: 'kbtn go', id: 'next' }, last ? '🏁 ' + t(['Finish', 'पूरा करो', 'Finish']) : t(['Next card ➡', 'अगला कार्ड ➡', 'Agla card ➡'])); n.onclick = () => { st.locked = false; if (last) return finish(); st.i++; show(); }; $('#go').append(n); }
function finish() { const n = D[mode].cards.length, pass = st.right >= n - 1; K.done('think-cards', mode, { mode, right: st.right, total: n, pass }); if (pass) K.star(3);
  K.win(pass ? ['Think-first star!', 'सोचो-पहले सितारा!', 'Think-first star!'] : ['Good try!', 'अच्छी कोशिश!', 'Achhi koshish!'], [`${st.right} of ${n} right.` + (pass ? '' : ' Try once more to get at least ' + (n - 1) + '.'), `${n} में से ${st.right} सही।` + (pass ? '' : ' कम से कम ' + (n - 1) + ' के लिए फिर कोशिश करो।'), `${n} mein se ${st.right} sahi.` + (pass ? '' : ' Kam se kam ' + (n - 1) + ' ke liye phir try karo.')], null, pass ? '🦜' : '💪', () => start()); }
window.__tcState = () => ({ mode, i: st.i, right: st.right, ans: D[mode].cards.map((c) => c.a) });
function start() { st = { i: 0, right: 0, res: [] }; drawModes(); const d = D[mode]; $('#goal').innerHTML = `<span style="font-size:22px">🎯</span><div><b>${t(['Goal', 'लक्ष्य', 'Goal'])}:</b> ${esc(t(cfg.mode === mode && cfg.goal ? [cfg.goal.en, cfg.goal.hi || cfg.goal.en, cfg.goal.hinglish] : d.goal))}</div>`; const s = $('#scen'); s.hidden = !d.scen; s.textContent = d.scen ? t(d.scen) : ''; show(); }
K.onLang(() => { const keep = st; start(); if (keep) { Object.assign(st, keep, { locked: false }); show(); } });
start();
})();
