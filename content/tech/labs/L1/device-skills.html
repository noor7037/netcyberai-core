<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1D4ED8">
<title>Device skills · Tech & AI Lab</title>
<!-- Lab: device-skills (Level 1). Practise using a device: tap / double-tap / long-press / drag; find keys on a QWERTY keyboard
     (with the F and J bumps); type home-row words; organise files into folders and make a new folder.
     Modes (?mode=): tap | keys | type | files. Works with touch, mouse and a real keyboard. Own work, MIT. -->
<style>/* L1 lab kit (own work, MIT). Family App palette from src/lib/design-tokens.ts */
:root{--royal:#1D4ED8;--sapphire:#002357;--grape:#8B3DFF;--violet:#4400F0;--tangerine:#FF7A1A;--coral:#FF6B57;--gold:#F5B90A;--turq:#14B8A6;--emerald:#0F766E;--cyan:#02CFF9;--slate:#1E293B;--off:#F9FAFB;--ink2:#475569;--r:18px;--sh:0 6px 18px rgba(30,41,59,.12),0 1px 3px rgba(30,41,59,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--off);color:var(--slate);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overscroll-behavior:none}
body{background:transparent;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.kbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(120deg,var(--sapphire),var(--royal) 60%,var(--grape));color:#fff;box-shadow:0 2px 10px rgba(0,35,87,.25)}
.kbar{flex-wrap:wrap;row-gap:6px}
.kbar h1{flex:1 1 9em;min-width:0;margin:0;font-size:16px;line-height:1.2;font-weight:800;letter-spacing:.2px;overflow-wrap:break-word}/* title never cut: controls move to a 2nd row when needed */
.kctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.kbar .kemo{font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.kpill{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.kpill button{padding:5px 9px;border-radius:999px;font-size:12.5px;font-weight:700;color:#e0e7ff;min-height:32px}
.kpill button[aria-pressed=true]{background:#fff;color:var(--royal)}
.kstars{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;font-weight:800;font-size:14px;min-width:54px;justify-content:center}
.kstars.bump{animation:kbump .5s}
@keyframes kbump{40%{transform:scale(1.35)}}
.kgoal{margin:10px 12px 0;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.kgoal b{color:var(--royal)}
.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:800;background:var(--royal);color:#fff;box-shadow:0 4px 0 #1239a8,var(--sh);transition:transform .08s}
.kbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1239a8}
.kbtn.alt{background:#fff;color:var(--royal);box-shadow:0 4px 0 #c7d2fe,var(--sh)}
.kbtn.go{background:var(--turq);box-shadow:0 4px 0 #0d8a7c,var(--sh)}
.kbtn.warn{background:var(--tangerine);box-shadow:0 4px 0 #c75a0c,var(--sh)}
.kbtn[disabled]{opacity:.45;pointer-events:none}
.ktoast{pointer-events:none;position:fixed;left:0;top:0;width:max-content;z-index:60;max-width:min(92vw,360px);padding:12px 16px;border-radius:16px;background:var(--slate);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center;line-height:1.35;font-size:15px;opacity:0;visibility:hidden;transform:scale(.9);transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1),visibility 0s .3s}
.ktoast.show{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1)}
.ktoast.inline{position:static;display:block;width:auto;max-width:none;margin:10px 12px;grid-column:1/-1;flex:0 0 auto}
.ktoast.good{background:var(--emerald)}.ktoast.bad{background:#b4321f}
#kconf{position:fixed;inset:0;pointer-events:none;z-index:-1}/* behind content; inside the win dialog it sits behind the card */
.kwin #kconf{position:absolute;z-index:0}.kwin>div{position:relative;z-index:1}
.kwin{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:rgba(6,18,51,.55);backdrop-filter:blur(3px);padding:20px}
.kwin.show{display:flex}
.kwin>div{background:#fff;border-radius:24px;padding:22px;text-align:center;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:kpop .5s cubic-bezier(.2,1.5,.4,1)}
.kwin .big{font-size:64px;line-height:1;animation:kspin 1.2s ease-out}
.kwin h2{margin:10px 0 6px;font-size:22px}
.kwin p{margin:0 0 14px;color:var(--ink2)}
@keyframes kpop{from{transform:scale(.6);opacity:0}}
@keyframes kspin{from{transform:rotateY(-540deg) scale(.4)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.kvoice{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);font-size:17px;opacity:.6}
.kvoice[aria-pressed=true]{background:#fff;opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
</style>

.task{font-weight:900;font-size:18px;text-align:center;padding:10px 8px 0}

.box{position:absolute;right:16px;bottom:16px;width:110px;height:96px;border-radius:18px;border:3px dashed var(--grape);display:flex;align-items:center;justify-content:center;font-size:42px;background:#faf5ff}
.box.hot{background:#ede9fe;transform:scale(1.05)}
.kb{display:flex;flex-direction:column;gap:5px;padding:8px;background:#1e293b;border-radius:18px;box-shadow:var(--sh);transform:perspective(700px) rotateX(18deg);transform-origin:50% 100%}
.kr{display:flex;gap:4px;justify-content:center}
.k{flex:1;max-width:44px;height:44px;border-radius:9px;background:linear-gradient(#f8fafc,#e2e8f0);box-shadow:0 3px 0 #94a3b8;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;position:relative;color:#1e293b}
.k.wide{max-width:none;flex:2.2;font-size:12px}.k.space{flex:6;max-width:none}
.k.home{background:linear-gradient(#fef9c3,#fde68a)}
.k.bump::after{content:'';position:absolute;bottom:7px;width:12px;height:3px;border-radius:2px;background:#475569}
.k.hint{outline:3px solid var(--tangerine);animation:np 1s ease-in-out infinite}@keyframes np{50%{outline-offset:3px}}
.k.down{transform:translateY(3px);box-shadow:0 0 0 #94a3b8}
.k.ok{background:#bbf7d0}.k.bad{background:#fecaca}
.screen{background:#0f172a;color:#e2e8f0;border-radius:16px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:22px;min-height:54px;letter-spacing:1px;word-break:break-all}
.screen .cur{display:inline-block;width:11px;height:24px;background:#5eead4;vertical-align:middle;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.screen .want{color:#64748b}.screen .done{color:#86efac}
.fm{display:grid;grid-template-columns:1fr;gap:8px}
.folders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.folder{border-radius:16px;background:#fff;box-shadow:var(--sh);padding:8px 4px;text-align:center;font-weight:800;font-size:13px;min-height:92px;transition:transform .15s}
.folder .fi{font-size:34px;display:block}.folder .fc{font-size:18px;min-height:22px}
.folder.hot{transform:scale(1.07);outline:3px solid var(--royal)}
.files{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:10px;min-height:80px}
.file{width:84px;border-radius:12px;background:#f8fafc;box-shadow:0 2px 0 #cbd5e1;padding:6px 2px;text-align:center;font-size:11px;font-weight:800;overflow-wrap:anywhere}
.file b{display:block;font-size:28px}
.newf{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.newf button{padding:7px 10px;border-radius:10px;background:#eef2ff;font-weight:800;font-size:13px;min-height:36px}
.why{font-size:14px;background:#eff6ff;border-left:4px solid var(--royal);padding:8px 10px;border-radius:10px}
.prog{display:flex;gap:4px;justify-content:center}.prog i{width:22px;height:8px;border-radius:9px;background:#e2e8f0}.prog i.on{background:var(--turq)}
@media (orientation:landscape) and (max-height:520px){main{display:grid;grid-template-columns:1fr 1fr;align-items:start}.modes,#goal{grid-column:1/-1}}

function nameFolder(nf) { nf.innerHTML = `<b style="font-size:13px">${t(['Name it:', 'नाम रखो:', 'Naam rakho:'])}</b>`; [['Stuff', 'Holiday', 'asdf']].flat().forEach((n) => { const b = el('button', { id: 'nm-' + n }, '📁 ' + n); b.onclick = () => { if (n === 'Holiday') { st.holiday = true; K.sfx('good'); K.star(); why(['A good folder name tells you what is inside. "asdf" or "Stuff" would be hard to find later!', 'अच्छा फ़ोल्डर नाम बताता है कि अंदर क्या है। "asdf" या "Stuff" बाद में ढूँढना मुश्किल होगा!', 'Achha folder naam batata hai ki andar kya hai. "asdf" ya "Stuff" baad mein dhoondhna mushkil hoga!']); filesMode(); } else { K.sfx('bad'); K.toast(['Hmm — will you remember what is inside a folder with that name?', 'हम्म — क्या उस नाम के फ़ोल्डर में क्या है, याद रहेगा?', 'Hmm — kya us naam ke folder mein kya hai, yaad rahega?'], 'bad'); } }; nf.append(b); }); }
function dropFile(x, px, py) { K._hover(-1, -1); const tgt = [...document.querySelectorAll('.folder')].find((f) => { const r = f.getBoundingClientRect(); return px > r.left && px < r.right && py > r.top && py < r.bottom; }); if (!tgt) return false; const f = tgt.dataset.f;
  if (f !== x.f) { K.sfx('bad'); const ext = x.name.split('.').pop(); K.toast([`Look at the name and the ending .${ext} — what kind of file is it?`, `नाम और आख़िरी हिस्सा .${ext} देखो — यह किस तरह की फ़ाइल है?`, `Naam aur aakhri hissa .${ext} dekho — yeh kis tarah ki file hai?`], 'bad', 2600); return false; }
  st.placed[x.id] = f; K.sfx('good'); K.star(); setTimeout(filesMode, 10); return true; }

function drawModes() { const m = $('#modes'); m.innerHTML = ''; for (const k in MODES) { const b = el('button', { 'aria-pressed': k === mode }, t(MODES[k].n)); b.onclick = () => { mode = k; start(); }; m.append(b); } }

  ({ tap: tapMode, keys: keysMode, type: typeMode, files: filesMode })[mode](); if (mode === 'files') why(['File names end in a type: .docx and .pdf are documents, .png and .jpg are pictures, .mp3 is sound.', 'फ़ाइल के नाम के आख़िर में प्रकार होता है: .docx और .pdf दस्तावेज़, .png और .jpg चित्र, .mp3 आवाज़।', 'File naam ke aakhir mein type hota hai: .docx aur .pdf documents, .png aur .jpg pictures, .mp3 sound.']); }
