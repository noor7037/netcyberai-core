<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F766E">
<title>Gajju's story stage · block coding · Tech & AI Lab</title>
<!-- Lab: story-blocks (Level 1). Tap-to-build block stories and games with Gajju the elephant.
     Modes (?mode= / config.mode): story (sequence) | debug (fix a buggy story) | ifelse (IF / ELSE weather rule) | game (events + score variable + IF).
     Deterministic interpreter over a block list (no eval). Own work, MIT. -->
<style>/* L1 lab kit (own work, MIT). Family App palette from src/lib/design-tokens.ts */
:root{--royal:#1D4ED8;--sapphire:#002357;--grape:#8B3DFF;--violet:#4400F0;--tangerine:#FF7A1A;--coral:#FF6B57;--gold:#F5B90A;--turq:#14B8A6;--emerald:#0F766E;--cyan:#02CFF9;--slate:#1E293B;--off:#F9FAFB;--ink2:#475569;--r:18px;--sh:0 6px 18px rgba(30,41,59,.12),0 1px 3px rgba(30,41,59,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--off);color:var(--slate);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overscroll-behavior:none}
body{background:transparent;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.kbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(120deg,var(--sapphire),var(--royal) 60%,var(--grape));color:#fff;box-shadow:0 2px 10px rgba(0,35,87,.25)}
.kbar{flex-wrap:wrap;row-gap:6px}
.kbar h1{flex:1 1 9em;min-width:0;margin:0;font-size:16px;line-height:1.2;font-weight:800;letter-spacing:.2px;overflow-wrap:break-word}/* title never cut: controls move to a 2nd row when needed */
.kctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.kbar .kemo{font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.kpill{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.kpill button{padding:5px 9px;border-radius:999px;font-size:12.5px;font-weight:700;color:#e0e7ff;min-height:32px}
.kpill button[aria-pressed=true]{background:#fff;color:var(--royal)}
.kstars{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;font-weight:800;font-size:14px;min-width:54px;justify-content:center}
.kstars.bump{animation:kbump .5s}
@keyframes kbump{40%{transform:scale(1.35)}}
.kgoal{margin:10px 12px 0;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.kgoal b{color:var(--royal)}
.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:800;background:var(--royal);color:#fff;box-shadow:0 4px 0 #1239a8,var(--sh);transition:transform .08s}
.kbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1239a8}
.kbtn.alt{background:#fff;color:var(--royal);box-shadow:0 4px 0 #c7d2fe,var(--sh)}
.kbtn.go{background:var(--turq);box-shadow:0 4px 0 #0d8a7c,var(--sh)}
.kbtn.warn{background:var(--tangerine);box-shadow:0 4px 0 #c75a0c,var(--sh)}
.kbtn[disabled]{opacity:.45;pointer-events:none}
.ktoast{pointer-events:none;position:fixed;left:0;top:0;width:max-content;z-index:60;max-width:min(92vw,360px);padding:12px 16px;border-radius:16px;background:var(--slate);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center;line-height:1.35;font-size:15px;opacity:0;visibility:hidden;transform:scale(.9);transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1),visibility 0s .3s}
.ktoast.show{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1)}
.ktoast.inline{position:static;display:block;width:auto;max-width:none;margin:10px 12px;grid-column:1/-1;flex:0 0 auto}
.ktoast.good{background:var(--emerald)}.ktoast.bad{background:#b4321f}
#kconf{position:fixed;inset:0;pointer-events:none;z-index:-1}/* behind content; inside the win dialog it sits behind the card */
.kwin #kconf{position:absolute;z-index:0}.kwin>div{position:relative;z-index:1}
.kwin{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:rgba(6,18,51,.55);backdrop-filter:blur(3px);padding:20px}
.kwin.show{display:flex}
.kwin>div{background:#fff;border-radius:24px;padding:22px;text-align:center;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:kpop .5s cubic-bezier(.2,1.5,.4,1)}
.kwin .big{font-size:64px;line-height:1;animation:kspin 1.2s ease-out}
.kwin h2{margin:10px 0 6px;font-size:22px}
.kwin p{margin:0 0 14px;color:var(--ink2)}
@keyframes kpop{from{transform:scale(.6);opacity:0}}
@keyframes kspin{from{transform:rotateY(-540deg) scale(.4)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.kvoice{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);font-size:17px;opacity:.6}
.kvoice[aria-pressed=true]{background:#fff;opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
</style>

.drop{position:absolute;top:-30px;font-size:16px;animation:rain .7s linear infinite}@keyframes rain{to{transform:translateY(230px)}}
.mango{position:absolute;font-size:30px;width:20%;text-align:center;top:-40px;z-index:1}
.score{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);border-radius:12px;padding:4px 10px;font-weight:900;font-size:15px;z-index:3}
.day{position:absolute;left:10px;bottom:6px;background:rgba(255,255,255,.92);border-radius:12px;padding:4px 10px;font-weight:900;font-size:14px;z-index:3}
.ws{display:grid;grid-template-columns:1fr;gap:8px}
.panel{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:10px}
.panel h3{margin:0 0 6px;font-size:14px;color:#334155}
.script{display:flex;flex-direction:column;gap:5px;min-height:60px}
.blk{display:flex;align-items:center;gap:6px;border-radius:12px;padding:8px 10px;font-weight:800;font-size:14px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);min-height:40px;position:relative}
.blk .tx{flex:1;min-width:0;overflow-wrap:anywhere}

.blk.bug{outline:3px dashed #ef4444;outline-offset:2px}
.blk .mini{background:rgba(255,255,255,.25);color:#fff;border-radius:8px;min-width:32px;min-height:32px;font-size:14px;font-weight:900}

.palette{display:flex;flex-wrap:wrap;gap:6px}
.palette .blk{cursor:pointer;flex:1 1 140px}
.cond{display:flex;flex-direction:column;gap:6px}
.cond .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:900;font-size:14px}

.opts{display:flex;flex-wrap:wrap;gap:6px}

.go{display:flex;flex-wrap:wrap;gap:8px}
.go .kbtn{flex:1 1 120px}
.pad{display:flex;gap:10px;justify-content:center}
.pad button{width:72px;height:56px;border-radius:16px;background:#0f172a;color:#fff;font-size:26px;box-shadow:0 4px 0 #475569}

.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
@media (orientation:landscape) and (max-height:520px){main{display:grid;grid-template-columns:1fr 1fr;align-items:start}.modes,#goal{grid-column:1/-1}.stage{height:160px}}

  st.busy = false; if (ok === 2) return win(L('Your rule works on both days! IF/ELSE lets one program make the right choice in different situations — like a phone switching to dark mode at night.', 'तुम्हारा नियम दोनों दिन चला! अगर/नहीं तो से एक ही प्रोग्राम अलग हालात में सही फ़ैसला लेता है — जैसे रात में फ़ोन डार्क मोड में चला जाता है।', 'Tumhara rule dono din chala! IF/ELSE se ek hi program alag situations mein sahi faisla leta hai — jaise raat mein phone dark mode mein chala jaata hai.'), { days: 2 });
  const m = !res[0] ? ['On the rainy day Gajju got wet. Which action should happen when it rains?', 'बारिश वाले दिन गज्जू भीग गया। बारिश में कौन सा काम होना चाहिए?', 'Baarish wale din Gajju bheeg gaya. Baarish mein kaun sa action hona chahiye?'] : ['On the sunny day Gajju was too hot. What should happen when it is NOT raining?', 'धूप वाले दिन गज्जू को बहुत गर्मी लगी। जब बारिश न हो तब क्या होना चाहिए?', 'Dhoop wale din Gajju ko bahut garmi lagi. Jab baarish NA ho tab kya hona chahiye?']; K.toast(m, 'bad'); why(m); }
// ---------- game ----------
const GB = [{ id: 'start', c: 'ev', l: L('🚩 When game starts → set score to 0', '🚩 जब गेम शुरू हो → स्कोर = 0', '🚩 Jab game shuru ho → score = 0'), need: true },
  { id: 'left', c: 'ev', l: L('⬅ When left button pressed → move left', '⬅ जब बायाँ बटन दबे → बाएँ चलो', '⬅ Jab left button dabe → left chalo'), need: true },
  { id: 'right', c: 'ev', l: L('➡ When right button pressed → move right', '➡ जब दायाँ बटन दबे → दाएँ चलो', '➡ Jab right button dabe → right chalo'), need: true },
  { id: 'catch', c: 'var', l: L('🥭 When mango touches Gajju → change score by 1', '🥭 जब आम गज्जू को छुए → स्कोर में 1 जोड़ो', '🥭 Jab mango Gajju ko chhuye → score mein 1 jodo'), need: true },
  { id: 'win', c: 'ctl', l: L('🏆 IF score = 5 → say "I win!"', '🏆 अगर स्कोर = 5 → बोलो "मैं जीता!"', '🏆 IF score = 5 → bolo "Main jeeta!"'), need: true },
  { id: 'sleep', c: 'look', l: L('😴 When mango touches Gajju → go to sleep', '😴 जब आम गज्जू को छुए → सो जाओ', '😴 Jab mango Gajju ko chhuye → so jao'), need: false }];
const COLS = [2, 0, 3, 1, 4, 2, 0, 3, 1, 4, 2, 3];
function gameMode() { st.have = st.have || new Set(); st.pos = 2; const S = stage({ pos: 2 }); S.append(el('div', { class: 'score', id: 'score' }, `⭐ ${t(['score', 'स्कोर', 'score'])} = ${st.score ?? 0}`)); const W = $('#ws'); W.innerHTML = '';
  const p = el('div', { class: 'panel' }, `<h3>📜 ${t(['Game rules (tap to add or remove)', 'गेम के नियम (जोड़ने/हटाने को टैप करो)', 'Game rules (add/remove ke liye tap karo)'])}</h3>`); const pp = el('div', { class: 'script' });
  GB.forEach((g) => { const on = st.have.has(g.id); const b = el('button', { class: 'blk ' + g.c, id: 'g-' + g.id, 'aria-pressed': on, style: on ? '' : 'opacity:.55;filter:saturate(.4)' }, `<span class="tx">${on ? '✅ ' : '➕ '}${esc(t(g.l))}</span>`); b.onclick = () => { if (st.busy) return; on ? st.have.delete(g.id) : st.have.add(g.id); K.sfx('tap'); gameMode(); }; pp.append(b); }); p.append(pp);
  const go = el('div', { class: 'go' }); const run = el('button', { class: 'kbtn', id: 'run' }, '▶ ' + t(['Play the game', 'गेम खेलो', 'Game khelo'])); run.onclick = playGame; go.append(run);
  const pad = el('div', { class: 'pad' }); const bl = el('button', { id: 'padL', 'aria-label': 'left' }, '⬅'), br = el('button', { id: 'padR', 'aria-label': 'right' }, '➡'); bl.onclick = () => press('left'); br.onclick = () => press('right'); pad.append(bl, br);
  W.append(pad, go, p); why(['An event is "when something happens". Each game rule waits for its event: a button press, a mango touching Gajju. The score is a variable — a box that holds a number.', 'इवेंट मतलब "जब कुछ हो"। हर नियम अपने इवेंट का इंतज़ार करता है: बटन दबना, आम का गज्जू को छूना। स्कोर एक वेरिएबल है — संख्या रखने वाला डिब्बा।', 'Event matlab "jab kuch ho". Har rule apne event ka intezaar karta hai: button dabna, mango ka Gajju ko chhoona. Score ek variable hai — number rakhne wala dabba.']); }
function press(dir) { if (!st.playing) return; if (!st.have.has(dir)) { st.noMove = dir; return; } st.pos = Math.max(0, Math.min(4, st.pos + (dir === 'left' ? -1 : 1))); place(st.pos); K.sfx('move'); }
window.__sbState = () => ({ pos: st.pos, playing: !!st.playing, next: st.nextCol, score: st.score });
async function playGame() { if (st.busy) return; st.busy = true; st.playing = true; st.score = st.have.has('start') ? 0 : NaN; st.noMove = null; let caught = 0, slept = false, said = false; const S = $('#stage'); const sc = $('#score');
  const show = () => sc.textContent = `⭐ ${t(['score', 'स्कोर', 'score'])} = ${Number.isNaN(st.score) ? '?' : st.score}`; show();
  for (let i = 0; i < COLS.length && !said; i++) { const col = COLS[i]; st.nextCol = col; const m = el('div', { class: 'mango', 'data-ov-sprite': '' }, '🥭'); m.style.left = col * 20 + '%'; S.append(m);
    const T0 = performance.now(), dur = 1500; await new Promise((res) => { (function f(now) { const k = Math.min(1, (now - T0) / dur); m.style.top = (-40 + k * 150) + 'px'; if (k < 1) requestAnimationFrame(f); else res(); })(performance.now()); });
    if (col === st.pos) { if (st.have.has('sleep')) { slept = true; $('#gear').textContent = '💤'; } if (st.have.has('catch')) { st.score = st.score + 1; caught++; K.sfx('good'); K.star(); } else K.sfx('tap'); show(); if (st.have.has('win') && st.score === 5) { said = true; speech(t(['I win!', 'मैं जीता!', 'Main jeeta!'])); } }
    m.remove(); if (slept) break; }
  st.playing = false; st.busy = false;
  if (said) return win(L('You built a real game: events (button presses, a mango touching Gajju), a variable (score) and a condition (IF score = 5). Every video game is made of rules like these.', 'तुमने असली गेम बनाया: इवेंट (बटन दबना, आम का गज्जू को छूना), वेरिएबल (स्कोर) और शर्त (अगर स्कोर = 5)। हर वीडियो गेम ऐसे ही नियमों से बनता है।', 'Tumne asli game banaya: events (button dabna, mango ka Gajju ko chhoona), variable (score) aur condition (IF score = 5). Har video game aise hi rules se banta hai.'), { caught });
  let m; if (slept) m = ['Gajju fell asleep when a mango touched him! Remove the rule that does not belong in this game.', 'आम छूते ही गज्जू सो गया! वह नियम हटाओ जो इस गेम का नहीं है।', 'Mango chhoote hi Gajju so gaya! Woh rule hatao jo is game ka nahin hai.'];
  else if (st.noMove) m = [`You pressed ${st.noMove === 'left' ? '⬅' : '➡'} but nothing happened. Which event rule is missing?`, `तुमने ${st.noMove === 'left' ? '⬅' : '➡'} दबाया पर कुछ नहीं हुआ। कौन सा इवेंट नियम ग़ायब है?`, `Tumne ${st.noMove === 'left' ? '⬅' : '➡'} dabaaya par kuch nahin hua. Kaun sa event rule gaayab hai?`];
  else if (!st.have.has('start')) m = ['The score shows "?" — it was never set at the start. Add the rule that sets score to 0.', 'स्कोर "?" दिखा रहा है — शुरू में कभी सेट नहीं हुआ। स्कोर को 0 करने वाला नियम जोड़ो।', 'Score "?" dikha raha hai — shuru mein kabhi set nahin hua. Score ko 0 karne wala rule jodo.'];
  else if (!st.have.has('catch')) m = ['Mangoes touched Gajju but the score did not change. Which rule adds 1 to the score?', 'आम गज्जू को छुए पर स्कोर नहीं बदला। कौन सा नियम स्कोर में 1 जोड़ता है?', 'Mangoes Gajju ko chhuye par score nahin badla. Kaun sa rule score mein 1 jodta hai?'];
  else if (!st.have.has('win')) m = ['Nobody said "I win!" — add the IF rule that checks the score.', 'किसी ने "मैं जीता!" नहीं कहा — स्कोर जाँचने वाला अगर-नियम जोड़ो।', 'Kisi ne "Main jeeta!" nahin kaha — score check karne wala IF rule jodo.'];
  else m = [`Only ${caught} mangoes caught. Move under each mango with ⬅ ➡ — watch where it falls!`, `सिर्फ़ ${caught} आम पकड़े। ⬅ ➡ से हर आम के नीचे जाओ — देखो वह कहाँ गिरता है!`, `Sirf ${caught} mangoes pakde. ⬅ ➡ se har mango ke neeche jao — dekho woh kahan girta hai!`];
  K.sfx('bad'); K.toast(m, 'bad'); why(m); }
function start() { st = { day: 'rain' }; drawModes(); $('#goal').innerHTML = `<span style="font-size:22px">🎯</span><div><b>${t(['Goal', 'लक्ष्य', 'Goal'])}:</b> ${esc(t(cfg.mode === mode && cfg.goal ? [cfg.goal.en, cfg.goal.hi || cfg.goal.en, cfg.goal.hinglish] : MODES[mode].goal))}</div>`;
  ({ story: storyMode, debug: storyMode, ifelse: ifMode, game: gameMode })[mode](); }
K.onLang(() => { if (!st || !st.busy) start(); });
start();
})();
