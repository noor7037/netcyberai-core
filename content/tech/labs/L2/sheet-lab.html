<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sheet & Database Lab — NCA Tech & AI Lab</title><style>/* NCA Tech & AI Lab — Level 2 shared lab skin (own work, MIT). Family App lesson tokens: paper, card, ink, saffron, teal, plum. */
:root{--paper:#FBF8F3;--card:#FFFDF9;--ink:#1C1B1A;--muted:#4B5563;--line:#E7E1D6;--saffron:#E8702A;--saffronD:#C2410C;--teal:#0F766E;--plum:#6D28D9;--sky:#0369A1;

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(251,248,243,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:var(--lilac);flex:none}
.top h1{font-size:16px;margin:0;line-height:1.2;flex:1;min-width:0}
.top h1 small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;background:var(--card)}

<script>/* NCA Tech & AI Lab — Level 2 shared lab runtime (own work, MIT). No eval, no network except an optional same-origin ?lesson= JSON. */
(function(g){

  addEventListener('scroll',rePlace,{passive:true});addEventListener('resize',rePlace);document.addEventListener('animationend',rePlace,true);document.addEventListener('transitionend',rePlace,true);const toastMO=new MutationObserver(rs=>{if(rs.some(r=>!toastEl.contains(r.target)))rePlace();});

    a.after(el);}

<script>
(async function(){

 <label>ORDER BY ${selH('ord',['none','marks DESC'],Q.order==='none'?'none':'marks DESC')}</label></div>
 <div class="sql">${sqlText()}</div><div class="row"><button class="btn teal" id="chk">${T(L('Run & check','चलाओ और जाँचो','Run & check'))}</button>${ci?'<button class="btn ghost" id="pv">←</button>':''}${ci<2?'<button class="btn ghost" id="nx">→</button>':''}</div>`;
 const upd=()=>{Q={c1:$('c1').value,o1:$('o1').value,v1:$('v1').value,and:$('and').checked,c2:$('c2').value,o2:$('o2').value,v2:$('v2').value,order:$('ord').value==='none'?'none':'desc'};drawDB();};
 ['c1','o1','c2','o2','ord','and'].forEach(i=>$(i).onchange=upd);['v1','v2'].forEach(i=>{$(i).onchange=upd;$(i).onkeydown=e=>{if(e.key==='Enter')upd();};});
 $('chk').onclick=()=>{upd();const got=run().map(r=>r.roll).sort((a,b)=>a-b).join(),want=CH[ci].want.join();if(got===want){solved[ci]=1;N.toast(L('Correct query!','सही क्वेरी!','Sahi query!'),'ok');if(ci<2)setTimeout(()=>{ci++;drawDB();},900);}else N.toast(L(`Not yet: you got ${run().length} rows. Check the column, operator and value.`,`अभी नहीं: ${run().length} पंक्तियाँ आईं। स्तंभ, संकारक और मान जाँचो।`,`Abhi nahi: ${run().length} rows aayi. Column, operator aur value check karo.`),'bad');drawDB();if(CH.every((_,i)=>solved[i]))win('db',L('You speak SQL!','आप SQL बोलते हो!','Aap SQL bolte ho!'));mission();};
 if($('pv'))$('pv').onclick=()=>{ci--;drawDB();};if($('nx'))$('nx').onclick=()=>{ci++;drawDB();};}
/* ---------- chance ---------- */
let seed=20261127,rolls=[0,0,0,0,0,0],nR=0,pred=null,last=[];
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const FACES=['⚀','⚁','⚂','⚃','⚄','⚅'];
const PR=[['1/2',L('1 in 2','2 में 1','2 mein 1')],['1/3',L('1 in 3','3 में 1','3 mein 1')],['1/6',L('1 in 6','6 में 1','6 mein 1')],['1/12',L('1 in 12','12 में 1','12 mein 1')]];
function roll(k){last=[];for(let i=0;i<k;i++){const f=Math.floor(rnd()*6);rolls[f]++;nR++;if(i<8)last.push(f);}drawChance();}
function drawChance(){const mx=Math.max(1,...rolls),exp=nR/6,p6=nR?rolls[5]/nR:0;
 const W=300,H=150,bw=36;
 $('left').innerHTML=`<div style="font-weight:800;font-size:14px;margin-bottom:6px">${T(L('1. Predict: what is the chance of rolling a 6?','1. अनुमान: 6 आने की संभावना क्या है?','1. Predict: 6 aane ki probability kya hai?'))}</div>
 <div class="row" style="gap:6px;flex-wrap:wrap">${PR.map(([k,n])=>`<button class="btn ${pred===k?'teal':'ghost'}" data-pr="${k}" style="flex:1;min-width:70px">${k}<br><span style="font-size:11px">${T(n)}</span></button>`).join('')}</div>
 <div style="font-weight:800;font-size:14px;margin:10px 0 6px">${T(L('2. Roll the dice','2. पासा फेंको','2. Dice phenko'))}</div>
 <div class="row" style="gap:6px"><button class="btn teal" id="r1">🎲 ×1</button><button class="btn teal" id="r10">🎲 ×10</button><button class="btn plum" id="r100">🎲 ×100</button><button class="btn ghost" id="r0">↺</button></div>
 <div style="font-size:30px;letter-spacing:4px;min-height:40px;margin-top:6px" aria-live="polite">${last.map(f=>`<span style="display:inline-block;animation:pop .3s both">${FACES[f]}</span>`).join('')}</div>
 <svg viewBox="0 0 ${W} ${H+44}" style="width:100%;display:block" role="img" aria-label="${E(T(L('Bar chart of how often each face came up','हर अंक कितनी बार आया उसका दंड चार्ट','Har face kitni baar aaya uska bar chart')))}">
 ${rolls.map((c,i)=>{const h=c/mx*H;return `<rect x="${14+i*48}" y="${H-h}" width="${bw}" height="${h}" rx="5" fill="${i===5?'#F59E0B':'#0EA5E9'}" style="transition:all .3s"/><text x="${32+i*48}" y="${H+18}" text-anchor="middle" font-size="16">${FACES[i]}</text><text x="${32+i*48}" y="${H+38}" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">${c}</text>`;}).join('')}
 ${nR?`<line x1="8" x2="${W-6}" y1="${H-exp/mx*H}" y2="${H-exp/mx*H}" stroke="#DC2626" stroke-dasharray="5 4" stroke-width="1.5"/>`:''}</svg>${nR?`<div style="font-size:12.5px;color:#DC2626;font-weight:700;margin-top:2px">- - - ${E(T(L('expected for each face','हर अंक के लिए अपेक्षित','har face ke liye expected')))} ≈ ${exp.toFixed(0)}</div>`:''}`;/* labels sit under the bars: the dashed line crosses no text */
 $('left').querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{pred=b.dataset.pr;drawChance();});
 $('r1').onclick=()=>roll(1);$('r10').onclick=()=>roll(10);$('r100').onclick=()=>roll(100);$('r0').onclick=()=>{rolls=[0,0,0,0,0,0];nR=0;last=[];drawChance();};
 $('right').innerHTML=`<div style="font:800 20px system-ui">${T(L('Rolls','फेंक','Rolls'))}: ${nR}</div>
 <div style="font-size:14px;margin:6px 0">⚅ ${T(L('Theory','सिद्धांत','Theory'))}: <b>1/6 ≈ 16.7%</b><br>⚅ ${T(L('Your experiment','तुम्हारा प्रयोग','Tumhara experiment'))}: <b>${nR?rolls[5]+'/'+nR+' = '+(p6*100).toFixed(1)+'%':'—'}</b></div>
 <p style="font-size:13px">${T(L('Probability = favourable outcomes ÷ all equally likely outcomes. A fair die has 6 faces, so P(6) = 1/6. With only a few rolls the bars look uneven; with hundreds they get closer to the red line — the law of large numbers.','संभावना = अनुकूल परिणाम ÷ सभी समान संभावित परिणाम। निष्पक्ष पासे के 6 फलक हैं, तो P(6) = 1/6। कम फेंक में दंड असमान दिखते हैं; सैकड़ों फेंक में वे लाल रेखा के पास आते हैं — बड़ी संख्याओं का नियम।','Probability = favourable outcomes ÷ saare equally likely outcomes. Fair dice ke 6 faces hain, to P(6) = 1/6. Kam rolls mein bars uneven dikhte hain; saikdon rolls mein woh red line ke paas aate hain — law of large numbers.'))}</p>
 ${pred&&pred!=='1/6'?`<div style="font-size:13px;background:var(--blush);border-radius:10px;padding:6px 8px">${T(L('Look at your bars: does a 6 really come up that often? Count the faces on a die.','अपने दंड देखो: क्या 6 सच में इतनी बार आता है? पासे के फलक गिनो।','Apne bars dekho: kya 6 sach mein itni baar aata hai? Dice ke faces gino.'))}</div>`:''}`;
 if(pred==='1/6'&&nR>=300)win('chance',L('Prediction confirmed by experiment — that is how scientists work!','प्रयोग ने अनुमान की पुष्टि की — वैज्ञानिक ऐसे ही काम करते हैं!','Experiment ne prediction confirm kiya — scientists aise hi kaam karte hain!'));mission();}
/* ---------- shell ---------- */
function mission(){const st={sheet:L(`${YEL.filter(cellOK).length}/4 formula cells correct`,`${YEL.filter(cellOK).length}/4 सूत्र सेल सही`,`${YEL.filter(cellOK).length}/4 formula cells sahi`),chart:L(`charts ${Object.values(picks).filter(Boolean).length}/3 · median ${medOK?'✔':'✘'}`,`चार्ट ${Object.values(picks).filter(Boolean).length}/3 · माध्यिका ${medOK?'✔':'✘'}`,`charts ${Object.values(picks).filter(Boolean).length}/3 · median ${medOK?'✔':'✘'}`),db:L(`queries ${Object.keys(solved).length}/3`,`क्वेरी ${Object.keys(solved).length}/3`,`queries ${Object.keys(solved).length}/3`),chance:L(`predict 1/6 + ${Math.min(nR,300)}/300 rolls`,`1/6 अनुमान + ${Math.min(nR,300)}/300 फेंक`,`predict 1/6 + ${Math.min(nR,300)}/300 rolls`)};
 $('mission').innerHTML=TABS.map(([k,n])=>`<div style="margin:3px 0">${done[k]?'✅':'⬜'} <b>${T(n)}</b> — ${T(st[k])}</div>`).join('');}
function draw(){$('goal').innerHTML=E(T(goal&&cfg.tab===tab?goal:GOALS[tab]));$('tabs').innerHTML=TABS.map(([k,n])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${T(n)}</button>`).join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();});({sheet:drawSheet,chart:drawChart,db:drawDB,chance:drawChance})[tab]();mission();}
N.onLang(draw);draw();
window.__lab={roll,tab:k=>{tab=k;draw();},set:(c,v)=>{S[c]=v;drawSheet();checkSheet();},val:c=>cellVal(c),done};
})();
</script></body></html>
