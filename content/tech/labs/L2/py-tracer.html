 loop:{n:L('Loops','लूप','Loops'),code:`total = 0\nfor n in range(1, 6):\n    total = total + n\nprint("1+2+3+4+5 =", total)\n\ncount = 3\nwhile count > 0:\n    print("Countdown", count)\n    count = count - 1\nprint("Launch! 🚀")`,ask:{q:L('How many times does line 3 run?','लाइन 3 कितनी बार चलती है?','Line 3 kitni baar chalti hai?'),o:['5','6','4'],a:0,why:L('range(1, 6) gives 1, 2, 3, 4, 5 — it stops BEFORE 6. So the loop body runs 5 times.','range(1, 6) देता है 1, 2, 3, 4, 5 — 6 से पहले रुकता है। इसलिए लूप 5 बार चलता है।','range(1, 6) deta hai 1, 2, 3, 4, 5 — 6 se PEHLE ruk jaata hai. Isliye loop body 5 baar chalti hai.')}},
 function:{n:L('Functions','फ़ंक्शन','Functions'),code:`def area(length, width):\n    result = length * width\n    return result\n\nroom = area(4, 5)\nfloor = area(10, 12)\nprint("Room:", room, "Floor:", floor)`,ask:{q:L('Where do length and width live?','length और width कहाँ रहते हैं?','length aur width kahan rehte hain?'),o:[L('Only inside area() while it runs','केवल area() के चलने तक उसके अंदर','Sirf area() ke andar jab tak woh chal raha hai'),L('Everywhere in the program','पूरे प्रोग्राम में','Poore program mein'),L('In the output','आउटपुट में','Output mein')],a:0,why:L('Parameters are local variables. A fresh set is made on each call and thrown away when the function returns — watch them appear and disappear in Memory.','पैरामीटर स्थानीय वेरिएबल हैं। हर कॉल पर नए बनते हैं और return पर मिट जाते हैं — मेमोरी में देखो।','Parameters local variables hote hain. Har call pe naye bante hain aur return pe mit jaate hain — Memory mein aate-jaate dekho.')}},
 lists:{n:L('Lists','लिस्ट','Lists'),code:`marks = [72, 88, 95, 64, 81]\ntotal = 0\nbest = marks[0]\nfor m in marks:\n    total = total + m\n    if m > best:\n        best = m\naverage = total / len(marks)\nprint("Average:", average, "Best:", best)`,ask:{q:L('What is marks[2]?','marks[2] क्या है?','marks[2] kya hai?'),o:['88','95','72'],a:1,why:L('Python counts positions from 0. marks[0] = 72, marks[1] = 88, marks[2] = 95.','पायथन स्थान 0 से गिनता है। marks[0] = 72, marks[1] = 88, marks[2] = 95।','Python positions 0 se ginta hai. marks[0] = 72, marks[1] = 88, marks[2] = 95.')}},
 linear:{n:L('Linear search','रैखिक खोज','Linear search'),code:`nums = [14, 7, 31, 22, 9, 40, 18]\ntarget = 9\nfound = -1\nfor i in range(len(nums)):\n    if nums[i] == target:\n        found = i\n        break\nprint("Found at index", found)`,ask:{q:L('How many items did it check before finding 9?','9 मिलने तक कितनी चीज़ें जाँचीं?','9 milne tak kitne items check kiye?'),o:['5','1','7'],a:0,why:L('Linear search checks one by one: 14, 7, 31, 22, 9 — five checks. In the worst case (not found) it checks all n items.','रैखिक खोज एक-एक करके जाँचती है: 14, 7, 31, 22, 9 — पाँच बार। सबसे बुरी स्थिति में सभी n चीज़ें।','Linear search ek-ek karke check karta hai: 14, 7, 31, 22, 9 — paanch checks. Worst case (nahi mila) mein saare n items.')}},
 binary:{n:L('Binary search','द्विआधारी खोज','Binary search'),code:`nums = [3, 8, 12, 19, 25, 31, 44, 50, 67]\ntarget = 44\nlo = 0\nhi = len(nums) - 1\nsteps = 0\nwhile lo <= hi:\n    steps = steps + 1\n    mid = (lo + hi) // 2\n    if nums[mid] == target:\n        break\n    elif nums[mid] < target:\n        lo = mid + 1\n    else:\n        hi = mid - 1\nprint("Index", mid, "in", steps, "steps")`,ask:{q:L('Binary search only works if the list is…','द्विआधारी खोज तभी चलती है जब लिस्ट…','Binary search tabhi kaam karta hai jab list…'),o:[L('sorted','क्रम में (sorted) हो','sorted ho'),L('short','छोटी हो','chhoti ho'),L('full of even numbers','सम संख्याओं की हो','even numbers ki ho')],a:0,why:L('It throws away half the list each step by comparing with the middle. That only makes sense if smaller values are on the left. 1,000,000 sorted items need at most 20 steps!','यह बीच वाले से तुलना करके हर बार आधी लिस्ट हटा देती है। यह तभी सही है जब छोटे मान बाईं ओर हों। 10 लाख क्रमित चीज़ों में अधिकतम 20 कदम!','Yeh middle se compare karke har step mein aadhi list hata deta hai. Yeh tabhi sahi hai jab chhoti values left mein hon. 10 lakh sorted items mein maximum 20 steps!')}},
 bubble:{n:L('Bubble sort','बबल सॉर्ट','Bubble sort'),code:`nums = [29, 10, 14, 37, 13]\nn = len(nums)\nfor i in range(n - 1):\n    for j in range(n - 1 - i):\n        if nums[j] > nums[j + 1]:\n            nums[j], nums[j + 1] = nums[j + 1], nums[j]\nprint("Sorted:", nums)`,ask:{q:L('After the FIRST pass (i = 0), which number is surely in its final place?','पहले दौर (i = 0) के बाद कौन-सी संख्या पक्की अपनी जगह पर है?','Pehle pass (i = 0) ke baad kaunsa number pakka apni final jagah pe hai?'),o:['37','10','13'],a:0,why:L('Each pass “bubbles” the biggest remaining number to the end, like a big bubble rising. So after pass 1, 37 is last. That is why the inner loop gets shorter (n − 1 − i).','हर दौर बची हुई सबसे बड़ी संख्या को अंत तक “बुलबुले” की तरह ले जाता है। पहले दौर के बाद 37 आख़िर में। इसलिए अंदर का लूप छोटा होता जाता है (n − 1 − i)।','Har pass bachi hui sabse badi number ko end tak “bubble” karta hai. Pass 1 ke baad 37 last mein. Isliye inner loop chhota hota jaata hai (n − 1 − i).')}},
 bug:{n:L('🐞 Fix the bug','🐞 बग ठीक करो','🐞 Bug fix karo'),code:`prices = [40, 25, 60]\ntotal = 0\nfor p in prices:\n    total = total + p\nprint("Total: " + total)`,expect:'Total: 125'}};
let key=PROGS[cfg.program]?cfg.program:'variables',code=PROGS[key].code,editing=false,R=null,cur=0,done=false,err=null,prev={},timer=null,answered=false,passed=new Set();
const tabs=$('progs');Object.keys(PROGS).forEach(k=>{const b=document.createElement('button');b.dataset.p=k;b.setAttribute('role','tab');b.onclick=()=>{key=k;code=PROGS[k].code;editing=false;reset();};tabs.appendChild(b);});
const KWS=/\b(if|elif|else|while|for|in|def|return|and|or|not|True|False|None|break|continue|pass)\b/g,BIS=/\b(print|len|range|str|int|float|abs|min|max|sum|round|sorted)\b/g;
function hl(line){const ci=line.indexOf('#');let c='',s=line;if(ci>=0&&!/["']/.test(line.slice(0,ci))){c=line.slice(ci);s=line.slice(0,ci);}
 const parts=s.split(/("[^"]*"|'[^']*')/);return parts.map((x,i)=>i%2?`<span class="st">${E(x)}</span>`:E(x).replace(KWS,'<span class="kw">$1</span>').replace(BIS,'<span class="bi">$1</span>').replace(/\b(\d+)\b/g,'<span class="nm">$1</span>')).join('')+(c?`<span class="cm">${E(c)}</span>`:'');}
function drawCode(){if(editing){$('codeBox').innerHTML=`<textarea class="ed" id="ed" spellcheck="false" autocapitalize="off" autocomplete="off">${E(code)}</textarea>`;$('ed').oninput=e=>code=e.target.value;return;}
 $('codeBox').innerHTML=`<div class="code" role="list">${code.split('\n').map((l,i)=>`<div class="ln ${cur===i+1?(err?'err':'cur'):''}" role="listitem"><span class="no">${i+1}</span><span>${hl(l)||' '}</span></div>`).join('')}</div>`;}
function reset(){clearInterval(timer);timer=null;cur=0;done=false;err=null;prev={};answered=false;$('cons').textContent='';$('err').innerHTML='';
 try{R=MiniPy.run(code,{maxSteps:3000});}catch(e){R=null;showErr(e);}
 tabs.querySelectorAll('button').forEach(b=>{b.innerHTML=T(PROGS[b.dataset.p].n);b.setAttribute('aria-selected',b.dataset.p===key);});drawCode();drawMem();info();mission();$('auto').innerHTML=T(L('⏩ Auto','⏩ ऑटो','⏩ Auto'));}
const TIPS={NameError:L('Python does not know this name yet. Check spelling (Python is case-sensitive: Total ≠ total) and make sure the variable is created before it is used.','पायथन यह नाम अभी नहीं जानता। वर्तनी जाँचो (Total ≠ total) और देखो कि वेरिएबल इस्तेमाल से पहले बना हो।','Python yeh naam abhi nahi jaanta. Spelling check karo (Python case-sensitive hai: Total ≠ total) aur dekho variable use se pehle bana ho.'),
 TypeError:L('Two kinds of values were mixed that cannot be combined, like text + number. Convert one: str(total) turns a number into text.','दो ऐसे प्रकार मिले जो जुड़ नहीं सकते, जैसे टेक्स्ट + संख्या। एक को बदलो: str(total) संख्या को टेक्स्ट बनाता है।','Do aise types mix ho gaye jo jud nahi sakte, jaise text + number. Ek ko convert karo: str(total) number ko text bana deta hai.'),
 IndexError:L('You asked for a position that does not exist. A list of 5 items has positions 0 to 4.','ऐसा स्थान माँगा जो है ही नहीं। 5 चीज़ों की लिस्ट में स्थान 0 से 4 हैं।','Aisi position maangi jo exist nahi karti. 5 items ki list mein positions 0 se 4 hoti hain.'),
 SyntaxError:L('Python could not read this line — check for a missing colon (:), bracket or quote.','पायथन यह लाइन पढ़ नहीं पाया — छूटा कोलन (:), कोष्ठक या उद्धरण चिह्न देखो।','Python yeh line padh nahi paaya — missing colon (:), bracket ya quote check karo.'),
 IndentationError:L('The spaces at the start of the line do not match. Lines inside an if/for/def must be indented by the same amount (4 spaces).','लाइन की शुरुआत की जगहें मेल नहीं खातीं। if/for/def के अंदर की लाइनें बराबर (4 स्पेस) अंदर हों।','Line ke shuru ke spaces match nahi karte. if/for/def ke andar ki lines barabar (4 spaces) andar honi chahiye.'),
 ZeroDivisionError:L('Dividing by zero has no answer, so Python stops.','शून्य से भाग का कोई उत्तर नहीं, इसलिए पायथन रुकता है।','Zero se divide ka koi jawab nahi, isliye Python ruk jaata hai.'),
 TimeoutError:L('The loop never ended. Make sure something inside the loop changes the condition (for example count = count - 1).','लूप कभी ख़त्म नहीं हुआ। देखो कि लूप के अंदर कुछ शर्त को बदले (जैसे count = count - 1)।','Loop kabhi khatam nahi hua. Dekho loop ke andar kuch condition ko badle (jaise count = count - 1).')};
function showErr(e){err=e;if(e.line)cur=e.line;N.emit('error',{kind:e.kind});$('err').innerHTML=`<div class="errbox"><b>${E(e.kind||'Error')}</b> ${e.line?T(L('on line','लाइन','line'))+' '+e.line:''}: <span class="kbd">${E(e.message)}</span><br>💡 ${T(TIPS[e.kind]||L('Read the message, find the line, fix one thing and run again.','संदेश पढ़ो, लाइन ढूँढो, एक चीज़ ठीक करो और फिर चलाओ।','Message padho, line dhoondo, ek cheez theek karo aur dobara chalao.'))}</div>`;}
function step(){if(!R||done||err)return false;try{const s=R.gen.next();if(s.done){done=true;cur=0;N.emit('finished',{program:key,output:R.out.slice()});}else cur=s.value.line;}catch(e){if(e instanceof MiniPy.PyErr||e.kind)showErr(e);else showErr({kind:'Error',message:String(e.message||e)});}
 $('cons').textContent=R.out.join('\n');drawCode();drawMem();info();if(done||err){clearInterval(timer);timer=null;$('auto').innerHTML=T(L('⏩ Auto','⏩ ऑटो','⏩ Auto'));mission();}return !(done||err);}
function drawMem(){const box=$('vars');if(!R){box.innerHTML='';return;}const fr=R.stack[R.stack.length-1];const rows=[];
 const add=(scope,vars)=>Object.keys(vars).forEach(n=>{const v=vars[n];if(v&&v.fn)return;rows.push([scope,n,v]);});add('',R.globals);if(R.stack.length>1)add(fr.name+'()',fr.vars);
 const now={};box.innerHTML=rows.map(([s,n,v])=>{const r=MiniPy.repr(v,true),k=s+n;now[k]=r;const chg=prev[k]!==undefined&&prev[k]!==r||prev[k]===undefined&&Object.keys(prev).length>=0&&!(k in prev);
  return `<div class="var ${chg?'chg':''}"><div class="n">${s?`<span style="color:#0369A1">${E(s)} › </span>`:''}${E(n)}</div><div class="v">${E(r)}</div><div class="ty">${MiniPy.tname(v)}</div></div>`;}).join('')||`<span class="muted" style="font-size:13px">${T(L('(empty — press Step)','(ख़ाली — Step दबाओ)','(khaali — Step dabao)'))}</span>`;prev=now;
 // bars for the first list of numbers, with i / j / lo / hi / mid pointers
 const all=Object.assign({},R.globals,fr.vars);const ln=Object.keys(all).find(n=>Array.isArray(all[n])&&all[n].length>1&&all[n].length<=12&&all[n].every(x=>typeof x==='number'));
 $('viz').classList.toggle('hidden',!ln);if(!ln)return;const a=all[ln],mx=Math.max(...a,1);const ptr={};['i','j','lo','hi','mid','found'].forEach(p=>{if(typeof all[p]==='number'&&all[p]>=0&&all[p]<a.length)(ptr[all[p]]=ptr[all[p]]||[]).push(p);});
 const tg=all.target;$('bars').innerHTML=a.map((v,i)=>`<div class="barc ${ptr[i]&&(ptr[i].includes('j')||ptr[i].includes('mid')||ptr[i].includes('found'))||(key==='linear'&&ptr[i])?'hl':''}"><span class="ptr">${(ptr[i]||[]).join(',')}</span><div class="bar" style="height:${12+88*v/mx}%">${v}</div><span class="ix">[${i}]</span></div>`).join('')+(tg!=null?`<div style="position:absolute;right:8px;top:2px;font:700 11px ui-monospace,monospace;color:#9FB1E8">${E(ln)} · target=${tg}</div>`:`<div style="position:absolute;right:8px;top:2px;font:700 11px ui-monospace,monospace;color:#9FB1E8">${E(ln)}</div>`);}
function info(){$('stepInfo').innerHTML=R?(done?'✅ '+T(L(`Finished in ${R.steps()} steps.`,`${R.steps()} कदमों में पूरा।`,`${R.steps()} steps mein khatam.`)):err?'⛔ '+T(L('Stopped with an error.','त्रुटि के साथ रुका।','Error ke saath ruk gaya.')):cur?T(L(`Step ${R.steps()}: the yellow line is running now. Watch Memory.`,`कदम ${R.steps()}: पीली लाइन अभी चली। मेमोरी देखो।`,`Step ${R.steps()}: peeli line abhi chal rahi hai. Memory dekho.`)):T(L('Press ▶ Step to run the first line.','पहली लाइन चलाने के लिए ▶ अगला दबाओ।','Pehli line chalane ke liye ▶ Step dabao.'))):'';}
function mission(){const P=PROGS[key];const m=$('mission');
 if(P.expect){const ok=done&&!err&&R&&R.out[R.out.length-1]===P.expect;m.innerHTML=(ok?'✅ ':'')+T(L(`This program should print <span class="kbd">${P.expect}</span> but it crashes. Run it, read the error, press ✏️ Edit, fix the ONE line, and run again.`,`इस प्रोग्राम को <span class="kbd">${P.expect}</span> छापना चाहिए पर यह टूट जाता है। चलाओ, त्रुटि पढ़ो, ✏️ बदलो दबाओ, एक लाइन ठीक करो और फिर चलाओ।`,`Is program ko <span class="kbd">${P.expect}</span> print karna chahiye par yeh crash hota hai. Chalao, error padho, ✏️ Edit dabao, EK line theek karo aur dobara chalao.`))+(ok?' — '+T(L('Bug fixed! You just debugged like a real programmer.','बग ठीक! आपने असली प्रोग्रामर की तरह डीबग किया।','Bug fix! Aapne asli programmer ki tarah debug kiya.')):'');
  if(ok&&!passed.has(key)){passed.add(key);N.confetti();N.toast(L('Mission complete +XP','मिशन पूरा +XP','Mission complete +XP'),'ok');N.emit('mission:complete',{lab:'py-tracer',program:key});}return;}
 const A=P.ask;if(!done){m.innerHTML=T(L('Step through the whole program, then answer the question that appears here.','पूरे प्रोग्राम को कदम-दर-कदम चलाओ, फिर यहाँ आने वाले प्रश्न का उत्तर दो।','Poora program step-by-step chalao, phir yahan aane wale sawaal ka jawab do.'));return;}
 m.innerHTML=`<b>${T(A.q)}</b><div class="opts">${A.o.map((o,i)=>`<button data-i="${i}">${E(T(o))}</button>`).join('')}</div><div id="why" style="margin-top:8px"></div>`;
 m.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===A.a;b.classList.add(ok?'right':'wrong');$('why').innerHTML=(ok?'✅ ':'❌ ')+T(A.why);N.emit(ok?'answered:right':'answered:wrong',{program:key});
  if(ok&&!passed.has(key)){passed.add(key);N.confetti();N.toast(L('Correct! +XP','सही! +XP','Sahi! +XP'),'ok');N.emit('mission:complete',{lab:'py-tracer',program:key});}});}
$('step').onclick=()=>{if(editing){editing=false;reset();}if(done||err)reset();step();};
$('reset').onclick=()=>{editing=false;reset();};
$('edit').onclick=()=>{editing=!editing;if(!editing)reset();else{clearInterval(timer);drawCode();}$('edit').innerHTML=T(editing?L('✅ Done','✅ हो गया','✅ Done'):L('✏️ Edit','✏️ बदलो','✏️ Edit'));};
$('auto').onclick=()=>{if(editing){editing=false;$('edit').innerHTML=T(L('✏️ Edit','✏️ बदलो','✏️ Edit'));reset();}if(timer){clearInterval(timer);timer=null;$('auto').innerHTML=T(L('⏩ Auto','⏩ ऑटो','⏩ Auto'));return;}if(done||err)reset();
 $('auto').innerHTML=T(L('⏸ Pause','⏸ रुको','⏸ Pause'));timer=setInterval(()=>{if(!step()){clearInterval(timer);timer=null;}},1100-$('spd').value*100);};
const goalDef=L('A program is a list of instructions run from top to bottom, one line at a time. Step through it and watch the variables (labelled boxes in memory) change.','प्रोग्राम ऊपर से नीचे, एक-एक लाइन चलने वाले निर्देशों की सूची है। कदम-दर-कदम चलाओ और वेरिएबल (मेमोरी के नाम वाले डिब्बे) बदलते देखो।','Program = instructions ki list jo upar se neeche, ek-ek line chalti hai. Step karo aur variables (memory ke naam wale dibbe) badalte dekho.');
const setGoal=()=>$('goal').innerHTML=T(goal||goalDef);N.onLang(()=>{setGoal();tabs.querySelectorAll('button').forEach(b=>b.innerHTML=T(PROGS[b.dataset.p].n));drawMem();info();mission();if(err)showErr(err);});
setGoal();reset();
window.__lab={load:k=>{key=k;code=PROGS[k].code;reset();},runAll:()=>{let g=0;while(step()&&g++<5000);},setCode:c=>{code=c;reset();}};
})();
</script></body></html>
