<title>Scam Spotter Inbox — NCA Tech & AI Lab</title><style>/* NCA Tech & AI Lab — Level 2 shared lab skin (own work, MIT). Family App lesson tokens: paper, card, ink, saffron, teal, plum. */

<script>/* NCA Tech & AI Lab — Level 2 shared lab runtime (own work, MIT). No eval, no network except an optional same-origin ?lesson= JSON. */

<script>
(async function(){

// Every message is a real pattern reported to Indian police / CERT-In / RBI awareness campaigns. Names, numbers and links are made up.
// Body text uses [[visible text|flag]]; flags explain why that part is a warning sign (scams) or a good sign (safe).
const FL={
 num:L('Sent from an ordinary 10-digit mobile number. Real banks and companies send SMS from short registered headers like “AX-XYZBNK-S”.','सामान्य 10 अंकों के मोबाइल नंबर से भेजा गया। असली बैंक और कंपनियाँ “AX-XYZBNK-S” जैसे पंजीकृत हेडर से SMS भेजते हैं।','Normal 10-digit mobile number se aaya. Asli banks aur companies “AX-XYZBNK-S” jaise registered header se SMS bhejte hain.'),
 urg:L('Panic and a deadline (“today”, “tonight”, “immediately”). Scammers rush you so you do not stop to think or ask an adult.','घबराहट और समय-सीमा (“आज”, “आज रात”, “तुरंत”)। ठग जल्दी कराते हैं ताकि आप सोचें नहीं या किसी बड़े से न पूछें।','Panic aur deadline (“aaj”, “aaj raat”, “turant”). Scammers jaldi karwaate hain taaki aap soch na sako ya kisi bade se pooch na sako.'),
 link:L('A look-alike link. The real website name is the part just before the first single “/”. “xyzbank-kyc-verify.top” is NOT xyzbank.com. Never update KYC from an SMS link.','मिलता-जुलता नकली लिंक। असली वेबसाइट का नाम पहले अकेले “/” से ठीक पहले वाला भाग है। “xyzbank-kyc-verify.top”, xyzbank.com नहीं है। SMS लिंक से कभी KYC न करो।','Look-alike nakli link. Asli website ka naam pehle single “/” se theek pehle wala hissa hota hai. “xyzbank-kyc-verify.top” xyzbank.com NAHI hai. SMS link se kabhi KYC update mat karo.'),
 kyc:L('Asks for KYC/PAN/card details through a message. RBI says banks never ask for these by SMS, call or link — KYC is done in the branch or the official app.','संदेश से KYC/PAN/कार्ड विवरण माँगता है। RBI के अनुसार बैंक ये SMS, कॉल या लिंक से कभी नहीं माँगते — KYC शाखा या आधिकारिक ऐप में होता है।','Message se KYC/PAN/card details maangta hai. RBI kehta hai banks yeh kabhi SMS, call ya link se nahi maangte — KYC branch ya official app mein hota hai.'),
 money:L('Too good to be true: easy money for tiny tasks. These “task scams” pay ₹100–200 first to win trust, then ask you to “invest” to unlock bigger earnings — and the money vanishes.','सच होने के लिए बहुत अच्छा: छोटे काम के लिए आसान पैसा। ये “टास्क स्कैम” पहले ₹100–200 देकर भरोसा जीतते हैं, फिर बड़ी कमाई के लिए “निवेश” माँगते हैं — और पैसा ग़ायब।','Too good to be true: chhote kaam ke liye aasaan paisa. Yeh “task scams” pehle ₹100–200 dekar bharosa jeette hain, phir badi kamaai unlock karne ke liye “invest” maangte hain — aur paisa gayab.'),
 foreign:L('An unknown international number (+44, +62, +84…). Most job and investment scam chats start this way.','अनजान अंतरराष्ट्रीय नंबर (+44, +62, +84…)। ज़्यादातर नौकरी और निवेश स्कैम ऐसे ही शुरू होते हैं।','Anjaan international number (+44, +62, +84…). Zyaadatar job aur investment scam chats aise hi shuru hote hain.'),
 move:L('Moves you to another app (Telegram) where there are fewer safety checks and the group admins are the scammers.','आपको दूसरे ऐप (टेलीग्राम) पर ले जाता है जहाँ कम सुरक्षा है और ग्रुप एडमिन ही ठग हैं।','Aapko doosre app (Telegram) pe le jaata hai jahan kam safety checks hain aur group admins hi scammers hain.'),
 pin:L('The golden UPI rule: you enter your UPI PIN ONLY to SEND money, never to receive it. A “collect request” that asks for your PIN takes money OUT of your account.','UPI का सुनहरा नियम: UPI PIN केवल पैसे भेजने के लिए डालते हैं, पाने के लिए कभी नहीं। PIN माँगने वाला “कलेक्ट अनुरोध” आपके खाते से पैसा निकालता है।','UPI ka golden rule: UPI PIN SIRF paisa BHEJNE ke liye daalte hain, paane ke liye kabhi nahi. PIN maangne wala “collect request” aapke account se paisa NIKAALTA hai.'),
 stranger:L('A stranger from a buying/selling site. Real buyers pay you; they do not need you to approve anything.','ख़रीद-बिक्री साइट का अजनबी। असली ख़रीदार आपको भुगतान करते हैं; उन्हें आपसे कुछ स्वीकृत नहीं कराना होता।','Buying/selling site ka ajnabi. Asli buyer aapko pay karta hai; usse aapse kuch approve nahi karwana hota.'),
 callnum:L('Asks you to call a private number. Electricity boards never send disconnection warnings with an officer’s personal mobile number; check on the official board app or bill.','निजी नंबर पर कॉल करने को कहता है। बिजली बोर्ड कभी अधिकारी के निजी मोबाइल नंबर के साथ कटौती की चेतावनी नहीं भेजते; आधिकारिक ऐप या बिल पर जाँचो।','Private number pe call karne ko kehta hai. Bijli board kabhi officer ke personal mobile number ke saath disconnection warning nahi bhejte; official app ya bill pe check karo.'),
 grammar:L('Strange grammar and spelling (“bill was not update”). Official messages are checked carefully; scam templates are copied in a hurry.','अजीब व्याकरण और वर्तनी (“bill was not update”)। आधिकारिक संदेश ध्यान से जाँचे जाते हैं; स्कैम जल्दबाज़ी में कॉपी होते हैं।','Ajeeb grammar aur spelling (“bill was not update”). Official messages dhyaan se check hote hain; scam templates jaldi mein copy hote hain.'),
 newnum:L('“New number, old phone lost” is the classic start of family-impersonation fraud. AI tools can now copy a voice from a few seconds of audio (a voice deepfake).','“नया नंबर, पुराना फ़ोन खो गया” परिवार बनकर ठगी की पुरानी शुरुआत है। AI अब कुछ सेकंड की आवाज़ से आवाज़ की नक़ल कर सकता है (वॉइस डीपफ़ेक)।','“Naya number, purana phone kho gaya” family ban ke thagi ki classic shuruaat hai. AI ab kuch seconds ki audio se awaaz copy kar sakta hai (voice deepfake).'),
 secret:L('Asks you to keep it secret (“don’t tell Mummy”). Secrecy is a huge red flag — a real family member will be fine with you checking.','गुप्त रखने को कहता है (“मम्मी को मत बताना”)। गोपनीयता बड़ा ख़तरा संकेत है — असली परिवारवाला जाँचने पर बुरा नहीं मानेगा।','Secret rakhne ko kehta hai (“Mummy ko mat batana”). Secrecy bahut bada red flag hai — asli family member check karne pe bura nahi maanega.'),
 qr:L('Pay to an unknown QR or UPI ID. Call back on the number you already have saved before sending any money.','किसी अनजान QR या UPI ID पर भुगतान। पैसे भेजने से पहले पहले से सेव नंबर पर वापस कॉल करो।','Anjaan QR ya UPI ID pe payment. Paisa bhejne se pehle pehle se saved number pe call back karo.'),
 police:L('Pretends to be police/CBI/customs. There is no such thing as a “digital arrest” in Indian law; police never question you or collect money over a video call.','पुलिस/CBI/कस्टम बनता है। भारतीय क़ानून में “डिजिटल अरेस्ट” जैसा कुछ नहीं है; पुलिस वीडियो कॉल पर न पूछताछ करती है न पैसा लेती है।','Police/CBI/customs ban ke aata hai. Indian law mein “digital arrest” jaisa kuch nahi hota; police video call pe na poochtaachh karti hai na paisa leti hai.'),
 fear:L('Uses fear (drugs, arrest, your name in a case) so you obey. Hang up, tell a parent, and call 1930 or your local police station yourself.','डर दिखाता है (ड्रग्स, गिरफ़्तारी, केस में नाम) ताकि आप मान जाओ। फ़ोन काटो, माता-पिता को बताओ, और ख़ुद 1930 या स्थानीय थाने को कॉल करो।','Darr dikhata hai (drugs, arrest, case mein naam) taaki aap maan jao. Phone kaato, parent ko batao, aur khud 1930 ya local police station ko call karo.'),
 share:L('“Forward to 10 groups to activate” — chain-message trick that spreads the scam and harvests your details on a fake form.','“10 ग्रुप में भेजो तो चालू होगा” — चेन-मैसेज की चाल जो स्कैम फैलाती है और नकली फ़ॉर्म पर आपकी जानकारी चुराती है।','“10 groups mein forward karo tab activate hoga” — chain message ki chaal jo scam phailati hai aur nakli form pe aapki details churaati hai.'),
 free:L('Free gifts for “every Indian” are bait. No company or government gives recharge by forwarding links.','“हर भारतीय” को मुफ़्त उपहार चारा है। कोई कंपनी या सरकार लिंक भेजने पर रिचार्ज नहीं देती।','“Har Indian” ko free gift = chaara. Koi company ya government link forward karne pe recharge nahi deti.'),
 generic:L('Generic greeting (“Dear Customer / Dear Member”) — the sender does not actually know who you are.','सामान्य संबोधन (“Dear Customer / Dear Member”) — भेजने वाला असल में आपको नहीं जानता।','Generic greeting (“Dear Customer / Dear Member”) — bhejne wala asal mein aapko jaanta hi nahi.'),
 g_head:L('Good sign: a registered business header ending in -S (service) or -T (transactional), not a personal number.','अच्छा संकेत: -S (सेवा) या -T (लेन-देन) पर ख़त्म होने वाला पंजीकृत हेडर, निजी नंबर नहीं।','Achha sign: registered business header jo -S (service) ya -T (transactional) pe khatam hota hai, personal number nahi.'),
 g_you:L('Good sign: you asked for this OTP yourself a moment ago. Still — an OTP is like the key to your house. Type it only into the app you are using; never read it out to anyone, not even “bank staff”.','अच्छा संकेत: आपने अभी ख़ुद यह OTP माँगा था। फिर भी — OTP घर की चाबी जैसा है। इसे केवल उसी ऐप में डालो; किसी को न बताओ, “बैंक कर्मचारी” को भी नहीं।','Achha sign: aapne abhi khud yeh OTP maanga tha. Phir bhi — OTP ghar ki chaabi jaisa hai. Sirf usi app mein type karo; kisi ko mat batao, “bank staff” ko bhi nahi.'),
 g_contact:L('Good sign: a saved contact you know, talking about something you expect (a PTM), with no link, no money and no secret.','अच्छा संकेत: जाना-पहचाना सेव संपर्क, अपेक्षित बात (PTM), कोई लिंक, पैसा या राज़ नहीं।','Achha sign: jaana-pehchaana saved contact, expected baat (PTM), koi link, paisa ya secret nahi.'),
 g_nolink:L('Good sign: it only informs you. It asks for nothing — no link, no OTP, no payment.','अच्छा संकेत: केवल जानकारी देता है। कुछ नहीं माँगता — न लिंक, न OTP, न भुगतान।','Achha sign: sirf jaankari deta hai. Kuch nahi maangta — na link, na OTP, na payment.')};

let state={},openId=null;const list=(cfg.only?M.filter(m=>cfg.only.includes(m.id)):M);
const CHI={SMS:'💬 SMS',WhatsApp:'🟢 WhatsApp',UPI:'₹ UPI','Video call':'📹 Video call'};
function body(m){return E(m.body).replace(/\[\[(.+?)\|(\w+)\]\]/g,(_,txt,f)=>`<button class="fl" data-f="${f}">${txt}</button>`);}
function score(){const n=list.filter(m=>state[m.id]&&state[m.id].right).length,d=list.filter(m=>state[m.id]&&state[m.id].done).length;$('sc').textContent=n+'/'+list.length;$('mb').style.width=(100*n/list.length)+'%';return {n,d};}
const preview=t=>{t=t.replace(/\s+/g,' ').trim();if(t.length<=70)return t;const c=t.lastIndexOf(' ',66);return t.slice(0,c>30?c:66)+' …';};
function drawList(){$('list').innerHTML=list.map(m=>{const s=state[m.id];return `<button class="item" data-id="${m.id}"><span class="av" style="background:${m.av}">${m.e}</span><span class="m"><span class="s"><span>${E(m.from)}</span><small>${m.time}</small></span><span class="p">${E(preview(m.body.replace(/\[\[(.+?)\|\w+\]\]/g,'$1').replace(/\n/g,' ')))}</span>
 <span style="font-size:11px;color:#6B7280">${CHI[m.ch]||m.ch}</span> ${s&&s.done?`<span class="tag ${m.scam?'scam':'safe'}">${m.scam?'🚩 SCAM':'✅ SAFE'} ${s.right?'✓':'✗'}</span>`:''}</span></button>`;}).join('');
 $('list').querySelectorAll('.item').forEach(b=>b.onclick=()=>open(b.dataset.id));}
function open(id){openId=id;const m=M.find(x=>x.id===id);const s=state[id]=state[id]||{found:new Set(),done:false};
 $('det').innerHTML=`<div class="dh"><button id="back" aria-label="back">←</button><span class="av" style="background:${m.av};width:34px;height:34px;font-size:15px">${m.e}</span><span class="who">${E(m.from)}<small>${CHI[m.ch]||m.ch}</small></span></div>
 <p class="hint">👆 ${T(L('Tap the parts that look suspicious (or reassuring). Then decide.','जो हिस्से संदिग्ध (या भरोसेमंद) लगें उन्हें दबाओ। फिर फ़ैसला करो।','Jo hisse suspicious (ya bharosemand) lagein unhe tap karo. Phir decide karo.'))}</p>
 <div class="msg">${body(m)}<span class="tm">${m.time}</span></div><div id="infos"></div><div id="ver"></div>
 <div class="acts" id="acts"><button class="btn" style="background:#FF6B57;box-shadow:0 3px 0 #B42318" data-v="1">🚩 ${T(L('Scam — report','स्कैम — रिपोर्ट','Scam — report'))}</button><button class="btn teal" data-v="0">✅ ${T(L('Looks safe','सुरक्षित है','Safe lagta hai'))}</button></div>`;
 $('scr').classList.add('open');$('back').onclick=()=>{$('scr').classList.remove('open');openId=null;drawList();};
 $('det').querySelectorAll('.fl').forEach(b=>b.onclick=()=>{const f=b.dataset.f;if(!s.found.has(f)){s.found.add(f);}showFlags(m,s);});
 $('acts').querySelectorAll('button').forEach(b=>b.onclick=()=>decide(m,s,+b.dataset.v));showFlags(m,s);if(s.done)verdict(m,s);}
function showFlags(m,s){$('det').querySelectorAll('.fl').forEach(b=>{b.classList.toggle('found',s.found.has(b.dataset.f));if(s.done&&!s.found.has(b.dataset.f))b.classList.add('miss');});
 const fs=[...new Set([...$('det').querySelectorAll('.fl')].map(b=>b.dataset.f))].filter(f=>s.found.has(f)||s.done);
 $('infos').innerHTML=fs.map(f=>`<div class="flinfo ${f.startsWith('g_')?'g':''}">${f.startsWith('g_')?'🟢':'🚩'} ${T(FL[f])}</div>`).join('');}
const ACT={kyc:L('Delete it. If worried, open your bank’s official app or call the number printed on your passbook/card. Report the SMS on Sanchar Saathi → Chakshu.','मिटा दो। चिंता हो तो बैंक का आधिकारिक ऐप खोलो या पासबुक/कार्ड पर छपे नंबर पर कॉल करो। SMS को संचार साथी → चक्षु पर रिपोर्ट करो।','Delete karo. Chinta ho to bank ka official app kholo ya passbook/card pe chhape number pe call karo. SMS ko Sanchar Saathi → Chakshu pe report karo.'),
 job:L('Block and report the number in WhatsApp. Real jobs never ask you to pay or “invest” to earn.','WhatsApp में नंबर ब्लॉक और रिपोर्ट करो। असली नौकरी कमाने के लिए कभी भुगतान या “निवेश” नहीं माँगती।','WhatsApp mein number block aur report karo. Asli job kabhi kamaane ke liye pay ya “invest” karne ko nahi kehti.'),
 collect:L('Tap Decline. To receive money you only share your UPI ID or QR — the payer enters THEIR PIN.','Decline दबाओ। पैसा पाने के लिए केवल अपनी UPI ID या QR दो — भुगतान करने वाला अपना PIN डालता है।','Decline dabao. Paisa paane ke liye sirf apni UPI ID ya QR do — pay karne wala APNA PIN daalta hai.'),
 bill:L('Do not call. Check your bill on the electricity board’s official app/website. Report the number on Chakshu.','कॉल मत करो। बिजली बोर्ड के आधिकारिक ऐप/वेबसाइट पर बिल देखो। नंबर को चक्षु पर रिपोर्ट करो।','Call mat karo. Bijli board ke official app/website pe bill check karo. Number ko Chakshu pe report karo.'),
 papa:L('Stop. Call Papa back on his OLD saved number, or ask your family’s secret code word. Tell Mummy — secrecy is the scam.','रुको। पापा को उनके पुराने सेव नंबर पर कॉल करो, या परिवार का गुप्त कोड शब्द पूछो। मम्मी को बताओ — गोपनीयता ही स्कैम है।','Ruko. Papa ko unke PURANE saved number pe call back karo, ya family ka secret code word poocho. Mummy ko batao — secrecy hi scam hai.'),
 police:L('Cut the call. Tell your parents. If anyone lost money, call 1930 (National Cyber Crime Helpline) at once or report on cybercrime.gov.in — the first hours matter most.','कॉल काटो। माता-पिता को बताओ। किसी का पैसा गया हो तो तुरंत 1930 (राष्ट्रीय साइबर अपराध हेल्पलाइन) पर कॉल करो या cybercrime.gov.in पर रिपोर्ट करो — पहले घंटे सबसे अहम हैं।','Call kaato. Parents ko batao. Kisi ka paisa gaya ho to turant 1930 (National Cyber Crime Helpline) call karo ya cybercrime.gov.in pe report karo — pehle kuch ghante sabse important hain.'),
 free:L('Do not forward or tap. Reply kindly in the group that it is a known scam, so others are protected too.','आगे मत भेजो, मत दबाओ। ग्रुप में शालीनता से बताओ कि यह जाना-माना स्कैम है, ताकि दूसरे भी बचें।','Forward mat karo, tap mat karo. Group mein politely batao ki yeh known scam hai, taaki doosre bhi bachein.'),
 otp:L('It is genuine because you requested it — use it in your app and never share it.','यह असली है क्योंकि आपने माँगा था — अपने ऐप में डालो और कभी साझा मत करो।','Yeh asli hai kyunki aapne maanga tha — apne app mein daalo aur kabhi share mat karo.'),
 ptm:L('Safe. Note the date.','सुरक्षित। तारीख़ नोट करो।','Safe. Date note kar lo.'),food:L('Safe — just an update.','सुरक्षित — केवल जानकारी।','Safe — sirf update.')};
function decide(m,s,v){if(s.done)return;s.done=true;s.right=(v===m.scam);s.found.forEach(()=>{});N.emit(s.right?'answered:right':'answered:wrong',{msg:m.id});showFlags(m,s);verdict(m,s);score();mission();}
function verdict(m,s){$('ver').innerHTML=`<div class="verdict ${s.right?'ok':'no'}"><b>${s.right?'✅ '+T(L('Correct!','सही!','Sahi!')):'❌ '+T(L('Not quite.','ठीक नहीं।','Galat.'))}</b> ${T(m.scam?L('This is a SCAM.','यह स्कैम है।','Yeh SCAM hai.'):L('This one is SAFE.','यह सुरक्षित है।','Yeh SAFE hai.'))}<br>👉 ${T(ACT[m.id])}</div>`;$('acts').style.display='none';}
function mission(){const {n,d}=score(),need=Math.min(cfg.need||8,list.length);const ok=n>=need;
 $('mission').innerHTML=(ok?'✅ ':'')+T(L(`Sort the inbox: get at least ${need} of ${list.length} right. Done ${d}, correct ${n}.`,`इनबॉक्स छाँटो: ${list.length} में से कम से कम ${need} सही करो। किए ${d}, सही ${n}।`,`Inbox sort karo: ${list.length} mein se kam se kam ${need} sahi karo. Kiye ${d}, sahi ${n}.`));
 if(ok&&!mission.done){mission.done=1;N.confetti();N.toast(L('Cyber Defender! Mission complete +XP','साइबर रक्षक! मिशन पूरा +XP','Cyber Defender! Mission complete +XP'),'ok');N.emit('mission:complete',{lab:'scam-inbox',score:n});}}
function help(){$('help').innerHTML=`<b>🆘 ${T(L('If something goes wrong','अगर कुछ गड़बड़ हो','Agar kuch galat ho jaaye'))}</b><ul>
 <li>${T(L('Tell a parent or teacher at once — you will not be in trouble.','तुरंत माता-पिता या शिक्षक को बताओ — आप मुसीबत में नहीं पड़ोगे।','Turant parent ya teacher ko batao — aap musibat mein nahi padoge.'))}</li>
 <li>📞 <b>1930</b> — ${T(L('National Cyber Crime Helpline (call quickly if money was lost)','राष्ट्रीय साइबर अपराध हेल्पलाइन (पैसा गया हो तो जल्दी कॉल करो)','National Cyber Crime Helpline (paisa gaya ho to jaldi call karo)'))}</li>
 <li>🌐 <b>cybercrime.gov.in</b> — ${T(L('report online','ऑनलाइन रिपोर्ट','online report'))}</li>
 <li>📱 <b>Sanchar Saathi → Chakshu</b> — ${T(L('report a suspected fraud call, SMS or WhatsApp','संदिग्ध धोखाधड़ी कॉल, SMS या WhatsApp की रिपोर्ट','suspected fraud call, SMS ya WhatsApp report karo'))}</li></ul>
 <div class="muted" style="font-size:12px">${T(L('All names, numbers and links here are made up for practice.','यहाँ सभी नाम, नंबर और लिंक अभ्यास के लिए काल्पनिक हैं।','Yahan saare naam, numbers aur links practice ke liye kaalpanik hain.'))}</div>`;}
const goalDef=L('Open each message, tap anything that feels off, then decide: scam or safe? Real scammers copy banks, police, jobs and even family voices.','हर संदेश खोलो, जो अजीब लगे उसे दबाओ, फिर तय करो: स्कैम या सुरक्षित? असली ठग बैंक, पुलिस, नौकरी और परिवार की आवाज़ तक की नक़ल करते हैं।','Har message kholo, jo ajeeb lage use tap karo, phir decide karo: scam ya safe? Asli scammers bank, police, job aur family ki awaaz tak copy karte hain.');
const setGoal=()=>$('goal').innerHTML=T(goal||goalDef);N.onLang(()=>{setGoal();drawList();help();mission();if(openId)open(openId);});
setGoal();drawList();help();mission();
window.__lab={open,decide:(id,v)=>{open(id);const m=M.find(x=>x.id===id);decide(m,state[id],v);},tapAll:()=>$('det').querySelectorAll('.fl').forEach(b=>b.click())};
})();
</script></body></html>
