<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robot & IoT Lab — NCA Tech & AI Lab</title><style>/* NCA Tech & AI Lab — Level 2 shared lab skin (own work, MIT). Family App lesson tokens: paper, card, ink, saffron, teal, plum. */
:root{--paper:#FBF8F3;--card:#FFFDF9;--ink:#1C1B1A;--muted:#4B5563;--line:#E7E1D6;--saffron:#E8702A;--saffronD:#C2410C;--teal:#0F766E;--plum:#6D28D9;--sky:#0369A1;

--r:16px;--sh:0 1px 0 rgba(28,27,26,.04),0 6px 18px -8px rgba(28,27,26,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;font-variant-numeric:tabular-nums}
body{background:transparent;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(251,248,243,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:var(--lilac);flex:none}
.top h1{font-size:16px;margin:0;line-height:1.2;flex:1;min-width:0}
.top h1 small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;background:var(--card)}
.lang button{border:0;background:none;padding:6px 9px;font-size:12px;font-weight:600;color:var(--muted);min-height:32px}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.wrap>*{min-width:0}
.wrap>div{grid-template-columns:minmax(0,1fr)}
.card,.stage{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.goal{background:var(--butter);border-color:#F1DFA8;display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.goal b{color:#8A5300}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;min-height:44px;background:var(--saffron);color:var(--ink);box-shadow:0 3px 0 #B4531B;transition:transform .12s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #B4531B}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);box-shadow:none}
.btn.teal{background:var(--teal);color:#fff;box-shadow:0 3px 0 #0A4F49}
.btn.plum{background:var(--plum);color:#fff;box-shadow:0 3px 0 #4C1D95}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--mint);color:var(--teal)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:2px}/* wraps: every mode name always fully visible */
.tabs button{flex:0 1 auto;max-width:100%;white-space:normal;text-align:center;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}

.toast{position:fixed;left:0;top:0;width:max-content;max-width:min(92vw,340px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;visibility:hidden;transform:scale(.92);transition:opacity .25s,transform .25s,visibility 0s .25s;pointer-events:none;text-align:center;line-height:1.35}

.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<style>

@media (orientation:landscape) and (min-width:640px){.wrap{grid-template-columns:1.2fr 1fr}.wrap>.full{grid-column:1/-1}}
</style></head><body>

<script>/* NCA Tech & AI Lab — Level 2 shared lab runtime (own work, MIT). No eval, no network except an optional same-origin ?lesson= JSON. */
(function(g){
  const qs=new URLSearchParams(location.search);
  const LANGS=['hinglish','en','hi'];
  let lang=(qs.get('lang')||localStorage.getItem('nca-tl-lang')||'hinglish'); if(!LANGS.includes(lang)) lang='hinglish';
  const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const t=x=>x==null?'':(typeof x==='string'||typeof x==='number')?String(x):(x[lang]||x.hinglish||x.en||'');
  let STR={}; const listeners=[];
  function applyI18n(root){(root||document).querySelectorAll('[data-k]').forEach(el=>{const v=STR[el.dataset.k]; if(v) el.innerHTML=t(v);});
    document.documentElement.lang=lang==='hi'?'hi':(lang==='en'?'en':'en-IN');
    document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));}
  function setLang(l){lang=l;localStorage.setItem('nca-tl-lang',l);applyI18n();listeners.forEach(f=>f(l));}
  function header(icon,titleK,subK){const h=document.createElement('header');h.className='top';
    h.innerHTML=`<div class="ic" aria-hidden="true">${icon}</div><h1><span data-k="${titleK}"></span><small data-k="${subK}"></small></h1>
    <div class="lang" role="group" aria-label="Language"><button data-l="hinglish">Hinglish</button><button data-l="en">EN</button><button data-l="hi">हिं</button></div>`;
    document.body.prepend(h); h.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));}
  // Toast: never covers text. It floats in a free band of the screen (bottom first); if the screen has no free band
  // it sits in the page flow right under what the child just tapped (pushes content down, covers nothing). Closes after 2.5 s.
  let toastEl,lastTap=null,tapAt=null;document.addEventListener('pointerdown',e=>{lastTap=e.target;tapAt=[e.clientX,e.clientY+scrollY]},true);let rePend=0;const rePlace=()=>{if(!toastEl||!toastEl.classList.contains('on')||rePend)return;rePend=1;requestAnimationFrame(()=>{rePend=0;placeToast();});};
  addEventListener('scroll',rePlace,{passive:true});addEventListener('resize',rePlace);document.addEventListener('animationend',rePlace,true);document.addEventListener('transitionend',rePlace,true);const toastMO=new MutationObserver(rs=>{if(rs.some(r=>!toastEl.contains(r.target)))rePlace();});
  function textRects(skip){const vh=innerHeight,out=[],rg=document.createRange(),w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
    while((n=w.nextNode())){if(!n.nodeValue.trim())continue;const p=n.parentElement;if(!p||skip.contains(p)||/^(SCRIPT|STYLE)$/.test(p.tagName))continue;rg.selectNodeContents(n);
      for(const q of rg.getClientRects())if(q.width>=1&&q.bottom>0&&q.top<vh)out.push(q);}
    document.querySelectorAll('input,select,textarea,button,a[href],[role=button]').forEach(e=>{if(skip.contains(e))return;const q=e.getBoundingClientRect();if(q.width&&q.bottom>0&&q.top<vh)out.push(q)});if(0)document.querySelectorAll('x').forEach(e=>{const q=e.getBoundingClientRect();if(q.width&&q.bottom>0&&q.top<vh)out.push(q)});return out;}
  function freeSpot(el){const vw=document.documentElement.clientWidth,vh=innerHeight,w=el.offsetWidth,h=el.offsetHeight,m=8;let top=m;
    const bar=document.querySelector('.top');if(bar)top=Math.max(top,bar.getBoundingClientRect().bottom+m);
    const obs=textRects(el),xs=[(vw-w)/2,m,vw-w-m],free=(x,y)=>!obs.some(q=>q.left<x+w+4&&q.right>x-4&&q.top<y+h+4&&q.bottom>y-4);
    const cur=el._spot;if(cur&&free(cur.x,cur.y))return cur;
    for(let y=vh-h-m;y>=top;y-=6)for(const x of xs)if(free(x,y))return{x,y};return null;}
  /* never drop the note inside a 3D scene, a transformed, positioned-out or clipping box */
  function boxedIn(a){for(let p=a;p&&p!==document.body;p=p.parentElement){const c=getComputedStyle(p);if(c.transform!=='none'||c.transformStyle==='preserve-3d'||c.perspective!=='none'||c.position==='absolute'||c.position==='fixed'||(p!==a&&c.overflow!=='visible'))return true;}return false;}
  function inlineAfter(el){let a=lastTap&&lastTap.isConnected&&!el.contains(lastTap)?lastTap:null;
    if(!a&&tapAt){const y=tapAt[1]-scrollY;if(y>0&&y<innerHeight)a=document.elementFromPoint(tapAt[0],y);}/* the tapped thing was re-drawn: use what is there now */
    if(!a||el.contains(a))a=document.querySelector('main')||document.body.lastElementChild;
    while(a.parentElement&&a.parentElement!==document.body){const d=getComputedStyle(a.parentElement),me=getComputedStyle(a);
      if(me.display!=='inline'&&!(a instanceof SVGElement)&&(d.display==='block'||d.display==='flow-root'||d.display==='grid'||(d.display==='flex'&&d.flexDirection.startsWith('column')))&&a.getBoundingClientRect().width>=Math.min(260,innerWidth*.6)&&!boxedIn(a))break;a=a.parentElement;}
    a.after(el);}
  function placeToast(){const el=toastEl;if(!el.classList.contains('on'))return;if(!el.isConnected){el.classList.remove('inline');document.body.appendChild(el);}
    if(el.classList.contains('inline'))return;const s=freeSpot(el);
    if(s){el._spot=s;el.style.left=s.x+'px';el.style.top=s.y+'px';}else{el._spot=null;el.classList.add('inline');el.style.left=el.style.top='';inlineAfter(el);el.scrollIntoView({block:'nearest'});}}
  function toast(msg,kind){if(!toastEl){toastEl=document.createElement('div');toastEl.setAttribute('role','status');document.body.appendChild(toastEl);}
    const el=toastEl;clearTimeout(el._t);clearInterval(el._iv);if(el.classList.contains('inline'))document.body.appendChild(el);
    el.className='toast '+(kind||'');el._spot=null;el.innerHTML=typeof msg==='object'?t(msg):msg;el.style.left='0px';el.style.top='0px';
    el.classList.add('on');placeToast();el._iv=setInterval(placeToast,200);toastMO.observe(document.body,{subtree:true,childList:true,attributes:true,characterData:true});
    el._t=setTimeout(()=>{clearInterval(el._iv);toastMO.disconnect();el.classList.remove('on');setTimeout(()=>{if(!el.classList.contains('on')&&el.classList.contains('inline')){el.classList.remove('inline');document.body.appendChild(el);}},320);},2500);}
  function confetti(){if(reduced())return;const c=document.createElement('canvas');c.className='confetti';c.setAttribute('aria-hidden','true');document.body.appendChild(c);
    const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d');const cols=['#E8702A','#0F766E','#6D28D9','#F5B90A','#02CFF9','#FF6B57'];
    const P=Array.from({length:90},()=>({x:W/2,y:H*.55,vx:(Math.random()-.5)*9,vy:-Math.random()*11-4,r:Math.random()*6+3,c:cols[Math.random()*6|0],a:Math.random()*6}));
    let n=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.32;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
      if(++n<110)requestAnimationFrame(f);else c.remove();})();}
  function tween(ms,step,done){if(reduced()||ms<=0){step(1);done&&done();return()=>{};}let stop=0;const t0=performance.now();
    const f=now=>{if(stop)return;const k=Math.min(1,(now-t0)/ms);step(k);k<1?requestAnimationFrame(f):done&&done();};requestAnimationFrame(f);return()=>{stop=1};}
  const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  const sleep=ms=>new Promise(r=>setTimeout(r,reduced()?0:ms));
  // Lesson config: ?lesson=<same-origin json path> (its play.config + play.goal), else inline defaults. ?cfg=<json> also accepted (parsed with JSON.parse only).
  async function lessonConfig(defaults){let cfg=Object.assign({},defaults),goal=null,id=null;
    const p=qs.get('lesson');
    if(p&&/^[\w\-./]+\.json$/.test(p)&&!p.includes('..')){try{const r=await fetch(p);if(r.ok){const j=await r.json();id=j.id;if(j.play){Object.assign(cfg,j.play.config||{});goal=j.play.goal||null;}}}catch(e){}}
    const c=qs.get('cfg'); if(c){try{Object.assign(cfg,JSON.parse(c));}catch(e){}}
    return {cfg,goal,id};}
  // Progress events the Family App shell can listen for (postMessage to the parent frame), plus local XP for the prototype.
  function emit(type,data){const msg={source:'nca-techlab',type,data:data||{},at:Date.now()};try{parent!==window&&parent.postMessage(msg,'*');}catch(e){}
    document.dispatchEvent(new CustomEvent('nca-lab',{detail:msg}));}
  g.NCA={qs,esc,t,get lang(){return lang},setLang,onLang:f=>listeners.push(f),strings:o=>{STR=Object.assign(STR,o);applyI18n();},applyI18n,header,toast,confetti,tween,ease,sleep,reduced,lessonConfig,emit};
})(window);

<script>
(async function(){
const N=NCA,T=N.t,E=N.esc,L=(en,hi,hinglish)=>({en,hi,hinglish}),$=id=>document.getElementById(id);
N.header('🤖','title','sub');
N.strings({title:L('Robot & IoT Lab','रोबोट और IoT लैब','Robot aur IoT Lab'),sub:L('Sense → Think → Act: line follower, smart farm, servo arm','महसूस → सोचो → करो: लाइन फ़ॉलोअर, स्मार्ट खेत, सर्वो भुजा','Sense → Think → Act: line follower, smart farm, servo arm'),mT:L('🚀 Mission','🚀 मिशन','🚀 Mission')});
const {cfg,goal}=await N.lessonConfig({tab:'line'});
const TABS=[['line',L('🛤️ Line follower','🛤️ लाइन फ़ॉलोअर','🛤️ Line follower')],['farm',L('🌱 Smart farm (IoT)','🌱 स्मार्ट खेत (IoT)','🌱 Smart farm (IoT)')],['arm',L('🦾 Servo arm','🦾 सर्वो भुजा','🦾 Servo arm')]];
const GOALS={line:L('The robot has two light sensors that see the black line. Choose what it does for each sensor reading so it drives one full lap without leaving the track.','रोबोट के दो प्रकाश सेंसर काली रेखा देखते हैं। हर सेंसर रीडिंग पर वह क्या करे चुनो ताकि वह ट्रैक छोड़े बिना एक पूरा चक्कर लगाए।','Robot ke do light sensors kaali line dekhte hain. Har sensor reading pe woh kya kare chuno taaki woh track chhode bina ek poora lap lagaye.'),
 farm:L('A soil-moisture sensor sends readings to the cloud every hour. Set when the pump turns on, and use the weather forecast, so the seedlings stay between 30% and 70% all day.','मिट्टी-नमी सेंसर हर घंटे क्लाउड को रीडिंग भेजता है। पंप कब चालू हो तय करो, और मौसम पूर्वानुमान उपयोग करो, ताकि पौधे पूरे दिन 30% से 70% के बीच रहें।','Soil-moisture sensor har ghante cloud ko reading bhejta hai. Pump kab on ho set karo, aur weather forecast use karo, taaki seedlings poore din 30% se 70% ke beech rahein.'),
 arm:L('Each joint is a servo motor you turn to an exact angle. Move the arm to the mango, grab it, then drop it in the basket.','हर जोड़ एक सर्वो मोटर है जिसे तुम सटीक कोण पर घुमाते हो। भुजा को आम तक ले जाओ, पकड़ो, फिर टोकरी में डालो।','Har joint ek servo motor hai jise tum exact angle pe ghumaate ho. Arm ko aam tak le jao, pakdo, phir tokri mein daalo.')};
let tab=TABS.some(x=>x[0]===cfg.tab)?cfg.tab:'line';const done={};
function win(k,m){if(done[k])return;done[k]=1;N.confetti();N.toast(m,'ok');N.emit('mission:complete',{lab:'robot-lab',tab:k});mission();}
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}};

/* ---------- LINE FOLLOWER ---------- */
const TA=[110,125],TB=[250,125],TR=75,TW=22;
function dLine(x,y){const t=Math.max(0,Math.min(1,(x-TA[0])/(TB[0]-TA[0])));const px=TA[0]+t*(TB[0]-TA[0]);return Math.abs(Math.hypot(x-px,y-125)-TR);}
const ACT=[['fwd','⬆',L('Forward','आगे','Aage')],['left','↰',L('Left','बाएँ','Left')],['right','↱',L('Right','दाएँ','Right')],['stop','⏹',L('Stop','रुको','Ruko')]];
const STATES=[['both',1,1,L('both see line','दोनों रेखा पर','dono line pe')],['left',1,0,L('only left','केवल बायाँ','sirf left')],['right',0,1,L('only right','केवल दायाँ','sirf right')],['none',0,0,L('none see line','कोई नहीं','koi nahi')]];
let rules={both:'fwd',left:'fwd',right:'fwd',none:'stop'},sim=null,res=null,raf=0;
function newSim(){return {x:180,y:50,th:0,lap:0,pa:Math.atan2(50-125,0),lost:0,s:0,trail:[[180,50]],st:'both'};}
function step(m){const sx=Math.cos(m.th),sy=Math.sin(m.th),lx=-sy,ly=sx,V=1.6,TRN=.09;
 const Ls=dLine(m.x+18*sx-7*lx,m.y+18*sy-7*ly)<TW/2,Rs=dLine(m.x+18*sx+7*lx,m.y+18*sy+7*ly)<TW/2;
 m.st=Ls&&Rs?'both':Ls?'left':Rs?'right':'none';const a=rules[m.st];
 if(a==='fwd'){m.x+=V*sx;m.y+=V*sy;}else if(a==='left'){m.th-=TRN;m.x+=V*.6*sx;m.y+=V*.6*sy;}else if(a==='right'){m.th+=TRN;m.x+=V*.6*sx;m.y+=V*.6*sy;}
 m.lost=dLine(m.x,m.y)>TW*1.6?m.lost+1:0;const an=Math.atan2(m.y-125,m.x-180);let d=an-m.pa;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;m.lap+=d;m.pa=an;m.s++;
 if(m.s%6===0)m.trail.push([m.x,m.y]);
 if(Math.abs(m.lap)>=2*Math.PI)return 'ok';if(m.lost>30||m.x<0||m.x>360||m.y<0||m.y>250)return 'off';if(m.s>2600)return 'slow';return '';}
function lineSVG(m){const sx=Math.cos(m.th),sy=Math.sin(m.th),lx=-sy,ly=sx;const deg=m.th*180/Math.PI;
 const sL=[m.x+18*sx-7*lx,m.y+18*sy-7*ly],sR=[m.x+18*sx+7*lx,m.y+18*sy+7*ly];const on=p=>dLine(p[0],p[1])<TW/2;
 return `<svg class="sim" viewBox="0 0 360 250" role="img" aria-label="${E(T(L('Oval track with a two-sensor robot','दो-सेंसर रोबोट के साथ अंडाकार ट्रैक','Do-sensor robot ke saath oval track')))}">
 <rect x="0" y="0" width="360" height="250" fill="#F8F5EC"/><path d="M110 50 H250 A75 75 0 0 1 250 200 H110 A75 75 0 0 1 110 50 Z" fill="none" stroke="#111" stroke-width="${TW}"/>
 <path d="M180 38 v24" stroke="#22C55E" stroke-width="4"/><text x="186" y="30" font-size="11" fill="#15803D" font-weight="700">START</text>
 <polyline points="${m.trail.map(p=>p.join(',')).join(' ')} ${m.x},${m.y}" fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="3 3" opacity=".8"/>
 <g transform="translate(${m.x} ${m.y}) rotate(${deg})"><rect x="-14" y="-12" width="30" height="24" rx="7" fill="#7C3AED" stroke="#fff" stroke-width="2"/><rect x="-10" y="-16" width="12" height="5" rx="2" fill="#1F2937"/><rect x="-10" y="11" width="12" height="5" rx="2" fill="#1F2937"/><circle cx="6" cy="0" r="3.5" fill="#FDE68A"/><line x1="16" y1="0" x2="18" y2="0" stroke="#fff"/></g>
 ${[sL,sR].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${on(p)?'#F43F5E':'#22C55E'}" stroke="#fff" stroke-width="1.5"/>`).join('')}
 </svg>`;}
function codeLine(){const fn={fwd:'forward()',left:'turn_left()',right:'turn_right()',stop:'stop()'};
 return `<pre><span class="k">while</span> True:            <span class="c"># the feedback loop</span>
    L = left_sensor()   <span class="c"># SENSE</span>
    R = right_sensor()
    <span class="k">if</span> L <span class="k">and</span> R: ${fn[rules.both]}   <span class="c"># THINK → ACT</span>
    <span class="k">elif</span> L:    ${fn[rules.left]}
    <span class="k">elif</span> R:    ${fn[rules.right]}
    <span class="k">else</span>:      ${fn[rules.none]}</pre>`;}
function drawLine(){const m=sim||newSim();
 $('stage').innerHTML=`<div id="lsv">${lineSVG(m)}</div><div class="row" style="margin-top:8px"><button class="btn teal" id="go">${T(L('▶ Run','▶ चलाओ','▶ Run'))}</button><button class="btn ghost" id="lr">${T(L('↺ Reset','↺ फिर से','↺ Reset'))}</button></div><div id="lmsg"></div>`;
 $('side').innerHTML=`<div style="font-weight:800;font-size:14px">${T(L('Rules: what should the robot do?','नियम: रोबोट क्या करे?','Rules: robot kya kare?'))}</div>
 ${STATES.map(([k,l,r,n])=>`<div class="rule"><div class="st"><span class="dot ${l?'on':'off'}"></span><span class="dot ${r?'on':'off'}"></span> <span style="font-size:11px;font-weight:600">${T(n)}</span></div><div class="seg">${ACT.map(([a,ic,an])=>`<button data-r="${k}" data-a="${a}" aria-pressed="${rules[k]===a}" aria-label="${E(T(an))}">${ic} <span style="font-size:11px">${T(an)}</span></button>`).join('')}</div></div>`).join('')}
 <div style="font-size:12px;color:var(--muted);margin:4px 0 8px">⚫ = ${T(L('sensor over the black line','सेंसर काली रेखा पर','sensor kaali line pe'))} · ⚪ = ${T(L('over white floor','सफ़ेद फ़र्श पर','safed floor pe'))}</div>${codeLine()}`;
 $('side').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rules[b.dataset.r]=b.dataset.a;vib();stopRun();sim=null;res=null;drawLine();});
 $('go').onclick=runLine;$('lr').onclick=()=>{stopRun();sim=null;res=null;drawLine();};showRes();}
function showRes(){const el=$('lmsg');if(!el)return;if(!res){el.innerHTML='';return;}
 const M={ok:[1,L('Full lap! Your sense → think → act loop kept the robot on the line.','पूरा चक्कर! तुम्हारे महसूस → सोचो → करो लूप ने रोबोट को रेखा पर रखा।','Poora lap! Tumhare sense → think → act loop ne robot ko line pe rakha.')],
  off:[0,L('The robot left the track. When only the LEFT sensor sees the line, the line is to the robot’s left — which way should it turn?','रोबोट ट्रैक से हट गया। जब केवल बायाँ सेंसर रेखा देखे, रेखा रोबोट के बाईं ओर है — उसे किधर मुड़ना चाहिए?','Robot track se hat gaya. Jab sirf LEFT sensor line dekhe, line robot ke left mein hai — use kidhar mudna chahiye?')],
  slow:[0,L('The robot got stuck or went round in circles. It must move forward when both sensors see the line.','रोबोट अटक गया या गोल घूमता रहा। दोनों सेंसर रेखा देखें तो उसे आगे बढ़ना चाहिए।','Robot atak gaya ya gol ghoomta raha. Dono sensors line dekhein to use aage badhna chahiye.')]}[res];
 el.innerHTML=`<div class="msg ${M[0]?'ok':'bad'}">${M[0]?'✅':'⚠️'} ${T(M[1])}</div>`;}
function stopRun(){cancelAnimationFrame(raf);raf=0;}
function runLine(){stopRun();sim=newSim();res=null;showRes();
 const fin=r=>{res=r;$('lsv').innerHTML=lineSVG(sim);showRes();if(r==='ok')win('line',L('Line follower complete — that is a real feedback loop!','लाइन फ़ॉलोअर पूरा — यही असली फ़ीडबैक लूप है!','Line follower complete — yahi asli feedback loop hai!'));};
 if(N.reduced()){let r='';while(!(r=step(sim)));return fin(r);}
 const tick=()=>{let r='';for(let i=0;i<6&&!r;i++)r=step(sim);$('lsv').innerHTML=lineSVG(sim);if(r)return fin(r);raf=requestAnimationFrame(tick);};raf=requestAnimationFrame(tick);}

/* ---------- SMART FARM ---------- */
let thr=20,skip=false,farmRes=null;
const rainH=h=>h===14||h===15;
function farmSim(){let m=55,water=0,lo=100,hi=0;const rows=[];
 for(let h=0;h<24;h++){const fc=skip&&[h,h+1,h+2].some(rainH);const pump=m<thr&&!fc;if(pump){m+=10;water+=10;}
  m-=(h<6||h>19)?1.5:4.5;if(rainH(h))m+=20;m=Math.max(0,Math.min(100,m));lo=Math.min(lo,m);hi=Math.max(hi,m);rows.push({h,m,pump,fc,rain:rainH(h)});}
 return {rows,lo,hi,water,ok:lo>=30&&hi<=70};}
function farmSVG(r){const X=h=>30+h*13.5,Y=m=>210-m*1.9;const pts=r.rows.map(o=>`${X(o.h)},${Y(o.m)}`).join(' ');
 return `<svg class="sim" viewBox="0 0 360 240" role="img" aria-label="${E(T(L('Soil moisture over 24 hours','24 घंटे में मिट्टी की नमी','24 ghante mein mitti ki nami')))}">
 <rect x="30" y="${Y(70)}" width="${13.5*23}" height="${Y(30)-Y(70)}" fill="#10B981" opacity=".18"/><text x="34" y="${Y(70)+12}" font-size="10" fill="#6EE7B7">${E(T(L('healthy 30–70%','स्वस्थ 30–70%','healthy 30–70%')))}</text>
 ${[0,25,50,75,100].map(v=>`<line x1="30" x2="${X(23)}" y1="${Y(v)}" y2="${Y(v)}" stroke="#25305A"/><text x="4" y="${Y(v)+4}" font-size="9" fill="#8090C0">${v}%</text>`).join('')}
 ${r.rows.map(o=>(o.rain?`<text x="${X(o.h)-6}" y="20" font-size="12">🌧️</text>`:'')+(o.pump?`<rect x="${X(o.h)-4}" y="214" width="8" height="10" rx="2" fill="#38BDF8"/>`:'')+(o.fc&&!o.rain?`<text x="${X(o.h)-4}" y="34" font-size="9" fill="#FDE68A">⏸</text>`:'')).join('')}
 <polyline points="${pts}" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linejoin="round"/>
 ${r.rows.map(o=>`<circle cx="${X(o.h)}" cy="${Y(o.m)}" r="2.6" fill="${o.m<30||o.m>70?'#F43F5E':'#FDE047'}"/>`).join('')}
 ${[0,6,12,18,23].map(h=>`<text x="${X(h)-6}" y="236" font-size="9" fill="#8090C0">${h}:00</text>`).join('')}<text x="${X(23)-40}" y="226" font-size="9" fill="#38BDF8">💧 ${E(T(L('pump','पंप','pump')))}</text></svg>`;}
function drawFarm(){const r=farmSim();farmRes=r;
 $('stage').innerHTML=`${farmSVG(r)}<div class="flow" aria-label="data flow"><span>🌡️<br>${T(L('sensor','सेंसर','sensor'))}</span><i>→</i><span>🔲<br>${T(L('controller','नियंत्रक','controller'))}</span><i>→ Wi-Fi →</i><span>☁️<br>${T(L('cloud','क्लाउड','cloud'))}</span><i>→</i><span>📱<br>${T(L('farmer app','किसान ऐप','farmer app'))}</span></div>
 <div class="log" id="flog">${r.rows.filter((o,i)=>i%3===0||o.pump||o.rain).slice(0,14).map(o=>`${String(o.h).padStart(2,'0')}:00 sensor→cloud {"moisture":${Math.round(o.m)}}${o.pump?' · cloud→pump ON':''}${o.fc&&!o.rain?' · forecast rain → wait':''}${o.rain?' · 🌧 rain':''}`).join('<br>')}</div>`;
 $('side').innerHTML=`<label for="thr" style="font-weight:800;font-size:14px">${T(L('Pump turns ON when moisture is below','नमी इससे कम हो तो पंप चालू','Moisture isse kam ho to pump ON'))}: <b id="tv">${thr}%</b></label><input type="range" id="thr" min="20" max="70" step="5" value="${thr}">
 <label class="tg"><input type="checkbox" id="sk" ${skip?'checked':''}> ☁️ ${T(L('Use the weather forecast: wait if rain is due in the next 3 hours','मौसम पूर्वानुमान उपयोग करो: अगले 3 घंटे में बारिश हो तो रुको','Weather forecast use karo: agle 3 ghante mein baarish ho to ruko'))}</label>
 <div class="big">${r.ok?'🌱✅':'🥀⚠️'} ${Math.round(r.lo)}–${Math.round(r.hi)}%</div><div style="font-size:13.5px">💧 ${T(L('Pump water used','पंप का पानी','Pump ka paani'))}: <b>${r.water} L</b></div>
 <div class="msg ${r.ok?'ok':'bad'}">${T(r.ok?L('Healthy all day, and no water wasted before the rain. This is how IoT farms save water.','पूरे दिन स्वस्थ, और बारिश से पहले पानी बर्बाद नहीं। IoT खेत ऐसे पानी बचाते हैं।','Poore din healthy, aur baarish se pehle paani waste nahi. IoT farms aise paani bachaate hain.'):r.lo<30?L('Too dry at some point — the pump starts too late. Raise the threshold.','किसी समय बहुत सूखा — पंप देर से चलता है। सीमा बढ़ाओ।','Kisi time bahut sookha — pump der se chalta hai. Threshold badhao.'):L('Too wet — the soil got waterlogged after rain. Use less pumping or the forecast.','बहुत गीला — बारिश के बाद मिट्टी में पानी भर गया। कम पंप करो या पूर्वानुमान उपयोग करो।','Bahut geela — baarish ke baad mitti mein paani bhar gaya. Kam pump karo ya forecast use karo.'))}</div>`;
 $('thr').oninput=e=>{thr=+e.target.value;drawFarm();};$('sk').onchange=e=>{skip=e.target.checked;vib();drawFarm();};
 if(r.ok)win('farm',L('Smart farm running! Sensor + cloud + forecast = water saved.','स्मार्ट खेत चालू! सेंसर + क्लाउड + पूर्वानुमान = पानी बचा।','Smart farm chalu! Sensor + cloud + forecast = paani bacha.'));}

/* ---------- SERVO ARM ---------- */
const BASE=[180,215],L1=85,L2=75;
const tip=(a1,a2)=>{const r1=a1*Math.PI/180,r2=(a1+a2-90)*Math.PI/180;const e=[BASE[0]+L1*Math.cos(r1),BASE[1]-L1*Math.sin(r1)];return [e,[e[0]+L2*Math.cos(r2),e[1]-L2*Math.sin(r2)]];};
const MANGO=tip(150,40)[1],BASKET=tip(40,130)[1];
let a1=90,a2=90,held=false,placed=false,armMsg=null;
const near=(p,q,d)=>Math.hypot(p[0]-q[0],p[1]-q[1])<d;
function armSVG(){const [e,t]=tip(a1,a2);const mg=held?t:placed?[BASKET[0],BASKET[1]-4]:MANGO;
 return `<svg class="sim" viewBox="0 0 360 240" role="img" aria-label="${E(T(L('Two-joint robot arm','दो जोड़ों वाली रोबोट भुजा','Do joints wali robot arm')))}">
 <rect y="215" width="360" height="25" fill="#1E293B"/><circle cx="${MANGO[0]}" cy="${MANGO[1]+16}" r="0"/>
 <rect x="${MANGO[0]-18}" y="${MANGO[1]+8}" width="36" height="${215-MANGO[1]-8}" fill="#92400E" rx="3"/>
 <path d="M${BASKET[0]-24} ${BASKET[1]+2} h48 l-6 26 h-36 z" fill="#B45309" stroke="#FDE68A" stroke-width="1.5"/><rect x="${BASKET[0]-3}" y="${BASKET[1]+28}" width="6" height="${215-BASKET[1]-28}" fill="#475569"/>
 <rect x="${BASE[0]-22}" y="${BASE[1]-10}" width="44" height="14" rx="5" fill="#64748B"/>
 <line x1="${BASE[0]}" y1="${BASE[1]}" x2="${e[0]}" y2="${e[1]}" stroke="#F59E0B" stroke-width="11" stroke-linecap="round"/>
 <line x1="${e[0]}" y1="${e[1]}" x2="${t[0]}" y2="${t[1]}" stroke="#06B6D4" stroke-width="9" stroke-linecap="round"/>
 <circle cx="${BASE[0]}" cy="${BASE[1]}" r="9" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/><circle cx="${e[0]}" cy="${e[1]}" r="7" fill="#0F172A" stroke="#06B6D4" stroke-width="3"/>
 <path d="M${t[0]-6} ${t[1]-6} l6 6 l6 -6" stroke="#E2E8F0" stroke-width="3" fill="none"/>
 <text style="paint-order:stroke;stroke:#0B1430;stroke-width:2px" x="${BASKET[0]-16}" y="${BASKET[1]+20}" font-size="10" fill="#FDE68A">🧺</text>
 <text style="paint-order:stroke;stroke:#0B1430;stroke-width:3px" x="${BASE[0]+12}" y="${BASE[1]-12}" font-size="10" fill="#FCD34D">${a1}°</text><text style="paint-order:stroke;stroke:#0B1430;stroke-width:3px" x="${e[0]+10}" y="${e[1]-8}" font-size="10" fill="#67E8F9">${a2}°</text>
 <text x="${mg[0]-9}" y="${mg[1]+6}" font-size="18">🥭</text></svg>`;}
const pulse=a=>(1+a/180).toFixed(2);
function drawArm(){$('stage').innerHTML=`<div id="asv">${armSVG()}</div><div class="row" style="margin-top:8px"><button class="btn teal" id="grab">✊ ${T(L('Grab','पकड़ो','Pakdo'))}</button><button class="btn plum" id="drop">🖐 ${T(L('Drop','छोड़ो','Chhodo'))}</button><button class="btn ghost" id="ar">↺</button></div><div id="amsg"></div>`;
 $('side').innerHTML=`<label for="s1" style="font-weight:800;font-size:14px">🟠 ${T(L('Shoulder servo','कंधा सर्वो','Shoulder servo'))}: <b id="v1">${a1}°</b></label><input type="range" id="s1" min="0" max="180" step="5" value="${a1}">
 <label for="s2" style="font-weight:800;font-size:14px">🔵 ${T(L('Elbow servo','कोहनी सर्वो','Elbow servo'))}: <b id="v2">${a2}°</b></label><input type="range" id="s2" min="0" max="180" step="5" value="${a2}">
 <pre id="pw"></pre><div style="font-size:12.5px;color:var(--muted);margin-top:6px">${T(L('A hobby servo reads a control pulse 50 times a second: about 1 ms means 0°, about 2 ms means 180°. The motor turns until its sensor says it has reached that angle — a feedback loop inside the motor.','हॉबी सर्वो हर सेकंड 50 बार नियंत्रण पल्स पढ़ता है: लगभग 1 ms मतलब 0°, लगभग 2 ms मतलब 180°। मोटर तब तक घूमती है जब तक उसका सेंसर न बताए कि कोण आ गया — मोटर के अंदर फ़ीडबैक लूप।','Hobby servo har second 50 baar control pulse padhta hai: lagbhag 1 ms matlab 0°, lagbhag 2 ms matlab 180°. Motor tab tak ghoomti hai jab tak uska sensor na bataye ki angle aa gaya — motor ke andar feedback loop.'))}</div>`;
 const upd=()=>{$('asv').innerHTML=armSVG();$('v1').textContent=a1+'°';$('v2').textContent=a2+'°';$('pw').innerHTML=`<span class="c"># servo pulses (50 Hz)</span>\nshoulder.angle(${a1})  <span class="c"># ${pulse(a1)} ms</span>\nelbow.angle(${a2})     <span class="c"># ${pulse(a2)} ms</span>`;showArm();};
 $('s1').oninput=e=>{a1=+e.target.value;upd();};$('s2').oninput=e=>{a2=+e.target.value;upd();};
 $('grab').onclick=()=>{vib();const t=tip(a1,a2)[1];if(placed)armMsg=['ok',L('Already delivered!','पहले ही पहुँचा दिया!','Pehle hi deliver ho gaya!')];else if(near(t,MANGO,14)){held=true;armMsg=['ok',L('Got it! Now move to the basket and drop.','पकड़ लिया! अब टोकरी तक ले जाओ और छोड़ो।','Pakad liya! Ab tokri tak le jao aur chhodo.')];}else armMsg=['bad',L('The gripper is not at the mango yet. Adjust the two angles.','ग्रिपर अभी आम पर नहीं है। दोनों कोण बदलो।','Gripper abhi aam pe nahi hai. Dono angles badlo.')];upd();};
 $('drop').onclick=()=>{vib();const t=tip(a1,a2)[1];if(!held)armMsg=['bad',L('Grab the mango first.','पहले आम पकड़ो।','Pehle aam pakdo.')];else if(near(t,BASKET,16)){held=false;placed=true;armMsg=['ok',L('Delivered into the basket!','टोकरी में पहुँचा दिया!','Tokri mein deliver ho gaya!')];win('arm',L('Pick-and-place done — just like factory robot arms!','उठाना-रखना पूरा — फ़ैक्टरी रोबोट भुजाओं जैसा!','Pick-and-place done — factory robot arms jaisa!'));}else{held=false;armMsg=['bad',L('Oops, dropped on the floor! Grab it again from the stand.','अरे, फ़र्श पर गिर गया! स्टैंड से फिर पकड़ो।','Oops, floor pe gir gaya! Stand se phir pakdo.')];}upd();};
 $('ar').onclick=()=>{a1=90;a2=90;held=false;placed=false;armMsg=null;drawArm();};upd();}
function showArm(){const el=$('amsg');if(el)el.innerHTML=armMsg?`<div class="msg ${armMsg[0]}">${T(armMsg[1])}</div>`:'';}

function mission(){const st={line:L('One full lap on the track','ट्रैक पर एक पूरा चक्कर','Track pe ek poora lap'),farm:L('Seedlings 30–70% all day','पूरे दिन पौधे 30–70%','Seedlings poore din 30–70%'),arm:L('Mango delivered to the basket','आम टोकरी में पहुँचा','Aam tokri mein pahuncha')};
 $('mission').innerHTML=TABS.map(([k,n])=>`<div style="margin:3px 0">${done[k]?'✅':'⬜'} <b>${T(n)}</b> — ${T(st[k])}</div>`).join('');}
function draw(){stopRun();$('goal').innerHTML=E(T(goal&&cfg.tab===tab?goal:GOALS[tab]));$('tabs').innerHTML=TABS.map(([k,n])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${T(n)}</button>`).join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();});({line:drawLine,farm:drawFarm,arm:drawArm})[tab]();mission();}
N.onLang(draw);draw();
window.__lab={tab:k=>{tab=k;draw();},rules:r=>{Object.assign(rules,r);drawLine();},runSync:()=>{sim=newSim();let r='';while(!(r=step(sim)));return r;},done,MANGO,BASKET,tip};
})();
</script></body></html>
