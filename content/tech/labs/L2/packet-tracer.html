let mode=MODES[cfg.mode]?cfg.mode:'whatsapp', M, busy=false, slowMo=false, sentOnceWithLoss=false;

const goalDef=L('Send a message and follow every packet: DNS lookup first, then packets take different roads and get re-joined in order.','संदेश भेजो और हर पैकेट को देखो: पहले DNS खोज, फिर पैकेट अलग रास्तों से जाते हैं और क्रम से जुड़ते हैं।','Message bhejo aur har packet follow karo: pehle DNS lookup, phir packets alag raaston se jaate hain aur order mein jud jaate hain.');const setGoal=()=>$('goal').innerHTML=T(goal||goalDef);setGoal();
function mission(){ $('mission').innerHTML=sentOnceWithLoss?('✅ '+T(L('Done! A packet was lost, the receiver noticed the missing sequence number, asked again, and the message still arrived complete. That is how TCP keeps data reliable.','हो गया! एक पैकेट खोया, प्राप्तकर्ता ने ग़ायब क्रम संख्या देखी, दोबारा माँगा, और संदेश फिर भी पूरा पहुँचा। TCP ऐसे ही डेटा को भरोसेमंद रखता है।','Ho gaya! Ek packet kho gaya, receiver ne missing sequence number pakda, dobara maanga, aur message phir bhi poora pahuncha. TCP aise hi data reliable rakhta hai.'))):T(L('Turn on “Lose a packet”, send a message, and make sure it still arrives complete and in the right order.','“एक पैकेट खो जाए” चालू करो, संदेश भेजो, और देखो कि वह फिर भी पूरा और सही क्रम में पहुँचे।','“Raste mein ek packet kho jaaye” ON karo, message bhejo, aur dekho ki woh phir bhi poora aur sahi order mein pahunche.'));}
function pos(id){const r=svg.getBoundingClientRect(),land=r.width>r.height*1.15,n=M.nodes[id],k=land?n.q:n.p;return [k[0]*(r.width-70)+35,k[1]*(r.height-56)+26];}
function draw(){M=MODES[mode];const r=svg.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.innerHTML='';
 const gE=document.createElementNS(NS,'g');svg.appendChild(gE);
 M.edges.forEach(([a,b,d])=>{const [x1,y1]=pos(a),[x2,y2]=pos(b);const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${x1},${y1} Q${(x1+x2)/2+(y2-y1)*.12},${(y1+y2)/2-(x2-x1)*.12} ${x2},${y2}`);p.setAttribute('class','edge'+(d?' dns':''));p.id='e-'+a+'-'+b;gE.appendChild(p);});
 if(mode==='upi'){const [x1,y1]=pos('rb'),[x2,y2]=pos('ra');const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${x1},${y1} L${x2},${y2}`);p.setAttribute('class','edge');p.id='e-rb-ra';gE.appendChild(p);}
 const labels=[];Object.keys(M.nodes).forEach(id=>{const n=M.nodes[id],[x,y]=pos(id);const g=document.createElementNS(NS,'g');g.setAttribute('class','node');g.id='n-'+id;g.setAttribute('transform',`translate(${x},${y})`);
  g.innerHTML=`<circle class="halo" r="24"/><circle class="disc" r="18"/><text class="emo" y="7">${n.e}</text>`;svg.appendChild(g);
  const lb=document.createElementNS(NS,'g');lb.setAttribute('class','node lbl');lb.setAttribute('transform',`translate(${x},${y})`);lb.innerHTML=`<text y="34">${E(T(n.n))}</text><text class="sub" y="46">${E(T(n.s))}</text>`;labels.push(lb);});
 const pl=document.createElementNS(NS,'g');pl.id='pk';svg.appendChild(pl);
 labels.forEach(l=>svg.appendChild(l));/* names on top: never hidden by a halo, an edge or a flying packet */}
function edgeEl(a,b){return $('e-'+a+'-'+b)||$('e-'+b+'-'+a);}
function hop(el,a,b,ms){return new Promise(res=>{const path=edgeEl(a,b);if(!path){res();return;}const len=path.getTotalLength(),rev=!$('e-'+a+'-'+b);path.classList.add('live');
 N.tween(ms*(slowMo?2.6:1),k=>{const e=N.ease(k),pt=path.getPointAtLength(rev?len*(1-e):len*e);el.setAttribute('transform',`translate(${pt.x},${pt.y})`);},()=>{path.classList.remove('live');res();});});}
function hot(id,on){const g=$('n-'+id);g&&g.classList.toggle('hot',on);}
function log(html,cls){const d=document.createElement('div');d.className=cls||'';d.innerHTML=html;$('log').appendChild(d);$('log').scrollTop=1e6;}
function mkPk(label,color){const g=document.createElementNS(NS,'g');g.setAttribute('class','pk');g.setAttribute('data-ov-sprite','');g.innerHTML=`<rect x="-15" y="-10" width="30" height="20" fill="${color}"/><text y="4">${E(label)}</text>`;$('pk').appendChild(g);return g;}
const COLS=['#FFD23F','#02CFF9','#22C55E','#FF7A1A','#FF6B57','#C4B5FD','#5EEAD4','#FDA4AF'];
function bytesOf(s){return Array.from(new TextEncoder().encode(s));}
function scramble(bytes,seq){return bytes.map((b,i)=>((b^(0x5A+seq*31+i*7))&0xff).toString(16).padStart(2,'0')).join('');}
async function walk(el,path,stat){for(let i=1;i<path.length;i++){hot(path[i-1],true);await hop(el,path[i-1],path[i],420);hot(path[i-1],false);}}
async function send(){if(busy)return;busy=true;$('send').disabled=true;$('log').innerHTML='';$('strip').innerHTML='';draw();
 const text=$('msg').value.trim()||cfg.message, lose=$('lose').checked, enc=$('enc').checked, size=Math.max(3,Math.min(12,cfg.packetBytes|0||6));
 const bytes=bytesOf(text);const chunks=[];
 // split on byte boundaries but never inside one UTF-8 character
 let cur=[];Array.from(text).forEach(ch=>{const b=bytesOf(ch);if(cur.length&&cur.length+b.length>size){chunks.push(cur);cur=[];}cur=cur.concat(b);});if(cur.length)chunks.push(cur);
 const dec=new TextDecoder();const stat={h:0,t:0};$('sP').textContent=chunks.length;$('sB').textContent=bytes.length;$('sH').textContent=0;$('sT').textContent=0;
 log('✂️ '+T(L(`Your message is ${bytes.length} bytes. The phone cuts it into ${chunks.length} packets of up to ${size} bytes and numbers each one (sequence number).`,`आपका संदेश ${bytes.length} बाइट का है। फ़ोन इसे ${size} बाइट तक के ${chunks.length} पैकेट में काटकर हर एक पर क्रम संख्या लिखता है।`,`Aapka message ${bytes.length} bytes ka hai. Phone isse ${size} bytes tak ke ${chunks.length} packets mein kaat ke har ek pe number (sequence number) likhta hai.`)));
 const cards=chunks.map((c,i)=>{const d=document.createElement('div');d.className='pcard';d.style.animationDelay=(i*70)+'ms';
  d.innerHTML=`<div class="h" style="background:${COLS[i%8]};color:#1C1B1A">#${i+1} / ${chunks.length}</div><div class="b"><span>From: ${M.src}</span><span class="to">To: ?</span><span class="d">${E(enc?scramble(c,i):dec.decode(new Uint8Array(c)))}</span></div>`;$('strip').appendChild(d);return d;});
 if(enc) log('🔒 '+T(L('Encryption ON: the data is scrambled with a key only the two phones have. Routers and even the server see only gibberish.','एन्क्रिप्शन चालू: डेटा ऐसी चाबी से उलझाया गया जो सिर्फ़ दोनों फ़ोनों के पास है। राउटर और सर्वर को केवल बेमतलब अक्षर दिखते हैं।','Encryption ON: data ek aisi key se scramble hua jo sirf dono phones ke paas hai. Routers aur server ko sirf gibberish dikhta hai.')));
 await N.sleep(500);
 // DNS
 log('📖 '+T(L(`DNS lookup: “Where is ${M.host}?” Computers need a number (IP address), not a name.`,`DNS खोज: “${M.host} कहाँ है?” कंप्यूटर को नाम नहीं, नंबर (IP पता) चाहिए।`,`DNS lookup: “${M.host} kahan hai?” Computer ko naam nahi, number (IP address) chahiye.`)),'dns');
 const sum=p=>p.slice(1).reduce((a,n)=>a+(M.lat[n]||4),0);stat.h=M.pathB.length-1;stat.t=2*sum(['phone','wifi','isp','dns'])+Math.max(sum(M.pathA),sum(M.pathB))+(lose&&chunks.length>1?200:0);
 const q=mkPk('?','#C4B5FD');await walk(q,['phone','wifi','isp','dns'],stat);hot('dns',true);await N.sleep(300);q.querySelector('text').textContent='IP';await walk(q,['dns','isp','wifi','phone'],stat);hot('dns',false);q.remove();
 log('✅ '+T(L(`DNS answer: ${M.host} = ${M.hostIP}. Now every packet gets this address in its header.`,`DNS उत्तर: ${M.host} = ${M.hostIP}। अब हर पैकेट के हेडर में यह पता लिखा जाएगा।`,`DNS ka jawab: ${M.host} = ${M.hostIP}. Ab har packet ke header mein yeh address likha jaayega.`)),'ok');
 cards.forEach(c=>c.querySelector('.to').textContent='To: '+M.hostIP);
 // send packets: odd ones take the busy road, so they arrive out of order
 const arrived=[];const lostIdx=lose&&chunks.length>1?1:-1;
 const toServer=chunks.map((c,i)=>new Promise(async res=>{await N.sleep(i*260);const el=mkPk('#'+(i+1),COLS[i%8]);const path=(i%2?M.pathB:M.pathA);const upto=path.indexOf('server');
   if(i===lostIdx){await walk(el,path.slice(0,3),stat);const [x,y]=[...el.getAttribute('transform').matchAll(/-?[\d.]+/g)].map(m=>+m[0]);
     N.tween(500,k=>{el.setAttribute('transform',`translate(${x},${y-k*30}) scale(${1+k})`);el.style.opacity=1-k;},()=>el.remove());
     cards[i].classList.add('lost');log('💥 '+T(L(`Packet #${i+1} was dropped by a busy router! Nobody “sees” it go missing… yet.`,`व्यस्त राउटर ने पैकेट #${i+1} गिरा दिया! अभी किसी को पता नहीं चला…`,`Packet #${i+1} ek busy router ne drop kar diya! Abhi kisi ko pata nahi chala…`)),'bad');res();return;}
   await walk(el,path.slice(0,upto+1),stat);arrived.push(i);el.remove();res();}));
 await Promise.all(toServer);
 log('📥 '+T(L(`Server received packets in this order: ${arrived.map(i=>'#'+(i+1)).join(', ')} — not in order, because they took different roads.`,`सर्वर को पैकेट इस क्रम में मिले: ${arrived.map(i=>'#'+(i+1)).join(', ')} — क्रम में नहीं, क्योंकि रास्ते अलग थे।`,`Server ko packets is order mein mile: ${arrived.map(i=>'#'+(i+1)).join(', ')} — order mein nahi, kyunki raaste alag the.`)));
 if(lostIdx>=0){await N.sleep(400);log('🔁 '+T(L(`Sequence numbers show #${lostIdx+1} is missing, so no acknowledgement (ACK) goes back for it. The sender's timer runs out and it sends #${lostIdx+1} again.`,`क्रम संख्याओं से पता चला कि #${lostIdx+1} ग़ायब है, इसलिए उसकी पावती (ACK) नहीं गई। भेजने वाले का टाइमर ख़त्म हुआ और उसने #${lostIdx+1} फिर भेजा।`,`Sequence numbers se pata chala #${lostIdx+1} missing hai, isliye uska ACK (receipt) wapas nahi gaya. Sender ka timer khatam hua aur usne #${lostIdx+1} dobara bheja.`)),'bad');
   const el=mkPk('#'+(lostIdx+1),COLS[lostIdx%8]);await walk(el,M.pathA.slice(0,M.pathA.indexOf('server')+1),stat);el.remove();arrived.push(lostIdx);cards[lostIdx].classList.remove('lost');}
 // server -> receiver
 const tail=M.pathA.slice(M.pathA.indexOf('server'));const order=arrived.slice();
 await Promise.all(order.map((i,k)=>new Promise(async res=>{await N.sleep(k*160);const el=mkPk('#'+(i+1),COLS[i%8]);await walk(el,tail,stat);el.remove();res();})));
 const sorted=order.slice().sort((a,b)=>a-b);const full=dec.decode(new Uint8Array(sorted.flatMap(i=>chunks[i])));
 sorted.forEach(i=>cards[i].classList.add('ok'));
 log('🧩 '+T(L(`The receiver sorts by sequence number ${sorted.map(i=>'#'+(i+1)).join(' → ')} and joins the pieces${enc?', then unlocks them with its key':''}.`,`प्राप्तकर्ता क्रम संख्या ${sorted.map(i=>'#'+(i+1)).join(' → ')} से जोड़ता है${enc?' और फिर अपनी चाबी से खोलता है':''}।`,`Receiver sequence number ${sorted.map(i=>'#'+(i+1)).join(' → ')} se sort karke jodta hai${enc?', phir apni key se unlock karta hai':''}.`)),'ok');
 const [fx,fy]=pos('friend');const b=document.createElementNS(NS,'g');const w=Math.min(260,svg.getBoundingClientRect().width-20);const bx=Math.max(8,Math.min(fx-w/2,svg.getBoundingClientRect().width-w-8));const H0=svg.getBoundingClientRect().height,occ=[...svg.querySelectorAll('.node circle.halo,.lbl text')].map(e=>{const r=e.getBBox(),m=e.getCTM(),s0=svg.getCTM().inverse().multiply(m);const p1=new DOMPoint(r.x,r.y).matrixTransform(s0),p2=new DOMPoint(r.x+r.width,r.y+r.height).matrixTransform(s0);return [p1.x,p1.y,p2.x,p2.y];});
 const freeY=y=>!occ.some(o=>o[0]<bx+w+4&&o[2]>bx-4&&o[1]<y+44&&o[3]>y-4);let by=null;const pref=fy>120?fy-96:fy+52;
 for(let d=0;d<H0;d+=6){for(const y of [pref-d,pref+d])if(by==null&&y>=4&&y<=H0-44&&freeY(y))by=y;if(by!=null)break;}/* the delivered bubble goes where it covers no node or name */
 if(by!=null)b.innerHTML=`<rect class="bubble" x="${bx}" y="${by}" width="${w}" height="40" rx="12" fill="${mode==='upi'?'#E4F3EA':'#DCF8C6'}" stroke="#0F766E"/><text x="${bx+12}" y="${by+25}" fill="#1C1B1A" font-size="13" font-weight="700">${E(mode==='upi'?'₹ '+full:full)} <tspan fill="#0369A1">✓✓</tspan></text>`;
 b.style.animation='pop .4s both';if(by!=null)$('pk').appendChild(b);else log('📩 '+E(mode==='upi'?'₹ '+full:full)+' ✓✓');
 $('sH').textContent=stat.h;$('sT').textContent=stat.t;
 log('🎉 '+T(L(`Delivered: “${E(full)}” in about ${stat.t} ms (${stat.h} hops). ${lose&&chunks.length>1?'(+200 ms waiting to resend the lost packet)':'Faster than a blink (≈100–150 ms)!'}`,`पहुँच गया: “${E(full)}” लगभग ${stat.t} ms में (${stat.h} हॉप)। ${lose&&chunks.length>1?'(+200 ms खोया पैकेट दोबारा भेजने में)':'पलक झपकने (≈100–150 ms) जितना तेज़!'}`,`Deliver ho gaya: “${E(full)}” lagbhag ${stat.t} ms mein (${stat.h} hops). ${lose&&chunks.length>1?'(+200 ms lost packet dobara bhejne mein)':'Palak jhapakne (≈100–150 ms) jitna fast!'}`)),'ok');

 if(lostIdx>=0&&!sentOnceWithLoss){sentOnceWithLoss=true;N.emit('mission:complete',{lab:'packet-tracer'});N.confetti();N.toast(L('Mission complete! +XP','मिशन पूरा! +XP','Mission complete! +XP'),'ok');}

document.querySelectorAll('.tabs button').forEach(b=>{b.onclick=()=>{if(busy)return;mode=b.dataset.m;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));$('msg').value=mode==='upi'?'250 to Sharma Kirana':cfg.message;$('log').innerHTML='';$('strip').innerHTML='';draw();};b.setAttribute('aria-selected',b.dataset.m===mode);});

$('send').onclick=send;$('slow').onclick=()=>{slowMo=!slowMo;$('slow').style.background=slowMo?'var(--mint)':'';};
