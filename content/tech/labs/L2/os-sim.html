<script>

const TABS=[['tasks',L('🧠 RAM & tasks','🧠 RAM और कार्य','🧠 RAM & tasks')],['files',L('📁 Files','📁 फ़ाइलें','📁 Files')],['perms',L('🔐 Permissions','🔐 अनुमतियाँ','🔐 Permissions')]];
const GOALS={tasks:L('Open apps until the RAM is full and watch the OS free memory by stopping the least recently used app.','RAM भरने तक ऐप खोलो और देखो OS सबसे पुराने उपयोग वाले ऐप को रोककर मेमोरी कैसे ख़ाली करता है।','RAM bharne tak apps kholo aur dekho OS sabse purane use wale app ko rok ke memory kaise khaali karta hai.'),
 files:L('Tap a file, then tap the folder where it belongs. Read its full path.','फ़ाइल दबाओ, फिर उसका सही फ़ोल्डर दबाओ। उसका पूरा पथ पढ़ो।','File tap karo, phir uska sahi folder tap karo. Uska poora path padho.'),
 perms:L('Six apps ask for permissions. Allow only what each app needs for its job.','छह ऐप अनुमति माँगते हैं। केवल वही दो जो ऐप के काम के लिए ज़रूरी है।','Chhe apps permission maang rahe hain. Sirf wahi do jo app ke kaam ke liye zaroori hai.')};
let tab=TABS.some(x=>x[0]===cfg.tab)?cfg.tab:'tasks'; const done={};
function win(k,msg){if(done[k])return;done[k]=1;N.confetti();N.toast(msg,'ok');N.emit('mission:complete',{lab:'os-sim',tab:k});mission();}
/* ---------- TASKS: RAM + scheduler + low-memory killer (LRU) ---------- */
const RAM=+cfg.ram||4, OSGB=1.2;
const APPS=[{id:'wa',n:'WhatsApp',ic:'💬',c:'#25D366',gb:.4},{id:'yt',n:'YouTube',ic:'▶️',c:'#FF4E45',gb:.7},{id:'game',n:'Racing game',ic:'🏎️',c:'#F5B90A',gb:1.5},{id:'cam',n:'Camera',ic:'📷',c:'#8B9CF7',gb:.5},
 {id:'maps',n:'Maps',ic:'🗺️',c:'#34D399',gb:.6},{id:'web',n:'Browser',ic:'🌐',c:'#02CFF9',gb:.8},{id:'calc',n:'Calculator',ic:'🧮',c:'#CBD5E1',gb:.1},{id:'upi',n:'UPI app',ic:'💸',c:'#C4B5FD',gb:.3}];
let run=[],clock=0,log=[],kills=0,loading=false,lane=[],laneTimer=null;
const used=()=>OSGB+run.reduce((s,r)=>s+r.gb,0);
function addLog(m){log.unshift(m);log=log.slice(0,12);}
async function openApp(id){if(loading)return;const a=APPS.find(x=>x.id===id);clock++;let r=run.find(x=>x.id===id);
 if(r){r.t=clock;addLog(L(`${a.n}: already in RAM → opens instantly (warm start).`,`${a.n}: पहले से RAM में → तुरंत खुला (वॉर्म स्टार्ट)।`,`${a.n}: pehle se RAM mein → turant khula (warm start).`));drawTasks();return;}
 loading=true;drawTasks(L(`Loading ${a.n} from storage into RAM…`,`${a.n} को स्टोरेज से RAM में ला रहे हैं…`,`${a.n} ko storage se RAM mein la rahe hain…`));await N.sleep(650);loading=false;
 run.push({id,gb:a.gb,t:clock});addLog(L(`${a.n} started (cold start): +${a.gb} GB RAM.`,`${a.n} शुरू (कोल्ड स्टार्ट): +${a.gb} GB RAM।`,`${a.n} start hua (cold start): +${a.gb} GB RAM.`));
 while(used()>RAM+1e-9){const fg=run.reduce((m,x)=>x.t>m.t?x:m);const victim=run.filter(x=>x!==fg).sort((p,q)=>p.t-q.t)[0];if(!victim)break;
  run=run.filter(x=>x!==victim);kills++;const v=APPS.find(x=>x.id===victim.id);
  addLog(L(`⚠️ RAM full! The OS stopped ${v.n} — the least recently used app — and freed ${v.gb} GB.`,`⚠️ RAM भरी! OS ने ${v.n} रोका — सबसे पहले उपयोग हुआ ऐप — और ${v.gb} GB ख़ाली किया।`,`⚠️ RAM full! OS ne ${v.n} roka — least recently used app — aur ${v.gb} GB khaali kiya.`));
  N.toast(L(`Low memory: ${v.n} was closed`,`कम मेमोरी: ${v.n} बंद`,`Low memory: ${v.n} band hua`),'bad');const w=document.querySelector('.bar .warn');}
 drawTasks();if(kills&&!done.tasks)win('tasks',L('The OS managed memory for you!','OS ने आपके लिए मेमोरी सँभाली!','OS ne aapke liye memory sambhaali!'));}
function closeApp(id){run=run.filter(x=>x.id!==id);const a=APPS.find(x=>x.id===id);addLog(L(`You swiped away ${a.n}: −${a.gb} GB.`,`आपने ${a.n} हटाया: −${a.gb} GB।`,`Aapne ${a.n} swipe karke hataya: −${a.gb} GB.`));drawTasks();}
function tick(){if(tab!=='tasks')return;const fg=run.length?run.reduce((m,x)=>x.t>m.t?x:m):null;let pick;
 if(!run.length)pick='#334155';else{const r=Math.random();const bg=run.filter(x=>x!==fg);const pid=(r<.6||!bg.length)?fg.id:bg[(Math.random()*bg.length)|0].id;pick=APPS.find(a=>a.id===pid).c;}
 lane.push(pick);lane=lane.slice(-18);const el=$('lane');if(el)el.innerHTML=lane.map(c=>`<b style="background:${c}"></b>`).join('');}
function drawTasks(busy){const u=used();const pct=x=>(x/RAM*100).toFixed(1)+'%';const fg=run.length?run.reduce((m,x)=>x.t>m.t?x:m):null;
 $('scr').innerHTML=`<div class="ram"><div class="lbl"><span>RAM ${u.toFixed(1)} / ${RAM} GB</span><span style="color:${u/RAM>.85?'#FF6B57':'#7DF9C9'}">${Math.round(u/RAM*100)}%</span></div>
 <div class="bar"><span class="os" style="flex-basis:${pct(OSGB)}">OS</span>${run.map(r=>{const a=APPS.find(x=>x.id===r.id);return `<span style="flex-basis:${pct(r.gb)};background:${a.c}" title="${E(a.n)}">${a.ic}</span>`}).join('')}${u/RAM>.85?'<i class="warn"></i>':''}</div></div>
 <div class="apps">${APPS.map(a=>`<button class="app ${run.some(r=>r.id===a.id)?'run':''}" data-a="${a.id}"><i style="background:${a.c}">${a.ic}</i>${E(a.n)}<small>${a.gb} GB</small></button>`).join('')}</div>
 <div class="cpu"><b>${T(L('CPU scheduler — who gets the next time slice','CPU शेड्यूलर — अगली बारी किसकी','CPU scheduler — agli time slice kiski'))}</b><div class="lane" id="lane"></div>
 <div style="margin-top:8px;font-weight:700">${T(L('Recent apps (tap = bring to front, × = close)','हाल के ऐप (दबाओ = आगे लाओ, × = बंद)','Recent apps (tap = aage lao, × = band)'))}</div>
 <div class="recent">${run.slice().sort((p,q)=>q.t-p.t).map(r=>{const a=APPS.find(x=>x.id===r.id);return `<button data-a="${a.id}" class="${r===fg?'fg':''}">${a.ic} ${E(a.n)}</button><button data-x="${a.id}" aria-label="close ${E(a.n)}">×</button>`}).join('')||'<span class="muted" style="color:#9FB0D8">—</span>'}</div></div>
 ${busy?`<div class="loading"><div><div class="spin"></div>${T(busy)}</div></div>`:''}`;
 $('scr').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>openApp(b.dataset.a));$('scr').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>closeApp(b.dataset.x));tick();
 $('side').innerHTML=`<h3 style="margin:0 0 6px;font-size:15px">${T(L('📜 What the OS is doing','📜 OS क्या कर रहा है','📜 OS kya kar raha hai'))}</h3><div class="log">${log.map(m=>`<div>${T(m)}</div>`).join('')||`<div class="muted">${T(L('Tap an app icon to open it.','ऐप आइकन दबाकर खोलो।','App icon tap karke kholo.'))}</div>`}</div>
 <p class="muted" style="font-size:13px;margin:8px 0 0">${T(L(`This phone has ${RAM} GB RAM; Android itself keeps about ${OSGB} GB. The colour strip shows the CPU switching between apps many times a second — the app you are using gets most turns.`,`इस फ़ोन में ${RAM} GB RAM है; Android ख़ुद लगभग ${OSGB} GB रखता है। रंगीन पट्टी दिखाती है CPU हर सेकंड कई बार ऐप बदलता है — जो ऐप आप चला रहे हो उसे सबसे ज़्यादा बारी मिलती है।`,`Is phone mein ${RAM} GB RAM hai; Android khud lagbhag ${OSGB} GB rakhta hai. Colour strip dikhati hai CPU har second kai baar apps badalta hai — jo app aap use kar rahe ho usse sabse zyada turns milte hain.`))}</p>`;}
/* ---------- FILES ---------- */
const ROOT='/storage/emulated/0';
const FOLD=[{id:'Pictures',ic:'🖼️'},{id:'Music',ic:'🎵'},{id:'Documents',ic:'📄'},{id:'Movies',ic:'🎬'}];
const FILES=[['holi-2026.jpg','Pictures'],['class-photo.png','Pictures'],['bhajan.mp3','Music'],['jana-gana-mana.m4a','Music'],['maths-notes.pdf','Documents'],['science-project.docx','Documents'],['timetable.pdf','Documents'],['school-trip.mp4','Movies']];
const EXT={jpg:L('JPEG photo','JPEG फ़ोटो','JPEG photo'),png:L('PNG image','PNG चित्र','PNG image'),mp3:L('MP3 audio','MP3 ऑडियो','MP3 audio'),m4a:L('M4A (AAC) audio','M4A (AAC) ऑडियो','M4A (AAC) audio'),pdf:L('PDF document','PDF दस्तावेज़','PDF document'),docx:L('Word document','Word दस्तावेज़','Word document'),mp4:L('MP4 video','MP4 वीडियो','MP4 video')};
let place={},sel=null,lastPath=null;
function drawFiles(){const loose=FILES.filter(f=>!place[f[0]]);
 $('scr').innerHTML=`<div class="tree"><div class="fold" style="border-style:solid"><h4>📥 Download <small>${loose.length}</small></h4><div class="fs">${loose.map(f=>`<button class="file ${sel===f[0]?'sel':''}" data-f="${E(f[0])}">${E(f[0])}</button>`).join('')||'✨'}</div></div>
 ${FOLD.map(d=>`<button class="fold ${sel?'target':''}" data-d="${d.id}"><h4>${d.ic} ${d.id} <small>${FILES.filter(f=>place[f[0]]===d.id).length}</small></h4><span class="fs">${FILES.filter(f=>place[f[0]]===d.id).map(f=>`<span class="file ok">${E(f[0])}</span>`).join('')}</span></button>`).join('')}</div>
 ${lastPath?`<div class="path">${E(lastPath)}</div>`:''}`;
 $('scr').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{sel=sel===b.dataset.f?null:b.dataset.f;drawFiles();});
 $('scr').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>drop(b.dataset.d,b));
 const ext=sel?sel.split('.').pop():null;
 $('side').innerHTML=`<h3 style="margin:0 0 6px;font-size:15px">${T(L('🔎 File inspector','🔎 फ़ाइल जाँच','🔎 File inspector'))}</h3>${sel?`<p style="margin:0"><b>${E(sel)}</b><br>${T(L('Extension','एक्सटेंशन','Extension'))}: <span class="chip">.${E(ext)}</span> = ${T(EXT[ext])}</p>`:`<p class="muted" style="margin:0">${T(L('Tap a file in Download to inspect it.','Download में कोई फ़ाइल दबाकर देखो।','Download mein koi file tap karke dekho.'))}</p>`}
 <p class="muted" style="font-size:13px">${T(L('A path is the address of a file: every folder from the top (root) down to the file, joined by “/”. On Android your own storage starts at /storage/emulated/0.','पथ फ़ाइल का पता है: ऊपर (रूट) से फ़ाइल तक हर फ़ोल्डर, “/” से जुड़े। Android पर आपका स्टोरेज /storage/emulated/0 से शुरू होता है।','Path file ka address hai: upar (root) se file tak har folder, “/” se jude. Android pe aapka storage /storage/emulated/0 se shuru hota hai.'))}</p>`;}
function drop(d,el){if(!sel){N.toast(L('First tap a file in Download','पहले Download में फ़ाइल दबाओ','Pehle Download mein file tap karo'));return;}
 const f=FILES.find(x=>x[0]===sel);if(f[1]!==d){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),650);const ext=sel.split('.').pop();
  N.toast(L(`.${ext} is a ${EXT[ext].en} — does it belong in ${d}?`,`.${ext} एक ${EXT[ext].hi} है — क्या यह ${d} में जाएगी?`,`.${ext} ek ${EXT[ext].hinglish} hai — kya yeh ${d} mein jaayegi?`),'bad');return;}
 place[sel]=d;lastPath=`${ROOT}/${d}/${sel}`;sel=null;drawFiles();
 if(FILES.every(x=>place[x[0]]))win('files',L('Every file is in its folder!','हर फ़ाइल अपने फ़ोल्डर में!','Har file apne folder mein!'));}
/* ---------- PERMISSIONS ---------- */
const PR=[{app:'Super Torch',ic:'🔦',p:L('access your contacts','आपके संपर्क देखने','aapke contacts dekhne'),ok:false,why:L('A torch only needs the flashlight. Contacts access could let it copy and sell your family’s numbers.','टॉर्च को केवल फ़्लैश चाहिए। संपर्क देखकर वह आपके परिवार के नंबर कॉपी करके बेच सकता है।','Torch ko sirf flashlight chahiye. Contacts se woh family ke numbers copy karke bech sakta hai.')},
 {app:'Camera',ic:'📷',p:L('take pictures and record video','फ़ोटो लेने और वीडियो रिकॉर्ड करने','photo lene aur video record karne'),ok:true,why:L('Taking photos is the camera app’s whole job.','फ़ोटो लेना कैमरा ऐप का पूरा काम है।','Photo lena camera app ka poora kaam hai.')},
 {app:'Maps',ic:'🗺️',p:L('use your location only while using the app','केवल ऐप चलाते समय आपकी लोकेशन','sirf app use karte waqt aapki location'),ok:true,why:L('Directions need location — and “only while using the app” is the safer choice.','रास्ता बताने के लिए लोकेशन चाहिए — और “केवल ऐप चलाते समय” ज़्यादा सुरक्षित है।','Raasta batane ke liye location chahiye — aur “sirf app use karte waqt” zyada safe hai.')},
 {app:'Calculator Pro',ic:'🧮',p:L('record audio','ऑडियो रिकॉर्ड करने','audio record karne'),ok:false,why:L('A calculator has no reason to listen to you. Deny it.','कैलकुलेटर के पास आपकी बात सुनने का कोई कारण नहीं। मना करो।','Calculator ke paas aapki baat sunne ka koi reason nahi. Deny karo.')},
 {app:'WhatsApp',ic:'💬',p:L('record audio (for voice notes and calls)','ऑडियो रिकॉर्ड करने (वॉइस नोट और कॉल के लिए)','audio record karne (voice notes aur calls ke liye)'),ok:true,why:L('Voice notes and calls need the microphone, so this one makes sense.','वॉइस नोट और कॉल के लिए माइक्रोफ़ोन चाहिए, इसलिए यह सही है।','Voice notes aur calls ke liye mic chahiye, isliye yeh sahi hai.')},
 {app:'Free HD Wallpapers',ic:'🖼️',p:L('send and view SMS messages','SMS भेजने और पढ़ने','SMS bhejne aur padhne'),ok:false,why:L('Wallpapers do not need SMS. Apps that read SMS can steal OTPs — a common trick in banking frauds.','वॉलपेपर को SMS नहीं चाहिए। SMS पढ़ने वाले ऐप OTP चुरा सकते हैं — बैंक धोखाधड़ी की आम चाल।','Wallpapers ko SMS nahi chahiye. SMS padhne wale apps OTP chura sakte hain — banking fraud ki common trick.')}];
let pi=0,ans={};
function drawPerms(){const r=PR[pi];const a=ans[pi];
 $('scr').innerHTML=`<div style="text-align:center;font-size:12px;color:#9FB0D8;font-weight:700">${T(L('Request','अनुरोध','Request'))} ${pi+1}/6</div>
 <div class="perm"><div class="pi">${r.ic}</div><h4>${T(L(`Allow ${r.app} to ${r.p.en}?`,`${r.app} को ${r.p.hi} की अनुमति दें?`,`${r.app} ko ${r.p.hinglish} ki permission dein?`))}</h4>
 <p>${T(L('Android asks you before any app uses sensitive data or hardware.','कोई भी ऐप संवेदनशील डेटा या हार्डवेयर उपयोग करे उससे पहले Android आपसे पूछता है।','Koi bhi app sensitive data ya hardware use kare usse pehle Android aapse poochta hai.'))}</p>
 <div class="pa"><button data-v="1">${T(L('Allow','अनुमति दें','Allow'))}</button><button data-v="0">${T(L('Don’t allow','अनुमति न दें','Don’t allow'))}</button></div></div>
 <div class="dots">${PR.map((_,i)=>`<i class="${ans[i]==null?'':(ans[i]===PR[i].ok?'g':'r')} ${i===pi?'c':''}"></i>`).join('')}</div>`;
 $('scr').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>decide(b.dataset.v==='1'));
 $('side').innerHTML=`<h3 style="margin:0 0 6px;font-size:15px">${T(L('🛡️ Why?','🛡️ क्यों?','🛡️ Kyun?'))}</h3>${a==null?`<p class="muted" style="margin:0">${T(L('Ask: does this app need this for its main job?','पूछो: क्या इस ऐप को अपने मुख्य काम के लिए यह चाहिए?','Poocho: kya is app ko apne main kaam ke liye yeh chahiye?'))}</p>`:`<div class="why ${a===r.ok?'':'r'}">${a===r.ok?'✅':'❌'} ${T(r.why)}</div>`}
 <div class="row" style="margin-top:10px"><button class="btn ghost" id="pp" ${pi?'':'disabled'}>←</button><button class="btn teal" id="pn" ${pi<5?'':'disabled'}>→</button></div>`;
 $('pp').onclick=()=>{pi--;drawPerms();};$('pn').onclick=()=>{pi++;drawPerms();};}
function decide(v){ans[pi]=v;const ok=v===PR[pi].ok;N.toast(ok?L('Sensible choice!','समझदारी भरा चुनाव!','Samajhdaar choice!'):L('Think again — read why','फिर सोचो — कारण पढ़ो','Phir socho — reason padho'),ok?'ok':'bad');drawPerms();
 if(ok&&pi<5)setTimeout(()=>{if(ans[pi]===PR[pi].ok&&pi<5){pi++;drawPerms();}},900);
 if(PR.every((r,i)=>ans[i]===r.ok))win('perms',L('Your data is safe — only needed permissions given.','आपका डेटा सुरक्षित — केवल ज़रूरी अनुमतियाँ।','Aapka data safe — sirf zaroori permissions di.'));mission();}
/* ---------- shell ---------- */
function mission(){const st={tasks:L('Make the OS free memory (fill the RAM).','OS से मेमोरी ख़ाली कराओ (RAM भरो)।','OS se memory khaali karwao (RAM bharo).'),files:L(`Sort all 8 files (${Object.keys(place).length}/8).`,`सभी 8 फ़ाइलें छाँटो (${Object.keys(place).length}/8)।`,`Saari 8 files sort karo (${Object.keys(place).length}/8).`),perms:L(`Make all 6 permission choices right (${PR.filter((r,i)=>ans[i]===r.ok).length}/6).`,`सभी 6 अनुमति निर्णय सही करो (${PR.filter((r,i)=>ans[i]===r.ok).length}/6)।`,`Saare 6 permission decisions sahi karo (${PR.filter((r,i)=>ans[i]===r.ok).length}/6).`)};
 $('mission').innerHTML=TABS.map(([k,n])=>`<div style="margin:3px 0">${done[k]?'✅':'⬜'} <b>${T(n)}</b> — ${T(st[k])}</div>`).join('');}
function draw(){$('goal').innerHTML=T(goal&&cfg.tab===tab?goal:GOALS[tab]);$('tabs').innerHTML=TABS.map(([k,n])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${T(n)}</button>`).join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();});({tasks:drawTasks,files:drawFiles,perms:drawPerms})[tab]();mission();}
N.onLang(draw);draw();laneTimer=setInterval(tick,N.reduced()?1500:350);
window.__lab={tab:k=>{tab=k;draw();},open:openApp,place:(f,d)=>{sel=f;drop(d,document.body);},decide:(i,v)=>{pi=i;decide(v);},answerAll:()=>PR.forEach((r,i)=>{pi=i;ans[i]=r.ok;}),done};
})();
</script></body></html>
