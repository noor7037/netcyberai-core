<title>Cyber Defence Lab — NCA Tech & AI Lab</title><style>/* NCA Tech & AI Lab — Level 2 shared lab skin (own work, MIT). Family App lesson tokens: paper, card, ink, saffron, teal, plum. */

<script>/* NCA Tech & AI Lab — Level 2 shared lab runtime (own work, MIT). No eval, no network except an optional same-origin ?lesson= JSON. */

    document.body.prepend(h); h.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));}

  let toastEl,lastTap=null,tapAt=null;document.addEventListener('pointerdown',e=>{lastTap=e.target;tapAt=[e.clientX,e.clientY+scrollY]},true);let rePend=0;const rePlace=()=>{if(!toastEl||!toastEl.classList.contains('on')||rePend)return;rePend=1;requestAnimationFrame(()=>{rePend=0;placeToast();});};

    while((n=w.nextNode())){if(!n.nodeValue.trim())continue;const p=n.parentElement;if(!p||skip.contains(p)||/^(SCRIPT|STYLE)$/.test(p.tagName))continue;rg.selectNodeContents(n);
      for(const q of rg.getClientRects())if(q.width>=1&&q.bottom>0&&q.top<vh)out.push(q);}

  function freeSpot(el){const vw=document.documentElement.clientWidth,vh=innerHeight,w=el.offsetWidth,h=el.offsetHeight,m=8;let top=m;
    const bar=document.querySelector('.top');if(bar)top=Math.max(top,bar.getBoundingClientRect().bottom+m);
    const obs=textRects(el),xs=[(vw-w)/2,m,vw-w-m],free=(x,y)=>!obs.some(q=>q.left<x+w+4&&q.right>x-4&&q.top<y+h+4&&q.bottom>y-4);

      if(me.display!=='inline'&&!(a instanceof SVGElement)&&(d.display==='block'||d.display==='flow-root'||d.display==='grid'||(d.display==='flex'&&d.flexDirection.startsWith('column')))&&a.getBoundingClientRect().width>=Math.min(260,innerWidth*.6)&&!boxedIn(a))break;a=a.parentElement;}
    a.after(el);}

    const el=toastEl;clearTimeout(el._t);clearInterval(el._iv);if(el.classList.contains('inline'))document.body.appendChild(el);
    el.className='toast '+(kind||'');el._spot=null;el.innerHTML=typeof msg==='object'?t(msg):msg;el.style.left='0px';el.style.top='0px';
    el.classList.add('on');placeToast();el._iv=setInterval(placeToast,200);toastMO.observe(document.body,{subtree:true,childList:true,attributes:true,characterData:true});

    const P=Array.from({length:90},()=>({x:W/2,y:H*.55,vx:(Math.random()-.5)*9,vy:-Math.random()*11-4,r:Math.random()*6+3,c:cols[Math.random()*6|0],a:Math.random()*6}));

    document.dispatchEvent(new CustomEvent('nca-lab',{detail:msg}));}
  g.NCA={qs,esc,t,get lang(){return lang},setLang,onLang:f=>listeners.push(f),strings:o=>{STR=Object.assign(STR,o);applyI18n();},applyI18n,header,toast,confetti,tween,ease,sleep,reduced,lessonConfig,emit};

<script>
(async function(){
const N=NCA,T=N.t,E=N.esc,L=(en,hi,hinglish)=>({en,hi,hinglish}),$=id=>document.getElementById(id);
N.header('🛡️','title','sub');
N.strings({title:L('Cyber Defence Lab','साइबर रक्षा लैब','Cyber Defence Lab'),sub:L('Passwords, padlocks, sharing and kindness — defence only','पासवर्ड, ताला, शेयरिंग और दयालुता — केवल बचाव','Passwords, padlock, sharing aur kindness — sirf defence'),mT:L('🚀 Mission','🚀 मिशन','🚀 Mission')});
const {cfg,goal}=await N.lessonConfig({tab:'pass'});
const TABS=[['pass',L('🔑 Password + 2FA','🔑 पासवर्ड + 2FA','🔑 Password + 2FA')],['url',L('🔒 Padlock check','🔒 ताला जाँच','🔒 Padlock check')],['share',L('📤 Share or not?','📤 शेयर करें या नहीं?','📤 Share karein ya nahi?')],['kind',L('💬 Be kind, be safe','💬 दयालु रहो, सुरक्षित रहो','💬 Kind raho, safe raho')]];
const GOALS={pass:L('Make up a practice passphrase (never your real one) that would take centuries to crack, then turn on 2-step login and watch the attacker fail.','अभ्यास पासफ़्रेज़ बनाओ (असली कभी नहीं) जिसे तोड़ने में सदियाँ लगें, फिर 2-स्टेप लॉगिन चालू करो और हमलावर को हारते देखो।','Practice passphrase banao (asli kabhi nahi) jise todne mein sadiyaan lagein, phir 2-step login on karo aur attacker ko haarte dekho.'),
 url:L('A padlock only means the connection is encrypted — not that the site is honest. Find the real domain and mark each link Safe or Scam.','ताला केवल बताता है कि कनेक्शन एन्क्रिप्टेड है — यह नहीं कि साइट ईमानदार है। असली डोमेन ढूँढो और हर लिंक को सुरक्षित या धोखा चिह्नित करो।','Padlock sirf batata hai ki connection encrypted hai — yeh nahi ki site imaandaar hai. Asli domain dhoondo aur har link ko Safe ya Scam mark karo.'),
 share:L('Sort each post: OK to share, keep private, or check first.','हर पोस्ट छाँटो: शेयर ठीक, निजी रखो, या पहले जाँचो।','Har post sort karo: share OK, private rakho, ya pehle check karo.'),
 kind:L('Choose the best response in each situation.','हर स्थिति में सबसे अच्छा जवाब चुनो।','Har situation mein sabse achha response chuno.')};
let tab=TABS.some(x=>x[0]===cfg.tab)?cfg.tab:'pass';const done={};
function win(k,m){if(done[k])return;done[k]=1;N.confetti();N.toast(m,'ok');N.emit('mission:complete',{lab:'cyber-lab',tab:k});mission();}
/* ---------- PASSWORD ---------- */
const COMMON=['123456','123456789','12345678','password','qwerty','111111','123123','abc123','iloveyou','india123','admin','welcome','password1','000000','1234567890','qwerty123','sachin','krishna','cricket','india'];
const GPS=1e10; // guesses per second by a fast offline attacker rig
function pool(p){let n=0;if(/[a-z]/.test(p))n+=26;if(/[A-Z]/.test(p))n+=26;if(/[0-9]/.test(p))n+=10;if(/[^A-Za-z0-9]/.test(p))n+=33;return n;}
function crack(p){const low=p.toLowerCase();if(!p)return 0;if(COMMON.includes(low)||COMMON.some(c=>c.length>4&&low.replace(/[0-9!@#]+$/,'')===c))return 0.001;
 let lg=p.length*Math.log10(Math.max(pool(p),1));if(/^(.)\1+$/.test(p))lg=1;if(/^[a-z]+[0-9]{2,4}$/i.test(p))lg=Math.min(lg,7.5);/* name+year pattern: attackers try these first */

function human(s){const U=[[3.156e9,L('centuries','सदियाँ','sadiyaan')],[3.156e7,L('years','साल','saal')],[86400,L('days','दिन','din')],[3600,L('hours','घंटे','ghante')],[60,L('minutes','मिनट','minute')],[1,L('seconds','सेकंड','second')]];
 if(s<1)return T(L('instantly','तुरंत','turant'));if(s>3.156e11)return T(L('millions of years','लाखों साल','laakhon saal'));for(const [d,n] of U)if(s>=d){return (d===3.156e9?'':Math.floor(s/d).toLocaleString('en-IN')+' ')+T(n);}return '';}
let pw='',twofa=false,attackRan=false,attackBlocked=false;
function drawPass(){const s=crack(pw),strong=s>3.156e9&&pw.length>=12;const w=Math.min(100,pw?Math.max(6,Math.log10(s+1)*7+10):0);

 {e:'👀',t:L('You see a classmate being teased in a group chat.','आप देखते हो किसी सहपाठी को ग्रुप चैट में चिढ़ाया जा रहा है।','Aap dekhte ho kisi classmate ko group chat mein chidhaya ja raha hai.'),o:[L('Add a laughing emoji so you fit in','घुलने-मिलने के लिए हँसता इमोजी डालो','Fit in hone ke liye hasta emoji daalo'),L('Stay silent, it is not your problem','चुप रहो, यह आपकी समस्या नहीं','Chup raho, yeh aapki problem nahi'),L('Message them privately with support and report the posts','उन्हें निजी रूप से सहारा भेजो और पोस्ट रिपोर्ट करो','Unhe privately support bhejo aur posts report karo')],a:2,why:L('Be an upstander, not a bystander: support the person, do not join in, and report.','तमाशबीन नहीं, साथ खड़े होने वाले बनो: व्यक्ति का साथ दो, शामिल मत हो, और रिपोर्ट करो।','Bystander nahi, upstander bano: person ka saath do, join mat karo, aur report karo.')},
 {e:'🎮',t:L('A friendly “gamer” you met online asks for your photo and says “keep it our secret”.','ऑनलाइन मिला एक दोस्ताना “गेमर” आपकी फ़ोटो माँगता है और कहता है “यह हमारा राज़ रहे”।','Online mila ek friendly “gamer” aapki photo maangta hai aur kehta hai “yeh hamara secret rahe”.'),o:[L('Send it — they seem nice','भेज दो — वह अच्छा लगता है','Bhej do — woh achha lagta hai'),L('Say no, stop chatting, block, and tell a parent','मना करो, बात बंद करो, ब्लॉक करो, और माता-पिता को बताओ','Mana karo, chat band karo, block karo, aur parent ko batao'),L('Send a cartoon of yourself instead','उसकी जगह अपना कार्टून भेजो','Uski jagah apna cartoon bhejo')],a:1,why:L('“Keep it secret” from an online stranger is a big warning sign. Safe adults never ask children to hide things from parents.','ऑनलाइन अजनबी का “राज़ रखो” बड़ा चेतावनी संकेत है। सुरक्षित बड़े बच्चों से कभी माता-पिता से बातें छिपाने को नहीं कहते।','Online ajnabi ka “secret rakho” bada warning sign hai. Safe adults bachchon se kabhi parents se baatein chhupane ko nahi kehte.')}];
let kv={};
function drawKind(){const right=SC.filter((s,i)=>kv[i]===s.a).length;
 $('stage').innerHTML=SC.map((s,i)=>{const a=kv[i];return `<div class="item ${a===undefined?'':(a===s.a?'ok':'no')}"><div><span style="font-size:22px">${s.e}</span> <b>${T(s.t)}</b></div>${s.o.map((o,j)=>`<button class="btn ${a===j?'teal':'ghost'}" style="display:block;width:100%;text-align:left;margin-top:6px" data-i="${i}" data-j="${j}">${T(o)}</button>`).join('')}${a!==undefined?`<div class="why">${a===s.a?'✔':'✖'} ${T(s.why)}</div>`:''}</div>`;}).join('');
 $('stage').querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{kv[+b.dataset.i]=+b.dataset.j;const y=scrollY;drawKind();scrollTo(0,y);});
 $('side').innerHTML=`<div class="big">${right}/${SC.length} ✔</div><p style="font-size:13.5px"><b>STOP</b>: ${T(L('Stop replying · Take screenshots · Block and report · Tell a trusted adult. In India you can also report on cybercrime.gov.in or call 1930.','जवाब देना रोको · स्क्रीनशॉट लो · ब्लॉक और रिपोर्ट करो · भरोसेमंद बड़े को बताओ। भारत में cybercrime.gov.in पर रिपोर्ट या 1930 पर कॉल भी कर सकते हो।','Reply rokho · Screenshots lo · Block aur report karo · Trusted adult ko batao. India mein cybercrime.gov.in pe report ya 1930 pe call bhi kar sakte ho.'))}</p>`;
 if(right===SC.length)win('kind',L('Kind and safe online. Upstander badge!','ऑनलाइन दयालु और सुरक्षित। अपस्टैंडर बैज!','Online kind aur safe. Upstander badge!'));}
function mission(){const st={pass:L('12+ chars, centuries to crack, 2FA blocks the leak','12+ अक्षर, सदियाँ, 2FA लीक रोकता है','12+ chars, sadiyaan, 2FA leak rokta hai'),url:L('All 7 links judged correctly','सभी 7 लिंक सही आँके','Saare 7 links sahi judge'),share:L('All 8 posts sorted','सभी 8 पोस्ट छाँटे','Saare 8 posts sort'),kind:L('All 3 situations','सभी 3 स्थितियाँ','Saari 3 situations')};
 $('mission').innerHTML=TABS.map(([k,n])=>`<div style="margin:3px 0">${done[k]?'✅':'⬜'} <b>${T(n)}</b> — ${T(st[k])}</div>`).join('');}
function draw(){$('goal').innerHTML=E(T(goal&&cfg.tab===tab?goal:GOALS[tab]));$('tabs').innerHTML=TABS.map(([k,n])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${T(n)}</button>`).join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();});({pass:drawPass,url:drawURL,share:drawShare,kind:drawKind})[tab]();mission();}
N.onLang(draw);draw();
window.__lab={tab:k=>{tab=k;draw();},pw:s=>{pw=s;drawPass();},done,domainOf};
})();
</script></body></html>
