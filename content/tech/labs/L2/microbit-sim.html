 wait:{c:'#475569',e:'⏱️',n:L('wait','रुको','ruko'),opts:[['100','100 ms'],['200','200 ms'],['500','500 ms'],['1000','1 s']],d:'200'}};
const PRESETS={empty:{start:[['icon','HAPPY']],then:[],else:[],thr:'20'},parking:{start:[['icon','HAPPY']],then:[['led','1'],['tone','880'],['wait','100']],else:[['led','0'],['wait','200']],thr:'20'},gate:{start:[['servo','0']],then:[['servo','90'],['icon','YES']],else:[['servo','0'],['icon','NO']],thr:'15'}};
let prog=JSON.parse(JSON.stringify(PRESETS[cfg.preset]||PRESETS.empty)),selSec='then',running=false,stopFlag=false,muted=false,curBlk=null,passed=false;
// hardware state
const hw={led:0,icon:'CLEAR',servo:0,tone:0};
const ICONS={HEART:'0101011111111110111000100',HAPPY:'0000001010000001000101110',SAD:'0000001010000000111010001',NO:'1000101010001000101010001',YES:'0000000001000101010001000',CLEAR:'0'.repeat(25)};
const svg=$('hw');svg.innerHTML=`
 <defs><radialGradient id="glow"><stop offset="0" stop-color="#FF6B6B" stop-opacity=".9"/><stop offset="1" stop-color="#FF6B6B" stop-opacity="0"/></radialGradient></defs>
 <rect x="10" y="12" width="120" height="104" rx="14" fill="#1F2937" stroke="#4B5563" stroke-width="2"/><text x="70" y="28" fill="#9CA3AF" font-size="8" text-anchor="middle" font-weight="700">micro:bit</text>
 ${Array.from({length:25},(_,i)=>`<rect class="led5" id="m${i}" x="${33+(i%5)*16}" y="${34+(i/5|0)*15}" width="7" height="10" rx="2"/>`).join('')}
 <rect x="10" y="108" width="120" height="14" rx="3" fill="#B8860B"/>${[0,1,2,3,4].map(i=>`<text x="${22+i*24}" y="118" font-size="7" fill="#1C1B1A" font-weight="800">P${i}</text>`).join('')}
 <path d="M30,122 C30,150 70,150 70,165" stroke="#DC2626" stroke-width="2.5" fill="none"/><path d="M54,122 C54,160 150,140 160,165" stroke="#F59E0B" stroke-width="2.5" fill="none"/><path d="M78,122 C80,190 230,150 240,170" stroke="#10B981" stroke-width="2.5" fill="none"/><path d="M102,122 C102,175 190,110 205,58" stroke="#3B82F6" stroke-width="2.5" fill="none"/>
 <circle id="ledGlow" cx="70" cy="178" r="26" fill="url(#glow)" opacity="0"/><path d="M60,190 v-18 a10,10 0 0 1 20,0 v18 z" id="ledR" fill="#7F1D1D" stroke="#FCA5A5"/><line x1="64" y1="190" x2="64" y2="205" stroke="#9CA3AF" stroke-width="2"/><line x1="76" y1="190" x2="76" y2="210" stroke="#9CA3AF" stroke-width="2"/><text x="70" y="226" fill="#C9D4FF" font-size="10" text-anchor="middle">LED · P0</text>
 <g id="buz"><circle cx="160" cy="185" r="17" fill="#111827" stroke="#6B7280" stroke-width="2"/><circle cx="160" cy="185" r="3" fill="#6B7280"/></g><g id="bwaves" opacity="0"><path d="M182,172 q8,13 0,26" stroke="#FFD23F" stroke-width="2" fill="none"/><path d="M190,166 q12,19 0,38" stroke="#FFD23F" stroke-width="2" fill="none"/></g><text x="160" y="226" fill="#C9D4FF" font-size="10" text-anchor="middle">${'Buzzer · P1'}</text>
 <rect x="222" y="172" width="44" height="30" rx="4" fill="#1E3A8A" stroke="#93C5FD"/><circle cx="234" cy="180" r="5" fill="#E5E7EB"/><g id="arm" style="transform-origin:234px 180px;transition:transform .45s cubic-bezier(.3,1.4,.5,1)"><rect x="232" y="150" width="4" height="32" rx="2" fill="#F9FAFB"/><circle cx="234" cy="152" r="5" fill="#F9FAFB"/></g><text x="244" y="226" fill="#C9D4FF" font-size="10" text-anchor="middle">Servo · P2</text>
 <rect x="196" y="40" width="40" height="36" rx="4" fill="#1D4ED8" stroke="#93C5FD"/><circle cx="208" cy="58" r="8" fill="#D1D5DB" stroke="#6B7280" stroke-width="2"/><circle cx="226" cy="58" r="8" fill="#D1D5DB" stroke="#6B7280" stroke-width="2"/><text x="216" y="90" fill="#C9D4FF" font-size="9" text-anchor="middle">HC-SR04 · P3</text>
 ${[0,1,2].map(i=>`<path class="wave" id="w${i}" d="M240,44 q10,14 0,28"/>`).join('')}
 <line x1="240" y1="104" x2="352" y2="104" stroke="#34457F" stroke-dasharray="3 4"/><g id="objG"><rect x="0" y="34" width="16" height="48" rx="4" fill="#F97316" stroke="#FED7AA"/><text x="8" y="64" font-size="12" text-anchor="middle">🧱</text></g>`;
function draw(){const bits=ICONS[hw.icon]||ICONS.CLEAR;for(let i=0;i<25;i++)$('m'+i).classList.toggle('on',bits[i]==='1');
 $('ledR').setAttribute('fill',hw.led?'#FF3B30':'#7F1D1D');$('ledGlow').setAttribute('opacity',hw.led?1:0);
 $('arm').style.transform=`rotate(${hw.servo-90}deg)`;$('bwaves').setAttribute('opacity',hw.tone?1:0);$('buz').style.transform=hw.tone?`translate(${Math.random()*1.4-.7}px,0)`:'';}
function dist(){return +$('dist').value;}
function showDist(){const d=dist();$('rD').textContent=d+' cm';$('rE').textContent=Math.round(2*d/34300*1e6)+' µs';$('objG').setAttribute('transform',`translate(${244+(d-2)/198*96},0)`);}
$('dist').oninput=showDist;
// sonar ping animation
let pingT=0;function ping(now){if(running&&now-pingT>600){pingT=now;[0,1,2].forEach(i=>{const w=$('w'+i);N.tween(500,k=>{w.setAttribute('transform',`translate(${k*((dist()-2)/198*96+4)+i*4},0)`);w.style.opacity=(1-k)*.9;});});}if(hw.tone)draw();requestAnimationFrame(ping);}requestAnimationFrame(ping);
// audio (WebAudio square wave, like a piezo buzzer)
let ac=null;function beep(f,ms){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+ms/1000);}catch(e){}}
// ---- the interpreter: walks the block lists; every block is one of five known kinds, nothing is evaluated as code
async function exec(b,real){const [k,v]=b;if(k==='led')hw.led=+v;else if(k==='icon')hw.icon=v;else if(k==='servo')hw.servo=+v;
 else if(k==='tone'){hw.tone=+v;if(real){draw();beep(+v,150);await N.sleep(150);}hw.tone=0;hw.lastTone=+v;}
 else if(k==='wait'&&real)await N.sleep(+v);draw();}
async function run(){if(running){stopFlag=true;return;}running=true;stopFlag=false;$('run').innerHTML=T(L('⏹ Stop','⏹ रोको','⏹ Stop'));$('rS').textContent='▶';
 for(const b of prog.start){await step('start',b);}
 let guard=0;while(!stopFlag&&guard++<100000){const sec=dist()<+prog.thr?'then':'else';if(!prog[sec].length)await N.sleep(60);for(const b of prog[sec]){if(stopFlag)break;await step(sec,b);}await N.sleep(20);}
 running=false;$('rS').textContent='⏹';$('run').innerHTML=T(L('▶ Run','▶ चलाओ','▶ Run'));mark(null);}
async function step(sec,b){mark(sec,prog[sec].indexOf(b));await exec(b,true);}
function mark(sec,i){document.querySelectorAll('.blk.run').forEach(x=>x.classList.remove('run'));if(sec){const el=document.querySelector(`.sec[data-s=${sec}] .list`).children[i];el&&el.classList.add('run');}}
// one dry pass at a given distance → final outputs (used to check the mission without waiting)
function dry(d){const s={led:0,icon:'CLEAR',servo:0,tones:[]};const ap=(b)=>{const [k,v]=b;if(k==='led')s.led=+v;else if(k==='icon')s.icon=v;else if(k==='servo')s.servo=+v;else if(k==='tone')s.tones.push(+v);};
 prog.start.forEach(ap);for(let r=0;r<2;r++){s.tones=[];(d<+prog.thr?prog.then:prog.else).forEach(ap);}return s;}
const MISS={parking:{t:L('Parking sensor: when the object is closer than 20 cm, turn the red LED ON and beep. When it is farther, LED OFF and silent.','पार्किंग सेंसर: वस्तु 20 cm से पास हो तो लाल LED चालू और बीप। दूर हो तो LED बंद और शांत।','Parking sensor: object 20 cm se paas ho to red LED ON aur beep. Door ho to LED OFF aur chup.'),
  ok:()=>{const a=dry(10),b=dry(50);return +prog.thr<=20&&+prog.thr>10&&a.led===1&&a.tones.length>0&&b.led===0&&b.tones.length===0;}},
 gate:{t:L('Smart gate: if a car is closer than 15 cm, open the gate (servo 90°) and show ✔; otherwise close it (servo 0°) and show ✖.','स्मार्ट गेट: कार 15 cm से पास हो तो गेट खोलो (सर्वो 90°) और ✔ दिखाओ; वरना बंद करो (सर्वो 0°) और ✖ दिखाओ।','Smart gate: car 15 cm se paas ho to gate kholo (servo 90°) aur ✔ dikhao; warna band karo (servo 0°) aur ✖ dikhao.'),
  ok:()=>{const a=dry(8),b=dry(60);return +prog.thr===15&&a.servo===90&&a.icon==='YES'&&b.servo===0&&b.icon==='NO';}}};
const mis=MISS[cfg.mission]||MISS.parking;
function mission(){$('mission').innerHTML=(passed?'✅ ':'')+T(mis.t);}
$('check').onclick=()=>{if(mis.ok()){if(!passed){passed=true;N.confetti();N.emit('mission:complete',{lab:'microbit-sim',mission:cfg.mission});}N.toast(L('It works at every distance! Mission complete +XP','हर दूरी पर काम करता है! मिशन पूरा +XP','Har distance pe kaam karta hai! Mission complete +XP'),'ok');}
 else{const a=dry(10),b=dry(50);N.toast(L(`Not yet. Tested at 10 cm: LED ${a.led?'ON':'OFF'}, ${a.tones.length?'beep':'no beep'}. At 50 cm: LED ${b.led?'ON':'OFF'}, ${b.tones.length?'beep':'no beep'}. Check the threshold too.`,`अभी नहीं। 10 cm पर: LED ${a.led?'चालू':'बंद'}, ${a.tones.length?'बीप':'बीप नहीं'}। 50 cm पर: LED ${b.led?'चालू':'बंद'}, ${b.tones.length?'बीप':'बीप नहीं'}। सीमा भी जाँचो।`,`Abhi nahi. 10 cm pe: LED ${a.led?'ON':'OFF'}, ${a.tones.length?'beep':'no beep'}. 50 cm pe: LED ${b.led?'ON':'OFF'}, ${b.tones.length?'beep':'no beep'}. Threshold bhi check karo.`),'bad');N.emit('answered:wrong');}mission();};
// editor
const pal=$('pal');Object.entries(B).forEach(([k,b])=>{const x=document.createElement('button');x.style.background=b.c;x.dataset.b=k;x.onclick=()=>{prog[selSec].push([k,b.d]);ui();};pal.appendChild(x);});
document.querySelectorAll('.sec[data-s]').forEach(s=>s.addEventListener('click',e=>{if(e.target.closest('select,button'))return;selSec=s.dataset.s;ui();}));
const thr=$('thr');[5,10,15,20,30,50].forEach(n=>thr.insertAdjacentHTML('beforeend',`<option value="${n}">${n}</option>`));thr.onchange=()=>{prog.thr=thr.value;ui();};
function ui(){pal.querySelectorAll('button').forEach(x=>x.innerHTML=`+ ${B[x.dataset.b].e} ${E(T(B[x.dataset.b].n))}`);thr.value=prog.thr;
 document.querySelectorAll('.sec[data-s]').forEach(s=>{const k=s.dataset.s;s.classList.toggle('sel',k===selSec);const list=s.querySelector('.list');list.innerHTML='';
  if(!prog[k].length)list.innerHTML=`<div class="empty">${T(L('(empty — tap here, then add blocks)','(ख़ाली — यहाँ दबाओ, फिर ब्लॉक जोड़ो)','(khaali — yahan tap karo, phir blocks jodo)'))}</div>`;
  prog[k].forEach((b,i)=>{const d=B[b[0]],el=document.createElement('div');el.className='blk';el.style.background=d.c;
   el.innerHTML=`${d.e} ${E(T(d.n))} <select aria-label="value">${d.opts.map(([v,l])=>`<option value="${v}" ${v===b[1]?'selected':''}>${l}</option>`).join('')}</select><button class="x" aria-label="remove">✕</button>`;
   el.querySelector('select').onchange=e=>{b[1]=e.target.value;ui();};el.querySelector('.x').onclick=()=>{prog[k].splice(i,1);ui();};list.appendChild(el);});});
 $('py').innerHTML=py();}
function py(){const line=(b)=>{const [k,v]=b;return k==='led'?`pin0.write_digital(${v})`:k==='icon'?(v==='CLEAR'?'display.clear()':`display.show(Image.${v})`):k==='tone'?`music.pitch(${v}, 150)`:k==='servo'?`servo_angle(pin2, ${v})   <span class="c"># helper: 0.5–2.5 ms pulse</span>`:`sleep(${v})`;};
 const blk=(arr,ind)=>arr.length?arr.map(b=>ind+line(b)).join('\n'):ind+'<span class="k">pass</span>';
 return `<span class="k">from</span> microbit <span class="k">import</span> *\n<span class="k">import</span> music\n\n<span class="c"># on start</span>\n${blk(prog.start,'')}\n\n<span class="k">while</span> True:\n    d = distance_cm(pin3)   <span class="c"># helper: echo time × 0.0343 ÷ 2</span>\n    <span class="k">if</span> d &lt; <span class="n">${prog.thr}</span>:\n${blk(prog.then,'        ')}\n    <span class="k">else</span>:\n${blk(prog.else,'        ')}`;}
$('run').onclick=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();}catch(e){}run();};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';};
const goalDef=L('Program a real-style gadget. The ultrasonic sensor sends a sound pulse (40 kHz, too high for us to hear) and times its echo; your blocks decide what the LED, buzzer and servo do.','असली जैसा गैजेट प्रोग्राम करो। अल्ट्रासोनिक सेंसर ध्वनि की धड़कन (40 kHz, हमारे सुनने से ऊँची) भेजता है और उसकी गूँज का समय नापता है; आपके ब्लॉक तय करते हैं कि LED, बज़र और सर्वो क्या करें।','Asli jaisa gadget program karo. Ultrasonic sensor ek sound pulse (40 kHz, humare sunne se upar) bhejta hai aur uski echo ka time naapta hai; aapke blocks decide karte hain ki LED, buzzer aur servo kya karein.');
const setGoal=()=>$('goal').innerHTML=T(goal||goalDef);N.onLang(()=>{setGoal();ui();mission();$('run').innerHTML=T(running?L('⏹ Stop','⏹ रोको','⏹ Stop'):L('▶ Run','▶ चलाओ','▶ Run'));});
setGoal();ui();mission();showDist();draw();
window.__lab={load:k=>{prog=JSON.parse(JSON.stringify(PRESETS[k]));ui();},run,dist:d=>{$('dist').value=d;showDist();}};
})();
</script></body></html>
