<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-labelledby="netcyberai-logo-title">
  <title id="netcyberai-logo-title">NetCyberAI</title>
  <defs>
    <linearGradient id="ncaWordmarkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02CFF9" />
      <stop offset="16%" stop-color="#002357" />
      <stop offset="56%" stop-color="#002357" />
      <stop offset="78%" stop-color="#4400F0" />
      <stop offset="92%" stop-color="#02CFF9" />
      <stop offset="100%" stop-color="#FFC590" />
    </linearGradient>
  </defs>

  <text
    x="0"
    y="118"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="800"
    font-size="108"
    letter-spacing="-2"
    fill="url(#ncaWordmarkGradient)"
  >NetCyberAI</text>

  <!-- Small leaf accent under the "C" of "Cyber", echoing the founder-supplied
       reference artwork's own teal accent -- decorative only, not a load-bearing brand mark. -->
  <path
    d="M 208 132 C 216 140, 232 140, 240 128 C 230 132, 216 130, 208 132 Z"
    fill="#0F766E"
  />

  <!-- Sparkle accent inside the "AI", echoing the reference artwork. -->
  <path
    d="M 556 40 L 560 50 L 570 54 L 560 58 L 556 68 L 552 58 L 542 54 L 552 50 Z"
    fill="#FFFFFF"
  />
</svg>
