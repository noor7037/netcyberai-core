<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"><title>Sound waves from a speaker</title><style>.c{transform-origin:70px 120px;animation:c 2s ease-out infinite;opacity:0}.c2{animation-delay:.66s}.c3{animation-delay:1.33s}@keyframes c{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="320" height="240" fill="#F9FAFB"/><path d="M30 100 H55 L85 75 V165 L55 140 H30Z" fill="#1E293B"/><g fill="none" stroke="#8B3DFF" stroke-width="4"><path class="c" d="M95 90 Q115 120 95 150"/><path class="c c2" d="M95 90 Q115 120 95 150"/><path class="c c3" d="M95 90 Q115 120 95 150"/></g></svg>