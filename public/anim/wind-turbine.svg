<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"><title>A wind turbine turning in the wind</title><style>.r{transform-origin:160px 90px;animation:s 3s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.w{animation:w 2s linear infinite}@keyframes w{from{transform:translateX(-40px);opacity:0}50%{opacity:1}to{transform:translateX(60px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="320" height="240" fill="#F9FAFB"/><rect y="200" width="320" height="40" fill="#22C55E"/><path d="M155 90 L150 205 H170 L165 90Z" fill="#1E293B"/><g class="r"><path d="M160 90 L154 20 Q160 12 166 20Z" fill="#002357"/><path d="M160 90 L154 20 Q160 12 166 20Z" fill="#002357" transform="rotate(120 160 90)"/><path d="M160 90 L154 20 Q160 12 166 20Z" fill="#002357" transform="rotate(240 160 90)"/></g><circle cx="160" cy="90" r="7" fill="#FF7A1A"/><g class="w" stroke="#016898" stroke-width="3" stroke-linecap="round"><path d="M20 60h50"/><path d="M10 120h60"/><path d="M30 170h40"/></g></svg>