<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"><title>A pendulum swinging</title><style>.p{transform-origin:160px 30px;animation:p 2s ease-in-out infinite alternate}@keyframes p{from{transform:rotate(30deg)}to{transform:rotate(-30deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="320" height="240" fill="#F9FAFB"/><rect x="80" y="20" width="160" height="10" fill="#1E293B"/><path d="M160 30 v150" stroke="#1E293B" stroke-dasharray="4 4" opacity=".3"/><g class="p"><path d="M160 30 V170" stroke="#1E293B" stroke-width="2"/><circle cx="160" cy="180" r="16" fill="#FF7A1A"/></g></svg>