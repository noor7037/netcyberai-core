<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"><title>An atom with moving electrons</title><style>.a{transform-origin:160px 120px;animation:a 3s linear infinite}.a2{animation-duration:4.5s;animation-direction:reverse}@keyframes a{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="320" height="240" fill="#F9FAFB"/><circle cx="160" cy="120" r="80" fill="none" stroke="#1E293B" opacity=".3"/><circle cx="160" cy="120" r="50" fill="none" stroke="#1E293B" opacity=".3"/><circle cx="153" cy="116" r="9" fill="#FF6B57"/><circle cx="167" cy="124" r="9" fill="#016898"/><circle cx="165" cy="112" r="9" fill="#FF6B57"/><g class="a"><circle cx="240" cy="120" r="7" fill="#8B3DFF"/><circle cx="80" cy="120" r="7" fill="#8B3DFF"/></g><g class="a a2"><circle cx="160" cy="70" r="7" fill="#8B3DFF"/></g></svg>