<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"><title>The water cycle</title><style>.v{animation:v 3s ease-in infinite}.v2{animation-delay:1s}.v3{animation-delay:2s}@keyframes v{from{transform:translateY(0);opacity:0}30%{opacity:1}to{transform:translateY(-90px);opacity:0}}.d{animation:d 1.2s linear infinite}.d2{animation-delay:.4s}.d3{animation-delay:.8s}@keyframes d{from{transform:translateY(0);opacity:1}to{transform:translateY(80px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="320" height="240" fill="#F9FAFB"/><circle cx="40" cy="40" r="22" fill="#FFD23F"/><rect y="190" width="320" height="50" fill="#016898"/><path d="M200 200 L260 120 L320 200Z" fill="#0F766E"/><g fill="#02CFF9"><circle class="v" cx="80" cy="180" r="4"/><circle class="v v2" cx="110" cy="180" r="4"/><circle class="v v3" cx="140" cy="180" r="4"/></g><g fill="#fff" stroke="#002357" stroke-width="2"><ellipse cx="230" cy="55" rx="45" ry="20"/><ellipse cx="200" cy="65" rx="30" ry="16"/></g><g stroke="#016898" stroke-width="3" stroke-linecap="round"><path class="d" d="M200 85v8"/><path class="d d2" d="M225 85v8"/><path class="d d3" d="M250 85v8"/></g></svg>