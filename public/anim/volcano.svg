<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"><title>A volcano erupting</title><style>.l{animation:l 1.6s ease-out infinite}.l2{animation-delay:.5s}.l3{animation-delay:1s}@keyframes l{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--x),-80px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="320" height="240" fill="#F9FAFB"/><rect y="200" width="320" height="40" fill="#0F766E"/><path d="M60 200 L140 80 H180 L260 200Z" fill="#8A5300"/><path d="M140 80 H180 L172 100 H148Z" fill="#FF7A1A"/><g fill="#FF6B57"><circle class="l" style="--x:-30px" cx="160" cy="80" r="7"/><circle class="l l2" style="--x:20px" cx="160" cy="80" r="6"/><circle class="l l3" style="--x:40px" cx="160" cy="80" r="5"/></g></svg>