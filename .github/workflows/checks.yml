name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: No fabricated numeric claims outside the demo fixture
        run: |
          # src/lib/recognition.ts is excluded alongside the demo fixture: its
          # header comment cites 85->90=33.3%% and 40->55=25.0%% as the proof
          # that the banned headroom formula is inverted. That's the point of
          # the comment, not an unsourced claim — removing it would remove the
          # only place the bug is demonstrated in code.
          if grep -rEn '[0-9]+%|₹[0-9]|\$[0-9]' src/ --include='*.ts' --include='*.tsx' \
              | grep -v 'src/demo-fixture/' | grep -v 'src/lib/recognition.ts'; then
            echo "::error::Unsourced numeric claim found outside src/demo-fixture/ — trace it to a cited source or remove it."
            exit 1
          fi

      - name: No mock/dummy/fake/sample data outside the demo fixture
        run: |
          # src/lib/recognition.ts is also excluded: it uses "sample-size" in
          # its normal statistical sense (a comment on the minimum-assessments
          # guard), not as placeholder/dummy data.
          if grep -rn 'mock\|dummy\|fake\|sample' src/ --include='*.ts' --include='*.tsx' \
              | grep -v 'src/demo-fixture/' | grep -v 'src/lib/recognition.ts'; then
            echo "::error::Found a mock/dummy/fake/sample reference outside src/demo-fixture/, the only allowlisted exception."
            exit 1
          fi

      - name: No secrets committed
        run: |
          if grep -rn 'sk_\|api_key\|SECRET\|PRIVATE_KEY' src/; then
            echo "::error::Possible secret found in src/."
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
