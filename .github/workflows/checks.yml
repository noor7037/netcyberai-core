name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: scripts/ci_local.sh still mirrors this workflow
        run: python3 scripts/check_ci_mirror.py

      - name: No fabricated numeric claims outside the demo fixture
        run: python3 scripts/check_claims.py

      - name: No mock/dummy/fake/sample data outside the demo fixture
        run: |
          # src/lib/recognition.ts is also excluded: it uses "sample-size" in
          # its normal statistical sense (a comment on the minimum-assessments
          # guard), not as placeholder/dummy data.
          #
          # src/lib/whatsapp/ is also excluded: MockWhatsAppProvider (Prompt H
          # Task 2) is a real, permanent WhatsAppProviderSPI implementation --
          # the prompt's own explicit design, not unfinished placeholder data.
          # It's what every school resolves to today, since no real WhatsApp
          # Business API credentials exist anywhere in this project (Task 0).
          # src/components/settings/WhatsAppConfigPanel.tsx only mentions it in
          # a comment explaining the same thing.
          if grep -rn 'mock\|dummy\|fake\|sample' src/ --include='*.ts' --include='*.tsx' \
              | grep -v 'src/demo-fixture/' | grep -v 'src/lib/recognition.ts' \
              | grep -v 'src/lib/whatsapp/' | grep -v 'src/components/settings/WhatsAppConfigPanel.tsx'; then
            echo "::error::Found a mock/dummy/fake/sample reference outside the allowlisted exceptions."
            exit 1
          fi

      - name: Tenant-context choke point stays singular
        run: python3 scripts/check_choke_point.py

      - name: Service-role Supabase client stays a single allowlisted choke point
        run: python3 scripts/check_service_role.py

      - name: No unallowlisted permissive RLS policy
        run: python3 scripts/check_rls_policies.py

      - name: No non-privileged role holds UPDATE/DELETE on an append-only table
        run: python3 scripts/check_append_only_grants.py

      - name: No function/trigger body references a renamed or dropped column
        run: python3 scripts/check_stale_column_refs.py

      - name: WhatsApp send-gate stays a single allowlisted choke point
        run: python3 scripts/check_whatsapp_send_gate.py

      - name: Text-color contrast meets WCAG floors
        run: python3 scripts/check_contrast.py

      - name: Every /control and /app route goes through its guard
        run: python3 scripts/check_route_guards.py

      - name: Every /app and /control screen renders through ModulePage
        run: python3 scripts/check_module_pages.py

      - name: Words on /app and /control screens come from the message files (English and Hindi)
        run: |
          python3 scripts/check_ui_strings.py --self-test
          python3 scripts/check_ui_strings.py

      - name: No secrets committed
        run: |
          # required('SOME_ENV_VAR_NAME') (src/lib/auth/env.ts) looks up an
          # env var by NAME via process.env[name] -- it's a reference to a
          # variable, never the secret value itself, so it's excluded here
          # the same way src/lib/recognition.ts's "sample-size" is excluded
          # from the mock/dummy check above: a real non-match, not a path
          # carve-out for a genuine risk. process.env.SOME_SECRET_NAME is the
          # same kind of reference, for optional settings (C99).
          if grep -rn 'sk_\|api_key\|SECRET\|PRIVATE_KEY' src/ \
              | grep -v "required('[A-Z0-9_]\+')" \
              | grep -v "process\.env\.[A-Z0-9_]*\(SECRET\|PRIVATE_KEY\)[A-Z0-9_]*"; then
            echo "::error::Possible secret found in src/."
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (kept regression suite, Decision Log C70)
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_WHATSAPP_NUMBER: "919817707037"
        run: npm run build

      - name: The screenshot harness and session minting cannot reach production
        run: |
          python3 scripts/check_harness_isolation.py --self-test
          python3 scripts/check_harness_isolation.py --build .next

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SEO/AEO audit
        env:
          NEXT_PUBLIC_WHATSAPP_NUMBER: "919817707037"
        run: bash scripts/run_seo_audit.sh --skip-build
